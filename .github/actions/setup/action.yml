# What every job does before it builds machopo: the system libraries the
# build needs, the pinned toolchain, ../third_party at the commits machopo
# pins, and the build cache. Only for the Linux runners for now (the
# packages are Ubuntu's).
name: Set up machopo's build
description: System libraries, toolchain, ../third_party and the cargo cache for one job

inputs:
  cache:
    description: >-
      The build cache's key (`Swatinem/rust-cache`'s `shared-key`): jobs
      that build the same thing share one entry, so the repository's 10 GB
      of cache hold one copy of each. Empty: no build cache
    default: ""
  save-cache:
    description: >-
      Whether this job saves the cache, on `main` only: one job per key
      does, the others restore what it saved
    default: "false"
  gpu:
    description: >-
      Install Mesa's lavapipe too, the CPU adapter wgpu draws with on a
      runner (which has no GPU)
    default: "false"

runs:
  using: composite
  steps:
    # fontconfig's headers and .pc for `yeslogic-fontconfig-sys` (fonts,
    # Skia), whose build script every job runs, clippy's too.
    - name: Install system libraries
      shell: bash
      env:
        GPU: ${{ inputs.gpu }}
      run: |
        packages=(libfontconfig1-dev)
        if [ "$GPU" = true ]; then
          packages+=(libvulkan1 mesa-vulkan-drivers)
        fi
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends "${packages[@]}"
    # The toolchain rust-toolchain.toml pins, with its components.
    - shell: bash
      run: rustup toolchain install
    # Before the cache: it runs `cargo metadata`, which needs the forks that
    # Cargo.toml depends on by path.
    - shell: bash
      run: python3 scripts/ci.py third-party
    - if: inputs.cache != ''
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache }}
        save-if: ${{ inputs.save-cache == 'true' && github.ref == 'refs/heads/main' }}
