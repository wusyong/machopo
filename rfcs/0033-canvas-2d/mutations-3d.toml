[[mutant]]
name = "SVG's stroke solid"
file = "crates/paint/src/svg.rs"
from = '''        dash: dash.as_ref().map(|dash| (dash.intervals(), dash.phase())),
    };
    path.stroke_contains(point, &stroke, 0.05)'''
to = '''        dash: dash.as_ref().map(|dash| (dash.intervals(), dash.phase())).filter(|_| false),
    };
