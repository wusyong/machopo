# Step 1e's mutation tests: `python3 scripts/test.py mutate
# rfcs/0033-canvas-2d/mutations-1e.toml`. Each names the tests closest to
# what it breaks: gfx's shapes against Skia's own (in raster), the context
# without a raster (dom_api), the pixels in the browser.
test = ["cargo", "test", "-q", "-p", "raster", "--lib", "path_shape"]
timeout = 1500

# gfx: the shapes, against Skia's.

