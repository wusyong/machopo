                            nearest_neighbor,'''
to = '''                            tex_coord_rect,
                            nearest_neighbor: true,'''
test = ["cargo", "test", "-q", "-p", "viz", "--lib", "surface_aggregator"]

# Through the reftests.

[[mutant]]
name = "a layer at a whole CSS px"
file = "crates/renderer/src/compositing.rs"
from = '''                    origin: gfx::PointF::new(bounds.x, bounds.y),'''
to = '''                    origin: gfx::PointF::new(bounds.x.floor(), bounds.y.floor()),'''
