[[mutant]]
name = "a sandboxed frame traverses the frames not below it alone"
file = "crates/browser/src/web_contents.rs"
from = '''                .any(|(frame, _)| !self.frame_tree.is_within(*frame, sandboxed))'''
to = '''                .any(|(frame, _)| self.frame_tree.is_within(*frame, sandboxed))'''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "it", "navigation::links::a_sandboxed_frame_traverses"]

[[mutant]]
name = "a frame isn't within itself"
file = "crates/browser/src/frame_tree.rs"
from = '''        std::iter::successors(Some(frame), |at| self.nodes.get(at)?.parent).any(|at| at == ancestor)'''
to = '''        std::iter::successors(self.nodes.get(&frame).and_then(|node| node.parent), |at| self.nodes.get(at)?.parent).any(|at| at == ancestor)'''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "it", "navigation::links::a_sandboxed_frame_traverses"]

[[mutant]]
