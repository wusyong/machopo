# History.

[[mutant]]
name = "allow-top-navigation doesn't count in history"
file = "crates/browser/src/web_contents.rs"
from = '''                    .contains(protocol::sandbox::SandboxFlags::TOP_NAVIGATION);'''
to = '''                    .contains(protocol::sandbox::SandboxFlags::NAVIGATION);'''
