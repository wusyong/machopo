# Stage 2's mutants (navigation, new windows, history and the console's messages): `python3 scripts/test.py mutate rfcs/0130-iframe-sandbox/mutants-2.toml`.
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "frames::"]
timeout = 2400

# The navigations a sandboxed frame may make (`dom_api`'s `frame.rs`).

