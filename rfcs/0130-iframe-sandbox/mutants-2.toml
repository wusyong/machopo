# A `Location`'s asker.

[[mutant]]
name = "href's asker is the entry realm"
file = "crates/dom_api/src/location.rs"
from = '''    let by = op.incumbent_context(cx);
    check_may_navigate(cx, this, &url, by)?;
    navigate(cx, this, url, false, by);'''
to = '''    let by = op.current_context(cx);
    check_may_navigate(cx, this, &url, by)?;
    navigate(cx, this, url, false, by);'''

[[mutant]]
name = "replace's asker is the entry realm"
file = "crates/dom_api/src/location.rs"
from = '''    let by = op.incumbent_context(cx);
    check_may_navigate(cx, this, &url, by)?;
    navigate(cx, this, url, true, by);'''
to = '''    let by = op.current_context(cx);
    check_may_navigate(cx, this, &url, by)?;
    navigate(cx, this, url, true, by);'''

[[mutant]]
name = "the incumbent realm isn't found"
file = "crates/dom_js/src/info_front.rs"
from = '''        let Some(global) = self.incumbent_window else {
            return self.current_context(cx);
        };'''
to = '''        let Some(global) = None::<v8::Local<'s, v8::Object>> else {
            return self.current_context(cx);
        };'''

