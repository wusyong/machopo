to = '''        global.segments.is_empty()'''
test = ["python3", "scripts/test.py", "gc-models"]

# Starting and finishing.

[[mutant]]
name = "a marking starts at the limit"
file = "crates/gc/src/heap.rs"
from = '''        self.concurrent && self.allocated.get() >= self.limit.get() / 2'''
to = '''        self.concurrent && self.allocated.get() >= self.limit.get()'''

[[mutant]]
name = "a marking starts without the scavenge"
file = "crates/gc/src/heap.rs"
from = '''        self.young.get_mut().resize_at_full_gc();
        self.scavenge(&*platform, true);
        platform.trace_begin("Gc.MarkStart");'''
to = '''        platform.trace_begin("Gc.MarkStart");'''

[[mutant]]
name = "a marking at the limit runs on"
file = "crates/gc/src/heap.rs"
from = '''            if at_limit || self.marking_done() {'''
to = '''            if self.marking_done() {'''

[[mutant]]
name = "a marking done runs on"
file = "crates/gc/src/heap.rs"
from = '''            if at_limit || self.marking_done() {'''
to = '''            if at_limit {'''

[[mutant]]
name = "a scavenge doesn't post the job again"
file = "crates/gc/src/heap.rs"
from = '''        let record = self.scavenge(&*platform, false);
        if let Some(marking) = self.marking.get_mut() {
            marking.post(&*platform);
        }'''
to = '''        let record = self.scavenge(&*platform, false);'''

[[mutant]]
name = "the roots removed before a scavenge wait for the end"
file = "crates/gc/src/heap.rs"
from = '''            // The roots removed since the last safepoint, while their
            // objects haven't moved.
            self.drain_barrier();'''
to = '''            // The roots removed since the last safepoint, while their
            // objects haven't moved.'''

[[mutant]]
name = "Heap::collect leaves a marking running"
file = "crates/gc/src/heap.rs"
from = '''        if self.inner.marking.get_mut().is_some() {
            self.inner.drain_barrier();
            self.inner.finish_marking();
        }
        self.inner.collect();'''
to = '''        if self.inner.marking.get_mut().is_some() {
            return;
        }
        self.inner.collect();'''

# The pool's posted jobs.

[[mutant]]
name = "a posted run doesn't yield to run"
file = "crates/gc/src/platform.rs"
from = '''        self.cancelled.load(Ordering::Relaxed) || self.shared.running.load(Ordering::Relaxed)'''
to = '''        self.cancelled.load(Ordering::Relaxed)'''
test = ["cargo", "test", "-q", "-p", "gc", "--lib", "platform::"]

[[mutant]]
name = "cancel doesn't wait for the runs"
file = "crates/gc/src/platform.rs"
from = '''            if state.background[at].active == 0 {'''
to = '''            if true {'''
test = ["cargo", "test", "-q", "-p", "gc", "--lib", "platform::"]

[[mutant]]
name = "a background run never asks whether to yield"
file = "crates/gc/src/worklist.rs"
from = '''                if visited % YIELD_EVERY == 0 && should_yield() {'''
to = '''                if visited % YIELD_EVERY == 0 && false {'''

# The verifier.

[[mutant]]
name = "the verifier lets any marked object float"
file = "crates/gc/src/heap/verify.rs"
from = '''                        .find(|data| !seen.contains(data) && !floating.contains(data))'''
to = '''                        .find(|data| !seen.contains(data) && floating.is_empty())'''

[[mutant]]
name = "what is allocated while marking isn't floating"
file = "crates/gc/src/heap.rs"
from = '''            marking.allocated(data);'''
to = '''            let _ = data;'''
