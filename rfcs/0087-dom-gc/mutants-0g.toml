# Step 0g: `bench.py blink-perf --gc` (the pages' wasm versions served
# from `guests/`, the runner's timer as User Timing in `hook.js`, the GC
# in the measured iterations from kun's trace, the recordings, the report)
# and `gc_bench.window_gc`. The runs of pages use kun's dev build and
# Chrome for Testing; run with RUSTY_V8_ARCHIVE pointing at a V8 built from
# the fork (`ci.py v8`).
test = ["python3", "scripts/bench/blink_perf/blink_perf_test.py"]
timeout = 900

# The runner's timer as User Timing.

[[mutant]]
name = "the timer's start isn't marked"
file = "scripts/bench/blink_perf/hook.js"
from = '''      performance.mark("blink_perf");'''
to = '''      void 0;'''

[[mutant]]
name = "the timer's end isn't measured"
file = "scripts/bench/blink_perf/hook.js"
from = '''    if (label === "blink_perf" && timing) performance.measure("blink_perf", "blink_perf");'''
to = '''    if (label === "blink_perf" && timing) void 0;'''

[[mutant]]
name = "each iteration is marked"
file = "scripts/bench/blink_perf/hook.js"
from = '''    if (label === "blink_perf" && !timing) {'''
to = '''    if (label === "blink_perf") {'''

# The GC from the trace.

[[mutant]]
name = "the main thread is the measure's track"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''    main = next((event[0] for event in events if event[3] == 3 and event[4] == "blink_perf"), None)'''
to = '''    main = next((event[0] for event in events if event[4] == "blink_perf"), None)'''
test = ["python3", "scripts/bench/blink_perf/blink_perf_test.py", "-k", "GcTests"]

[[mutant]]
name = "the window is any slice"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''                   for begin, end, name, _ in gc_bench.slices(events, track) if name == "blink_perf"), None)'''
to = '''                   for begin, end, name, _ in gc_bench.slices(events, track)), None)'''
test = ["python3", "scripts/bench/blink_perf/blink_perf_test.py", "-k", "GcTests"]

[[mutant]]
name = "the window's GC isn't cut at its ends"
file = "scripts/bench/gc/gc_bench.py"
from = '''            outermost.append((max(begin, first), min(end, last), name))'''
to = '''            outermost.append((begin, end, name))'''
test = ["python3", "scripts/bench/gc/gc_bench_test.py", "-k", "window"]

[[mutant]]
name = "the window's nested GC slices count"
file = "scripts/bench/gc/gc_bench.py"
from = '''        if is_gc(name) and not any(is_gc(name) for name in outer) and end > first and begin < last:'''
to = '''        if is_gc(name) and end > first and begin < last:'''
test = ["python3", "scripts/bench/gc/gc_bench_test.py", "-k", "window"]

[[mutant]]
name = "the window's GC after it counts"
file = "scripts/bench/gc/gc_bench.py"
from = '''        if is_gc(name) and not any(is_gc(name) for name in outer) and end > first and begin < last:'''
to = '''        if is_gc(name) and not any(is_gc(name) for name in outer) and end > first:'''
test = ["python3", "scripts/bench/gc/gc_bench_test.py", "-k", "window"]

[[mutant]]
name = "the other threads' GC is the whole trace's"
file = "scripts/bench/gc/gc_bench.py"
from = '''        "background_gc_ns": background_gc_between(events, main, first, last),'''
to = '''        "background_gc_ns": background_gc_between(events, main, 0, 2**62),'''
test = ["python3", "scripts/bench/gc/gc_bench_test.py", "-k", "window"]

[[mutant]]
name = "the span's other threads are cut nowhere"
file = "scripts/bench/gc/gc_bench.py"
from = '''    return background_gc_between(events, span_track(events, span), first, last)'''
to = '''    return background_gc_between(events, span_track(events, span), 0, 2**62)'''
test = ["python3", "scripts/bench/gc/gc_bench_test.py"]

