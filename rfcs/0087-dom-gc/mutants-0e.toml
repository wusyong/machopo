# The edge counts.

[[mutant]]
name = "a struct's edges are its largest field's"
file = "crates/dom_macros/src/lib.rs"
from = '''sum_edges(&['''
to = '''most_edges(&['''

[[mutant]]
name = "an enum's edges are all its variants'"
file = "crates/dom_macros/src/lib.rs"
from = '''most_edges(&[#(#arm_edges),*])'''
to = '''sum_edges(&[#(#arm_edges),*])'''

[[mutant]]
name = "an array's edges are one element's"
file = "crates/dom/src/gc.rs"
from = '''    const EDGES: usize = match T::EDGES.checked_mul(N) {'''
to = '''    const EDGES: usize = match T::EDGES.checked_mul(1) {'''

# The fork's GC count.

[[mutant]]
name = "the GC count's Rust reads nothing"
file = "../third_party/rusty_v8/src/cppgc/standalone.rs"
from = '''    unsafe { cppgc__StandaloneHeap__GcCount(self.heap.as_ptr()) }'''
to = '''    0'''

# C++: rebuilds V8 from the fork (`ci.py v8`, a minute or so for one file).
[[mutant]]
name = "the fork counts no GC"
file = "../third_party/rusty_v8/src/binding.cc"
from = '''  void ResetAllocatedObjectSize(size_t) override { count_++; }'''
to = '''  void ResetAllocatedObjectSize(size_t) override {}'''
test = ["python3", "-c", "import subprocess, sys; sys.exit(subprocess.call([sys.executable, 'scripts/ci.py', 'v8', '--profile', 'release']) or subprocess.call(['cargo', 'test', '-q', '-p', 'dom', '--test', 'it', 'recording::']))"]

# `gc_bench inspect`.

[[mutant]]
name = "a type's bytes are its objects"
file = "crates/gc_bench/src/inspect.rs"
from = '''        self.objects.saturating_mul(self.allocated)'''
to = '''        self.objects'''
test = ["cargo", "test", "-q", "-p", "gc_bench", "--test", "it", "recording::"]

[[mutant]]
name = "every write is outside any object"
file = "crates/gc_bench/src/inspect.rs"
from = '''                if object == 0 {'''
to = '''                if object != 0 {'''
test = ["cargo", "test", "-q", "-p", "gc_bench", "--test", "it", "recording::"]

[[mutant]]
name = "an object counts as no type's"
file = "crates/gc_bench/src/inspect.rs"
from = '''                bump(&mut ty.objects);'''
to = '''                let _ = ty;'''
test = ["cargo", "test", "-q", "-p", "gc_bench", "--test", "it", "recording::"]

[[mutant]]
name = "inspect reads no file"
file = "crates/gc_bench/src/main.rs"
from = '''            [path] => inspect(path),'''
to = '''            [_] => ExitCode::SUCCESS,'''
test = ["cargo", "test", "-q", "-p", "gc_bench", "--test", "it", "recording::"]
