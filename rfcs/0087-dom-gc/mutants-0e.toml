# Step 0e: the recording of the DOM's heap (`dom::recording`, its hooks in
# `dom`, the edge counts of `dom_macros`' derives), the fork's GC count of
# a standalone heap, and `gc_bench inspect`. Run with RUSTY_V8_ARCHIVE
# pointing at a V8 built from the fork (`ci.py v8`).
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "recording::"]
# A mutant takes seconds (a minute or so to rebuild V8); one that hangs
# waits this long.
timeout = 600

# The recorder: objects by address, and where a write is.

[[mutant]]
name = "an object over a dead one's start keeps the dead one"
file = "crates/dom/src/recording.rs"
from = '''            && old.end > start'''
to = '''            && false'''

[[mutant]]
name = "an object keeps the dead ones inside its range"
file = "crates/dom/src/recording.rs"
from = '''        let reused: Vec<usize> = self.objects.range(start..end).map(|(&at, _)| at).collect();'''
to = '''        let reused: Vec<usize> = self.objects.range(start..start).map(|(&at, _)| at).collect();'''

[[mutant]]
name = "a write's offset counts from cppgc's object"
file = "crates/dom/src/recording.rs"
from = '''        let offset = slot.checked_sub(object.data)?;'''
to = '''        let offset = slot.checked_sub(object.data.saturating_sub(8))?;'''

[[mutant]]
name = "a slot past an object's end is in it"
file = "crates/dom/src/recording.rs"
from = '''        if slot >= object.end {'''
to = '''        if slot > object.end.saturating_add(4096) {'''

[[mutant]]
name = "a recorded target is unknown"
file = "crates/dom/src/recording.rs"
from = '''            Some(target) => self.object(target).map_or(Target::Unknown, Target::Object),'''
to = '''            Some(target) => self.object(target).map_or(Target::Unknown, |_| Target::Unknown),'''

[[mutant]]
name = "a weak edge's write is strong"
file = "crates/dom/src/recording.rs"
from = '''        self.write(&Record::Write {
            object,
            offset,
            target,
            weak,
        });'''
to = '''        self.write(&Record::Write {
            object,
            offset,
            target,
            weak: false,
        });'''

[[mutant]]
name = "a type has no edges"
file = "crates/dom/src/recording.rs"
from = '''                    edges: T::EDGES as u64,'''
to = '''                    edges: 0,'''

[[mutant]]
name = "a type's allocation is its data only"
file = "crates/dom/src/recording.rs"
from = '''                    allocated: end.saturating_sub(start) as u64,'''
to = '''                    allocated: end.saturating_sub(data) as u64,'''

# Wrappers and GCs.

[[mutant]]
name = "the dead wrappers are the live ones"
file = "crates/dom/src/recording.rs"
from = '''                std::mem::take(&mut self.wrapped).into_iter().partition(|w| (w.alive)());'''
to = '''                std::mem::take(&mut self.wrapped).into_iter().partition(|w| !(w.alive)());'''

[[mutant]]
name = "a safepoint never looks for dead wrappers"
file = "crates/dom/src/recording.rs"
from = '''        if self.gcs.majors.get() != self.majors_seen {'''
to = '''        if false {'''

[[mutant]]
name = "a minor GC counts as full"
file = "crates/dom/src/recording.rs"
from = '''        if kind == GcKind::Major {
            self.majors.set(self.majors.get().wrapping_add(1));'''
to = '''        if kind == GcKind::Minor {
            self.majors.set(self.majors.get().wrapping_add(1));'''

[[mutant]]
name = "a GC's end comes before V8's inside it"
file = "crates/dom/src/recording.rs"
from = '''    pub(crate) fn gc_end(&mut self, kind: GcKind) {
        self.flush_gcs();'''
to = '''    pub(crate) fn gc_end(&mut self, kind: GcKind) {'''

[[mutant]]
name = "every V8 GC is minor"
file = "crates/dom/src/v8_engine.rs"
from = '''    } else {
        GcKind::Major
    }'''
to = '''    } else {
        GcKind::Minor
    }'''

[[mutant]]
name = "V8's GC ends aren't recorded"
file = "crates/dom/src/v8_engine.rs"
from = '''    log.end(gc_kind(ty));'''
to = '''    let _ = (log, ty);'''

# The format.

[[mutant]]
name = "an integer's bytes hold eight bits"
file = "crates/dom/src/recording.rs"
from = '''        value = value.wrapping_shr(7);'''
to = '''        value = value.wrapping_shr(8);'''
test = ["cargo", "test", "-q", "-p", "gc_bench", "--test", "it", "recording::"]

[[mutant]]
name = "an integer may run past 64 bits"
file = "crates/dom/src/recording.rs"
from = '''        if shift == 63 && bits > 1 {'''
to = '''        if false {'''

[[mutant]]
name = "any version is read"
