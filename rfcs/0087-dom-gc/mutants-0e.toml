        if let Some(mut recorder) = self.roots.recorder() {
            recorder.safepoint();
        }'''
to = '''    pub(crate) fn mutation_scope<'s>(&'s mut self, heap: HeapAccess<'s>) -> DomMutationScope<'s> {'''

[[mutant]]
name = "a read scope isn't a safepoint"
