from = '''    pub(crate) fn read_scope(&self) -> DomReadScope<'_> {
        if let Some(mut recorder) = self.roots.recorder() {
            recorder.safepoint();
        }'''
to = '''    pub(crate) fn read_scope(&self) -> DomReadScope<'_> {'''

