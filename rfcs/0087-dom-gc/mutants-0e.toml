[[mutant]]
name = "an edge's write isn't recorded"
file = "crates/dom/src/gc.rs"
from = '''            recorder.write_edge(slot_address(&self.slot), Some(target.get_rust_obj().addr()), false);'''
to = '''            let _ = (&mut recorder, target);'''

[[mutant]]
name = "an edge's copy isn't recorded"
file = "crates/dom/src/gc.rs"
from = '''            recorder.write_edge(slot_address(&self.slot), target, false);'''
to = '''            let _ = target;'''

[[mutant]]
name = "an edge's clearing isn't recorded"
file = "crates/dom/src/gc.rs"
from = '''            recorder.write_edge(slot_address(&self.slot), None, false);
        }
        // SAFETY: as for `set`.'''
to = '''        }
        // SAFETY: as for `set`.'''

[[mutant]]
name = "a weak edge's write is recorded strong"
file = "crates/dom/src/gc.rs"
from = '''            recorder.write_edge(slot_address(&self.slot), Some(target.get_rust_obj().addr()), true);'''
to = '''            recorder.write_edge(slot_address(&self.slot), Some(target.get_rust_obj().addr()), false);'''

[[mutant]]
name = "a tagged edge's write isn't recorded"
file = "crates/dom/src/gc.rs"
from = '''            recorder.write_edge(slot_address(&self.slot), Some(target.addr()), false);'''
to = '''            let _ = &mut recorder;'''

[[mutant]]
name = "a JS value's write isn't recorded"
file = "crates/dom/src/v8_engine.rs"
from = '''            recorder.write_external(slot_address(&self.slot), value.is_some());'''
to = '''            let _ = &mut recorder;'''

[[mutant]]
name = "a wrapper isn't recorded"
file = "crates/dom/src/v8_engine.rs"
from = '''            recorder.wrapper(
                value.get_rust_obj().addr(),
                Box::new(move || alive.get().is_some()),
            );'''
to = '''            let _ = (&mut recorder, alive);'''

[[mutant]]
name = "a mutation scope isn't a safepoint"
file = "crates/dom/src/isolate.rs"
