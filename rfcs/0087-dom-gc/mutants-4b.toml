name = "the verifier skips the slot sets' holders"
file = "crates/gc/src/heap/verify.rs"
from = '''                    if !live {'''
to = '''                    if false && !live {'''

[[mutant]]
name = "the verifier skips old weak edges to young objects"
file = "crates/gc/src/heap/verify.rs"
from = '''                    if !young_host && !remembered {'''
to = '''                    if false && !young_host && !remembered {'''

[[mutant]]
name = "a weak read's objects don't float"
file = "crates/gc/src/heap.rs"
from = '''            if self.verifies() {
                self.floats(raw);
            }'''
to = '''            let _ = self.verifies();'''
