[[mutant]]
name = "a view's request for the focus is dropped"
file = "crates/ui/src/tree.rs"
from = '''            Some(true) => self.set_focus(Some(id)),'''
to = '''            Some(true) => {}'''

[[mutant]]
name = "a view asking to be laid out isn't"
file = "crates/ui/src/tree.rs"
from = '''        if requests.layout {
            self.mark_layout(id);
        }'''
to = '''        if requests.layout && false {
            self.mark_layout(id);
        }'''

[[mutant]]
name = "the cursor is the default everywhere"
file = "crates/ui/src/tree.rs"
from = '''            .and_then(|(id, local)| Some(self.views[id.slot()].as_deref()?.cursor(local)))'''
to = '''            .and_then(|(id, _)| self.views[id.slot()].as_deref().map(|_| Cursor::Default))'''

[[mutant]]
name = "a token table's values are out of order"
file = "crates/ui/src/theme.rs"
from = '''            values: K::ALL.iter().map(|&token| value(token)).collect(),'''
to = '''            values: K::ALL.iter().rev().map(|&token| value(token)).collect(),'''

[[mutant]]
name = "a view's damage is its list's bounds"
file = "crates/ui/src/tree.rs"
from = '''        self.list
            .visual_rects()
            .iter()
            .fold(RectF::default(), |drawn, rect| drawn.union(rect))
            .offset(self.origin.x, self.origin.y)'''
to = '''        self.list.bounds().offset(self.origin.x, self.origin.y)'''

[[mutant]]
name = "damage isn't kept within the layer"
file = "crates/ui/src/tree.rs"
from = '''            .map(|rect| rect.intersect(&layer))'''
to = '''            .map(|rect| *rect)'''
