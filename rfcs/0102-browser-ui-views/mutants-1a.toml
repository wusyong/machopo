# `ui`'s tree: ids, layout, painting with kept recordings and damage, hit
# testing, events, focus.
test = ["cargo", "test", "-q", "-p", "ui"]
timeout = 600

[[mutant]]
name = "a freed slot keeps its generation"
file = "crates/ui/src/tree.rs"
from = '''                slot.generation = next;'''
to = '''                let _ = next;'''

[[mutant]]
name = "an id's generation isn't checked"
file = "crates/ui/src/tree.rs"
from = '''        if slot.generation != id.generation {
            return None;
        }
        slot.node.as_ref()'''
to = '''        slot.node.as_ref()'''

[[mutant]]
name = "removing a view leaves the views under it"
file = "crates/ui/src/tree.rs"
from = '''            stack.extend(node.children);
            self.views[id.slot()] = None;'''
to = '''            drop(node.children);
            self.views[id.slot()] = None;'''

[[mutant]]
name = "a view that asks to be laid out keeps its ancestors' caches"
file = "crates/ui/src/tree.rs"
from = '''            node.cache.clear();
            at = node.parent;'''
to = '''            at = node.parent;'''

[[mutant]]
name = "a view whose size changed doesn't paint again"
file = "crates/ui/src/tree.rs"
from = '''            if bounds.size() != node.bounds.size() {
                node.needs_paint = true;
            }'''
to = '''            if bounds.size() != node.bounds.size() && false {
                node.needs_paint = true;
            }'''

[[mutant]]
name = "a view painted again leaves no damage where it was"
file = "crates/ui/src/tree.rs"
from = '''                if let Some(old) = node.painted.replace(painted) {
                    damage.push(old.drawn());
                }'''
to = '''                if let Some(old) = node.painted.replace(painted) {
                    drop(old);
                }'''

[[mutant]]
name = "a view moved leaves no damage where it was"
file = "crates/ui/src/tree.rs"
from = '''                    // Moved: where it was and where it is.
                    damage.push(painted.drawn());'''
to = '''                    // Moved: where it was and where it is.'''

[[mutant]]
name = "a view hidden leaves no damage"
file = "crates/ui/src/tree.rs"
from = '''                    self.forget_painted(id);
                    damage.append(&mut self.damage);'''
to = '''                    self.damage.clear();'''

[[mutant]]
name = "a removed view leaves no damage"
file = "crates/ui/src/tree.rs"
from = '''            if let Some(painted) = painted {
                self.damage.push(painted.drawn());
            }'''
to = '''            drop(painted);'''

[[mutant]]
name = "the first frame names what changed"
file = "crates/ui/src/tree.rs"
from = '''                invalidation: (!full).then(|| damage.into()),'''
to = '''                invalidation: Some(damage.into()),'''

[[mutant]]
name = "a new size isn't painted whole"
file = "crates/ui/src/tree.rs"
from = '''            self.needs_layout = true;
            self.needs_full_paint = true;'''
to = '''            self.needs_layout = true;'''

[[mutant]]
name = "a view's request to paint is dropped"
file = "crates/ui/src/tree.rs"
from = '''        if requests.paint
            && let Some(node) = self.node_mut(id)'''
to = '''        if requests.paint
            && false
            && let Some(node) = self.node_mut(id)'''

[[mutant]]
name = "a new theme paints nothing again"
file = "crates/ui/src/tree.rs"
from = '''            if let Some(node) = &mut slot.node {
                node.needs_paint = true;'''
to = '''            if let Some(node) = &mut slot.node {'''

[[mutant]]
name = "no recording is found stale"
file = "crates/ui/src/tree.rs"
from = '''                    .is_some_and(|painted| painted.list != fresh)'''
to = '''                    .is_some_and(|painted| painted.list != fresh && false)'''

[[mutant]]
