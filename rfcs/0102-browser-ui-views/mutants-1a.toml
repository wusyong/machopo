            if let Some(hit) = self.hit_test_in(child, local) {'''
to = '''        for &child in node.children.iter() {
            if let Some(hit) = self.hit_test_in(child, local) {'''

[[mutant]]
name = "a hidden view is hit"
file = "crates/ui/src/tree.rs"
from = '''        if node.style.display == Display::None {
            return None;
        }
        let local'''
to = '''        let local'''

[[mutant]]
name = "a container is hit"
file = "crates/ui/src/view.rs"
from = '''    fn hit_test(&self, _: PointF) -> bool {
        false
    }'''
to = '''    fn hit_test(&self, _: PointF) -> bool {
        true
    }'''

