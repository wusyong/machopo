# Step 3a: the renderer commits a document as its body starts and parses
# the rest as it comes: the document owns its body (pipe, decoder), the
# parser waits for what is still to come, and the body is read while the
# parser waits for a script; the encoding is the start's; Navigation
# Timing's end and sizes, DevTools' data and the trace's `responseEnd`
# come at the end; a document isn't drawn till its parser has made its
# body.
test = ["sh", "-c", "cargo test -q -p browser --test it body:: && cargo test -q -p renderer --lib -- encoding:: document:: network_agent:: && cargo test -q -p shell --test it -- drawn devtools trace::marks"]
timeout = 1800

[[mutant]]
name = "the parser finishes when what came is parsed"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''                    if let Some(next) = self.doc_mut(frame)
                        && next.body.is_some()
                    {'''
to = '''                    if let Some(next) = self.doc_mut(frame)
                        && false
                    {'''

[[mutant]]
name = "what the pipe has isn't handed to the parser"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''                    read = read.saturating_add(length);
                    self.body_data(frame, length, &markup);'''
to = '''                    read = read.saturating_add(length);
                    self.body_data(frame, length, "");'''

[[mutant]]
name = "the pipe isn't watched"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''                        pipe.watch(scheduler.body_waker(token, navigation_id));'''
to = '''                        let _ = (pipe, token);'''

[[mutant]]
name = "what is past a task's bytes isn't read in another"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''                if let Some(token) = token {
                    (scheduler.body_waker(token, navigation_id))();
                }'''
to = '''                let _ = token;'''

[[mutant]]
name = "the body isn't read while the parser waits for a script"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''            let navigation_id = next.navigation_id;
            let Some(body) = &mut next.body else {
                break;
            };'''
to = '''            let navigation_id = next.navigation_id;
            if next.blocking_script.is_some() {
                break;
            }
            let Some(body) = &mut next.body else {
                break;
            };'''

