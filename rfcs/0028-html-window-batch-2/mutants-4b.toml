# --- Relevant mutations ---------------------------------------------------------

[[mutant]]
name = "a source's attribute change updates nothing"
file = "crates/dom_api/src/image.rs"
from = '''    for image in &images {
        m.record_image_change(image);
    }'''
to = ''''''

[[mutant]]
name = "a source's attribute change updates the img before it"
file = "crates/dom_api/src/image.rs"
from = '''            std::iter::successors(node.next_sibling(), |sibling| sibling.next_sibling())'''
to = '''            std::iter::successors(node.parent().and_then(|p| p.first_child()), |sibling| sibling.next_sibling())'''
test = ["python3", "scripts/test.py", "wpt", "the-img-element/relevant-mutations"]

[[mutant]]
name = "a picture's children changing updates nothing"
file = "crates/dom/src/scope.rs"
from = '''    if is(child, "img") {
        changes.push(ElementChange::Image(child.id));
        return;
    }'''
to = '''    if is(child, "img") {
        return;
    }'''
test = ["python3", "scripts/test.py", "wpt", "the-img-element/relevant-mutations"]

[[mutant]]
name = "a source inserted after the img updates it"
file = "crates/dom/src/scope.rs"
from = '''    let mut next = unsafe { child.next_sibling.get() };'''
to = '''    let mut next = unsafe { parent.first_child.get() };'''
test = ["python3", "scripts/test.py", "wpt", "the-img-element/relevant-mutations"]

# --- Keeping the current request --------------------------------------------------

[[mutant]]
name = "the same image, completely available, is replaced"
file = "crates/dom_api/src/image.rs"
from = '''            ImageRequestState::CompletelyAvailable => available.is_some(),'''
to = '''            ImageRequestState::CompletelyAvailable => false,'''
test = ["python3", "scripts/test.py", "wpt", "the-img-element/decode/image-decode-path-changes"]

[[mutant]]
name = "the same image, loading, is replaced"
file = "crates/dom_api/src/image.rs"
from = '''            ImageRequestState::Unavailable => true,
            ImageRequestState::Broken => false,'''
to = '''            ImageRequestState::Unavailable => false,
            ImageRequestState::Broken => false,'''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "navigation", "img"]

