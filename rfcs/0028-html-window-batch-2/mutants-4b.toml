# --- A new iframe's base URL ------------------------------------------------------

[[mutant]]
name = "a new iframe's about:blank has no base URL until the render thread has it"
file = "crates/renderer/src/frame_view.rs"
from = '''        *child.fallback_base_url.borrow_mut() = base_url.cloned();'''
to = '''        let _ = base_url;'''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "navigation", "about_blank_has"]

[[mutant]]
name = "a new iframe's base URL is its parent's when the render thread has it"
file = "crates/renderer/src/frame_view.rs"
from = '''            view.set_fallback_base_url(base.unwrap_or_else(|| self.base_url.clone()));'''
to = '''            let _ = base;
            view.set_fallback_base_url(self.base_url.clone());'''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "navigation", "about_blank_has"]

