# Mutation test of stage 4b (`srcset`, `sizes`, `<picture>` and reacting to
# environment changes):
# python3 scripts/test.py mutate rfcs/0028-html-window-batch-2/mutants-4b.toml
test = ["cargo", "test", "-q", "-p", "browser", "--test", "navigation", "srcset"]
timeout = 900

# --- Media queries and sizes ----------------------------------------------------

[[mutant]]
name = "and: unknown wins over false"
file = "crates/style/src/media.rs"
from = '''        (Some(false), _) | (_, Some(false)) => Some(false),
        (Some(true), Some(true)) => Some(true),'''
to = '''        (Some(true), Some(true)) => Some(true),
        (None, _) | (_, None) => None,
        (Some(false), _) | (_, Some(false)) => Some(false),'''
test = ["cargo", "test", "-q", "-p", "style", "--lib", "media"]

[[mutant]]
name = "or: unknown wins over true"
file = "crates/style/src/media.rs"
from = '''        (Some(true), _) | (_, Some(true)) => Some(true),
        (Some(false), Some(false)) => Some(false),'''
to = '''        (Some(false), Some(false)) => Some(false),
        (None, _) | (_, None) => None,
        (Some(true), _) | (_, Some(true)) => Some(true),'''
test = ["cargo", "test", "-q", "-p", "style", "--lib", "media"]

[[mutant]]
name = "orientation: a square is landscape"
file = "crates/style/src/media.rs"
from = '''environment.height >= environment.width'''
to = '''environment.height > environment.width'''
test = ["cargo", "test", "-q", "-p", "style", "--lib", "media"]

[[mutant]]
name = "general-enclosed takes a stray closing bracket"
file = "crates/style/src/media.rs"
from = '''            return invalid(input);
        }
    }
    Ok(())'''
to = '''            continue;
        }
    }
    Ok(())'''
test = ["cargo", "test", "-q", "-p", "style", "--lib", "media"]

[[mutant]]
name = "a negative source size is taken"
file = "crates/style/src/media.rs"
from = '''        Token::Dimension { value, unit, .. } if value >= 0.0 => match length(value, &unit) {'''
to = '''        Token::Dimension { value, unit, .. } => match length(value, &unit) {'''
test = ["cargo", "test", "-q", "-p", "style", "--lib", "media"]

[[mutant]]
name = "a size whose condition doesn't match is taken"
file = "crates/style/src/media.rs"
from = '''            && condition.is_none_or(|c| c.matches(environment))'''
to = '''            && condition.is_none_or(|_| true)'''

[[mutant]]
name = "the default size isn't 100vw"
file = "crates/style/src/media.rs"
from = '''pub fn default_source_size(environment: &MediaEnvironment) -> f32 {
    environment.width'''
to = '''pub fn default_source_size(environment: &MediaEnvironment) -> f32 {
    environment.width / 2.0'''

# --- srcset ---------------------------------------------------------------------

[[mutant]]
name = "a w descriptor isn't over the source size"
file = "crates/dom_api/src/srcset.rs"
from = '''                f64::from(width) / f64::from(source_size)'''
to = '''                f64::from(width) / 100.0'''

[[mutant]]
name = "src counts among widths"
file = "crates/dom_api/src/srcset.rs"
from = '''        if previous != Some(density) && !(has_width && from_src) {'''
to = '''        if previous != Some(density) {'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--lib", "srcset"]

[[mutant]]
name = "past the geometric mean takes the lower"
file = "crates/dom_api/src/srcset.rs"
from = '''        winner = if (dpr <= 1.0 && dpr > current) || dpr >= geometric_mean {'''
to = '''        winner = if dpr <= 1.0 && dpr > current {'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--lib", "srcset"]

[[mutant]]
name = "a denser candidate already loaded doesn't win"
file = "crates/dom_api/src/srcset.rs"
from = '''        .find(|&i| cached(deduped[i].1))'''
to = '''        .find(|_| false)'''

[[mutant]]
name = "an x descriptor is a width"
file = "crates/dom_api/src/srcset.rs"
from = '''        (None, Some(density)) => Descriptor::Density(density),'''
to = '''        (None, Some(density)) => Descriptor::Width(density as u32),'''

[[mutant]]
name = "a bad descriptor keeps the candidate"
file = "crates/dom_api/src/srcset.rs"
from = '''            _ => return None,
        }
    }
    // A height only goes with a width'''
to = '''            _ => {}
        }
    }
    // A height only goes with a width'''

[[mutant]]
name = "parentheses don't hold a descriptor's spaces"
file = "crates/dom_api/src/srcset.rs"
from = '''                Some('(') => {
                    current.push('(');
                    state = State::InParens;
                }'''
to = '''                Some('(') => {
                    current.push('(');
                }'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--lib", "srcset"]

