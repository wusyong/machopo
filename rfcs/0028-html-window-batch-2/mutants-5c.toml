# Mutation test of stage 5c (`Blob`, bodies of bytes and blob URLs):
# python3 scripts/test.py mutate rfcs/0028-html-window-batch-2/mutants-5c.toml
# Not here, as equivalent: JS's `[Clamp]` taking `NaN` as 0 (the table's
# entry does too).
test = ["cargo", "test", "-q", "-p", "browser", "--test", "navigation", "blobs"]
timeout = 900

# --- The table's buffer sources and `[Clamp]` (JS) ----------------------------------

[[mutant]]
name = "a resizable buffer is a buffer source"
file = "crates/dom_js/src/buffer.rs"
from = '''    buffer.is_some_and(|buffer| buffer.get_backing_store().is_resizable_by_user_javascript())'''
to = '''    let _ = buffer;
    false'''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "blob"]

[[mutant]]
name = "an ArrayBuffer's bytes are none"
file = "crates/dom_js/src/buffer.rs"
from = '''        return store[..buffer.byte_length().min(store.len())]'''
to = '''        return store[..0]'''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "blob"]

[[mutant]]
name = "an ArrayBuffer isn't a buffer source"
file = "crates/dom_js/src/buffer.rs"
from = '''    value.is_array_buffer() || view_kind(value).is_some()'''
to = '''    view_kind(value).is_some()'''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "blob"]

[[mutant]]
name = "a typed array is a union's sequence"
file = "crates/dom_js/src/convert.rs"
from = '''    if crate::buffer::is_buffer_source(value)
        && let Some(source) = member(&|base| matches!(base, Base::BufferSource))'''
to = '''    if false
        && let Some(source) = member(&|base| matches!(base, Base::BufferSource))'''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "blob"]

[[mutant]]
name = "[Clamp] rounds half away from zero"
file = "crates/dom_js/src/convert.rs"
from = '''n.clamp(-(2f64.powi(63)), 2f64.powi(63) - 1.0).round_ties_even()'''
to = '''n.clamp(-(2f64.powi(63)), 2f64.powi(63) - 1.0).round()'''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "blob"]

[[mutant]]
name = "a new Uint8Array is an ArrayBuffer"
file = "crates/dom_js/src/convert.rs"
from = '''        Value::Uint8Array(bytes) => crate::buffer::new_uint8_array(cx.scope(), &bytes),'''
to = '''        Value::Uint8Array(bytes) => crate::buffer::new_array_buffer(cx.scope(), &bytes).into(),'''

