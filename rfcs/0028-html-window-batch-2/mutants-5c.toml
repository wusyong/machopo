# --- Blob URLs: the renderer --------------------------------------------------------

[[mutant]]
name = "a revoke reaches the browser at once"
file = "crates/renderer/src/loader.rs"
from = '''        if state.live.remove(url).is_some() {
            state.revoked.push(url.to_owned());'''
to = '''        if state.live.remove(url).is_some() {
            let _ = self.to_browser.send(RendererHostMsg::RevokeBlobUrl { url: url.to_owned() });'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "loader"]

[[mutant]]
name = "a revoke never reaches the browser"
file = "crates/renderer/src/loader.rs"
from = '''            let _ = self.to_browser.send(RendererHostMsg::RevokeBlobUrl { url });'''
to = '''            let _ = url;'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "loader"]

[[mutant]]
name = "is_revoked minds the fragment"
