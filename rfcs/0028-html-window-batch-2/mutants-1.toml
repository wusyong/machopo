        );
        namespaces.push'''

[[mutant]]
name = "console is enumerable"
file = "crates/dom_js/src/lib.rs"
from = '''            let object = templates::namespace(scope, index);
            let name = templates::string(scope, namespace.name);
            global.define_own_property(
                scope,
                name.into(),
                object.into(),
                v8::PropertyAttribute::DONT_ENUM,'''
to = '''            let object = templates::namespace(scope, index);
            let name = templates::string(scope, namespace.name);
            global.define_own_property(
                scope,
                name.into(),
                object.into(),
                v8::PropertyAttribute::NONE,'''

[[mutant]]
name = "a namespace's member decodes as the one before it"
file = "crates/dom_js/src/templates.rs"
from = '''        None => &NAMESPACES[index - INTERFACES.len()].members[member],'''
to = '''        None => &NAMESPACES[index - INTERFACES.len()].members[member.saturating_sub(1)],'''

# --- renderer ----------------------------------------------------------

[[mutant]]
name = "the renderer drops console messages"
file = "crates/renderer/src/frame_view.rs"
from = '''        eprintln!("[console] {message}");'''
to = '''        let _ = message;'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "automation_pipe", "the_pages_output_stays_off_the_pipe"]

# --- The inspector's limits (found by wptrunner's run of `console/`) ------------

[[mutant]]
name = "no limit on array elements"
file = "crates/dom_js/src/console.rs"
from = '''        if length > *items || arrays.len() > MAX_DEPTH {'''
to = '''        if arrays.len() > MAX_DEPTH {'''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "console"]

[[mutant]]
name = "the element limit is per array"
file = "crates/dom_js/src/console.rs"
from = '''        *items -= length;'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "console"]

[[mutant]]
name = "too deep leaves out the rest"
file = "crates/dom_js/src/console.rs"
from = '''        if length > *items || arrays.len() > MAX_DEPTH {
            return false;
        }'''
to = '''        if arrays.len() > MAX_DEPTH {
            return true;
        }
        if length > *items {
            return false;
        }'''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "console"]

[[mutant]]
name = "an empty message is printed"
file = "crates/dom_api/src/console.rs"
from = '''    if message.is_empty() {
        return;
    }'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "console"]
