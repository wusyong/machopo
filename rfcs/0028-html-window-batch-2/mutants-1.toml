# Mutation test of stage 1 (console):
# python3 scripts/test.py mutate rfcs/0028-html-window-batch-2/mutants-1.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "console"]
timeout = 900

# --- dom ---------------------------------------------------------------

[[mutant]]
name = "count doesn't count"
file = "crates/dom/src/console.rs"
from = '''        *count += 1;'''
to = ''''''

[[mutant]]
name = "countReset of a label never counted is quiet"
file = "crates/dom/src/console.rs"
from = '''            None => false,'''
to = '''            None => true,'''

[[mutant]]
name = "time restarts a running timer"
file = "crates/dom/src/console.rs"
from = '''        if timers.contains_key(label) {
            return false;
        }'''
to = ''''''

[[mutant]]
name = "timeEnd doesn't stop the timer"
file = "crates/dom/src/console.rs"
from = '''            timers.remove(label)'''
to = '''            timers.get(label).copied()'''

# --- dom_api -----------------------------------------------------------

[[mutant]]
name = "no arguments print an empty line"
file = "crates/dom_api/src/console.rs"
from = '''    if !data.is_empty() {
        let message = text(cx, &data);'''
to = '''    if true {
        let message = text(cx, &data);'''

[[mutant]]
name = "an assertion that holds prints"
file = "crates/dom_api/src/console.rs"
from = '''    if !condition {'''
to = '''    if condition {'''

[[mutant]]
name = "no arguments print nothing for group"
file = "crates/dom_api/src/console.rs"
from = '''        name.to_owned()'''
to = '''        String::new()'''

[[mutant]]
name = "undefined is written as nothing"
file = "crates/dom_api/src/console.rs"
from = '''            None => "undefined".to_owned(),'''
to = '''            None => String::new(),'''

[[mutant]]
name = "count without the label"
file = "crates/dom_api/src/console.rs"
from = '''    print(cx, window, ConsoleLevel::Info, &format!("{label}: {count}"));'''
to = '''    print(cx, window, ConsoleLevel::Info, &format!("{count}"));'''

[[mutant]]
name = "timeLog drops its data"
file = "crates/dom_api/src/console.rs"
from = '''    if !data.is_empty() {
        message.push(' ');'''
to = '''    if false {
        message.push(' ');'''

[[mutant]]
name = "timeEnd doesn't end"
file = "crates/dom_api/src/console.rs"
from = '''    time_message(cx, window, &label, &Vec::new(), true);'''
to = '''    time_message(cx, window, &label, &Vec::new(), false);'''

[[mutant]]
name = "a timer's time is the clock's"
file = "crates/dom_api/src/console.rs"
from = '''number_to_string(now - start)'''
to = '''number_to_string(now)'''

[[mutant]]
name = "the timer starts at 0"
file = "crates/dom_api/src/console.rs"
from = '''    if !cx.mutate().console_time(window, label.as_str(), now) {'''
to = '''    if !cx.mutate().console_time(window, label.as_str(), now * 0.0) {'''

[[mutant]]
name = "console is in kun:dom"
file = "crates/dom_api/src/declare.rs"
from = '''    (@exposure JsOnly) => { $crate::Exposure::Js };'''
to = '''    (@exposure JsOnly) => { $crate::Exposure::Both };'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "wit"]

[[mutant]]
name = "the spec test ignores a namespace's differences"
file = "crates/dom_api/tests/spec.rs"
from = '''                    differences.insert(key, format!("{shape}, not in the IDL's {name}"));
                }
                Some(spec_shape) if *spec_shape != shape => {'''
to = '''                    let _ = (key, shape);
                }
                Some(spec_shape) if *spec_shape != shape => {'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "spec"]

[[mutant]]
name = "the spec test ignores what a namespace lacks"
file = "crates/dom_api/tests/spec.rs"
from = '''            if !table.contains_key(key) {
                missing.insert(key.clone());'''
to = '''            if !table.contains_key(key) {
                let _ = &missing;'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "spec"]

[[mutant]]
name = "the WebIDL reader skips namespaces"
file = "crates/dom_api/tests/webidl/mod.rs"
from = '''                idl.namespaces.entry(name).or_default().extend(members);'''
to = '''                let _ = (name, members);'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "spec"]

