# Mutation test of stage 2d: a state or attribute that rules use across
# siblings styles again only what their sibling invalidation sets find:
# python3 scripts/test.py mutate rfcs/0051-performance/mutants-2d.toml
test = ["cargo", "test", "-q", "-p", "style", "--test", "it"]
timeout = 600

[[mutant]]
name = "a sibling's set doesn't style it"
file = "crates/style/src/lib.rs"
from = '''let invalidated = sibling.as_ref().is_some_and(|sibling| sibling.restyle)'''
to = '''let invalidated = false'''

