# Mutation test of stage 3: the lifecycle events from the renderer, the
# network's quiet, `Page.navigate` answered as it is about to commit,
# machopodriver's waits, and `Target`'s detaching:
# python3 scripts/test.py mutate rfcs/0082-devtools-network/mutants-3.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools_lifecycle::"]
timeout = 600

# The lifecycle events.

[[mutant]]
name = "a new document has no init"
file = "crates/renderer/src/render_thread/page_agent.rs"
from = '''        self.tell("Page.frameStartedLoading", json!({ "frameId": frame.id }));
        self.lifecycle_event(
            &frame.id,
            frame.document,
            &frame.loader_id,
            "init",
            TimeTicks::now(),
        );'''
to = '''        self.tell("Page.frameStartedLoading", json!({ "frameId": frame.id }));'''

[[mutant]]
name = "a frame's initial document has no init"
file = "crates/renderer/src/render_thread/page_agent.rs"
from = '''        event("init");
        if frame.navigating {'''
to = '''        if frame.navigating {'''

