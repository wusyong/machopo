# The network's quiet.

[[mutant]]
name = "the network isn't watched"
file = "crates/renderer/src/render_thread.rs"
from = '''                    view.idleness().start();'''
to = ''''''

[[mutant]]
name = "fetch()es aren't counted"
file = "crates/renderer/src/render_thread.rs"
from = '''            let active = view
                .subresources_in_flight()
                .saturating_add(self.fetches.in_flight_for(view.document().as_node().id()));'''
to = '''            let active = view.subresources_in_flight();'''

[[mutant]]
name = "subresources aren't counted"
file = "crates/renderer/src/render_thread.rs"
from = '''            let active = view
                .subresources_in_flight()
                .saturating_add(self.fetches.in_flight_for(view.document().as_node().id()));'''
to = '''            let active = self.fetches.in_flight_for(view.document().as_node().id());'''

[[mutant]]
name = "the loop doesn't wake for the quiet"
file = "crates/renderer/src/render_thread.rs"
from = '''        sooner(
            sooner(sooner(sooner(self.until_next_timer(), heap), engine), caret),
            idle,
        )'''
to = '''        let _ = idle;
        sooner(sooner(sooner(self.until_next_timer(), heap), engine), caret)'''
timeout = 120

[[mutant]]
name = "the quiet isn't looked at after tasks"
file = "crates/renderer/src/render_thread.rs"
from = '''            self.check_network_idle();'''
to = ''''''
timeout = 120

[[mutant]]
name = "the quiet window is shorter"
file = "crates/renderer/src/idleness_detector.rs"
from = '''pub(crate) const QUIET_WINDOW: Duration = Duration::from_millis(500);'''
to = '''pub(crate) const QUIET_WINDOW: Duration = Duration::from_millis(100);'''

[[mutant]]
name = "two in flight are quiet"
file = "crates/renderer/src/idleness_detector.rs"
from = '''            let since = self.quiet_since.filter(|_| active == 0);
            self.quiet_since = (active == 0).then(|| since.unwrap_or(now));'''
to = '''            let since = self.quiet_since.filter(|_| active <= 2);
            self.quiet_since = (active <= 2).then(|| since.unwrap_or(now));'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "--", "idleness_detector"]

[[mutant]]
name = "the quiet is told when it ends, not when it began"
file = "crates/renderer/src/idleness_detector.rs"
from = '''                due.push(("networkIdle", since));'''
to = '''                due.push(("networkIdle", now));'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "--", "idleness_detector"]

# Page.navigate's answer.

[[mutant]]
name = "Page.navigate is answered as it starts"
file = "crates/shell/src/automation_session.rs"
from = '''                if !loading {
                    return Dispatched::Now(Ok(self.navigate_result(tab, loader, None)));
                }'''
to = '''                let _ = loading;
                return Dispatched::Now(Ok(self.navigate_result(tab, loader, None)));'''

[[mutant]]
name = "a load that failed is answered without its error"
file = "crates/shell/src/automation_session.rs"
from = '''                self.navigation_ready(tab, *navigation_id, Some(error_text));'''
to = '''                self.navigation_ready(tab, *navigation_id, None);'''

[[mutant]]
name = "a replaced navigation isn't answered"
file = "crates/shell/src/automation_session.rs"
from = '''                .partition(|(of, id, _)| *of == tab && *id < loader);'''
to = '''                .partition(|(of, id, _)| *of == tab && *id < loader && false);'''
timeout = 180

[[mutant]]
name = "a closed tab's navigation isn't answered"
file = "crates/shell/src/automation_session.rs"
from = '''            .chain(navigates.into_iter().map(|(_, _, reply): (_, _, Reply)| reply))'''
to = '''            .chain(navigates.into_iter().take(0).map(|(_, _, reply): (_, _, Reply)| reply))'''
timeout = 180

[[mutant]]
name = "a navigation's answer says it is a download"
file = "crates/shell/src/automation_session.rs"
from = '''            is_download: false,'''
to = '''            is_download: true,'''

