# Stage 3a: text is shaped a word at a time where that gives what shaping
# it whole does, and what shaping a word gave is kept (the parley fork's
# `shape/words.rs`, `shape/space.rs` and `shape_segment`), by the word, its
# characters' font styles (parley's ids) and its options.
#
# python3 scripts/test.py mutate rfcs/0083-text-layout-work/mutants-3a.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it"]
timeout = 600

# When a segment is shaped a word at a time.

