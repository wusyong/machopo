file = "crates/layout/src/lib.rs"
from = '''                    && !floats
                    && !inline.indented()
                {'''
to = '''                    && false
                {'''

[[mutant]]
name = "floats not placed for a width"
file = "crates/layout/src/lib.rs"
from = '''                    && !floats
                    && !inline.indented()
                {'''
to = '''                    && !inline.indented()
                {'''

[[mutant]]
name = "an indent not broken for a width"
file = "crates/layout/src/lib.rs"
from = '''                    && !floats
                    && !inline.indented()
                {'''
to = '''                    && !floats
                {'''

[[mutant]]
name = "every width its max-content one"
file = "crates/layout/src/lib.rs"
from = '''                            AvailableSpace::MinContent => min,'''
to = '''                            AvailableSpace::MinContent => max,'''

[[mutant]]
name = "a fit-content width left out"
file = "crates/layout/src/lib.rs"
from = '''                    let width = known.width.or(fit).unwrap_or_else(|| {'''
to = '''                    let width = known.width.unwrap_or_else(|| {'''

[[mutant]]
name = "a percentage indent counts"
file = "crates/layout/src/text.rs"
from = '''        indent_px(self.text_indent, None) != 0.0'''
to = '''        indent_px(self.text_indent, Some(1.0)) != 0.0'''

[[mutant]]
name = "never indented"
file = "crates/layout/src/text.rs"
from = '''        indent_px(self.text_indent, None) != 0.0'''
to = '''        false'''

# The count of lines broken.

[[mutant]]
name = "lines broken uncounted"
file = "crates/layout/src/text.rs"
from = '''        atomics.count_line_break();'''
to = ''''''

[[mutant]]
name = "a remembered break counted"
file = "crates/layout/src/text.rs"
from = '''        {
            return *size;
        }
        atomics.count_line_break();'''
to = '''        {
            atomics.count_line_break();
            return *size;
        }
        atomics.count_line_break();'''

[[mutant]]
name = "an atomic inline's lines uncounted"
file = "crates/layout/src/lib.rs"
from = '''    fn count_line_break(&mut self) {
        self.tree.count_line_break();
    }'''
to = '''    fn count_line_break(&mut self) {}'''
