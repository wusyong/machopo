# Stage 1: both browsers' samples by category (`categories.py`), a
# Chromium's samples (`--sample --browser chrome`: its renderer main thread
# by the tid its trace gives, on CLOCK_MONOTONIC, V8's perf maps without the
# sandbox and gone after), and `categories.md`. The tool's tests: the
# categories' (stacks of both browsers' shapes), the comparison's, and a
# Chromium sampled on the fake `frames` suite (Fedora's, installed).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "python3", "scripts/bench/speedometer/speedometer_test.py", "CategoryTests", "SampleReadingTests", "ChromeSampleTests"]
timeout = 600

[[mutant]]
name = "categories: V8's own frames don't look outward"
file = "scripts/bench/speedometer/categories.py"
from = '''        if found == V8:
            in_v8 = True'''
to = '''        if found == V8:
            return "V8 API"'''

[[mutant]]
name = "categories: under JS, V8's frames are V8 API's"
file = "scripts/bench/speedometer/categories.py"
from = '''        elif found == "JS":
            return "JS"'''
to = '''        elif found == "JS":
            return "V8 API" if in_v8 else "JS"'''

