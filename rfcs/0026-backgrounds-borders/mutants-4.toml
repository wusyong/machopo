from = '''    } else if v == 0.0 {
        gray(0x54)'''
to = '''    } else if v == 0.0 {
        gray(0)'''

[[mutant]]
name = "a ring with a side missing isn't whole"
file = "crates/paint/src/lib.rs"
from = '''        let uniform = looks.len() == present'''
to = '''        let uniform = looks.len() == 4'''

[[mutant]]
name = "a transparent side with a width is part of a whole ring"
