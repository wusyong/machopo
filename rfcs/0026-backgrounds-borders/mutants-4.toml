# Mutation test of stage 4 (border styles):
# python3 scripts/test.py mutate rfcs/0026-backgrounds-borders/mutants-4.toml
test = ["cargo", "test", "-q", "-p", "paint"]
timeout = 900

# --- style -------------------------------------------------------------

[[mutant]]
name = "hidden keeps its width"
file = "crates/style/src/properties.rs"
from = '''        if !side_mut(&mut style.border_style, i).is_drawn() {'''
to = '''        if *side_mut(&mut style.border_style, i) == computed_style::BorderStyle::None {'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "an outline takes hidden"
file = "crates/style/src/properties.rs"
from = '''                    Some(BorderStyle::Hidden) => None,'''
to = '''                    Some(BorderStyle::Hidden) => Some(OutlineStyle::Line(BorderStyle::Hidden)),'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "groove reads back as ridge"
file = "crates/style/src/serialize.rs"
from = '''        BorderStyle::Groove => "groove",'''
to = '''        BorderStyle::Groove => "ridge",'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "a hidden border is drawn"
file = "crates/computed_style/src/lib.rs"
from = '''        !matches!(self, Self::None | Self::Hidden)'''
to = '''        !matches!(self, Self::None)'''
test = ["python3", "scripts/test.py", "reftest", "backgrounds/t1"]

[[mutant]]
name = "a dashed border hides the background's edge"
file = "crates/computed_style/src/lib.rs"
from = '''            Self::Solid | Self::Groove | Self::Ridge | Self::Inset | Self::Outset'''
to = '''            Self::Solid | Self::Groove | Self::Ridge | Self::Inset | Self::Outset | Self::Dashed'''

# --- raster --------------------------------------------------------------

[[mutant]]
name = "no dashes"
file = "crates/raster/src/skia_backend.rs"
from = '''        paint.set_path_effect(sk::PathEffect::dash(&[dash.on, dash.off], 0.0));'''
to = '''        let _ = dash.off;'''
test = ["cargo", "test", "-q", "-p", "raster"]

[[mutant]]
name = "square dots"
file = "crates/raster/src/skia_backend.rs"
from = '''            paint.set_stroke_cap(sk::PaintCap::Round);'''
to = '''            paint.set_stroke_cap(sk::PaintCap::Butt);'''
test = ["cargo", "test", "-q", "-p", "raster"]

[[mutant]]
name = "a clipped op isn't clipped"
file = "crates/raster/src/skia_backend.rs"
from = '''            canvas.clip_path(&polygon_path(polygon), sk::ClipOp::Intersect, true);
            draw_op(canvas, op, base, cache);'''
to = '''            let _ = polygon;
            draw_op(canvas, op, base, cache);'''
test = ["cargo", "test", "-q", "-p", "raster"]

[[mutant]]
name = "a clipped op's bounds are none"
file = "crates/compositor_paint/src/lib.rs"
from = '''        PaintOp::DrawClipped { op, .. } => op_bounds(op),'''
to = '''        PaintOp::DrawClipped { .. } => None,'''
test = ["cargo", "test", "-q", "-p", "compositor_paint"]

# --- paint ---------------------------------------------------------------

[[mutant]]
name = "inset darkens the bottom and right"
file = "crates/paint/src/lib.rs"
from = '''        let top_left = i == 0 || i == 3;'''
to = '''        let top_left = i == 1 || i == 2;'''

[[mutant]]
name = "groove is ridge"
file = "crates/paint/src/lib.rs"
from = '''                let groove = side.style == Groove;'''
to = '''                let groove = side.style == Ridge;'''

[[mutant]]
name = "outset is inset"
file = "crates/paint/src/lib.rs"
from = '''            Outset => bands(&[(0.0, 1.0, shaded(false))]),'''
to = '''            Outset => bands(&[(0.0, 1.0, shaded(true))]),'''

[[mutant]]
