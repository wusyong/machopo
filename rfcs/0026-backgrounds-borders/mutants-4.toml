[[mutant]]
name = "a dash isn't fitted"
file = "crates/paint/src/lib.rs"
from = '''                off: best_dash_gap(length, dash, gap, closed),'''
to = '''                off: gap,'''

[[mutant]]
name = "thin dashes are thick ones' lengths"
