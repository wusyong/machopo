from = '''                (3.0 * width, 2.0 * width)'''
to = '''                (2.0 * width, width)'''

[[mutant]]
name = "dashes on a side too short for them"
file = "crates/paint/src/lib.rs"
from = '''            (length >= 2.0 * dash + gap).then(|| Dash {'''
to = '''            (length >= 0.0).then(|| Dash {'''

[[mutant]]
name = "dots one width apart"
file = "crates/paint/src/lib.rs"
from = '''                let gaps = (span / (2.0 * width)).round().max(1.0);'''
to = '''                let gaps = (span / width).round().max(1.0);'''

[[mutant]]
name = "the dash gap that fits more dashes always"
file = "crates/paint/src/lib.rs"
from = '''    if max_gap <= 0.0 || (min_gap - gap).abs() < (max_gap - gap).abs() {'''
to = '''    if max_gap <= 0.0 {'''

[[mutant]]
name = "a closed path has a gap fewer"
file = "crates/paint/src/lib.rs"
from = '''    let gaps = |dashes: f32| if closed { dashes } else { dashes - 1.0 };'''
to = '''    let gaps = |dashes: f32| dashes - 1.0;'''

[[mutant]]
name = "an outline's line is solid"
file = "crates/paint/src/lib.rs"
from = '''                    let side = BorderSide {
                        width,
                        style: line,
                        color,
                    };'''
to = '''                    let side = BorderSide {
                        width,
                        style: if line == BorderStyle::Solid { line } else { BorderStyle::Solid },
                        color,
                    };'''
