[[mutant]]
name = "dots start at the corners"
file = "crates/paint/src/lib.rs"
from = '''        if style == BorderStyle::Dotted && length > width {'''
to = '''        if false {'''

[[mutant]]
name = "a rounded dashed side follows the outer curve"
