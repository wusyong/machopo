[[mutant]]
name = "a missing side hides the background's edge"
file = "crates/paint/src/lib.rs"
from = '''                w(width) > 0.0 && border_style.draws_solid() && style.resolve(color).a == 255'''
to = '''                border_style.draws_solid() && style.resolve(color).a == 255'''

[[mutant]]
