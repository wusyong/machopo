# Mutation test of stage 2 (border-radius):
# python3 scripts/test.py mutate rfcs/0026-backgrounds-borders/mutants-2.toml
test = ["cargo", "test", "-q", "-p", "paint"]
timeout = 900

# --- gfx -------------------------------------------------------------

[[mutant]]
name = "corners that overlap aren't scaled down"
file = "crates/gfx/src/lib.rs"
from = '''        let radii = if f < 1.0 {'''
to = '''        let radii = if false {'''
test = ["cargo", "test", "-q", "-p", "gfx"]

[[mutant]]
name = "the padding edge's radii aren't less the border"
file = "crates/gfx/src/lib.rs"
from = '''SizeF::new((radius.width - x).max(0.0), (radius.height - y).max(0.0))'''
to = '''SizeF::new(radius.width.max(x - x), radius.height.max(y - y))'''
test = ["cargo", "test", "-q", "-p", "gfx"]

[[mutant]]
name = "a point past a corner's curve is inside"
file = "crates/gfx/src/lib.rs"
from = '''            dx * dx + dy * dy <= 1.0'''
to = '''            dx * dx + dy * dy <= 2.0'''
test = ["cargo", "test", "-q", "-p", "gfx"]

# --- style -----------------------------------------------------------

[[mutant]]
name = "two radii in the shorthand go to the wrong corners"
file = "crates/style/src/properties.rs"
from = '''            [a, b] => [a, b, a, b],'''
to = '''            [a, b] => [a, b, b, a],'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "the vertical radii after / are dropped"
file = "crates/style/src/properties.rs"
from = '''.map(|i| (Value::CornerRadius(x[i], Some(y[i])), false))'''
to = '''.map(|i| (Value::CornerRadius(x[i], Some(x[i])), false))'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "a longhand's vertical radius is dropped"
file = "crates/style/src/properties.rs"
from = '''                y: y.map_or(x, |y| y.compute(cx)),'''
to = '''                y: x,'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "a negative radius is valid"
file = "crates/style/src/properties.rs"
from = '''        let mut values = vec![LengthPercentage::parse(input, false)?];'''
to = '''        let mut values = vec![LengthPercentage::parse(input, true)?];'''
test = ["python3", "scripts/test.py", "wpt", "css/css-backgrounds/parsing/border-radius"]

[[mutant]]
name = "inherit doesn't copy a corner"
file = "crates/style/src/properties.rs"
from = '''                *corner_mut(&mut to.border_radius, i) = *corner_mut(&mut from.border_radius, i);'''
to = '''                let _ = i;'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "a longhand's equal radii serialize twice"
file = "crates/style/src/serialize.rs"
from = '''            if let Some(y) = y.filter(|y| y != x) {'''
to = '''            if let Some(y) = y {'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "the shorthand always writes / and the vertical radii"
file = "crates/style/src/serialize.rs"
from = '''    if xs == ys {
        horizontal'''
to = '''    if false {
        horizontal'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "a computed corner always has two radii"
file = "crates/style/src/computed.rs"
from = '''    if radius.y != radius.x {'''
to = '''    if true {'''
test = ["cargo", "test", "-q", "-p", "style"]

[[mutant]]
name = "a change of radius relays out"
file = "crates/layout/src/lib.rs"
from = '''            border_radius: old.border_radius,'''
to = '''            border_radius: new.border_radius,'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "update"]

# --- layout ----------------------------------------------------------

[[mutant]]
name = "every line of an inline element has its start padding"
file = "crates/layout/src/text.rs"
from = '''            left: if line_box.first { edge.padding.left } else { 0.0 },'''
to = '''            left: edge.padding.left,'''

[[mutant]]
name = "every line of an inline element is its first"
file = "crates/layout/src/text.rs"
from = '''            first: line_box.first,'''
to = '''            first: true,'''

[[mutant]]
name = "every line of an inline element is its last"
file = "crates/layout/src/text.rs"
from = '''            last: line_box.last,'''
to = '''            last: true,'''

