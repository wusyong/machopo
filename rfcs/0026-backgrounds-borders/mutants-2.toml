from = '''            overflows && translations && trees.effect_chain(node.effect).is_empty() && rounded <= 1'''
to = '''            overflows && translations && trees.effect_chain(node.effect).is_empty() && rounded <= 2'''

# --- raster ----------------------------------------------------------

[[mutant]]
name = "decal is clamp"
file = "crates/raster/src/skia_backend.rs"
from = '''        } else if shader.decal {
            sk::TileMode::Decal'''
to = '''        } else if shader.decal {
            sk::TileMode::Clamp'''
test = ["cargo", "test", "-q", "-p", "raster"]

[[mutant]]
name = "a decal gradient is drawn directly"
file = "crates/raster/src/skia_backend.rs"
from = '''            if !spaced && !shader.repeat_x && !shader.repeat_y && !shader.decal =>'''
to = '''            if !spaced && !shader.repeat_x && !shader.repeat_y =>'''
test = ["cargo", "test", "-q", "-p", "raster"]

[[mutant]]
name = "a border side isn't cut to its polygon"
file = "crates/raster/src/skia_backend.rs"
from = '''                    canvas.clip_path(&builder.detach(), sk::ClipOp::Intersect, true);'''
to = '''                    let _ = builder.detach();'''
test = ["cargo", "test", "-q", "-p", "raster"]

# --- compositor ------------------------------------------------------

[[mutant]]
name = "a layer's quads carry no rounded clip"
file = "crates/compositor/src/layer_tree_host_impl.rs"
from = '''                        rounded_clip: rounded,'''
to = '''                        rounded_clip: None,'''
test = ["cargo", "test", "-q", "-p", "compositor"]

[[mutant]]
name = "the rounded clip doesn't stay put as the layer scrolls"
file = "crates/compositor/src/layer_tree_host_impl.rs"
from = '''                                rect: r.rect.scale(s).offset(-scroll.x, -scroll.y),'''
to = '''                                rect: r.rect.scale(s),'''
test = ["cargo", "test", "-q", "-p", "compositor"]

[[mutant]]
name = "the rounded clip isn't where its node is"
file = "crates/compositor/src/property_trees.rs"
from = '''                    return Some(rrect.offset(at.x, at.y));'''
to = '''                    return Some(rrect);'''
test = ["cargo", "test", "-q", "-p", "compositor"]

[[mutant]]
name = "the compositor's clip nodes lose their corners"
file = "crates/renderer/src/compositing.rs"
from = '''radii: node.radii,'''
to = '''radii: Default::default(),'''
test = ["python3", "scripts/test.py", "reftest", "backgrounds/r3"]

# --- viz -------------------------------------------------------------

[[mutant]]
name = "an embedded surface's quads lose its rounded clip"
file = "crates/viz/src/surface_aggregator.rs"
from = '''                .or(rounded);'''
to = '''                .or(None);'''
test = ["cargo", "test", "-q", "-p", "viz"]

[[mutant]]
name = "an embedded surface's rounded clips aren't moved with it"
file = "crates/viz/src/surface_aggregator.rs"
from = '''                .map(|r| r.offset(offset.x, offset.y))'''
to = '''                .map(|r| r)'''
test = ["cargo", "test", "-q", "-p", "viz"]

[[mutant]]
name = "the software renderer ignores the rounded clip"
file = "crates/viz/src/software_renderer.rs"
from = '''            Some(r) => opacity * rounded_corner::coverage(r, x as f32 + 0.5, y as f32 + 0.5),'''
to = '''            Some(_) => opacity,'''
test = ["cargo", "test", "-q", "-p", "viz"]

[[mutant]]
name = "a rounded clip's edge isn't anti-aliased"
file = "crates/viz/src/rounded_corner.rs"
from = '''    (0.5 - d).clamp(0.0, 1.0)
}'''
to = '''    if d <= 0.0 { 1.0 } else { 0.0 }
}'''
test = ["cargo", "test", "-q", "-p", "viz"]

[[mutant]]
name = "the wgpu shader cuts every quad away"
file = "crates/viz/src/rounded_corner.rs"
from = '''    if (r.z < r.x) {
        return 1.0;
    }'''
to = '''    if (r.z < r.x) {
        return 0.0;
    }'''
# `rounded` alone misses it: its checks are text and the rounded scroller,
# which has a rounded clip; `backgrounds` waits for the card, which hasn't.
test = ["python3", "scripts/test.py", "automation", "rounded", "backgrounds"]
