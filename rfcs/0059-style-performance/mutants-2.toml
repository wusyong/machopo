# 2: render-blocked start_loads (`renderer`'s `frame_view.rs`), `rendered`
# carried down style's walk and the animations' fast path (`style`'s
# `lib.rs`, `animations.rs`), presentation attributes kept on the element
# and shared (`dom`'s `scope.rs`, `style`'s `hints.rs`).
#   python3 scripts/test.py mutate rfcs/0059-style-performance/mutants-2.toml
test = ["cargo", "test", "-q", "-p", "style"]
timeout = 1200

[[mutant]]
name = "start_loads styles while a stylesheet loads"
file = "crates/renderer/src/frame_view.rs"
from = '''        if self.is_render_blocked() {
            self.background_images_unchecked = true;
            return;
        }'''
to = '''        if false {
            self.background_images_unchecked = true;
            return;
        }'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "frame_view::"]

[[mutant]]
name = "load doesn't wait for the look"
file = "crates/renderer/src/frame_view.rs"
from = '''        if self.is_render_blocked() {
            self.background_images_unchecked = true;
            return;
        }'''
to = '''        if self.is_render_blocked() {
            return;
        }'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "frame_view::"]

