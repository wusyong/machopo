        return Some(features);
    }
    compound'''
to = '''    if !features.any {
        return Some(features);
    }
    return None;
    #[allow(unreachable_code)]
    compound'''

[[mutant]]
name = "names not lowered"
file = "crates/style/src/rule_set_invalidation.rs"
from = '''    if name.bytes().any(|byte| byte.is_ascii_uppercase()) {'''
to = '''    if false {'''

