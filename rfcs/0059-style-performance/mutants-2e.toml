[[mutant]]
name = "a srcdoc document has no fallback base URL"
file = "crates/renderer/src/render_thread.rs"
from = '''                m.set_fallback_base_url(&document, fallback_base_url.as_ref().map(Url::as_str));'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "style_sheets::urls"]

[[mutant]]
name = "CSSOM on an element resolves against nothing"
file = "crates/dom_api/src/css_style_declaration.rs"
from = '''        Owner::Element(element) => {
            let document = crate::node::document_of(cx, element);
            crate::document::document_base_url(cx, document.as_node())
        }'''
to = '''        Owner::Element(_) => None,'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "style_sheets::urls"]

[[mutant]]
name = "setProperty doesn't resolve"
file = "crates/css/src/property_set.rs"
from = '''            if let Some(base) = base {
                declaration.resolve_urls(base, &mut unparsed);
            }'''
to = '''            if let Some(base) = base.filter(|_| false) {
                declaration.resolve_urls(base, &mut unparsed);
            }'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "style_sheets::urls"]

[[mutant]]
name = "cssText doesn't resolve"
file = "crates/dom_api/src/css_style_declaration.rs"
from = '''    let mut block = CssPropertyValueSet::parse(value.as_str());
    if let Some(base) = base_url(cx, &owner) {
        block.resolve_urls(&base);
    }'''
to = '''    let block = CssPropertyValueSet::parse(value.as_str());'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "style_sheets::urls"]

[[mutant]]
name = "animate()'s keyframes don't resolve"
