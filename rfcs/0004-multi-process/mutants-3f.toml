# Step 3f: a tile's pixels cross in shared memory, drawn in place and
# copied once, by Viz. What `ipc` rests the writer's slice on, what a
# reader of a region may read, how a region goes to its message and comes
# back; the compositor drawing in a region; Viz's copy to the GPU; and
# the browser's grants.
#
# Not here, and why:
# - The renderer handing its compositor the channel's regions
#   (`render_thread.rs`, `CompositorFrameSinkSender::take_region`): without
#   it a tile's pixels are copied into a region as any large bytes are, and
#   the browser sees what it sees now (one copy more, which no test of the
#   browser's can tell from none). In docs/test-gaps.md.
# - `From<&SharedBuffer> for Pixels` taking the process's own bytes through
#   the staged path: the same pixels, drawn the same.
# - The lengths in `ChunksOut::next` and the slices of `Writer`: wrong, they
#   are reads and writes past a mapping, which Miri and the fuzzer look for,
#   not a test's assertion.
test = ["sh", "-c", "timeout 600 cargo test -q -p ipc"]
timeout = 900

[[mutant]]
name = "a region taken isn't held"
file = "crates/ipc/src/core/region.rs"
from = '''        *self.held.get_mut(i)? = true;'''
to = '''        *self.held.get_mut(i)? = false;'''

[[mutant]]
name = "the peer frees a region its taker still writes"
file = "crates/ipc/src/core/region.rs"
from = '''        if self.held.get(i).copied().unwrap_or(false) {
            return Err(BadMessage::RegionNotOut { number });
        }'''
to = '''        if false {
            return Err(BadMessage::RegionNotOut { number });
        }'''

[[mutant]]
name = "a region nobody holds is lent"
file = "crates/ipc/src/core/region.rs"
from = '''            Some(held) if *held => {
                *held = false;
                true
            }'''
to = '''            Some(held) => {
                *held = false;
                true
            }'''

[[mutant]]
name = "a region given back is still held"
file = "crates/ipc/src/core/region.rs"
from = '''                slot.out = false;
                *held = false;
                true'''
to = '''                slot.out = false;
                let _ = held;
                true'''

