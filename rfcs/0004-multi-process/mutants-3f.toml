    if !within {
        return false;
    }
    // SAFETY: `offset + into.len()` is no more than the memory's length,'''
to = '''        .is_some_and(|end| end <= memory.len().saturating_add(1));
    if !within {
        return false;
    }
    // SAFETY: `offset + into.len()` is no more than the memory's length,'''

