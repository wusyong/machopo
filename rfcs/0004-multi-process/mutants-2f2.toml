# Step 2f-2: Linux's channel (`ipc::platform::linux::channel`). A child
# has its end and nothing else of its host's, and only what is a Unix
# stream socket named to it is one; bytes and handles go as written, the
# handles with their message and no more than a message brings; room is
# told of once after a refusal; a peer gone is told after what it sent; a
# waiter tells its channels apart and lets go of the ones removed.
#
# The last four no test catches (docs/test-gaps.md). Equivalent: Rust
# starts every program with SIGPIPE ignored, so the write is refused with
# or without the flag; a socket's error is read once and the end of the
# stream after it; a read is made only of a socket the epoll said has
# something, by the one thread that reads it, so it never waits. By
# review: descriptors the kernel dropped for want of room leave more than
# a message brings in the room there is (caught by the count), and fewer
# only when this process has none left to give, which no test makes.
test = ["sh", "-c", "timeout 60 cargo test -q -p ipc --lib platform::linux::channel && timeout 240 cargo test -q -p ipc --test it _channel"]
timeout = 900

