# Step 2e-1: a whole endpoint (`ipc::endpoint`) over the platform within
# one process (`ipc::local`), and the read observer of a data pipe's
# consumer. Regions are told of before they are named and given back once
# read, pipes go as far as their readers have room, and what a peer that
# isn't ours sends closes the channel.
test = ["sh", "-c", "timeout 60 cargo test -q -p ipc"]
timeout = 900

[[mutant]]
name = "a child makes regions"
file = "crates/ipc/src/endpoint.rs"
from = '''        if !self.inner.config.may_attach {
            return None;
        }
        let class = class_len(len)?;
        if self.pool'''
to = '''        let class = class_len(len)?;
        if self.pool'''

[[mutant]]
name = "the limit of regions is ignored"
file = "crates/ipc/src/endpoint.rs"
from = '''        if self.pool.total().checked_add(class)? > self.inner.config.region_limit {
            return None;
        }'''
to = ''''''

[[mutant]]
name = "a host right at its limit makes no region"
file = "crates/ipc/src/endpoint.rs"
from = '''        if self.pool.total().checked_add(class)? > self.inner.config.region_limit {'''
to = '''        if self.pool.total().checked_add(class)? >= self.inner.config.region_limit {'''

[[mutant]]
name = "every region has the same number"
file = "crates/ipc/src/endpoint.rs"
from = '''        self.pool.add(number, memory).ok()?;
        *self.next_region = after;'''
to = '''        self.pool.add(number, memory).ok()?;'''

[[mutant]]
name = "a new region isn't told to the peer"
