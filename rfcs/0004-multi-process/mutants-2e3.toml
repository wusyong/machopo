            registry.answered.insert(pid);'''
to = '''        if let Some(rights) = registry.registered.remove(&pid) {'''

[[mutant]]
name = "a child is given what is registered for another"
file = "crates/ipc/src/platform/macos/rendezvous.rs"
from = '''        if let Some(rights) = registry.registered.remove(&pid) {
            registry.answered.insert(pid);'''
to = '''        let any = registry.registered.keys().next().copied().unwrap_or(pid);
        if let Some(rights) = registry.registered.remove(&any) {
            registry.answered.insert(pid);'''

[[mutant]]
name = "a question that came first isn't answered at the registration"
