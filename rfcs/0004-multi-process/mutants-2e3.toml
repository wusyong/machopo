# Step 2e-3: macOS's Mach messages, rights and rendezvous
# (`ipc::platform::macos::{message, port, rendezvous}`). A message's
# rights are its receiver's or are let go, never lost; a message laid out
# otherwise is refused whole; a child gets the rights registered for its
# pid, once, and no other process's.
test = ["sh", "-c", "timeout 240 cargo test -q -p ipc -- platform::macos rendezvous"]
timeout = 900

[[mutant]]
name = "a body longer than the buffer is for is sent"
file = "crates/ipc/src/platform/macos/message.rs"
from = '''    if rights.len() > MAX_RIGHTS || body.len() > buffer.body {'''
to = '''    if rights.len() > MAX_RIGHTS {'''

[[mutant]]
name = "more rights than a message holds are sent"
file = "crates/ipc/src/platform/macos/message.rs"
from = '''    if rights.len() > MAX_RIGHTS || body.len() > buffer.body {'''
to = '''    if body.len() > buffer.body {'''

[[mutant]]
name = "a message not sent keeps its rights"
file = "crates/ipc/src/platform/macos/message.rs"
from = '''            // only copied (`To::Port`) is left as it was.
            unsafe { mach_msg_destroy(header) };'''
to = '''            // only copied (`To::Port`) is left as it was.
            let _ = header;'''

