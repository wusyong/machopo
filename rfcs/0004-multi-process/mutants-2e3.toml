[[mutant]]
name = "a send right dropped keeps its right"
file = "crates/ipc/src/platform/macos/port.rs"
from = '''impl Drop for SendRight {
    fn drop(&mut self) {
        // SAFETY: the name is a right this value owns, let go once.
        unsafe { mach_port_deallocate(mach_task_self(), self.0) };'''
to = '''impl Drop for SendRight {
    fn drop(&mut self) {
        // SAFETY: the name is a right this value owns, let go once.
        let _ = unsafe { mach_task_self() };'''

[[mutant]]
name = "a right to answer dropped unused tells nobody"
file = "crates/ipc/src/platform/macos/port.rs"
from = '''impl Drop for SendOnceRight {
    fn drop(&mut self) {
        // SAFETY: the name is a right this value owns, let go once.
        unsafe { mach_port_deallocate(mach_task_self(), self.0) };'''
to = '''impl Drop for SendOnceRight {
    fn drop(&mut self) {
        // SAFETY: the name is a right this value owns, let go once.
        let _ = unsafe { mach_task_self() };'''

[[mutant]]
name = "a receive right dropped leaves its port alive"
file = "crates/ipc/src/platform/macos/port.rs"
from = '''        unsafe { mach_port_mod_refs(mach_task_self(), self.0, MACH_PORT_RIGHT_RECEIVE, -1) };'''
to = '''        let _ = unsafe { mach_task_self() };'''

[[mutant]]
