from = '''        let asked = registry.waiting.iter().position(|(asker, _)| *asker == pid);
        match asked.and_then(|i| registry.waiting.remove(i)) {'''
to = '''        let asked: Option<usize> = None;
        match asked.and_then(|i| registry.waiting.remove(i)) {'''

[[mutant]]
