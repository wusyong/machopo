# Step 2g-2: Windows's channel and its waiter
# (`ipc::platform::windows::channel`). An end writes nothing before a
# thread serves it, and one write at a time; room is told to whoever was
# refused; a host's handles go as values in its header and a child's
# bytes go as they are; a header no host writes is the peer gone; an
# interrupt ends one wait; an end removed, shut or gone is told of no
# more; nothing is left open by a channel let go.
#
# Not listed, the same either way (`docs/test-gaps.md`): `shut` without
# `CancelIoEx` (closing the pipe cancels too); a read that failed or
# brought nothing not taken for the pipe's end (the next read fails);
# a write that put fewer bytes than asked taken for whole (a pipe never
# does); an interrupt posted every time it is asked (only more turns of
# the loop); the port only looked at, never waited on (the loop spins);
# the pipe's flags, which only another process could try. Not listed
# because breaking it is memory freed twice, not a test failing: the
# mode that keeps what is done at once from the port.
test = ["cargo", "test", "-q", "-p", "ipc", "--lib", "platform::windows"]
timeout = 120

