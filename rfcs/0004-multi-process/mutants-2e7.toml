[[mutant]]
name = "a closed end wakes nobody"
file = "crates/ipc/src/core/channel.rs"
from = '''        // Not under the lock: it is another thread's to take.
        if let Some(wake) = wake {
            wake();
        }'''
to = '''        // Not under the lock: it is another thread's to take.
        drop(wake);'''

[[mutant]]
name = "a queue that starts wakes nobody"
