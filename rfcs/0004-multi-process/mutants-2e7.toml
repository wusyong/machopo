# Step 2e-7: one IO thread for a process's channels (`ipc::endpoint`'s
# `IoLoop` and `Waiter`; `ipc::local`'s and macOS's waiters), woken by
# the wake each end's channel holds (`core::channel`'s `Sender::on_wake`). Every
# channel is turned for what comes to it and for its wakes, each for its
# own; a channel over is told once and served no more; a loop stopped
# closes what it served.
#
# Taken out as the mutant showed it did nothing: a second wake at the end
# of `Link::open_pipe` (watching the source wakes at once when it has
# something already, and a source with nothing has nothing to send).
test = ["sh", "-c", "timeout 150 cargo test -q -p ipc -- endpoint process_channel mach_channel platform::macos::channel core::channel"]
timeout = 900

[[mutant]]
name = "an end that joins isn't turned for what it did before"
file = "crates/ipc/src/endpoint.rs"
from = '''                turns.extend(self.join(endpoint, handler));'''
to = '''                let _ = self.join(endpoint, handler);'''

[[mutant]]
name = "an end woken isn't turned"
file = "crates/ipc/src/endpoint.rs"
from = '''            let mut turns = woken;
            for (endpoint, handler) in joining {'''
to = '''            drop(woken);
            let mut turns = Vec::new();
            for (endpoint, handler) in joining {'''

[[mutant]]
name = "a stopped loop leaves its channels open"
file = "crates/ipc/src/endpoint.rs"
from = '''                    endpoint.abandon();
                    handler.gone(Gone::Closed);
                }
                return;'''
to = '''                    let _ = &mut endpoint;
                    handler.gone(Gone::Closed);
                }
                return;'''

[[mutant]]
name = "a stopped loop tells nobody its channels are over"
file = "crates/ipc/src/endpoint.rs"
from = '''                    endpoint.abandon();
                    handler.gone(Gone::Closed);
                }
                return;'''
to = '''                    endpoint.abandon();
                    let _ = &mut handler;
                }
                return;'''

