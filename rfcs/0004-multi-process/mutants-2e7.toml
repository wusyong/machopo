from = '''        let wake = outgoing.wake.clone().filter(|_| first);'''
to = '''        let wake = outgoing.wake.clone().filter(|_| false);'''

[[mutant]]
name = "every queued message wakes"
file = "crates/ipc/src/core/channel.rs"
