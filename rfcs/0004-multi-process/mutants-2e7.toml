[[mutant]]
name = "a channel's wake doesn't wake the loop"
file = "crates/ipc/src/endpoint.rs"
from = '''            shared.pending().woken.push(key);
            (shared.interrupt)();'''
to = '''            shared.pending().woken.push(key);'''

[[mutant]]
name = "every end joins under the same key"
