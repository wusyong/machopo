from = '''                        if reach > 0.0 && !rect.is_empty() {'''
to = '''                        if false {'''

[[mutant]]
name = "a shadow's offset not reaching"
file = "crates/paint/src/filter.rs"
from = '''            offset.0.abs().max(offset.1.abs()) + 3.0 * sigma'''
to = '''            3.0 * sigma'''

[[mutant]]
name = "a filter's reach unscaled"
file = "crates/paint/src/raster_invalidator.rs"
from = '''                Some(crate::filter::reach(filter) * stretch)'''
to = '''                Some(crate::filter::reach(filter))'''

[[mutant]]
name = "a filter not part of a chunk's state"
file = "crates/paint/src/raster_invalidator.rs"
from = '''                    (node.opacity, node.filter.clone(), matrix_of(node.transform))'''
to = '''                    (node.opacity, None, matrix_of(node.transform))'''

[[mutant]]
name = "a chain backwards"
file = "crates/raster/src/skia_backend.rs"
from = '''            .iter()
            .try_fold(input, |input, filter| {'''
to = '''            .iter()
            .rev()
            .try_fold(input, |input, filter| {'''
test = ["cargo", "test", "-q", "-p", "raster", "--lib", "--", "layer_filters"]

[[mutant]]
name = "a blur unblurred"
file = "crates/raster/src/skia_backend.rs"
from = '''        &ImageFilter::Blur { sigma } => sk::image_filters::blur((sigma, sigma), None, input, None),'''
to = '''        &ImageFilter::Blur { sigma: _ } => input,'''
test = ["cargo", "test", "-q", "-p", "raster", "--lib", "--", "layer_filters"]
