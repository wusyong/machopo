# Out-of-flow boxes paint where their parents place them in tree order, in
# the stacking context and under the effect around them there (`layout`,
# `paint`).
#   python3 scripts/test.py mutate rfcs/0064-rendering-gaps/mutants-paint-order.toml
test = ["cargo", "test", "-q", "-p", "paint", "--test", "it", "--", "artifact::out_of_flow", "hit_test::out_of_flow", "paint_controller::"]
timeout = 900

[[mutant]]
name = "no places"
file = "crates/layout/src/lib.rs"
from = '''        let out_of_flow = self.out_of_flow_places(index, &in_flow);'''
to = '''        let out_of_flow = Vec::new();'''

[[mutant]]
name = "places all first"
file = "crates/layout/src/lib.rs"
from = '''                if in_flow.get(before) == Some(&child) {
                    before += 1;
                }'''
to = '''                if false {
                    before += 1;
                }'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "update::an_out_of_flow", "update::out_of_flow"]

[[mutant]]
name = "floats counted in places"
file = "crates/layout/src/lib.rs"
from = '''                if in_flow.get(before) == Some(&child) {'''
to = '''                if true {'''

[[mutant]]
name = "places with fragments made before"
file = "crates/layout/src/lib.rs"
from = '''                before,
                fragment: self.fragment(child),'''
to = '''                before,
                fragment: self.boxes[usize::from(child)].fragment.clone().unwrap(),'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "update::an_out_of_flow", "update::out_of_flow"]

[[mutant]]
name = "parents not made again for a new out-of-flow fragment"
