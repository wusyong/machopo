from = '''                effects.insert(Arc::as_ptr(&place.fragment), contents.effect);'''
to = ''''''

[[mutant]]
name = "the effect not kept when walked again"
file = "crates/paint/src/lib.rs"
from = '''        if let Some(effect) = out_of_flow_effect {
            Arc::make_mut(&mut self.out_of_flow_effects).insert(address, effect);
        }'''
