to = '''            if false {
                let mut next'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "update::an_out_of_flow", "update::out_of_flow"]

[[mutant]]
name = "out-of-flow boxes where their containing blocks hold them too"
file = "crates/paint/src/lib.rs"
from = '''            if !child.fragment.style.is_out_of_flow() {
                take(&child.fragment);
            }'''
to = '''            take(&child.fragment);'''

[[mutant]]
name = "places after their children"
file = "crates/paint/src/lib.rs"
from = '''            while let Some(place) = places.next_if(|place| place.before == i) {'''
to = '''            while let Some(place) = places.next_if(|place| place.before < i) {'''

[[mutant]]
name = "the last places left out"
