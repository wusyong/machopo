# 4a: `text-shadow`, the text decorations' style, color, thickness and
# offset, `-webkit-text-fill-color` (`computed_style`, `css`, `style`,
# `layout`, `paint`).
#   python3 scripts/test.py mutate rfcs/0064-rendering-gaps/mutants-4a.toml
test = ["cargo", "test", "-q", "-p", "paint", "--test", "it", "--", "artifact::"]
timeout = 900

