[[mutant]]
name = "the glyphs' shadows with them"
file = "crates/paint/src/lib.rs"
from = '''        self.text_shadows(
            item,
            DisplayItemKind::Text,
            std::slice::from_ref(&glyphs),
            style,
        );
        self.text_shadows(item, DisplayItemKind::TextDecoration, &under_over, style);
        for (op, visual_rect) in under_over {
            self.text_item(item, DisplayItemKind::TextDecoration, op, visual_rect);
        }
        self.text_item(item, DisplayItemKind::Text, glyphs.0, glyphs.1);'''
to = '''        self.text_shadows(item, DisplayItemKind::TextDecoration, &under_over, style);
        for (op, visual_rect) in under_over {
            self.text_item(item, DisplayItemKind::TextDecoration, op, visual_rect);
        }
        self.text_shadows(
            item,
            DisplayItemKind::Text,
            std::slice::from_ref(&glyphs),
            style,
        );
        self.text_item(item, DisplayItemKind::Text, glyphs.0, glyphs.1);'''

