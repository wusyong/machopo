# 5a: `position: sticky` on the main thread (`css`, `computed_style`,
# `layout`, `paint`, `dom_api`, `renderer`).
#   python3 scripts/test.py mutate rfcs/0064-rendering-gaps/mutants-5a.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "sticky::"]
timeout = 900

[[mutant]]
name = "sticky not parsed"
file = "crates/css/src/properties.rs"
from = '''"sticky" | "-webkit-sticky" => computed_style::Position::Sticky,'''
to = '''"-webkit-sticky" => computed_style::Position::Sticky,'''

[[mutant]]
name = "-webkit-sticky not parsed"
file = "crates/css/src/properties.rs"
from = '''"sticky" | "-webkit-sticky" => computed_style::Position::Sticky,'''
to = '''"sticky" => computed_style::Position::Sticky,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "cascade::position_insets"]

