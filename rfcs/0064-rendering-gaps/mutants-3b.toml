# 3b: SVG's `<clipPath>`, `clip-path: url()` and `clip-rule` (`css`,
# `layout`, `style`, `paint`, `raster`).
#   python3 scripts/test.py mutate rfcs/0064-rendering-gaps/mutants-3b.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "svg::clip_paths"]
timeout = 1800

[[mutant]]
name = "url() not parsed"
file = "crates/css/src/masking.rs"
from = '''    if let Ok(url) = input.try_parse(crate::svg::parse_url) {'''
to = '''    if let Some(url) = None::<CssUrlData> {'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cssom::"]

[[mutant]]
name = "a local url() resolved"
file = "crates/css/src/properties.rs"
from = '''            Value::ClipPath(crate::masking::SpecifiedClipPath::Url(url)) if !url.is_local() => {'''
to = '''            Value::ClipPath(crate::masking::SpecifiedClipPath::Url(url)) => {'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cascade::urls"]

[[mutant]]
name = "a url() in a sheet left unresolved"
file = "crates/css/src/properties.rs"
from = '''            Value::Paint(SpecifiedPaint::Url(url, _))
            | Value::ClipPath(crate::masking::SpecifiedClipPath::Url(url)) => {
                !url.is_local() && !url.is_resolved()'''
to = '''            Value::Paint(SpecifiedPaint::Url(url, _)) => {
                !url.is_local() && !url.is_resolved()'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cascade::urls"]

[[mutant]]
name = "computed url() written as none"
file = "crates/css/src/masking.rs"
from = '''        ClipPath::Url(url) => return crate::svg::url_to_css(url, dest),'''
to = '''        ClipPath::Url(_) => return dest.push_str("none"),'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::clips"]

[[mutant]]
name = "clip-rule not inherited"
file = "crates/css/src/properties.rs"
from = '''                | FillRule
                | ClipRule
'''
to = '''                | FillRule
'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::clips"]

[[mutant]]
name = "clip-rule set as fill-rule"
file = "crates/css/src/properties.rs"
from = '''        (ClipRule, Value::FillRule(v)) => style.svg_mut().clip_rule = v,'''
to = '''        (ClipRule, Value::FillRule(v)) => style.svg_mut().fill_rule = v,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::clips"]

