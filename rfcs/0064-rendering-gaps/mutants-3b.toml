from = '''            SourceKind::Text(_) | SourceKind::Use(..) => return None,'''
to = '''            SourceKind::Text(_) | SourceKind::Use(..) => {}'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "svg::clip_paths"]

