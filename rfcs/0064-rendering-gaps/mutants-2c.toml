to = '''    taffy_style.flex_grow = style.flex_grow;'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "items keep align-self"
file = "crates/layout/src/lib.rs"
from = '''    taffy_style.align_self = None;'''
to = '''    let _ = taffy_style.align_self;'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "items keep an automatic minimum size"
file = "crates/layout/src/lib.rs"
from = '''    zero(&mut taffy_style.min_size.width);'''
to = '''    let _ = zero;'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "ordered by order"
file = "crates/layout/src/lib.rs"
from = '''                style.rare.box_ordinal_group as i32 - 1'''
to = '''                style.order'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "built items unchanged"
file = "crates/layout/src/lib.rs"
from = '''            if webkit_box && let Some(container) = &container {'''
to = '''            if false && let Some(container) = &container {'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "restyled items unchanged"
file = "crates/layout/src/lib.rs"
from = '''                if b.webkit_box_item
                    && let Some(container) = &container
                {
                    webkit_box_item(&style, container, &mut b.taffy_style);'''
to = '''                if false
                    && let Some(container) = &container
                {
                    webkit_box_item(&style, container, &mut b.taffy_style);'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "update::"]

[[mutant]]
name = "flow-root shares its block formatting context"
file = "crates/layout/src/lib.rs"
from = '''    if style.display == Display::FlowRoot {
        taffy_style.contain = taffy::Contain::PAINT;'''
to = '''    if false {
        taffy_style.contain = taffy::Contain::PAINT;'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "block::"]

[[mutant]]
name = "measured without its clamp"
file = "crates/layout/src/lib.rs"
from = '''        if inputs.run_mode == RunMode::ComputeSize
            && inputs.axis != RequestedAxis::Horizontal
            && self.boxes[index].style.line_clamp().is_some()'''
to = '''        if false
            && inputs.axis != RequestedAxis::Horizontal
            && self.boxes[index].style.line_clamp().is_some()'''

[[mutant]]
name = "height not clamped"
file = "crates/layout/src/lib.rs"
from = '''        output.size.height = height;
    }'''
to = '''        let _ = height;
    }'''

