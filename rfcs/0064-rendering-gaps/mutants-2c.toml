# 2c: line clamp, -webkit-box and flow-root (`computed_style`, `css`,
# `style`, `layout`, `paint`).
#   python3 scripts/test.py mutate rfcs/0064-rendering-gaps/mutants-2c.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "line_clamp::"]
timeout = 1800

[[mutant]]
name = "flow-root parsed as block"
file = "crates/css/src/properties.rs"
from = '''                    "flow-root" => computed_style::Display::FlowRoot,'''
to = '''                    "flow-root" => computed_style::Display::Block,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cssom::"]

[[mutant]]
name = "-webkit-box parsed as flex"
file = "crates/css/src/properties.rs"
from = '''                    "-webkit-box" => computed_style::Display::WebkitBox,'''
to = '''                    "-webkit-box" => computed_style::Display::Flex,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cssom::"]

[[mutant]]
name = "vertical parsed as horizontal"
file = "crates/css/src/properties.rs"
from = '''                    "vertical" => computed_style::BoxOrient::Vertical,'''
to = '''                    "vertical" => computed_style::BoxOrient::Horizontal,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cssom::"]

[[mutant]]
name = "negative box-flex invalid"
file = "crates/css/src/properties.rs"
from = '''            WebkitBoxFlex => Value::Number(parse_number(input)?),'''
to = '''            WebkitBoxFlex => Value::Number(parse_non_negative_number(input)?),'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cssom::"]

[[mutant]]
name = "0 a positive integer"
file = "crates/css/src/properties.rs"
from = '''    if value < 1 {
        return Err(input.new_custom_error(()));'''
to = '''    if value < 0 {
        return Err(input.new_custom_error(()));'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "cssom::"]

[[mutant]]
name = "box-orient serialized wrong"
file = "crates/css/src/serialize.rs"
from = '''        computed_style::BoxOrient::Horizontal => "horizontal",'''
to = '''        computed_style::BoxOrient::Horizontal => "vertical",'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::"]

[[mutant]]
name = "box-align initial start"
file = "crates/computed_style/src/lib.rs"
from = '''                box_align: BoxAlign::Stretch,'''
to = '''                box_align: BoxAlign::Start,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::"]

[[mutant]]
name = "box-flex interpolated"
file = "crates/css/src/interpolate.rs"
from = '''        WebkitBoxFlex => field!(@step [rare.box_flex] [rare_mut().box_flex]),'''
to = '''        WebkitBoxFlex => field!(rare.box_flex),'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "interpolation::"]

[[mutant]]
name = "clamp container stays a -webkit-box"
file = "crates/style/src/lib.rs"
from = '''            Display::WebkitBox => Display::FlowRoot,'''
to = '''            Display::WebkitBox => Display::WebkitBox,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::"]

[[mutant]]
name = "specified -webkit-box not remembered"
file = "crates/style/src/lib.rs"
from = '''        style.rare_mut().specified_display_webkit_box = true;'''
to = '''        let _ = style.rare_mut();'''

[[mutant]]
name = "clamp whatever the orient"
file = "crates/style/src/lib.rs"
from = '''    if style.rare.box_orient == BoxOrient::Vertical
        && style.rare.line_clamp.is_some()'''
to = '''    if style.rare.box_orient != BoxOrient::Vertical
        || style.rare.line_clamp.is_some()'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::"]

[[mutant]]
name = "-webkit-box children blockified"
file = "crates/style/src/lib.rs"
from = '''                in_flex_or_grid: self.layout_parent.display.blockifies_children(),'''
to = '''                in_flex_or_grid: self.layout_parent.display.is_flexible_or_grid(),'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::"]

[[mutant]]
name = "no z-index in a -webkit-box"
file = "crates/style/src/lib.rs"
from = '''    style.effective_z_index = if style.is_positioned() || in_flex_or_grid || in_webkit_box {'''
to = '''    style.effective_z_index = if style.is_positioned() || in_flex_or_grid {'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::"]

[[mutant]]
name = "-webkit-box has no items"
file = "crates/computed_style/src/lib.rs"
from = '''        self.blockifies_children() || self.is_webkit_box()'''
to = '''        self.blockifies_children()'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "specified flow-root clamps"
file = "crates/computed_style/src/lib.rs"
from = '''            .line_clamp
            .filter(|_| self.rare.specified_display_webkit_box)'''
to = '''            .line_clamp'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "computed::"]

[[mutant]]
name = "vertical box is a row"
file = "crates/layout/src/lib.rs"
from = '''            (BoxOrient::Vertical, BoxDirection::Normal) => taffy::FlexDirection::Column,'''
to = '''            (BoxOrient::Vertical, BoxDirection::Normal) => taffy::FlexDirection::Row,'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "-webkit-box wraps"
file = "crates/layout/src/lib.rs"
from = '''        taffy_style.flex_wrap = taffy::FlexWrap::NoWrap;'''
to = '''        let _ = taffy::FlexWrap::NoWrap;'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "justify packs at the start"
file = "crates/layout/src/lib.rs"
from = '''            BoxPack::Justify => taffy::JustifyContent::SPACE_BETWEEN,'''
to = '''            BoxPack::Justify => taffy::JustifyContent::FLEX_START,'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "flex::"]

[[mutant]]
name = "center aligns at the start"
