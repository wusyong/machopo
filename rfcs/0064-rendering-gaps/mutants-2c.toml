from = '''        && !style.is_scroll_container()
        && b.replaced.is_none()'''
to = '''        && b.replaced.is_none()'''

[[mutant]]
name = "nothing hidden after the clamp"
file = "crates/layout/src/lib.rs"
from = '''            *past |= clamp.is_some();'''
to = '''            let _ = clamp;'''

[[mutant]]
name = "blocks around keep their height"
