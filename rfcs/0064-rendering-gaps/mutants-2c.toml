from = '''            bottom += layout.padding.bottom + layout.border.bottom;'''
to = '''            bottom += layout.border.bottom;'''

[[mutant]]
name = "clamped boxes not hidden"
file = "crates/layout/src/lib.rs"
from = '''            hidden: b.hidden || b.clamped,'''
to = '''            hidden: b.hidden,'''

[[mutant]]
name = "no ellipsis shaped in a clamp container"
file = "crates/layout/src/lib.rs"
from = '''        cx.in_line_clamp |= style.line_clamp().is_some();'''
to = '''        cx.in_line_clamp |= false;'''

