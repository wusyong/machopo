# Stage 4h-3c-2: Web Animations' effects on the new DOM: `KeyframeEffect` and its members, effects
# given to and taken from animations, `timeline` set, `persist()`, `commitStyles()`'s checks.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it web_animations"]
timeout = 1500

