# Stage 4e-2c-2: layout through the flat tree on the new DOM: the boxes
# of a host's shadow tree and of slots' assigned nodes, the walks up it,
# a shadow root's flags on its host, a slot's child bit, the `:hover` and
# boundary chains, and the frame laying out again for any layout flag.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p layout --test it -- next && cargo test -q -p dom_next --test it -- shadow && cargo test -q -p renderer --lib -- next_frame_view && cargo test -q -p dom_api_next --test it"]
timeout = 3000

[[mutant]]
name = "boxes: the DOM's children"
file = "crates/layout/src/next.rs"
from = '''fn children<'a, 'b, 'gc>(dom: &'a Cx<'b, 'gc>, node: NodeRef<'gc>) -> dom_next::FlatChildren<'a, 'b, 'gc> {
    dom.flat_tree_children(node)
}'''
to = '''fn children<'a, 'b, 'gc>(dom: &'a Cx<'b, 'gc>, node: NodeRef<'gc>) -> impl Iterator<Item = NodeRef<'gc>> + use<'a, 'b, 'gc> {
    std::iter::successors(dom.first_child(node), |&child| dom.next_sibling(child))
}'''

[[mutant]]
name = "tree root: the DOM's"
file = "crates/layout/src/next.rs"
from = '''    while let Some(parent) = dom.flat_tree_parent(root) {'''
to = '''    while let Some(parent) = dom.parent(root) {'''

