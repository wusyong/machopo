# Stage 4g-2c-1: on the new DOM, Path2D (its constructor of another path or of path data, addPath,
# its CanvasPath members, the context's), fill, stroke and clip of one, isPointInPath and
# isPointInStroke, and roundRect's radii; the canvas crate's hit tests and radii checks, which
# today's DOM shares.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p canvas && cargo test -q -p dom_js_next --test it -- canvas && cargo test -q -p dom_api --test it canvas && cargo test -q -p dom_js --test it canvas && cargo test -q -p shell --test it next_dom_canvas"]
timeout = 3000

[[mutant]]
name = "hit: the point not mapped by the transform"
file = "crates/canvas/src/context.rs"
from = '''    let [a, b, c, d, e, f] = inverse(data.state().transform)?;'''
to = '''    let [a, b, c, d, e, f] = IDENTITY;'''

