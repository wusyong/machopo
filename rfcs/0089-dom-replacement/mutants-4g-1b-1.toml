# Stage 4g-1b-1: on the new DOM, srcset, sizes, <picture> and <source> (selected in the
# engine's microtask against the frame's viewport), the environment's changes, a
# picture's relevant mutations, a loading image taken at once.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it images && cargo test -q -p dom_api_next --test it images && cargo test -q -p dom_js_next --test it images"]
timeout = 3000

[[mutant]]
name = "dom: srcset's source taken at once"
file = "crates/dom_next/src/image.rs"
from = '''        let selected = if responsive {
            None
        } else {'''
to = '''        let selected = if false {
            None
        } else {'''

[[mutant]]
name = "dom: srcset without src cleared at once"
file = "crates/dom_next/src/image.rs"
from = '''        if !responsive && self.image_source(element).is_none() {'''
to = '''        if self.image_source(element).is_none() {'''

[[mutant]]
name = "dom: a loading image not taken at once"
file = "crates/dom_next/src/image.rs"
from = '''selected.clone().filter(|url| self.is_image_loading(url))'''
to = '''selected.clone().filter(|_| false)'''

[[mutant]]
name = "dom: a waiting current replaced"
file = "crates/dom_next/src/image.rs"
from = '''                if waiting {
                    return;
                }'''
to = ''''''

