from = '''                Gc::ptr_eq(self.document_of(element), document)
                    && '''
to = '''                '''

[[mutant]]
name = "dom: a picture isn't responsive"
file = "crates/dom_next/src/image.rs"
from = '''.is_some_and(|parent| self.is_html_named(parent, names::local::PICTURE))'''
to = '''.is_some_and(|parent| self.is_html_named(parent, names::local::DIV))'''

[[mutant]]
name = "dom: a source's coming changes nothing"
file = "crates/dom_next/src/image.rs"
from = '''        } else if self.is_html_named(node, names::local::SOURCE) {
            self.update_images_after(next);'''
to = '''        } else if false {
            self.update_images_after(next);'''

[[mutant]]
name = "dom: an img's coming into a picture changes nothing"
file = "crates/dom_next/src/image.rs"
from = '''        if self.is_img(node) {
            self.update_image_data(node);
        } else if'''
to = '''        if false {
            self.update_image_data(node);
        } else if'''

