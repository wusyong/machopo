from = '''                request.density = density;
'''
to = ''''''

[[mutant]]
name = "dom: the density not applied"
file = "crates/dom_next/src/image.rs"
from = '''        if self.density == 1.0 {'''
to = '''        if true {'''

[[mutant]]
name = "dom: another density changes nothing"
file = "crates/dom_next/src/image.rs"
from = '''            Some(std::mem::replace(&mut current.density, density) != density)'''
to = '''            Some(false)'''

[[mutant]]
name = "dom: not listed for the environment"
file = "crates/dom_next/src/image.rs"
from = '''            self.list_responsive_image(loader, element);
'''
to = ''''''

[[mutant]]
name = "dom: another document's listed"
