[[mutant]]
name = "api: document.location none"
file = "crates/dom_api_next/src/window.rs"
from = '''    Ok(cx.window_of(this).map(|window| cx.window_location(window)))'''
to = '''    let _ = this;
    Ok(None::<Gc<'gc, Location>>)'''

[[mutant]]
name = "api: document.location set without a window does nothing"
file = "crates/dom_api_next/src/window.rs"
from = '''        None => Err(ApiError::Type("The document has no location.".into())),'''
