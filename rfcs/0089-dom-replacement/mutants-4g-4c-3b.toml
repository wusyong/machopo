[[mutant]]
name = "api: a hit in a child frame not in its iframe"
file = "crates/dom_api_next/src/webdriver.rs"
from = '''                (cx.kind(at) == NodeKind::Document)
                    .then(|| cx.frame_owner(at))
                    .flatten()'''
