# Stage 4g-4c-3b: WebDriver in the new DOM's child frames: the engine's WebDriver methods in
# a frame's realm, a window's value by its document, the queries' points in the top-level
# viewport, document.location.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "-E", "RUSTY_V8_ARCHIVE=/home/wusyong/Desktop/kun/third_party/rusty_v8_artifacts", "sh", "-c", "cargo test -q -p dom_js_next --test it -- webdriver cross_origin && cargo test -q -p dom_api_next --test it -- webdriver"]
timeout = 900

[[mutant]]
name = "js: a frame's script in the top-level realm"
file = "crates/dom_js_next/src/engine.rs"
from = '''        let Some(context) = self.frame_context(frame) else {
            return Err(dom_api_next::WebDriverScriptError(
                "the frame has no document".into(),
            ));
        };
        let started = {'''
to = '''        let _ = frame;
        let Some(context) = self.context.clone() else {
            return Err(dom_api_next::WebDriverScriptError(
                "the frame has no document".into(),
            ));
        };
        let started = {'''

[[mutant]]
name = "js: a frame's property in the top-level realm"
file = "crates/dom_js_next/src/engine.rs"
from = '''        let Some(context) = self.frame_context(frame) else {
            return Err(dom_api_next::WebDriverScriptError(
                "the frame has no document".into(),
            ));
        };
        let isolate = self.data.isolate();'''
to = '''        let _ = frame;
        let Some(context) = self.context.clone() else {
            return Err(dom_api_next::WebDriverScriptError(
                "the frame has no document".into(),
            ));
        };
        let isolate = self.data.isolate();'''

[[mutant]]
name = "js: a window argument the current realm's"
