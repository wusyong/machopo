to = '''    if false && next_dom && out.is_none() {'''

[[mutant]]
name = "headless writes a next-dom frame"
file = "crates/shell/src/headless.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "shell", "--test", "it", "next_dom"]
from = '''    if opts.next_dom {
        return Err('''
to = '''    if false && opts.next_dom {
        return Err('''

[[mutant]]
name = "a new-DOM commit takes the old path"
file = "crates/renderer/src/render_thread.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "shell", "--test", "it", "next_dom"]
