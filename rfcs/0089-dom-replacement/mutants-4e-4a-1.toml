# Stage 4e-4a-1: the custom element registry on the new DOM: `dom_next`'s
# registry and definitions, `dom_api_next`'s `define`, `get`, `getName` and
# `whenDefined`, `dom_js_next`'s reading of the constructor and the
# promises.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it custom_elements && cargo test -q -p dom_js_next --test it custom_elements"]
timeout = 3000

[[mutant]]
name = "dom: a registry made each time"
file = "crates/dom_next/src/custom_element.rs"
from = '''        window.custom_elements.set(self.gc, Some(registry));
        registry'''
to = '''        registry'''

[[mutant]]
name = "dom: a name without a hyphen"
file = "crates/dom_next/src/custom_element.rs"
from = '''        && name.contains('-')
'''
to = '''
'''

[[mutant]]
name = "dom: a name with a space"
file = "crates/dom_next/src/custom_element.rs"
from = '''c.is_ascii_uppercase() || matches!('''
to = '''c.is_ascii_uppercase() || false && matches!('''

[[mutant]]
name = "dom: a reserved name"
file = "crates/dom_next/src/custom_element.rs"
from = '''        && !RESERVED_CUSTOM_ELEMENT_NAMES.contains(&name)'''
to = ''''''

[[mutant]]
name = "dom: a definition found by another name"
file = "crates/dom_next/src/custom_element.rs"
from = '''            .find(|definition| definition.name.get() == name)'''
to = '''            .find(|definition| definition.name.get() != name)'''

[[mutant]]
name = "dom: one promise number for all"
file = "crates/dom_next/src/custom_element.rs"
from = '''        let id = self.changes.promises_made.get().checked_add(1).expect("fewer than 2^64 promises");'''
to = '''        let id = self.changes.promises_made.get().checked_add(0).expect("fewer than 2^64 promises");'''

[[mutant]]
name = "dom: pending promises kept when taken"
file = "crates/dom_next/src/custom_element.rs"
from = '''                taken.push(list.remove(self.gc, index).id.get());'''
to = '''                taken.push(pending.id.get());
                index = index.saturating_add(1);'''

[[mutant]]
name = "dom: a pending promise of another name"
file = "crates/dom_next/src/custom_element.rs"
from = '''            .find(|pending| pending.name.get() == name)'''
to = '''            .find(|pending| pending.name.get() != name)'''

