# Stage 3c-2: `<link rel=stylesheet>` for the new DOM: the sheets
# `style_next` collects (the renderer's, `<style>`s, the preferred set,
# `type`, `disabled`, `media`); the renderer's loads (asked for as the
# parser stops and after the DOM changes, blocking rendering, `load` and
# `error` at the link, the window's `load` after them).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "style_next", "--test", "it", "sheets::"]
timeout = 1200

[[mutant]]
name = "a link's sheet collects nothing"
file = "crates/style_next/src/lib.rs"
from = '''            || std::mem::take(&mut self.linked_changed)
'''
to = ''''''

