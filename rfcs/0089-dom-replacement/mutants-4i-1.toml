# Stage 4i-1: the binding's shape as today's DOM has it (the members' order,
# a global's own members, inherited unforgeable ones, indexed queries,
# [Replaceable], window.event, document.all) and the small members.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it && cargo test -q -p bindings --test it -- isolate_state::"]
timeout = 1500

