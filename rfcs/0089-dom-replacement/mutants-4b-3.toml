from = '''    let handles = host.read(|cx| cx.animation_frame_handles(window.get(cx.gc)));
    for handle in handles {'''
to = '''    let mut at = 0;
    while let Some(handle) = host.read(|cx| cx.animation_frame_handles(window.get(cx.gc)).get(at).copied()) {
        at += 1;'''

[[mutant]]
name = "a callback stays after it runs"
file = "crates/dom_api_next/src/animation_frame.rs"
from = '''            cx.take_animation_frame(window.get(cx.gc), handle)
                .map(|frame| Persistent::new(cx.gc, frame))'''
to = '''            let window = window.get(cx.gc);
            let frame = cx.take_animation_frame(window, handle);
            if frame.is_some() {
                let again = cx.add_animation_frame(window);
                let _ = again;
            }
            frame.map(|frame| Persistent::new(cx.gc, frame))'''

