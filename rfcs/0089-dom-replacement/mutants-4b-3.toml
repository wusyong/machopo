# Stage 4b-3: `requestAnimationFrame`: the callbacks on the window
# (`dom_next`), "run the animation frame callbacks" (`dom_api_next`), the
# V8 host's call, the renderer running them each main frame before its
# rendering and asking for frames while there are some.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it -- window && cargo test -q -p dom_api_next --test it -- animation_frame && cargo test -q -p shell --test it -- next_dom"]
timeout = 3000

[[mutant]]
name = "handles start at 0"
file = "crates/dom_next/src/window.rs"
from = '''        window.last_animation_frame.set(handle);'''
to = '''        window.last_animation_frame.set(handle - 1);'''

[[mutant]]
name = "cancelling another handle"
file = "crates/dom_next/src/window.rs"
from = '''                .is_some_and(|frame| frame.handle.get() == handle)'''
to = '''                .is_some_and(|frame| frame.handle.get() != handle)'''

[[mutant]]
name = "no animation frames ever wanted"
file = "crates/dom_next/src/window.rs"
from = '''            .is_some_and(|frames| frames.len() > 0)'''
to = '''            .is_some_and(|_| false)'''

