# Stage 4h-3c-1: Web Animations on the new DOM: `animate()`, `Animation` and its CSS subclasses,
# `getAnimations()`, `document.timeline`, the promises on the objects, `AnimationPlaybackEvent`.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it web_animations && cargo test -q -p style_next --test it animations"]
timeout = 1500

