# Stage 4f-5: on the new DOM, a number's and a range's `valueAsNumber`,
# `stepUp()` and `stepDown()`; the URL and enumerated reflections; a
# form's `relList` and an output's `htmlFor` (a `DOMTokenList` of any
# attribute).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it form_values"]
timeout = 3000

