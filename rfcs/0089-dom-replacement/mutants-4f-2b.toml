# Stage 4f-2b: on the new DOM, an input's value by its value mode, kept
# once dirty, sanitized by its type (text types, url, email, number,
# range's step range, color), the type change steps, a copy's; a form's
# reset() and reset event, reset buttons; a button's type;
# RadioNodeList's value.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- form_values:: activation:: forms::"]
timeout = 3000

[[mutant]]
name = "dom: a hidden input's value its own"
file = "crates/dom_next/src/input.rs"
from = '''            Self::Hidden | Self::Submit | Self::Image | Self::Reset | Self::Button => ValueMode::Default,'''
to = '''            Self::Submit | Self::Image | Self::Reset | Self::Button => ValueMode::Default,'''

[[mutant]]
name = "dom: a checkbox's value not on"
file = "crates/dom_next/src/input.rs"
