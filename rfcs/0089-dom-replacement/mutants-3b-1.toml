# Stage 3b-1: the box tree built from the new DOM (`layout`'s `next`):
# block and inline content, text, pseudo-elements, what goes to the
# viewport, the layout tree flags cleared; checked against the old DOM's
# boxes for kun's reftest pages and a few more.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "layout", "--test", "it", "next::"]
timeout = 900

