# Stage 4h-1a: the DOM's core members on the new DOM: CharacterData's edits by UTF-16
# offsets, splitText and wholeText, the constructors, Element's attribute names, toggling and
# adjacent insertion, the documents' collections by namespace and name, links and anchors,
# metadata, dir and visibility, a shadow root's active element, Attr and NamedNodeMap,
# CDATASection and XMLDocument, DOMParser.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "-E", "RUSTY_V8_ARCHIVE=/home/wusyong/Desktop/kun/third_party/rusty_v8_artifacts", "sh", "-c", "cargo test -q -p dom_js_next --test it -- dom_core frames::the_pages_visibility && cargo test -q -p dom_api_next --test it -- focus"]
timeout = 900

