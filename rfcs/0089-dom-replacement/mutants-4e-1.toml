# Stage 4e-1: shadow roots on the new DOM: `dom_next`'s shadow root and
# tree scope (owners, adoption, connected through hosts, ids, clone,
# retarget, roots), `dom_api_next`'s `attachShadow`, `shadowRoot`, the
# dispatch through hosts, `composedPath()` and the related target.
