# Stage 4g-2a: on the new DOM, <canvas> and its 2D context's state, transforms, compositing,
# colors, rects, paths and line styles (the canvas crate's steps, shared with today's DOM), the
# draws drawn at once and before each frame, the layer's texture swapped, the canvas replaced;
# interface objects' read-only prototype.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it canvas && cargo test -q -p dom_js_next --test it wrappers && cargo test -q -p dom_js_next --test it exceptions && cargo test -q -p renderer --lib canvas && cargo test -q -p shell --test it next_dom_canvas"]
timeout = 3000

[[mutant]]
name = "dom: the default width is the height's"
file = "crates/dom_next/src/canvas.rs"
from = '''dimension(names::local::WIDTH, DEFAULT_CANVAS_WIDTH),'''
to = '''dimension(names::local::WIDTH, DEFAULT_CANVAS_HEIGHT),'''

