# Stage 4f-3c-1: on the new DOM, the user's keys in a text control (typing
# with beforeinput, textInput and input, deleting and moving by
# grapheme cluster, Shift's selection, maxlength, read-only, Enter, the
# commit's change), the focus out of a UA shadow tree and through the
# form controls, WebDriver's Element Send Keys and Clear, TextEvent.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it ua_shadow && cargo test -q -p dom_api_next --test it -- editing focus:: && cargo test -q -p dom_js_next --test it event_interfaces"]
timeout = 3000

[[mutant]]
name = "dom: the latest value kept as before the user's change"
file = "crates/dom_next/src/text_control.rs"
from = '''            cell.set(Some(kept.unwrap_or(value)));'''
to = '''            let _ = kept;
            cell.set(Some(value));'''

