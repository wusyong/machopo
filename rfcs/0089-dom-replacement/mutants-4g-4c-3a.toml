# Stage 4g-4c-3a: HTML's cross-origin objects on the new DOM (a window's and a location's
# access check and interceptors, the cross-origin functions of the accessing realm, the
# members' receivers checked), a child frame's location navigating it against the entry
# realm's URL, the window's close, closed, focus, blur and opener, contentDocument and
# frameElement across origins, a child's initial window with the page's focus.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "-E", "RUSTY_V8_ARCHIVE=/home/wusyong/Desktop/kun/third_party/rusty_v8_artifacts", "sh", "-c", "cargo test -q -p dom_js_next --test it -- cross_origin frames && cargo test -q -p html --test it -- next"]
timeout = 900

