# Stage 5c-2: DevTools' Network, initiators and resources on the DOM's
# requests.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p renderer --lib && cargo test -q -p dom_next --test it initiators:: && cargo test -q -p html --test it next:: && cargo test -q -p dom_js_next --test it devtools:: && cargo test -q -p shell --test it devtools"]
timeout = 1500

