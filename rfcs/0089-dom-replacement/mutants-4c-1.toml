[[mutant]]
name = "an async script's promise not awaited"
file = "crates/dom_js_next/src/webdriver.rs"
from = '''    resolver.resolve(scope, args.get(0));
    let promise = resolver.get_promise(scope);
    let _ = await_script(scope, id, promise);'''
to = '''    let _ = resolver;
    let value = v8::Local::new(scope, args.get(0));
    v8::tc_scope!(let tc, scope);
    let cloned = match state::scope(tc) {
        Some(mut scope) => clone(&mut scope, value, &mut Vec::new()),
        None => return,
    };
    let result = cloned.map_err(|failed| failure(tc, failed));
    settled(tc, id, result);'''

