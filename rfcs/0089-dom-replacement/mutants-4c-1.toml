# Stage 4c-1: WebDriver on the new DOM: `dom_api_next`'s queries (an
# element still the document's, Find, rect, name, attribute, click point,
# an action's origin, a screenshot's rect, the viewport), the engine's
# script (this, async settling, JSON clone), the renderer's references and
# values, and the document told to DevTools' `Page` agent.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it -- webdriver && cargo test -q -p dom_js_next --test it -- webdriver && cargo test -q -p shell --test it -- webdriver::the_new_doms devtools_lifecycle::the_new_doms"]
timeout = 3000

