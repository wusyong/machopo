# Stage 4e-3a-2: stylesheet invalidation in `style_next`
# (`rule_set_invalidation.rs`): the rules of the sheets that came and went,
# what finds the elements they may match, applied in the walk; an assigned
# node's sibling sets marked along its DOM siblings, a walk after for those
# passed.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p style_next"]
timeout = 3000

