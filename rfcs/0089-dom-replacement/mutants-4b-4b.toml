name = "Tab from the toolbar starts at the focused element"
file = "crates/dom_api_next/src/focus.rs"
from = '''pub fn set_initial_focus<H: ScriptHost>(host: &mut H, document: &NodeRoot, reverse: bool) -> bool {
    advance(host, document, None, reverse)'''
to = '''pub fn set_initial_focus<H: ScriptHost>(host: &mut H, document: &NodeRoot, reverse: bool) -> bool {
