# Stage 4b-4b: the mouse's focus, Tab's sequential navigation (the order,
# past the ends the browser's), Tab from the toolbar, the keys' target the
# focused element, the rings' heuristic; the renderer's `TakeFocus` and
# `SetInitialFocus`.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it -- focus input && cargo test -q -p shell --test it -- next_dom"]
timeout = 3000

[[mutant]]
name = "a negative tabindex in the order"
file = "crates/dom_api_next/src/focus.rs"
from = '''            if let Some(index) = index.filter(|&index| index >= 0) {'''
to = '''            if let Some(index) = index {'''

[[mutant]]
name = "a link not in the order"
file = "crates/dom_api_next/src/focus.rs"
from = '''            let index = tabindex(cx, node).or_else(|| focusable_by_default(cx, node).then_some(0));'''
to = '''            let index = tabindex(cx, node);'''

[[mutant]]
name = "0 first"
file = "crates/dom_api_next/src/focus.rs"
from = '''    entries.sort_by_key(|&(index, _)| if index == 0 { i32::MAX } else { index });'''
to = '''    entries.sort_by_key(|&(index, _)| index);'''

[[mutant]]
name = "only the children in the order"
file = "crates/dom_api_next/src/focus.rs"
from = '''        let first = stack.len();
        stack.extend(std::iter::successors(cx.first_child(node), |&child| cx.next_sibling(child)));'''
to = '''        let first = stack.len();'''

