# Stage 4h-3c-2, through the renderer with keyframes computed: replaced animations removed,
# `commitStyles()`'s values, a target changed, a frame made while others' animations started,
# script's animations that don't run kept on a restyle.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p shell --test it -- next_dom::effects_replaced_committed_and_retargeted next_dom::animations_of_a_frame_made_while_starting_others next_dom::script_animations_not_running_kept_when_restyled"]
timeout = 1800

