name = "a local is always empty"
file = "crates/bindings/src/unified_heap.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "bindings", "--test", "it", "--test", "unified_heap_marking", "--test", "unified_heap_linear", "--", "unified_heap", "gc_platform", "incremental_markings", "finishes_the_marking", "objects_behind"]
