# Stage 1g-1: the gc heap marking with V8's major GCs: bindings'
# unified_heap and gc_platform, the rusty_v8 fork's v8::kun, and the V8
# fork's patch (rebuilt for each of its mutants, last). Run with
# RUSTY_V8_ARCHIVE pointing at ../third_party/rusty_v8_artifacts, built
# from the patched fork (the prebuilt has none of it), and rebuild V8 after:
# the last C++ mutant's build is left there. Each test command in a scope
# of at most 24 GB (docs/testing.md); the baselines take seconds, plus a
# relink, and about a minute more to rebuild V8.
timeout = 300

[[mutant]]
name = "every type's wrappers share a tag"
file = "crates/bindings/src/unified_heap.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "bindings", "--test", "it", "--test", "unified_heap_marking", "--test", "unified_heap_linear", "--", "unified_heap", "gc_platform", "incremental_markings", "finishes_the_marking", "objects_behind"]
from = '''        .and_then(|index| v8::kun::FIRST_TAG.checked_add(index))'''
to = '''        .and_then(|_| v8::kun::FIRST_TAG.checked_add(0))'''

[[mutant]]
name = "the marking's hand-over is dropped"
file = "crates/bindings/src/unified_heap.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "bindings", "--test", "it", "--test", "unified_heap_marking", "--test", "unified_heap_linear", "--", "unified_heap", "gc_platform", "incremental_markings", "finishes_the_marking", "objects_behind"]
from = '''        *self.marker() = marker;'''
to = '''        drop(marker);'''

[[mutant]]
name = "the heap's marking is done before it is drained"
file = "crates/bindings/src/unified_heap.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "bindings", "--lib", "--", "unified_heap"]
from = '''    marker.is_none_or(gc::WrapperMarker::is_drained)'''
to = '''    let _ = marker;
    true'''

