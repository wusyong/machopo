[[mutant]]
name = "the fork's handle doesn't cancel"
file = "../third_party/rusty_v8/src/machopo.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "bindings", "--test", "it", "--test", "unified_heap_marking", "--test", "unified_heap_linear", "--", "unified_heap", "gc_platform", "incremental_markings", "finishes_the_marking", "objects_behind"]
from = '''    // SAFETY: the handle, deleted once.
    unsafe { v8__kun__JobHandle__Cancel(self.0.as_ptr()) };'''
to = '''    // SAFETY: the handle, deleted once.
    unsafe { v8__kun__JobHandle__CancelAndDetach(self.0.as_ptr()) };'''

