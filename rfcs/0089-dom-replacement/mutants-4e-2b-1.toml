# Stage 4e-2b-1: the tree's members on the new DOM: `childNodes` (live,
# its index cache cleared by the children's changes), `children`,
# `getElementsByClassName`, `ParentNode`'s and `ChildNode`'s methods,
# `replaceChild`, `nodeValue`, `normalize`, `compareDocumentPosition`,
# `isEqualNode`, `isSameNode`, the namespace lookups, the element
# siblings, the host-including ancestor check, and the hooks moved into
# `link`.
