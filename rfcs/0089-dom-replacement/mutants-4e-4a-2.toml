# Stage 4e-4a-2: constructing and upgrading custom elements on the new
# DOM: `dom_next`'s states, maps, candidates and construction stack,
# `dom_api_next`'s `[HTMLConstructor]`, `createElement`'s checks and the
# upgrade, `dom_js_next`'s construction.
