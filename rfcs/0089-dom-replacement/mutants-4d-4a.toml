# Stage 4d-4a: `CustomEvent`, `createEvent` and the legacy `init*Event`s,
# `WheelEvent`, `InputEvent` on the new DOM: `dom_next`'s initialized flag
# and event data, `dom_api_next`'s members and the typed layer's `any`,
# event target and string arguments, the V8 front's.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- event_interfaces ui_events events"]
timeout = 3000

[[mutant]]
name = "a constructed event not initialized"
file = "crates/dom_next/src/event.rs"
from = '''                flags: Cell::new(flag_bits(flags) | INITIALIZED),'''
to = '''                flags: Cell::new(flag_bits(flags)),'''

[[mutant]]
name = "createEvent's event initialized"
file = "crates/dom_next/src/event.rs"
from = '''        set_bits(&event.flags, INITIALIZED, false);
'''
to = ''''''

[[mutant]]
name = "initEvent initializes nothing"
file = "crates/dom_next/src/event.rs"
from = '''            kept | INITIALIZED
                | flag_bits('''
to = '''            kept
                | flag_bits('''

[[mutant]]
name = "an uninitialized event dispatched"
file = "crates/dom_api_next/src/event_target.rs"
from = '''!cx.event_state(event).dispatching && cx.event_initialized(event)'''
to = '''!cx.event_state(event).dispatching'''

