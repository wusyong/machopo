# Stage 4g-2b-3: on the new DOM, toDataURL (encoded on the main thread), toBlob (the bitmap taken
# at the call, encoded on the renderer's encoder thread, the callback called in an element task),
# and Blob itself (its constructor's parts and options, size, type, slice, text, arrayBuffer,
# bytes); the canvas crate's export steps, which today's DOM shares.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p canvas && cargo test -q -p dom_next --lib && cargo test -q -p dom_api_next --lib && cargo test -q -p dom_api --test it canvas_export && cargo test -q -p dom_js_next --test it -- blobs canvas && cargo test -q -p shell --test it next_dom_canvas"]
timeout = 3000

