# Stage 4h-3b: CSS transitions and animations on the new DOM: the elements' animations in
# `dom_next`, style_next's style change events and sampling (the shared `style::animation_style`
# steps), the timeline moving on, `TransitionEvent` and `AnimationEvent`.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p style_next --test it animations && cargo test -q -p dom_js_next --test it event_interfaces"]
timeout = 1500

