# Stage 4f-3b: on the new DOM, form controls' UA shadow trees (built at
# the next style update for a control connected to a document with a
# window, following the control at once), their parts matched as their
# host's pseudo-elements, the controls' native looks, their boxes as
# the build from `dom` makes them (`control`'s `ControlNode`), the
# native look's states painted again.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it ua_shadow && cargo test -q -p style_next --test it -- parts form_states && cargo test -q -p layout --test it -- next:: next_update::a_controls && cargo test -q -p shell --test it a_controls_tree"]
timeout = 3000

