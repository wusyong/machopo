# The last segment, c: docs/test-gaps.md's conclusions measured on code
# that went with the old DOM, tried again on today's. Each is expected
# missed (what the entry says no test catches); one caught means the entry
# is wrong.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js --test it && cargo test -q -p renderer --lib && cargo test -q -p shell --test it"]
timeout = 3000

