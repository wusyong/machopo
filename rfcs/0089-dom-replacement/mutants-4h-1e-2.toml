# Stage 4h-1e-2: import(), import.meta.resolve and <link rel=modulepreload> on the new DOM, and
# failed module fetches not kept in the module map.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --lib module && cargo test -q -p dom_js_next --test it -- scripts::"]
timeout = 1200

[[mutant]]
name = "api: a failed module stays in the map"
file = "crates/dom_api_next/src/module.rs"
from = '''            None => self.map.remove(&url).expect("fetching"),'''
to = '''            None => std::mem::replace(self.map.get_mut(&url).expect("fetching"), Entry::Fetching(Vec::new())),'''

[[mutant]]
name = "api: a module's fetch options aren't its fetch's"
file = "crates/dom_api_next/src/module.rs"
from = '''                self.fetches.insert(request_id, (url.clone(), entry.credentials));'''
to = '''                self.fetches.insert(request_id, (url.clone(), CredentialsMode::Anonymous));'''

[[mutant]]
name = "dom: a modulepreload rel isn't seen"
file = "crates/dom_next/src/script.rs"
from = '''        if local == names::local::REL && self.is_module_preload(element) {
            self.see(form::PRELOADS_SEEN);
        }'''
to = ''''''

[[mutant]]
name = "dom: rel's keywords by case"
file = "crates/dom_next/src/script.rs"
from = '''                    .any(|keyword| keyword.eq_ignore_ascii_case("modulepreload"))'''
to = '''                    .any(|keyword| keyword == "modulepreload")'''

[[mutant]]
name = "dom: rel whole, not its keywords"
file = "crates/dom_next/src/script.rs"
from = '''                    .split(|c: char| c.is_ascii_whitespace())'''
to = '''                    .split('\u{0}')'''

