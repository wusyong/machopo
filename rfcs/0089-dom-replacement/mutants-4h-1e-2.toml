[[mutant]]
name = "api: a classic script's credentials never include"
file = "crates/dom_api_next/src/script.rs"
from = '''        .is_some_and(|value| value.borrow().to_str().eq_ignore_ascii_case("use-credentials"))'''
to = '''        .is_some_and(|_| false)'''

