# Stage 4h-1d-1: script elements script inserts on the new DOM (their triggers recorded in tree
# order with the iframes', the flags, "prepare the script element", an inline one run as the
# call ends in its document's realm, `HTMLScriptElement`'s members).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "-E", "RUSTY_V8_ARCHIVE=/home/wusyong/Desktop/kun/third_party/rusty_v8_artifacts", "sh", "-c", "cargo test -q -p dom_next --test it -- scripts:: frames:: kinds:: && cargo test -q -p dom_js_next --test it -- scripts:: frames::"]
timeout = 1200

