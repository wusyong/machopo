[[mutant]]
name = "api: inherit sets the attribute"
file = "crates/dom_api_next/src/html.rs"
from = '''        Some(ContentEditable::Inherit) => {
            cx.remove_attribute(this, "contenteditable");
        }'''
to = ''''''

[[mutant]]
name = "api: any other value sets true"
file = "crates/dom_api_next/src/html.rs"
from = '''    .find(|state| value.eq_ignore_ascii_case(state.keyword()));'''
to = '''    .find(|state| value.eq_ignore_ascii_case(state.keyword()))
    .or(Some(ContentEditable::True));'''

[[mutant]]
name = "api: the value set as given"
file = "crates/dom_api_next/src/html.rs"
from = '''        Some(state) => cx.set_attribute_ns(this, QualName::local("contenteditable"), state.keyword()),'''
to = '''        Some(_) => cx.set_attribute_ns(this, QualName::local("contenteditable"), value),'''

[[mutant]]
name = "api: contentEditable's state of a missing attribute"
file = "crates/dom_api_next/src/html.rs"
from = '''    let state = cx.content_editable(this).unwrap_or(ContentEditable::Inherit);'''
to = '''    let state = cx.content_editable(this).unwrap_or(ContentEditable::True);
    let state = if state == ContentEditable::Inherit { ContentEditable::True } else { state };'''

[[mutant]]
name = "api: isContentEditable only by the element's own attribute"
file = "crates/dom_api_next/src/html.rs"
from = '''    Ok(cx.is_editable(this))'''
to = '''    Ok(matches!(cx.content_editable(this), Some(ContentEditable::True | ContentEditable::PlaintextOnly)))'''

