            return None;
        }'''
to = '''        self.qualified_name(element)?;'''

[[mutant]]
name = "dom: plaintext-only doesn't make it editable"
file = "crates/dom_next/src/editing.rs"
from = '''                Some(ContentEditable::True | ContentEditable::PlaintextOnly) => return Some(at),'''
to = '''                Some(ContentEditable::True) => return Some(at),
                Some(ContentEditable::PlaintextOnly) => return None,'''

[[mutant]]
name = "dom: false doesn't stop the walk"
file = "crates/dom_next/src/editing.rs"
