                        && self'''
to = '''                    false
                        && self'''

[[mutant]]
name = "dom: an editing host inside an editable one"
file = "crates/dom_next/src/editing.rs"
from = '''        self.is_editable(node)
            && !self.parent(node).is_some_and(|parent| self.is_editable(parent))'''
to = '''        self.is_editable(node)'''

[[mutant]]
name = "dom: the innermost editing host"
file = "crates/dom_next/src/editing.rs"
from = '''        let mut host = self.editable_from(node)?;
        while let Some(parent) = self.parent(host)
            && let Some(from) = self.editable_from(parent)
        {
            host = from;
        }
        Some(host)'''
to = '''        self.editable_from(node)'''

