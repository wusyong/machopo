# Stage 4h-1c-2: editability on the new DOM (contenteditable's states, what is editable, the
# editing host, what a caret can't be in), contentEditable and isContentEditable, :read-write
# of editable elements and contenteditable restyling the subtree, the editing host's
# overflow-wrap.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "-E", "RUSTY_V8_ARCHIVE=/home/wusyong/Desktop/kun/third_party/rusty_v8_artifacts", "sh", "-c", "cargo test -q -p dom_next --test it -- editing && cargo test -q -p dom_js_next --test it -- editing && cargo test -q -p style_next --test it -- editable_elements_are_read_write an_editing_hosts_long_words_wrap"]
timeout = 1200

[[mutant]]
name = "dom: the empty value isn't true"
file = "crates/dom_next/src/editing.rs"
from = '''        if value.is_empty() || value.eq_ignore_ascii_case("true") {'''
to = '''        if value.eq_ignore_ascii_case("true") {'''

[[mutant]]
name = "dom: true only in lower case"
file = "crates/dom_next/src/editing.rs"
from = '''        if value.is_empty() || value.eq_ignore_ascii_case("true") {'''
to = '''        if value.is_empty() || value == "true" {'''

[[mutant]]
name = "dom: plaintext-only is inherit"
file = "crates/dom_next/src/editing.rs"
from = '''        } else if value.eq_ignore_ascii_case("plaintext-only") {
            Self::PlaintextOnly'''
to = '''        } else if value.eq_ignore_ascii_case("plaintext-only") {
            Self::Inherit'''

[[mutant]]
name = "dom: plaintext-only's keyword is true's"
file = "crates/dom_next/src/editing.rs"
from = '''            Self::PlaintextOnly => "plaintext-only",'''
to = '''            Self::PlaintextOnly => "true",'''

[[mutant]]
