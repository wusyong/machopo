# Stage 4h-2b-1: getComputedStyle on the new DOM (a computed CSSStyleDeclaration, the style or the
# layout brought up to date, pseudo-elements), ::selection in style_next's walk, the declaration's
# supported names, a shadow root's sheets collected again once connected.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it computed_style && cargo test -q -p dom_js_next --test it css_style && cargo test -q -p style_next --test it && cargo test -q -p dom_next --test it sheets"]
timeout = 1200

