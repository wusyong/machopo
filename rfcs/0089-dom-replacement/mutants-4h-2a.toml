name = "dom: a link's sheet after it went is the same"
file = "crates/dom_next/src/cssom.rs"
from = '''            if current.owner.get(self.gc).is_some() {
                return Some(current);
            }'''
to = '''            return Some(current);'''

[[mutant]]
name = "dom: a style's sheet after it went is the same"
file = "crates/dom_next/src/cssom.rs"
