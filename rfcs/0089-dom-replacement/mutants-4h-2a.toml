# Stage 4h-2a: CSSOM on the new DOM: the sheets of <style>s and <link>s, owned by the DOM, their
# rules' objects, their lists and media lists, StyleSheetList, and the style and link elements.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it sheets && cargo test -q -p style_next --test it && cargo test -q -p dom_js_next --test it -- style_sheets::"]
timeout = 1200

[[mutant]]
name = "dom: a disconnected element has a sheet"
file = "crates/dom_next/src/cssom.rs"
from = '''        if !self.is_connected(owner) || !self.owns_sheet(owner) {'''
to = '''        if !self.owns_sheet(owner) {'''

