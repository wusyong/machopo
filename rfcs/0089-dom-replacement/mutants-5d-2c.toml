# Stage 5d-2c: navigation and frames on the DOM's engine.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it && cargo test -q -p dom_js_next --test it -- dom_core:: devtools:: && cargo test -q -p style_next --test it invalidation:: && cargo test -q -p shell --test it -- network::content_language automation_pipe::frames_are_switched && cargo test -q -p browser --test it -- the_tab_title_follows_document_title a_new_iframes_about_blank_has_its_parents_base_url a_child_frame_s_location clicks_go_into_child_frames documents_have_the_tabs_visibility"]
timeout = 2400

