# Stage 4f-3c-2: on the new DOM, the keys that click a check box, a radio
# button and a button; a number's and a range's keys and the user's
# steps; a search field's Escape and clear button; a number's spin
# button held, its repeat by the window's native timers.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it -- controls:: editing"]
timeout = 3000

