test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "-E", "RUSTY_V8_ARCHIVE=/home/wusyong/Desktop/kun/third_party/rusty_v8_artifacts", "sh", "-c", "python3 scripts/test.py wdspec --next-dom webdriver/tests/classic/switch_to_frame webdriver/tests/classic/switch_to_parent_frame webdriver/tests/classic/get_current_url/iframe.py webdriver/tests/classic/get_title/iframe.py webdriver/tests/classic/take_element_screenshot/iframe.py webdriver/tests/classic/take_screenshot/iframe.py webdriver/tests/classic/element_click/click.py webdriver/tests/classic/execute_script/arguments.py webdriver/tests/classic/execute_script/node.py webdriver/tests/classic/element_send_keys/send_keys.py webdriver/tests/classic/element_send_keys/interactability.py webdriver/tests/classic/get_element_rect/get.py webdriver/tests/classic/perform_actions/pointer_mouse.py | grep -q 'expects 212, gaps 4 '"]
