# Stage 4g-1b-2a: IntersectionObserver on the new DOM: the observers and observations
# (the targets keep them), the interfaces and their options, the entry's constructor,
# what the rendering update queues, the task that delivers it, and the renderer's
# computation after the lifecycle; and the last <link>s looked for before the load.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it intersection && cargo test -q -p dom_api_next --test it intersection && cargo test -q -p dom_js_next --test it intersection_observers"]
timeout = 3000

