# Stage 4g-4b-1: each frame's loops on the new DOM: the windows' timers by when they are
# due across the frames, the rendering update's animation frame callbacks and intersection
# observers' tasks in tree order, the element tasks of each window, the frames' documents
# in tree order and their origins.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it frames && cargo test -q -p dom_js_next --test it timers"]
timeout = 900

[[mutant]]
name = "api: the iframes' documents not in tree order"
file = "crates/dom_api_next/src/frame.rs"
from = '''        stack.extend(cx.child_content_documents(document).into_iter().rev());'''
to = '''        stack.extend(cx.child_content_documents(document));'''

[[mutant]]
name = "api: an about: document's origin its URL's"
file = "crates/dom_api_next/src/frame.rs"
from = '''            (Some(url), Some(owner)) if url.scheme() == "about" => at = cx.document_of(owner),'''
to = '''            (Some(url), Some(owner)) if false && url.scheme() == "about" => at = cx.document_of(owner),'''

[[mutant]]
name = "dom: no iframe's content document listed"
file = "crates/dom_next/src/frame.rs"
from = '''            documents.extend(self.content_document(node));'''
to = '''            let _ = node;'''

[[mutant]]
name = "js: the latest due timer first"
file = "crates/dom_js_next/src/engine.rs"
from = '''                && best.as_ref().is_none_or(|(best, ..)| at < *best)'''
to = '''                && best.as_ref().is_none_or(|(best, ..)| at > *best)'''

