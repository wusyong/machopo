# Stage 4b-2a: `UIEvent`, `MouseEvent` (dictionary numbers); `:hover` and
# `:active` (the document's chains, the nodes' bits, the style phase's
# invalidation); the mouse in `dom_api_next` (`EventHandler`: hit test,
# boundary events, clicks, a checkpoint after each event); the renderer
# routing input to the new DOM.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next -p style_next -p dom_api_next && cargo test -q -p dom_js_next --test it -- ui_events && cargo test -q -p shell --test it -- next_dom"]
timeout = 3000

