# Stage 4a-1: the id table and `getElementById`; selector queries
# (`querySelector(All)`, `matches`, `closest`) and their fast paths; the
# static `NodeList`, `classList` and `dataset`; named properties in the V8
# bindings.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_next", "-p", "style_next", "-p", "dom_api_next", "-p", "dom_js_next"]
timeout = 1800

[[mutant]]
name = "a second element with the id is taken as the first"
file = "crates/dom_next/src/ids.rs"
from = '''            entry.first = (entry.count == 0).then_some(id);'''
to = '''            entry.first = Some(id);'''

[[mutant]]
name = "the first leaving keeps it the first"
file = "crates/dom_next/src/ids.rs"
from = '''            } else if entry.first == Some(id) {
                entry.first = None;
            }'''
to = '''            }'''

[[mutant]]
name = "an entry stays when no element has the id"
file = "crates/dom_next/src/ids.rs"
from = '''            if entry.count == 0 {
                table.entries.remove(&key);
            } else if'''
to = '''            if'''

