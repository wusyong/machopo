# Stage 4d-1: the root tables without `Rc` and `RefCell` (`gc`'s
# `RootTable`, `Persistent`, the heap's drop with roots left), the
# dispatch passing over targets with no listeners in one operation, and
# the drop orders that let roots go before their heap.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p gc && cargo test -q -p dom_api_next --test it -- dispatch && cargo test -q -p dom_js_next && cargo test -q -p style_next"]
timeout = 3000

[[mutant]]
name = "a root removed while marking not kept"
file = "crates/gc/src/persistent.rs"
from = '''            if let Some(removed) = &mut entries.removed {
                removed.push(offset);
            }'''
to = '''            let _ = offset;'''

[[mutant]]
name = "a removed root's entry not freed"
file = "crates/gc/src/persistent.rs"
from = '''            entries.free.push(index);
        });'''
to = '''            let _ = index;
        });'''

[[mutant]]
name = "a dead weak root not cleared"
file = "crates/gc/src/persistent.rs"
from = '''        for slot in &mut slots {
            *slot = update(*slot);
        }'''
to = '''        for slot in &mut slots {
            let _ = update(*slot);
        }'''

[[mutant]]
name = "another heap's root read"
file = "crates/gc/src/persistent.rs"
from = '''        assert!(
            std::ptr::eq(self.table.as_ptr(), &raw const cx.inner.shared.roots),
            "a Persistent of another heap"
        );'''
to = ''''''

[[mutant]]
name = "roots outliving the heap not caught"
file = "crates/gc/src/heap.rs"
from = '''            debug_assert!(std::thread::panicking(), "{left} roots outlive their heap");'''
to = ''''''

[[mutant]]
name = "every target its own operation"
file = "crates/dom_api_next/src/event_target.rs"
from = '''                if listeners > 0 {
                    return Some(listeners);
                }'''
to = '''                return Some(listeners);'''

[[mutant]]
name = "the pass goes on past stopPropagation"
file = "crates/dom_api_next/src/event_target.rs"
from = '''                if cx.event_state(event).stop_propagation {
                    return None;
                }'''
