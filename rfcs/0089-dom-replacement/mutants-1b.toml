[[mutant]]
name = "an operation without a safepoint has one"
file = "crates/gc/src/heap.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "young::"]
from = '''    ) -> R {
        f(&Mutation {
            inner: &self.inner,
            _invariant: PhantomData,
        })
    }'''
to = '''    ) -> R {
        self.inner.safepoint();
        f(&Mutation {
            inner: &self.inner,
            _invariant: PhantomData,
        })
    }'''

