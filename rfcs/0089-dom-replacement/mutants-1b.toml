# Stage 1b: gc's side of marking with a JS engine (driven marking, its
# schedule, wrappers' objects handed over, JS edges, operations without a
# safepoint), brought over from RFC 0088's branch: its gc mutants that
# still apply (mutants-1c, 1d, 1f, 1g there), the one the cleanup changed,
# and a few more. Each test command in a scope of at most 24 GB
# (docs/testing.md: a mutation that makes a loop can grow a test without end).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "js::"]
timeout = 60

[[mutant]]
name = "a driven heap starts its markings itself"
file = "crates/gc/src/heap.rs"
from = '''        if self.options.driven {
            // The engine starts and finishes markings (`Heap::start_marking`);'''
to = '''        if false {
            // The engine starts and finishes markings (`Heap::start_marking`);'''

