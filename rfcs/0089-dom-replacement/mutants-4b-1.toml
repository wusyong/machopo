# Stage 4b-1: script reads the layout: `NextLayout` lent to each operation
# (laid out first, or not where no layout changes what is read), CSSOM
# View's `offset*`, `client*`, `scroll*`, rects, `elementFromPoint`,
# `scrollingElement` and the window's viewport; `DOMRect`, `DOMRectList`;
# `double` arguments; the new DOM's frame given the window's size at the
# commit.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next -p dom_api_next && cargo test -q -p shell --test it -- next_dom"]
timeout = 2400

[[mutant]]
name = "the layout lent to a node of another document"
file = "crates/dom_api_next/src/lib.rs"
from = '''        let shown = self.node_id(document) == layout.document() && self.is_connected(node);'''
to = '''        let shown = self.is_connected(node);'''

[[mutant]]
name = "the layout lent to a detached node"
file = "crates/dom_api_next/src/lib.rs"
from = '''        let shown = self.node_id(document) == layout.document() && self.is_connected(node);'''
to = '''        let shown = self.node_id(document) == layout.document();'''

[[mutant]]
name = "the layout not put back"
file = "crates/dom_api_next/src/lib.rs"
from = '''        cell.set(Some(layout));
        result'''
to = '''        drop(layout);
        result'''

[[mutant]]
name = "nothing laid out first"
file = "crates/dom_api_next/src/lib.rs"
from = '''            layout.update_style_and_layout(self.dom);'''
to = ''''''

[[mutant]]
name = "innerWidth lays out"
file = "crates/dom_api_next/src/geometry.rs"
from = '''        .peek_layout(document, |layout| saturated_cast(layout.viewport().size.width))'''
to = '''        .with_layout(document, |layout| saturated_cast(layout.viewport().size.width))'''

