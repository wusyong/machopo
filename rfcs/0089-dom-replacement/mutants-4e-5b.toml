# Stage 4e-5b: setHTMLUnsafe, parseHTMLUnsafe and getHTML on the new DOM:
# `html`'s fragment and whole-document parses with declarative shadow
# roots and the serializer's shadow roots, `dom_api_next`'s members, the
# table's static methods and `dom_js_next`'s `getHTML` options.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it shadow_dom && cargo test -q -p dom_js_next --test it wrappers"]
timeout = 3000

[[mutant]]
name = "html: a fragment's never attach"
file = "crates/html/src/next.rs"
from = '''    fn allow_declarative_shadow_roots(&self, _: &NodeRef<'gc>) -> bool {
        self.declarative_shadows
    }'''
to = '''    fn allow_declarative_shadow_roots(&self, _: &NodeRef<'gc>) -> bool {
        false
    }'''

[[mutant]]
name = "html: the fast path taken for setHTMLUnsafe"
file = "crates/html/src/next.rs"
from = '''    if !declarative_shadows && crate::fast_path_next::parse_fragment(cx, document, fragment, context, input) {'''
to = '''    if crate::fast_path_next::parse_fragment(cx, document, fragment, context, input) {'''

[[mutant]]
name = "html: a whole document's doctype dropped"
file = "crates/html/src/next.rs"
from = '''            let doctype = self.cx.create_doctype(self.fragment, &name, &public_id, &system_id);
            self.cx.insert(self.fragment, doctype, None);'''
to = '''            let _ = (name, public_id, system_id);'''

[[mutant]]
name = "html: a whole document's root kept out"
file = "crates/html/src/next.rs"
from = '''            && !self.whole_document
            && gc::Gc::ptr_eq(*parent, self.fragment)'''
to = '''            && gc::Gc::ptr_eq(*parent, self.fragment)'''

