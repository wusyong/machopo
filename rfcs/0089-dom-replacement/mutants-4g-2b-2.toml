# Stage 4g-2b-2: on the new DOM, drawImage's three forms, createPattern and CanvasPattern (its
# setTransform, a fill or stroke style kept with the state), imageSmoothingEnabled and
# imageSmoothingQuality, and origin-clean: an <img> from another origin without CORS, a canvas
# that drew one, a pattern of one; the canvas crate's image steps.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p canvas && cargo test -q -p dom_js_next --test it canvas && cargo test -q -p shell --test it next_dom_canvas"]
timeout = 3000

