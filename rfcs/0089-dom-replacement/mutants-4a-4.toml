# Stage 4a-4: `MutationObserver`: registrations in a node's rare data, the
# records the tree's, attributes' and data's changes queue, transient
# registrations, the options' checks, the delivery as a microtask the
# front end queues after the operation.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_next", "-p", "dom_api_next", "-p", "dom_js_next"]
timeout = 1800

