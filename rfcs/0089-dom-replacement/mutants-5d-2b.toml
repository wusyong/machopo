# Stage 5d-2b: tasks and timing on the DOM's engine.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it && cargo test -q -p dom_js_next --test it -- tasks:: blobs:: && cargo test -q -p renderer --lib navigation_timing:: && cargo test -q -p shell --test it -- messaging:: script:: forms:: performance:: navigator:: trace:: images:: fetch:: && cargo test -q -p browser --test it -- links::"]
timeout = 2400

