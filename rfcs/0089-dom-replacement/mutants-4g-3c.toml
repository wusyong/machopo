# Stage 4g-3c: SVG's geometry members on the new DOM (SVGMatrix, SVGPoint, SVGRect, getBBox,
# getCTM, getScreenCTM, SVGGeometryElement's and SVGTextContentElement's methods), what they
# compute shared with today's DOM in gfx::svg; an SVG element's client rect, focus and
# ResizeObserver sizes from its geometry; the layout's geometry queries generic over the DOM.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it svg && cargo test -q -p layout --test it -- next svg && cargo test -q -p dom_api_next --test it && cargo test -q -p dom_js --test it svg && cargo test -q -p dom_api --test it svg"]
timeout = 3000

