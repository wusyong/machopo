# Stage 4e-3a-3: the DOM notes only the changes style reads
# (`dom_next::StyleNames`): the names the rules use anywhere in a
# selector, the hints' attributes, `attr()`'s, given by `style_next`.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next -p style_next"]
timeout = 3000

