# Stage 4f-3a: on the new DOM, a textarea's value (its child text
# content until dirty, its newlines normalized, its reset and copy), the
# selection API of a textarea and the text inputs (the selection within
# the value, a changed value's cursor, a type change's, setRangeText's
# modes, select() and its focus), `select` queued as an element task and
# run by the engine, the form controls focusable, a textarea's
