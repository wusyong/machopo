# Stage 4d-4b: the wheel on the new DOM: `dom_next`'s wheel listeners
# (counted, passive by default, blocking for style), `style_next`'s flag,
# `dom_api_next`'s legacy event types and wheel input, the renderer's
# region, main-thread scroll and routing.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it -- wheel && cargo test -q -p dom_api_next --test it -- wheel && cargo test -q -p style_next --test it -- wheel && cargo test -q -p renderer --lib -- next_frame_view && cargo test -q -p shell --test it -- wheel::"]
timeout = 3000

[[mutant]]
name = "a handler not passive by default"
file = "crates/dom_next/src/event.rs"
from = '''        if type_and_flags & HANDLER != 0 && self.default_passive(target, event_type) {
            type_and_flags |= PASSIVE;
        }
'''
to = ''''''

