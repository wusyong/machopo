# Stage 4g-4a: the render thread's child frames on the new DOM, which only kun's frames/
# reftests reach (no cargo test drives the render thread): a frame's view shown in its
# parent's, its src fetched and srcdoc committed, scrolled to its URL's fragment, its
# scroll offsets the compositor's, its parent's load waiting for it.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "python3", "scripts/test.py", "reftest", "--next-dom", "frames/"]
timeout = 3000

[[mutant]]
name = "a frame's view always in the top-level one's"
file = "crates/renderer/src/render_thread/next.rs"
from = '''                            .show_child((Some(parent) != top).then_some(parent), view);'''
to = '''                            .show_child(None, view);'''

[[mutant]]
name = "srcdoc's markup not parsed"
file = "crates/renderer/src/render_thread/next.rs"
from = '''                self.commit_next_child(frame, url, "text/html", None, markup.as_bytes());'''
to = '''                self.commit_next_child(frame, url, "text/html", None, b"");'''

[[mutant]]
name = "a child not scrolled to its fragment"
file = "crates/renderer/src/render_thread/next.rs"
from = '''        self.scroll_next_to_fragment(frame);'''
to = '''        let _ = frame;'''

[[mutant]]
name = "a child's scroll offsets not the compositor's"
file = "crates/renderer/src/next_frame_view.rs"
from = '''            offsets.insert(child.document_node, child.scroll.viewport);'''
to = '''            let _ = child.document_node;'''

[[mutant]]
name = "a parent's load not waiting for its children"
file = "crates/renderer/src/render_thread/next.rs"
from = '''            || self.next_children.loading_in(frame)
        {'''
to = '''        {'''
