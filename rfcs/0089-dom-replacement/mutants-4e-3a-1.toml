name = "features: no id"
file = "crates/style_next/src/invalidation.rs"
from = '''        if let Some(id) = id {
            features.ids.push(id);
        } else if'''
to = '''        if let Some(id) = id.filter(|_| false) {
            features.ids.push(id);
        } else if'''

