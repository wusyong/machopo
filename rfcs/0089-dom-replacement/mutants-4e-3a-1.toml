# Stage 4e-3a-1: invalidation sets in `style_next` (`invalidation.rs`):
# descendant, sibling and state sets built from the rule indexes, handed
# down and along the style walk; the reach of a change of position.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p style_next --test it"]
timeout = 3000

