# Stage 4b-4a: focus: the document's focused element and its chain's bits
# (`dom_next`), `:focus`, `:focus-within`, `:focus-visible`
# (`style_next`), `focus()`, `blur()`, `tabIndex`, `activeElement`,
# `hasFocus()`, `FocusEvent`, the page's focus, the fixup
# (`dom_api_next`), the engine and the renderer passing them on.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it -- style && cargo test -q -p style_next --test it -- focus && cargo test -q -p dom_api_next --test it -- focus && cargo test -q -p dom_js_next --test it -- ui_events && cargo test -q -p shell --test it -- next_dom::focus"]
timeout = 3000

