# Stage 5d-3c: what style_next styles again, its document indexes, a new viewport.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p style_next --test it && cargo test -q -p dom_next --test it && cargo test -q -p shell --test it -- browser_view::a_new_scale_factor"]
timeout = 2400

