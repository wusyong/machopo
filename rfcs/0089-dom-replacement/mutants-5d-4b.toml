# Stage 5d-4b: the DOM and script gaps.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it && cargo test -q -p renderer --lib navigation_timing && cargo test -q -p shell --test it -- navigation_timing:: focus::an_editing_hosts_caret_on_focus"]
timeout = 2400

