# Stage 4f-4b: on the new DOM, the UA shadow trees of a select (a menu list's
# inner element, a list box's slot), an optgroup and an option, kept up
# with the options at once; `:-internal-list-box`; a list box's
# scrollbar room in the new DOM's box tree.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it ua_shadow && cargo test -q -p dom_js_next --test it select:: && cargo test -q -p style_next --test it form_states && cargo test -q -p layout --test it next::"]
timeout = 3000

