# Stage 4h-5b-2: idle callbacks, the navigator's geolocation, wakeLock, connection and
# scheduling on the new DOM; a time origin before the DOM was made, and a document its iframe
# navigated from no longer fully active.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- idle:: navigator_apis:: performance:: frames:: wrappers::"]
timeout = 1500

[[mutant]]
name = "api: an idle callback's timeout ignored"
file = "crates/dom_api_next/src/idle.rs"
from = '''    let idle = cx.add_idle_callback(this, options.timeout);'''
to = '''    let idle = cx.add_idle_callback(this, 0);'''

[[mutant]]
name = "api: a timed-out callback's deadline not the time it ran"
file = "crates/dom_api_next/src/idle.rs"
from = '''        let deadline = cx.create_idle_deadline(window, crate::event::coarsen(now), true);'''
to = '''        let deadline = cx.create_idle_deadline(window, crate::event::coarsen(now) + 50.0, true);'''

[[mutant]]
name = "api: negative time remaining"
file = "crates/dom_api_next/src/idle.rs"
from = '''    Ok(if remaining > 0.0 {'''
to = '''    Ok(if true {'''

[[mutant]]
name = "api: an idle timeout after a later timer"
file = "crates/dom_api_next/src/timer.rs"
from = '''cx.next_script_timer_due(window).is_none_or(|timer| idle < timer)'''
to = '''cx.next_script_timer_due(window).is_none()'''

[[mutant]]
name = "dom: idle timeouts don't make a timer due"
file = "crates/dom_next/src/window.rs"
from = '''        [self.next_script_timer_due(window), native, self.next_idle_timeout(window)]'''
to = '''        [self.next_script_timer_due(window), native, None]'''

