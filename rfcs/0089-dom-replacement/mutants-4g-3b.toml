# Stage 4g-3b: on the new DOM, SVG's <use> copies what it references into its UA shadow tree
# before style (the <use>s in a copy too, no cycles, at most MAX_COPIES elements) and copies
# again as its reference or what it copied changes; a copy matches its <use>'s tree's rules;
# layout captures the copy as the <use>, and draws again what an id found (gradients,
# <clipPath>s, an HTML box's clip-path) when an id finds another element or what it found
# changed.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it svg_use && cargo test -q -p style_next --test it && cargo test -q -p layout --test it -- next"]
timeout = 3000

