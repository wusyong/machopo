# Stage 5d-1: input and the cursor on the DOM's engine. Run with
# RUSTY_V8_ARCHIVE set until the fork's release with the embedder graph
# is out.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "env", "RUSTY_V8_ARCHIVE=/home/wusyong/Desktop/kun/third_party/rusty_v8_artifacts", "sh", "-c", "cargo test -q -p dom_api_next --test it && cargo test -q -p renderer --lib && cargo test -q -p browser --test it && cargo test -q -p dom_js_next --test it svg:: && cargo test -q -p shell --test it -- browser_view:: keys:: forms:: scheduling:: wheel:: focus:: selections:: network:: windowless::"]
timeout = 1500

