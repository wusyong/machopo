# Stage 4f-1b: the form owner on the new DOM: reset in the DOM's
# operations (the ancestor form, a `form` attribute, the parser's), a
# form's elements kept until an owner changes, `elements`, `form[i]` and
# `form[name]` (past names), `RadioNodeList`, `document.forms` and an
# `HTMLCollection`'s named getter.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it forms"]
timeout = 3000

[[mutant]]
name = "dom: no form seen at a form's making"
file = "crates/dom_next/src/lib.rs"
from = '''            self.form_made();'''
to = '''            let _ = ();'''

[[mutant]]
name = "dom: a cleared owner the same"
file = "crates/dom_next/src/form.rs"
from = '''            (old, form) => old.is_none() && form.is_none(),'''
to = '''            (_, _) => true,'''

[[mutant]]
name = "dom: the old form's elements kept"
file = "crates/dom_next/src/form.rs"
from = '''            self.form_elements_changed(old);'''
to = '''            let _ = old;'''

[[mutant]]
name = "dom: the new form's elements kept"
file = "crates/dom_next/src/form.rs"
from = '''                self.form_elements_changed(form);'''
to = '''                let _ = form;'''

[[mutant]]
name = "dom: past names keep an element gone"
file = "crates/dom_next/src/form.rs"
from = '''            self.forget_past_names(old, element);'''
to = '''            let _ = element;'''

[[mutant]]
name = "dom: an owner never cleared"
file = "crates/dom_next/src/form.rs"
from = '''                    association.owner.set(self.gc, None);'''
to = '''                    let _ = association;'''

[[mutant]]
name = "dom: a reset keeps the parser inserted flag"
file = "crates/dom_next/src/form.rs"
from = '''        self.set_flag(element, PARSER_INSERTED, false);'''
to = '''        let _ = ();'''

[[mutant]]
name = "dom: a form attribute counts out of a document"
