from = '''        if !self.is_connected(element) {
            return None;
        }'''
to = '''        if false {
            return None;
        }'''

[[mutant]]
name = "dom: a form attribute names any element"
file = "crates/dom_next/src/form.rs"
from = '''            .filter(|found| self.is_form(*found));'''
to = '''            .filter(|found| self.kind(*found) == crate::NodeKind::Element);'''

[[mutant]]
name = "dom: a form a form attribute names looks in its subtree"
file = "crates/dom_next/src/form.rs"
from = '''        if let Some(form) = form {
            self.association_or_new(form).outside.set(true);
        }'''
to = '''        if let Some(form) = form {
            let _ = form;
        }'''

[[mutant]]
name = "dom: the ancestor form only the parent"
file = "crates/dom_next/src/form.rs"
from = '''            at = self.parent(node);'''
to = '''            at = None;
            let _ = node;'''

