# Stage 5d-4c: the layout and rendering gaps.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p style_next --test it && cargo test -q -p dom_next --test it && cargo test -q -p layout --test it svg && cargo test -q -p renderer --lib svg && cargo test -q -p net --test it files_and_other_schemes && cargo test -q -p dom_js_next --test it -- wrappers frames:: && cargo test -q -p shell --test it -- images:: style_sheets::a_child_frames_changed_sheets_style_it"]
timeout = 2400

[[mutant]]
name = "style_next: the root's own rem is its last font size"
file = "crates/style_next/src/lib.rs"
from = '''        let rem = if is_root {
            self.initial_font_size
        } else {'''
to = '''        let rem = if is_root {
            self.root_font_size
        } else {'''

[[mutant]]
name = "style_next: the root's pseudo-elements' rem is the last walk's"
file = "crates/style_next/src/lib.rs"
from = '''                root_font_size: if is_root {
                    style.font.size
                } else {'''
to = '''                root_font_size: if is_root {
                    self.root_font_size
                } else {'''

[[mutant]]
name = "dom_next: a document's list gives the roots another document has"
file = "crates/dom_next/src/style.rs"
from = '''            .filter(|root| Gc::ptr_eq(self.document_of(*root), document))'''
to = '''            .filter(|_| true)'''

[[mutant]]
name = "dom_next: an adopted shadow root stays in its old document's list"
file = "crates/dom_next/src/style_sheet.rs"
from = '''            && data.sheets_listed.replace(false)'''
to = '''            && data.sheets_listed.get() && false'''

[[mutant]]
name = "dom_next: a shadow root's adoption steps before its tree is adopted"
file = "crates/dom_next/src/lib.rs"
from = '''                self.adopt_tree(shadow, old, document);
                // In its new document by now.
                self.shadow_root_adopted(shadow, old, document);'''
to = '''                self.shadow_root_adopted(shadow, old, document);
                self.adopt_tree(shadow, old, document);'''

