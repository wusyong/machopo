# Stage 1g-2: the new DOM from JS: dom_next's wrapper edge and driven
# marking, dom_api_next's front end hooks ([NewObject], finish), dom_js_next
# (templates, V8's front end, DOMException, the isolate's DOM), bindings'
# registration with the isolate's state, and dom_js's kunNextDom hook. Run
# with RUSTY_V8_ARCHIVE pointing at ../third_party/rusty_v8_artifacts. Each
# test command in a scope of at most 24 GB (docs/testing.md); the
# baselines take seconds, plus a relink.
timeout = 300

[[mutant]]
name = "a DOM string is never ASCII"
file = "crates/dom_next/src/string.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_next", "--test", "it", "--", "strings"]
from = '''flags: if text.is_ascii() { ASCII } else { 0 },'''
to = '''flags: 0,'''

[[mutant]]
name = "the driven heap's marking never finishes"
file = "crates/dom_next/src/lib.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_js_next"]
from = '''        self.heap.finish_marking();
'''
to = ''''''

[[mutant]]
name = "a new object's wrapper isn't made ahead"
file = "crates/dom_api_next/src/typed.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_api_next"]
from = '''        front.prepare_new_node(I::INDEX);
'''
to = '''        let _ = front;
'''

[[mutant]]
name = "a new object is given as any node"
file = "crates/dom_api_next/src/typed.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_api_next"]
from = '''        front.ret_new_node(cx, value);
'''
to = '''        front.ret_node(cx, value);
'''

[[mutant]]
name = "a getter isn't finished"
file = "crates/dom_api_next/src/declare.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_api_next"]
from = '''                        .map(|value| <$ty as $crate::typed::RetType>::give(front, cx, ::std::convert::Into::into(value)))
                });
                match result {
                    ::std::result::Result::Ok(()) => front.finish(dom),'''
to = '''                        .map(|value| <$ty as $crate::typed::RetType>::give(front, cx, ::std::convert::Into::into(value)))
                });
                match result {
                    ::std::result::Result::Ok(()) => {}'''

[[mutant]]
name = "createElement isn't a new object"
file = "crates/dom_api_next/src/interfaces.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_api_next"]
from = '''-> NewObject<Element> = document::create_element;'''
to = '''-> Element = document::create_element;'''

[[mutant]]
name = "NotFoundError has no legacy code"
file = "crates/dom_api_next/src/exception.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_js_next"]
from = '''        "NotFoundError" => 8,
'''
to = '''        "NotFoundError" => 0,
'''

[[mutant]]
name = "a string result is made in the operation"
file = "crates/dom_js_next/src/front.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_js_next"]
from = '''            None => self.kept = Kept::String(value.clone()),
'''
to = '''            None => {
                if let Some(string) = self.state.strings.get(self.scope, value) {
                    self.rv.set(string.into());
                }
            }
'''

[[mutant]]
name = "a node's new wrapper is made in the operation"
file = "crates/dom_js_next/src/front.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_js_next"]
from = '''            None => self.kept = Kept::Node(cx.root(node), interface_of(cx.kind(node))),
'''
to = '''            None => {
                let wrapper = templates::new_wrapper(self.scope, self.state, interface_of(cx.kind(node)));
                wrap_new(self.scope, cx, wrapper, node);
                self.rv.set(wrapper.into());
            }
'''

