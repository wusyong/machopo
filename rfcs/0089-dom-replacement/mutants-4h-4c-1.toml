[[mutant]]
name = "dom: a table's rows in tree order"
file = "crates/dom_next/src/collection.rs"
from = '''            TABLE_ROWS => {
                self.for_each_table_row(root, found);
                return;
            }'''
to = '''            TABLE_ROWS => {
                let mut found = found;
                let mut at = self.first_child(root);
                while let Some(node) = at {
                    if node.qualified_name() == QualifiedName::html(names::local::TR) && !found(node) {
                        return;
                    }
                    at = self.following_within(node, root);
                }
                return;
            }'''

