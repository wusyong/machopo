# Stage 4h-4c-1: HTML's element interfaces on the new DOM: by their local names, their reflections,
# HTMLElement's global attributes, tables, the document's kept collections.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- html_elements:: wrappers::create_element_foresees_its_wrapper"]
timeout = 1500

