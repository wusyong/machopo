[[mutant]]
name = "style marks: the DOM's parents"
file = "crates/dom_next/src/style.rs"
from = '''        let child_needs = StyleFlags::CHILD_NEEDS_STYLE_RECALC.0 << STYLE_SHIFT;
        let mut at = self.flat_tree_parent(node);
        while let Some(ancestor) = at.filter(|ancestor| ancestor.flags.get() & child_needs == 0) {
            self.set_flags(ancestor, child_needs);
            at = self.flat_tree_parent(ancestor);'''
to = '''        let child_needs = StyleFlags::CHILD_NEEDS_STYLE_RECALC.0 << STYLE_SHIFT;
        let mut at = self.parent(node);
        while let Some(ancestor) = at.filter(|ancestor| ancestor.flags.get() & child_needs == 0) {
            self.set_flags(ancestor, child_needs);
            at = self.parent(ancestor);'''

[[mutant]]
name = "both marks: the DOM's parents"
file = "crates/dom_next/src/style.rs"
from = '''        let mut at = self.flat_tree_parent(node);
        while let Some(ancestor) = at.filter(|ancestor| ancestor.flags.get() & both != both) {
            self.set_flags(ancestor, both);
            at = self.flat_tree_parent(ancestor);'''
to = '''        let mut at = self.parent(node);
        while let Some(ancestor) = at.filter(|ancestor| ancestor.flags.get() & both != both) {
            self.set_flags(ancestor, both);
            at = self.parent(ancestor);'''

