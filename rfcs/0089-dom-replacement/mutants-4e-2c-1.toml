# Stage 4e-2c-1: the flat tree on the new DOM: its walk and parents
# (`dom_next`'s `flat.rs`), the dirty bits up it, the slots' changes
# marking it, the stale assignments worked out before style, and
# `style_next` walking it (the document's sheets not into shadow trees).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it -- shadow slot && cargo test -q -p style_next --test it && cargo test -q -p dom_js_next --test it -- shadow_dom"]
timeout = 3000

