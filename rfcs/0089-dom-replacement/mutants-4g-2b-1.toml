# Stage 4g-2b-1: on the new DOM, ImageData (both constructors), getImageData, putImageData and
# createImageData, gradients, shadows, setTransform's dictionary and getContextAttributes; the
# table's overloads (resolved by count, then by an interface's object), `[EnforceRange] long`,
# typed arrays, dictionary results; the canvas crate's pixel steps.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p canvas && cargo test -q -p dom_js_next --test it canvas && cargo test -q -p dom_js_next --test it wrappers && cargo test -q -p shell --test it next_dom_canvas"]
timeout = 3000

[[mutant]]
name = "declare: a form takes more than it has"
file = "crates/dom_api_next/src/declare.rs"
from = '''forms[form].required() <= count && count <= forms[form].params.len()'''
to = '''forms[form].required() <= count'''

[[mutant]]
name = "declare: extra arguments count"
file = "crates/dom_api_next/src/declare.rs"
from = '''let count = given.min(most);'''
to = '''let count = given;'''

[[mutant]]
name = "declare: no form is an interface's"
file = "crates/dom_api_next/src/declare.rs"
from = '''.find(|&form| interface(form, index).is_some_and(|name| implements(index, name)))'''
to = '''.find(|_| false)'''

