[[mutant]]
name = "an object argument is any wrapper"
file = "crates/dom_js_next/src/front.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_js_next", "--test", "it"]
from = '''        if bindings::is_wrapper::<T>(self.scope, value) {
            return v8::Local::<v8::Object>::try_from(value).ok().map(Some);
        }
        self.throw_type_error(&format!(
            "parameter {} is not of type '{interface}'.",'''
to = '''        if bindings::is_wrapper::<T>(self.scope, value) || value.is_object() {
            return v8::Local::<v8::Object>::try_from(value).ok().map(Some);
        }
        self.throw_type_error(&format!(
            "parameter {} is not of type '{interface}'.",'''

