# Stage 2b-2: listeners and the DOM's dispatch: the new DOM's listeners
# and an event's dispatch state (its path and snapshot reused), gc's
# HeapVector::clear, EventTarget's members and Event's rest, the bindings'
# callbacks (strong references), union, sequence and object arguments and
# results, members calling script (ScriptHost), and bench.py calls' event
# cases.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_next"]
timeout = 900

[[mutant]]
name = "a cleared vector keeps its edges"
file = "crates/gc/src/vector.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "cleared"]
from = '''        for i in 0..self.len() {
            store.write(cx, i, 0);
        }
        self.len.set(0);'''
to = '''        let _ = store;
        self.len.set(0);'''

[[mutant]]
name = "a cleared vector keeps its length"
file = "crates/gc/src/vector.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "cleared"]
from = '''            store.write(cx, i, 0);
        }
        self.len.set(0);'''
to = '''            store.write(cx, i, 0);
        }'''

