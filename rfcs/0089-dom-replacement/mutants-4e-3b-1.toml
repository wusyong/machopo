from = '''        match self.containing_shadow_root(node) {
            Some(root) => self.shadow_sheets_changed(root),
            None => {
                let document = self.document_of(node);'''
to = '''        match None::<NodeRef<'gc>> {
            Some(root) => self.shadow_sheets_changed(root),
            None => {
                let document = self.document_of(node);'''

