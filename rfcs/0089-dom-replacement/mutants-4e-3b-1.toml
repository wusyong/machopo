# Stage 4e-3b-1: shadow trees' own sheets in `style_next`
# (`shadow_sheets.rs`), `:host` and `::slotted()`, the cascade order of
# tree contexts; `dom_next`'s list of shadow roots whose sheets may have
# changed; the renderer's loads of a shadow tree's `<link>`.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next -p style_next && cargo test -q -p shell --test it windowless::a_shadow_trees_link"]
timeout = 3000

[[mutant]]
name = "dom: a shadow tree's sheets the document's"
