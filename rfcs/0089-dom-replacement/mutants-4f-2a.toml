# Stage 4f-2a: on the new DOM, the DOM's activation steps in the
# dispatch, `click()`, an input's type, checkedness and indeterminate,
# radio button groups, a checkbox's and a radio button's activation,
# `input` and `change`, a label clicking its control, a form's buttons'
# activation (doing nothing yet), disabled form controls (what a fieldset
# ancestor says kept), the user's click on one not dispatched.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- activation:: forms:: && cargo test -q -p dom_api_next --test it input::"]
timeout = 3000

