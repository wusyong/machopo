# Stage 1f-2: the new DOM for wasm guests (dom_wasm_next): each store's
# handles to the nodes (its own numbers, the main store's in the node's
# engine word, the others' in shared entries), the typed host functions'
# checks before the operation, the errors' codes; gc's JS edge as the
# embedder's word where no engine drives the heap, dom_next's engine word
# and shared text. The C guest (tests/guests/dom.wasm) is built already.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_wasm_next"]
timeout = 600

[[mutant]]
name = "the embedder's word reads 0"
file = "crates/gc/src/js.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "--", "js::"]
from = '''        self.raw.load(Ordering::Relaxed)'''
to = '''        0'''

[[mutant]]
name = "the embedder's word isn't written"
file = "crates/gc/src/js.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "--", "js::"]
from = '''        self.raw.store(word, Ordering::Relaxed);'''
to = '''        let _ = word;'''

[[mutant]]
name = "a driven heap's JS edge is read as the embedder's"
file = "crates/gc/src/js.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "--", "js::"]
from = '''        assert!(!cx.inner.is_driven(), "a driven heap's JS edge is its engine's");
        self.raw.load(Ordering::Relaxed)'''
to = '''        self.raw.load(Ordering::Relaxed)'''

[[mutant]]
name = "a node's engine word reads 0"
file = "crates/dom_next/src/lib.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_next"]
from = '''        node.into_ref().wrapper.embedder_word(self.gc)'''
to = '''        { let _ = node; 0 }'''

[[mutant]]
name = "a string's shared text is a copy"
file = "crates/dom_next/src/string.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_next"]
from = '''    pub fn shared_text(&self) -> Arc<str> {
        self.text.clone()'''
to = '''    pub fn shared_text(&self) -> Arc<str> {
        Arc::from(&*self.text)'''

