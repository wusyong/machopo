# Stage 4g-1a: on the new DOM, an <img>'s requests (current and pending), the list of
# available images shared by the DOM's documents, load and error, decode(), the
# replaced box, and background images (fetched, drawn once they come, before load).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it images && cargo test -q -p dom_js_next --test it images"]
timeout = 3000

