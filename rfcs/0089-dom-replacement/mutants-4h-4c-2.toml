# Stage 4h-4c-2: the window's named properties object and the document's tables of
# names, `Navigator` and `UserActivation` on the new DOM.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it -- ids:: && cargo test -q -p dom_js_next --test it -- window_named:: navigator::"]
timeout = 1500

[[mutant]]
name = "dom: a connected subtree's names not kept"
file = "crates/dom_next/src/style.rs"
from = '''            if names {
                self.name_added(self.document_of(parent), at);
            }'''
to = '''            let _ = names;'''

[[mutant]]
name = "dom: a removed subtree's names kept"
file = "crates/dom_next/src/style.rs"
from = '''            if names {
                self.name_removed(self.document_of(parent), at);
            }'''
to = '''            let _ = names;'''

