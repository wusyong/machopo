# Stage 4c-3b: scenarios on the new DOM: `dom_api_next`'s `Probe` and
# `document_title`, the renderer's `QueryElement`, `ScrollIntoViewIfNeeded`
# and title for the new DOM, `NextFrameView`'s scroll target, the
# scenario runner's `--next-dom` and `--automation`'s.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it -- webdriver document && cargo test -q -p shell --test it -- windowless:: && cargo test -q -p shell --lib -- windowless && cargo test -q -p shell --bin kun -- next_dom"]
timeout = 3000

[[mutant]]
name = "a probe's rect without a box"
file = "crates/dom_api_next/src/webdriver.rs"
from = '''                    rect: (!rects.is_empty()).then(|| crate::geometry::bounding_rect(&rects)),'''
to = '''                    rect: Some(crate::geometry::bounding_rect(&rects)),'''

[[mutant]]
name = "a probe's text empty"
file = "crates/dom_api_next/src/webdriver.rs"
from = '''                    text: cx.text_content(element).map(|text| text.to_string()).unwrap_or_default(),'''
to = '''                    text: String::new(),'''

