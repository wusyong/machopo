from = '''fn perform_microtask_checkpoint(scope: &mut Scope<'_, '_, '_>) {
    let _entry = bindings::trace::enter_script();'''
to = '''fn perform_microtask_checkpoint(scope: &mut Scope<'_, '_, '_>) {'''

[[mutant]]
name = "binding: a classic script's entry left before its error is reported"
file = "crates/dom_js_next/src/engine.rs"
from = '''        let _entry = bindings::trace::enter_script();
        let ran =
            v8::Script::compile(scope, source, Some(&origin)).and_then(|script| script.run(scope));
        if ran.is_none() {
            report_caught(scope, ReportAt::Global(global));
        }'''
to = '''        let ran = {
            let _entry = bindings::trace::enter_script();
            v8::Script::compile(scope, source, Some(&origin)).and_then(|script| script.run(scope))
        };
        if ran.is_none() {
            report_caught(scope, ReportAt::Global(global));
        }'''

