# Stage 4i-2: new wrappers in their realm, the checkpoint as a callback
# returns, init dictionaries' view and relatedTarget, DOMException's
# structured clone and QuotaExceededError.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it"]
timeout = 1500

[[mutant]]
name = "binding: no checkpoint as a callback returns"
file = "crates/dom_js_next/src/listeners.rs"
from = '''    if !bindings::trace::in_script() {
        perform_microtask_checkpoint(scope);
    }
    result'''
to = '''    result'''

[[mutant]]
name = "binding: a listener's call not counted"
file = "crates/dom_js_next/src/listeners.rs"
from = '''run_callback(self.scope, |scope| call_listener(scope, event, index));'''
to = '''call_listener(self.scope, event, index);'''

[[mutant]]
name = "binding: a timer's call not counted"
file = "crates/dom_js_next/src/listeners.rs"
from = '''run_callback(self.scope, |scope| call_timer(scope, window, timer));'''
to = '''call_timer(self.scope, window, timer);'''

