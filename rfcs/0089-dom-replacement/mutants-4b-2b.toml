# Stage 4b-2b: `KeyboardEvent` (string dictionary members), the keys'
# events at the body (`EventHandler::handle_key`), the renderer handing
# keys to the new DOM, `kun --next-dom` in a window.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it -- input && cargo test -q -p dom_js_next --test it -- ui_events && cargo test -q -p shell --test it -- next_dom && cargo test -q -p shell --bin kun"]
timeout = 3000

[[mutant]]
name = "no keypress"
file = "crates/dom_api_next/src/input.rs"
from = '''        if input.down && not_canceled && input.types_text() {'''
to = '''        if false {'''

[[mutant]]
name = "a canceled keydown types"
file = "crates/dom_api_next/src/input.rs"
from = '''        if input.down && not_canceled && input.types_text() {'''
to = '''        if input.down && input.types_text() {'''

[[mutant]]
name = "a control character types"
file = "crates/dom_api_next/src/input.rs"
from = '''        let printable = self.text == "\r" || !self.text.chars().any(char::is_control);'''
to = '''        let printable = true;'''

[[mutant]]
name = "Enter types nothing"
file = "crates/dom_api_next/src/input.rs"
from = '''        let printable = self.text == "\r" || !self.text.chars().any(char::is_control);'''
to = '''        let printable = !self.text.chars().any(char::is_control);'''

[[mutant]]
name = "Ctrl types"
file = "crates/dom_api_next/src/input.rs"
from = '''        !self.text.is_empty() && printable && !(ctrl && !alt) && !meta'''
to = '''        !self.text.is_empty() && printable && !meta'''

[[mutant]]
name = "AltGr types nothing"
file = "crates/dom_api_next/src/input.rs"
from = '''        !self.text.is_empty() && printable && !(ctrl && !alt) && !meta'''
to = '''        !self.text.is_empty() && printable && !ctrl && !meta'''

[[mutant]]
name = "keypress's codes the key's"
file = "crates/dom_api_next/src/input.rs"
from = '''            let info = KeyboardEventInfo {
                char_code,
                key_code: char_code,
                ..info
            };'''
to = '''            let info = KeyboardEventInfo { char_code, ..info };'''

[[mutant]]
name = "keys at the root"
file = "crates/dom_api_next/src/input.rs"
from = '''        crate::geometry::body(cx, document)
            .or_else(|| crate::geometry::document_element(cx, document))'''
to = '''        crate::geometry::document_element(cx, document)'''

[[mutant]]
name = "every key a keyup"
file = "crates/dom_api_next/src/input.rs"
from = '''        let event_type = if input.down { "keydown" } else { "keyup" };'''
to = '''        let event_type = "keyup";'''

[[mutant]]
name = "a key event not cancelable"
file = "crates/dom_api_next/src/input.rs"
from = '''                bubbles: true,
                cancelable: true,
                composed: true,
                trusted: true,
            },
            window,
        );
        cx.set_keyboard_event_data(event, window, info);'''
to = '''                bubbles: true,
                cancelable: false,
                composed: true,
                trusted: true,
            },
            window,
        );
        cx.set_keyboard_event_data(event, window, info);'''

