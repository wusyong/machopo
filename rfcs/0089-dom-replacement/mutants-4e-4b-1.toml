# Stage 4e-4b-1: custom element reactions on the new DOM: `dom_next`'s
# reaction stack, element and backup queues, `dom_api_next`'s invocation
# and `[CEReactions]` scopes, `dom_js_next`'s microtask.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it custom_elements && cargo test -q -p dom_js_next --test it custom_elements && cargo test -q -p dom_js_next --test it engine::the_parsers"]
timeout = 3000

[[mutant]]
name = "dom: no scope entered"
file = "crates/dom_next/src/reactions.rs"
from = '''        stack.depth.set(stack.depth.get().saturating_add(1));'''
to = ''''''

[[mutant]]
name = "dom: a queue pushed for each reaction"
file = "crates/dom_next/src/reactions.rs"
from = '''        if stack.top.get() != depth {
            queues.push((depth, Persistent::new(self.gc, HeapVector::new(self.gc, 1))));'''
to = '''        if true {
            queues.push((depth, Persistent::new(self.gc, HeapVector::new(self.gc, 1))));'''

[[mutant]]
name = "dom: the outer queue forgotten"
file = "crates/dom_next/src/reactions.rs"
from = '''        stack.top.set(queues.last().map_or(0, |(at, _)| *at));'''
to = '''        stack.top.set(0);'''

[[mutant]]
name = "dom: the backup microtask each time"
file = "crates/dom_next/src/reactions.rs"
from = '''            if !stack.backup_queued.replace(true) {'''
to = '''            if !stack.backup_queued.replace(true) || true {'''

