# Stage 4f-4c-2: on the new DOM, a list box's presses (Shift, Ctrl,
# disabled options), drag and release, keys (Shift, Ctrl and Space), its
# state between events, `:-internal-multi-select-focus`, and its option
# scrolled into view in it.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it controls:: && cargo test -q -p style_next --test it form_states && cargo test -q -p shell --test it browser_view::a_"]
timeout = 3000

