# Stage 4h-5b-1: `performance` on the new DOM: its clock, User Timing, PerformanceObserver,
# Navigation Timing (the window's timing, the document's times marked as its events fire).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- performance:: wrappers::"]
timeout = 1500

[[mutant]]
name = "api: now() not coarsened"
file = "crates/dom_api_next/src/performance.rs"
from = '''    coarsen(cx.now_since(Some(window)))'''
to = '''    cx.now_since(Some(window)) + 0.01'''

