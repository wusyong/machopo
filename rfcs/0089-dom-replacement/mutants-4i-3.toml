# Stage 4i-3: user activation through the frame tree, `focus()` scrolling,
# WebDriver's scroll into view, DevTools' child frames and network
# idleness on the new DOM.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it images:: && cargo test -q -p shell --test it -- navigator:: focus::focusing webdriver:: devtools_lifecycle::the_new_doms devtools_lifecycle::a_navigation_is_told_through_its_lifecycle_on devtools_lifecycle::a_subresource_on_its_way_keeps_the_network_busy_on"]
timeout = 1500

[[mutant]]
name = "api: activation not up the frames"
file = "crates/dom_api_next/src/frame.rs"
