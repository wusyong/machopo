# Stage 4h-5c-1: AbortController and AbortSignal (abort, timeout, any and its weak
# dependents, addEventListener's signal) and Headers on the new DOM.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- abort:: headers:: events:: wrappers:: && cargo test -q -p protocol header_list"]
timeout = 1500

[[mutant]]
name = "api: abort() aborts twice"
file = "crates/dom_api_next/src/abort.rs"
from = '''    let signal = cx.abort_controller_signal(this);
    if cx.abort_signal_aborted(signal) {
        return Ok(None);
    }'''
to = '''    let signal = cx.abort_controller_signal(this);'''

