# Stage 4h-5a: `URL`, `URLSearchParams` and the pair iterator, `crypto`, `structuredClone`,
# `File`, `FileReader`, `ProgressEvent` and blob URLs on the new DOM.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- urls:: files::"]
timeout = 1500

[[mutant]]
name = "api: a URL's base ignored"
file = "crates/dom_api_next/src/url.rs"
from = '''        .base_url(base.as_ref())'''
to = '''        .base_url(None)'''

[[mutant]]
name = "api: setting href leaves the params"
file = "crates/dom_api_next/src/url.rs"
from = '''    cx.with_url(this, |old| *old = url);
    set_list(cx, this, list);'''
to = '''    cx.with_url(this, |old| *old = url);
    let _ = list;'''

[[mutant]]
name = "api: setting search leaves the params"
file = "crates/dom_api_next/src/url.rs"
from = '''        parse_query(value.strip_prefix('?').unwrap_or(value))
    };
    set_list(cx, this, list);'''
to = '''        parse_query(value.strip_prefix('?').unwrap_or(value))
    };
    let _ = list;'''

[[mutant]]
name = "api: the params don't write the query back"
file = "crates/dom_api_next/src/url.rs"
from = '''        cx.with_url(url, |url| url.set_query((!query.is_empty()).then_some(query.as_str())));'''
to = '''        let _ = (url, query);'''

[[mutant]]
name = "api: an empty list leaves an empty query"
