# Stage 4e-2a: slots on the new DOM: `dom_next`'s slot assignment (named
# and manual, the slots' list, lazily worked out), DOM's signal slots and
# the tree and attribute steps that signal them, the flattened
# slottables; `dom_api_next`'s `HTMLSlotElement`, `assignedSlot`, `slot`,
# `slotchange` with the observers' delivery, the dispatch through slots
# and `composedPath()`'s slots in closed trees; the `GcObject` derive's
# parameter names.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it -- slot shadow && cargo test -q -p dom_api_next --test it && cargo test -q -p dom_js_next --test it -- shadow_dom events mutation_observer && cargo test -q -p gc --test it -- fields_may"]
timeout = 3000

