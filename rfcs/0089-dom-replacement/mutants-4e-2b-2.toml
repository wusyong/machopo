# Stage 4e-2b-2: making nodes and documents on the new DOM:
# `createComment`, `createDocumentFragment`,
# `createProcessingInstruction` (its checks), `cloneNode`, `importNode`,
# `adoptNode` (theirs), `DOMImplementation` (the same each time, its
# documents and doctypes).
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_js_next --test it -- documents node_tree"]
timeout = 3000

