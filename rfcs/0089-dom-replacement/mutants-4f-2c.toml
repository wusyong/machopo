# Stage 4f-2c: on the new DOM, HTML's form pseudo-classes matched by
# asking the DOM and noted as their states change (checkedness,
# indeterminate, a radio button's groups, a fieldset's disabling, the
# value, a form's default button), the attributes each reads; the
# style's state bits widened.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p style_next --test it form_states"]
timeout = 3000

[[mutant]]
name = "dom: a text input's checkedness checked"
file = "crates/dom_next/src/form_state.rs"
from = '''        matches!(self.input_kind(element), Some(InputKind::Checkbox | InputKind::Radio)) && self.checkedness(element)'''
to = '''        self.checkedness(element)'''

[[mutant]]
name = "dom: a checkbox never indeterminate"
file = "crates/dom_next/src/form_state.rs"
from = '''            Some(InputKind::Checkbox) => self.indeterminate(element),'''
to = '''            Some(InputKind::Checkbox) => false,'''

[[mutant]]
name = "dom: a checked radio indeterminate"
file = "crates/dom_next/src/form_state.rs"
from = '''            Some(InputKind::Radio) => !self.checkedness(element) && !self.radio_group_has_checked(element),'''
to = '''            Some(InputKind::Radio) => !self.radio_group_has_checked(element),'''

[[mutant]]
name = "dom: a radio's group not looked at"
file = "crates/dom_next/src/form_state.rs"
from = '''            Some(InputKind::Radio) => !self.checkedness(element) && !self.radio_group_has_checked(element),'''
to = '''            Some(InputKind::Radio) => !self.checkedness(element),'''

