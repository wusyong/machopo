from = '''        Some(mode) if mode.eq_ignore_ascii_case("closed") => dom_next::ShadowRootMode::Closed,'''
to = '''        Some(mode) if mode.eq_ignore_ascii_case("closed") => dom_next::ShadowRootMode::Open,'''

