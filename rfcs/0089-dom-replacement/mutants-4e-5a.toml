# Stage 4e-5a: declarative shadow roots on the new DOM: `html`'s sink's
# hooks, `dom_next`'s host check and declarative flag, `dom_api_next`'s
# `attachShadow` taking one over and the template's attributes.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p html --test it next::declarative && cargo test -q -p dom_js_next --test it shadow && cargo test -q -p dom_js_next --test it custom_elements"]
timeout = 3000

[[mutant]]
name = "html: the document parser's not allowed"
file = "crates/html/src/next.rs"
from = '''    fn allow_declarative_shadow_roots(&self, _: &NextHandle) -> bool {
        true
    }'''
to = '''    fn allow_declarative_shadow_roots(&self, _: &NextHandle) -> bool {
        false
    }'''

[[mutant]]
name = "html: a host's second taken"
file = "crates/html/src/next.rs"
from = '''    if cx.kind(host) != NodeKind::Element || cx.is_shadow_host(host) || cx.shadow_host_check(host).is_err() {'''
to = '''    if cx.kind(host) != NodeKind::Element || cx.shadow_host_check(host).is_err() {'''

[[mutant]]
