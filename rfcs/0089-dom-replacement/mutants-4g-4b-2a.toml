# Stage 4g-4b-2a: the mouse and wheels into child frames on the new DOM: the page's
# EventHandler with each frame's mouse state, an input over an iframe passed on to its
# child frame (its point there, the iframe what the parent has it over), a press capturing
# the child frame, the frames left; the renderer's wheel through child frames, the
# compositor's deltas of theirs, points between frames; same_origin; a child's event
# handlers compiled in its realm.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_api_next --test it input && cargo test -q -p renderer --lib next_frame_view && cargo test -q -p dom_js_next --test it frames && cargo test -q -p shell --test it next_dom_intersection"]
timeout = 3000

[[mutant]]
name = "input: a press in a child frame captures nothing"
file = "crates/dom_api_next/src/input.rs"
from = '''                self.subframe = Some(child.clone());'''
to = '''                let _ = child;'''

