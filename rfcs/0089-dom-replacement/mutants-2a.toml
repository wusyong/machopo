# Stage 2a: the node kinds testharness's documents have (doctypes,
# comments, processing instructions, fragments; a document's quirks mode, a
# template's contents, a script's flags) in the new DOM, gc's checked
# downcast of an erased edge, the interfaces of the new kinds, and the
# parser on the new DOM (html::next), checked by the html5lib
# tree-construction tests.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "dom_next"]
timeout = 900

[[mutant]]
name = "an erased edge downcasts to any type"
file = "crates/gc/src/member.rs"
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "cargo", "test", "-q", "-p", "gc", "--test", "it", "downcast"]
from = '''        (index == T::__type().index()).then(|| unsafe { Gc::from_raw(self.as_non_null().cast()) })'''
to = '''        { let _ = index; true }.then(|| unsafe { Gc::from_raw(self.as_non_null().cast()) })'''

[[mutant]]
name = "the kind is two bits"
file = "crates/dom_next/src/lib.rs"
from = '''const KIND_MASK: u16 = 0b111;'''
to = '''const KIND_MASK: u16 = 0b11;'''

