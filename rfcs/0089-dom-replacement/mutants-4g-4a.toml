# Stage 4g-4a: iframes on the new DOM: what happens to them recorded by the DOM (connected,
# disconnected, src and srcdoc), their steps after each call and before the custom element
# reactions (a child browsing context made, navigated, discarded with those below it), the
# frames' realms with security tokens by origin, Window's parent, top, frameElement, length
# and window[i]; the renderer's frame tree laid out at the iframes' content boxes.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p dom_next --test it frames && cargo test -q -p dom_js_next --test it -- frames blobs && cargo test -q -p renderer --lib next_frame_view && cargo test -q -p layout --test it -- next"]
timeout = 3000

[[mutant]]
name = "dom: a removed iframe recorded as inserted"
file = "crates/dom_next/src/frame.rs"
from = '''            FrameOwnerChange::Removed(id)
        });'''
to = '''            FrameOwnerChange::Inserted(id)
        });'''

