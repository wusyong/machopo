# Stage 4h-3b, through the renderer: each frame's update of animations and its events, the pending
# animations started at the commit, frames wanted while they run.
test = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=24G", "-p", "MemorySwapMax=0", "sh", "-c", "cargo test -q -p shell --test it -- next_dom::transitions_and_animations_on_the_new_dom next_dom::animation_events_in_order_each_checkpointed next_dom::an_animations_value_is_rendered"]
timeout = 1800

[[mutant]]
name = "api: events not sorted"
file = "crates/dom_api_next/src/animations.rs"
from = '''        sort_events(cx, document, &mut pending);'''
to = ''''''

[[mutant]]
name = "api: no checkpoint between events"
file = "crates/dom_api_next/src/animations.rs"
from = '''        crate::event_target::dispatch(host, &target, &event);
        host.perform_microtask_checkpoint();'''
to = '''        crate::event_target::dispatch(host, &target, &event);'''

[[mutant]]
name = "api: events not trusted"
file = "crates/dom_api_next/src/animations.rs"
from = '''                        trusted: true,'''
to = '''                        trusted: false,'''

[[mutant]]
name = "api: ::before's events ::after's"
