# Mutation test of stage 1a: the flat tree, the marks across shadow roots
# and for tree scopes' sheets, each tree scope's sheets in style,
# inheritance along the flat tree and `display: contents` (2026-10-14):
# python3 scripts/test.py mutate rfcs/0046-shadow-tree-rendering/mutants-1a.toml
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "shadow::", "invalidation::", "cascade::"]
timeout = 900

# --- dom: the marks ---

[[mutant]]
name = "style marks stop at a shadow root"
file = "crates/dom/src/scope.rs"
from = '''    let mut ancestor = unsafe { parent_or_shadow_host(node) };
    while let Some(node) = ancestor {
        let mut flags = node.style_flags.get();'''
to = '''    let mut ancestor = unsafe { node.parent.get() };
    while let Some(node) = ancestor {
        let mut flags = node.style_flags.get();'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "flat_tree::"]

[[mutant]]
name = "layout marks stop at a shadow root"
file = "crates/dom/src/scope.rs"
from = '''    let mut ancestor = unsafe { parent_or_shadow_host(node) };
    while let Some(node) = ancestor {
        let mut flags = node.layout_tree_flags.get();'''
to = '''    let mut ancestor = unsafe { node.parent.get() };
    while let Some(node) = ancestor {
        let mut flags = node.layout_tree_flags.get();'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "flat_tree::"]

[[mutant]]
name = "style marks stop above a shadow root"
file = "crates/dom/src/scope.rs"
from = '''        node.style_flags.set(flags);
        // SAFETY: as above.
        ancestor = unsafe { parent_or_shadow_host(node) };'''
to = '''        node.style_flags.set(flags);
        // SAFETY: as above.
        ancestor = unsafe { node.parent.get() };'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "flat_tree::"]

[[mutant]]
name = "layout marks stop above a shadow root"
file = "crates/dom/src/scope.rs"
from = '''        node.layout_tree_flags.set(flags);
        // SAFETY: as above.
        ancestor = unsafe { parent_or_shadow_host(node) };'''
to = '''        node.layout_tree_flags.set(flags);
        // SAFETY: as above.
        ancestor = unsafe { node.parent.get() };'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "flat_tree::"]

[[mutant]]
name = "the style phase's layout marks stop above a shadow root"
file = "crates/dom/src/scope.rs"
from = '''            ancestor = node.parent_or_shadow_host();'''
to = '''            ancestor = node.parent();'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "flat_tree::"]

[[mutant]]
name = "a shadow root isn't a tree scope"
