from = '''            adopters.insert(self, node.persistent());'''
to = '''            let _ = adopters;'''

[[mutant]]
name = "adopting marks the document, not the shadow root"
file = "crates/dom/src/css_style_sheet.rs"
from = '''            adopters.insert(self, node.persistent());
        }
        self.set_style_sheets_changed(node);'''
to = '''            adopters.insert(self, node.persistent());
        }
        let document = self.document_of(node);
        self.set_style_sheets_changed(&document);'''

# --- dom: the flat tree ---

[[mutant]]
name = "a host's flat children are its own"
file = "crates/dom/src/slot.rs"
from = '''        if let Some(root) = node.shadow_root() {
            return FlatTreeChildren::Dom(root.children());'''
to = '''        if let Some(root) = node.shadow_root().filter(|_| false) {
            return FlatTreeChildren::Dom(root.children());'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "flat_tree::"]

[[mutant]]
