                        let room = target - guesses[PERCENT];'''
to = '''                    } else if false {
                        let room = target - guesses[PERCENT];'''

[[mutant]]
name = "auto columns grow evenly"
file = "crates/layout/src/table.rs"
from = '''                            + share(room, column.max - column.min, increases[MAX], auto_count)'''
to = '''                            + share(room, 1.0, auto_count as f32, auto_count)'''

[[mutant]]
name = "past the maxima, auto columns don't grow"
file = "crates/layout/src/table.rs"
from = '''                            column.max + share(room, column.max, auto_max, auto_count)'''
to = '''                            column.max'''

[[mutant]]
name = "past the maxima, fixed columns don't grow"
file = "crates/layout/src/table.rs"
from = '''                            column.max + share(room, column.max, fixed_max, fixed_count)'''
to = '''                            column.max'''

[[mutant]]
name = "past the maxima, percentage columns don't grow"
file = "crates/layout/src/table.rs"
from = '''                        column.percent_width(target)
                            + share(
                                room,
                                column.percent.unwrap_or(0.0),
                                total_percent,
                                percent_count,
                            )'''
to = '''                        column.percent_width(target)'''

[[mutant]]
name = "an auto table takes no width for its percentages"
file = "crates/layout/src/table.rs"
from = '''        max = percent_estimate.max(others).min(LIMIT);'''
to = '''        max += 0.0 * percent_estimate.max(others).min(LIMIT);'''

[[mutant]]
name = "a merged column has spacing"
file = "crates/layout/src/table.rs"
from = '''            if column.mergeable || (shrink_collapsed && column.collapsed) {
                return (end, 0.0);
            }'''
to = '''            if shrink_collapsed && column.collapsed {
                return (end, 0.0);
            }'''

[[mutant]]
name = "a merged column counts for the spacing"
