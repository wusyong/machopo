# Mutation test of stage 1b-1: the fixup, the column sizing, the rows, the
# cells' alignment, captions and baselines (2026-10-15):
# python3 scripts/test.py mutate rfcs/0047-tables/mutants-1b-1.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "tables::", "generated::"]
timeout = 900

# --- the fixup ---

[[mutant]]
name = "white space in a table makes a cell"
file = "crates/layout/src/table.rs"
from = '''        if run.iter().all(is_space_text) {
            run.clear();
            return;
        }'''
to = '''        if false {
            run.clear();
            return;
        }'''

[[mutant]]
name = "an out-of-flow box among cells goes into a cell"
file = "crates/layout/src/table.rs"
from = '''                Child::Inline(InlineItem::OutOfFlow(id, _)) if run.iter().all(is_space_text) => {'''
to = '''                Child::Inline(InlineItem::OutOfFlow(id, _)) if false => {'''

[[mutant]]
name = "a part in an inline element is the row's"
file = "crates/layout/src/table.rs"
from = '''                        Child::Inline(InlineItem::Open(..)) => depth += 1,'''
to = '''                        Child::Inline(InlineItem::Open(..)) => {}'''

[[mutant]]
name = "a table's anonymous child is a row"
file = "crates/layout/src/table.rs"
from = '''            Some(TablePart::Table) => TableDisplay::RowGroup,'''
to = '''            Some(TablePart::Table) => TableDisplay::Row,'''

[[mutant]]
name = "white space between misparented cells splits them"
file = "crates/layout/src/table.rs"
from = '''            if misparented(self, &child) || (space && !group.is_empty()) {'''
to = '''            if misparented(self, &child) || (space && group.is_empty()) {'''

[[mutant]]
name = "cells in an inline element make a block table"
file = "crates/layout/src/table.rs"
from = '''            Some(style) => (style.clone(), Display::InlineTable),'''
to = '''            Some(style) => (style.clone(), Display::Table(TableDisplay::Table)),'''

[[mutant]]
name = "the white space after misparented parts is dropped"
file = "crates/layout/src/table.rs"
from = '''        out.extend(after);'''
to = '''        drop(after);'''

[[mutant]]
name = "a rowspan of 0 is 1"
file = "crates/layout/src/table.rs"
from = '''                                    0 => left,'''
to = '''                                    0 => 1,'''

[[mutant]]
name = "no header group first"
file = "crates/layout/src/table.rs"
from = '''            sections.insert(0, header);'''
to = '''            sections.push(header);'''

[[mutant]]
name = "a cell spanning rows doesn't take its slots"
file = "crates/layout/src/table.rs"
from = '''                                    *t = (*t).max(rowspan);'''
to = '''                                    *t = (*t).max(1);'''

[[mutant]]
name = "blockified table parts stay table parts"
file = "crates/computed_style/src/lib.rs"
from = '''            Self::Table(_) => Self::Block,'''
to = '''            Self::Table(_) => self,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "computed::table_displays"]

# --- the columns ---

[[mutant]]
name = "no min-width on a cell"
file = "crates/layout/src/table.rs"
from = '''        let mut min = min_content.max(min_width.unwrap_or(0.0));'''
to = '''        let mut min = min_content;'''

[[mutant]]
name = "no max-width on a cell"
file = "crates/layout/src/table.rs"
from = '''            max = max.min(max_width);
            min = min.min(max_width);'''
to = '''            max = max.min(max_width + 1000.0);
            min = min.min(max_width + 1000.0);'''

[[mutant]]
name = "a cell's width isn't the column's maximum"
file = "crates/layout/src/table.rs"
from = '''        let mut max = width.unwrap_or(max_content);'''
to = '''        let mut max = max_content;'''

[[mutant]]
name = "a fixed column grows with content"
file = "crates/layout/src/table.rs"
from = '''                (true, false) => {}'''
to = '''                (true, false) => self.max = self.max.max(cell.max),'''

[[mutant]]
name = "percentages aren't held to 100"
file = "crates/layout/src/table.rs"
from = '''                let percent = percent.min(100.0 - total).max(0.0);'''
to = '''                let percent = percent.max(0.0);'''

[[mutant]]
name = "a spanning cell's width isn't spread"
