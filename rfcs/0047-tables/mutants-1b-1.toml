# --- the table's width and height ---

[[mutant]]
name = "a caption doesn't widen its table"
file = "crates/layout/src/table.rs"
from = '''        let table_min = (grid_min + spacing_x + inset_x).max(caption_min);'''
to = '''        let table_min = grid_min + spacing_x + inset_x;'''

[[mutant]]
name = "an auto table fills the room"
file = "crates/layout/src/table.rs"
from = '''(room + inset_x).max(0.0).min(table_max)'''
to = '''(room + inset_x).max(0.0)'''

[[mutant]]
name = "a table is narrower than its content"
file = "crates/layout/src/table.rs"
from = '''                min_width.map_or(width, |min| width.max(min)).max(table_min)'''
to = '''                min_width.map_or(width, |min| width.max(min))'''

[[mutant]]
name = "no min-width on a table"
file = "crates/layout/src/table.rs"
from = '''                min_width.map_or(width, |min| width.max(min)).max(table_min)'''
to = '''                width.max(table_min)'''

[[mutant]]
name = "a table's height is its content's"
file = "crates/layout/src/table.rs"
from = '''                        y += css_height
                            .unwrap_or(0.0)'''
to = '''                        y += 0.0f32'''

[[mutant]]
name = "an empty table's margins collapse through it"
file = "crates/layout/src/table.rs"
from = '''        output.margins_can_collapse_through = false;'''
to = '''        let _ = 0;'''

[[mutant]]
name = "a table isn't a table to taffy"
file = "crates/layout/src/lib.rs"
from = '''            taffy_style.item_is_table = true;'''
to = '''            taffy_style.item_is_table = false;'''

