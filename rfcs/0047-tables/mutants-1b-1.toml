from = '''        column.min = column.min.max(width);
    }'''
to = '''        column.min = column.min.max(0.0 * width);
    }'''

[[mutant]]
name = "the percentage guess is the minimum's"
file = "crates/layout/src/table.rs"
from = '''                Some(PERCENT) => {
                    if percent {'''
to = '''                Some(PERCENT) => {
                    if false {'''

[[mutant]]
name = "the fixed guess gives fixed columns their minimum"
file = "crates/layout/src/table.rs"
