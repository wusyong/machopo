# Mutation test of stage 2c: the main thread's scheduler, the widget in the
# frame, the page drawn while script is paused, and DevTools' paused
# message:
# python3 scripts/test.py mutate rfcs/0091-devtools-elements/mutants-2c.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools_overlay"]
timeout = 600

# The scheduler.

[[mutant]]
name = "the latest task comes first"
file = "crates/renderer/src/task_queue.rs"
from = '''            .min_by_key(|&(sequence, _)| sequence)'''
to = '''            .max_by_key(|&(sequence, _)| sequence)'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "--", "task_queue"]

[[mutant]]
name = "script paused takes input too"
file = "crates/renderer/src/task_queue.rs"
from = '''        (1 << TaskQueue::DevTools as u8) | (1 << TaskQueue::Rendering as u8),'''
to = '''        (1 << TaskQueue::DevTools as u8) | (1 << TaskQueue::Rendering as u8) | (1 << TaskQueue::Input as u8),'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "--", "task_queue"]

[[mutant]]
name = "a frame asked for is the browser's like any message"
file = "crates/renderer/src/task_queue.rs"
from = '''            msg @ RendererMsg::RequestVisualState { .. } => {
                return scheduler.post(TaskQueue::Rendering, MainThreadTask::Browser(msg), false);
            }'''
to = ''''''

[[mutant]]
name = "what a pause leaves goes back last"
file = "crates/renderer/src/task_queue.rs"
from = '''                devtools.push_front(Queued {
                    sequence: 0,'''
to = '''                devtools.push_back(Queued {
                    sequence: u64::MAX,'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "--", "task_queue"]

[[mutant]]
name = "the scheduler takes tasks after the main thread has gone"
file = "crates/renderer/src/task_queue.rs"
from = '''        state.closed = true;'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "--", "task_queue"]

[[mutant]]
name = "a wait with a timeout waits for ever"
file = "crates/renderer/src/task_queue.rs"
from = '''                    if left.is_zero() {
                        return None;
                    }'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "--", "task_queue"]

