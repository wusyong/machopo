                once: flags.once,'''
to = '''                passive: false,
                once: flags.once,'''

[[mutant]]
name = "a window's listeners aren't listed"
file = "crates/dom_js/src/devtools_page.rs"
from = '''        if let Some(window) = no_gc.unwrap::<Window>(cx.gc, object) {
            return vec![(cx.root_target(TargetRef::Window(window)), None)];
