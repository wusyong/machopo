# The search.

[[mutant]]
name = "the search has no selectors"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''        if let Some(selector) = style::SelectorQuery::parse(query) {'''
to = '''        if let Some(selector) = style::SelectorQuery::parse(query).filter(|_| false) {'''

[[mutant]]
name = "the search finds no text"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''                        .is_some_and(|data| data.to_str().to_lowercase().contains(&lower))'''
to = '''                        .is_some_and(|data| data.to_str().contains(query))'''

[[mutant]]
name = "a whole tag's name is a part"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''                (true, true) => name == tag,'''
to = '''                (true, true) => name.contains(&tag),'''

[[mutant]]
name = "a quoted value is a part"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''            if exact { text == value } else { text.contains(&value) }'''
to = '''            text.contains(&value)'''

[[mutant]]
name = "an attribute's name isn't searched"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''                                .contains(&lower)
                                || value_matches(&attribute.value.to_str())'''
to = '''                                .contains("\\u{0}")
                                || value_matches(&attribute.value.to_str())'''

[[mutant]]
name = "a search result's range isn't checked"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''                if to > found.len() || from >= to {'''
to = '''                if from >= to {'''

[[mutant]]
name = "a search isn't discarded"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''                self.session.searches.remove(id);'''
to = ''''''
