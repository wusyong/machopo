file = "crates/dom_js/src/devtools_page.rs"
from = '''    let key = v8::String::new(tc, "handleEvent")?;'''
to = '''    let key = v8::String::new(tc, "handle")?;'''

[[mutant]]
name = "a listener has no node"
file = "crates/dom_js/src/devtools_page.rs"
from = '''        if let Some(backend) = self.backend {
            built["backendNodeId"] = backend.into();
        }'''
to = ''''''

[[mutant]]
name = "a listener's handlers aren't wrapped"
file = "crates/dom_js/src/devtools_page.rs"
from = '''        if !group.is_empty() {
            let v8_scope = scope.scope();'''
to = '''        if group.is_empty() {
            let v8_scope = scope.scope();'''

[[mutant]]
name = "the nodes below aren't listed"
file = "crates/dom_js/src/devtools_page.rs"
