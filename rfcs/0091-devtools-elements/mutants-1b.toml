# Mutation test of stage 1b: nodes and script's objects (`resolveNode`,
# `requestNode`, `$0`, the console's names of nodes), the listeners, and
# the search:
# python3 scripts/test.py mutate rfcs/0091-devtools-elements/mutants-1b.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools_dom"]
timeout = 600

# The console's names of nodes.

[[mutant]]
name = "a node has no subtype"
file = "crates/bindings/src/devtools.rs"
from = '''        let subtype = (self.subtypes.borrow().as_ref()?)(scope, value)?;
        Some(StringBuffer::create(StringView::from(subtype.subtype.as_bytes())))'''
to = '''        let _ = (self.subtypes.borrow().as_ref()?)(scope, value)?;
        None'''

[[mutant]]
name = "an element's description has no id"
file = "crates/dom_js/src/devtools_page.rs"
from = '''                        description.push('#');'''
to = '''                        description.push(' ');'''

[[mutant]]
name = "an element's description has no classes"
file = "crates/dom_js/src/devtools_page.rs"
from = '''                        description.push('.');
                        description.push_str(class);'''
to = ''''''

[[mutant]]
name = "a doctype is described by its name"
file = "crates/dom_js/src/devtools_page.rs"
from = '''            NodeKind::DocumentType => format!("<!DOCTYPE {}>", cx.node_name(node).to_str()),'''
to = '''            NodeKind::DocumentType => cx.node_name(node).to_str().into_owned(),'''

# Nodes and their objects.

[[mutant]]
name = "an object of no node is a node"
file = "crates/dom_js/src/devtools_page.rs"
from = '''        let object = v8::Local::<v8::Object>::try_from(value).map_err(|_| not_a_node())?;'''
to = '''        let object = v8::Local::<v8::Object>::try_from(value).map_err(|_| "no".to_owned())?;'''

[[mutant]]
name = "requestNode sends no path"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''                Ok(json!({ "nodeId": self.push_path(node, document, events) }))
            }
            "performSearch" => {'''
to = '''                let _ = (node, document);
                Ok(json!({ "nodeId": 0 }))
            }
            "performSearch" => {'''

[[mutant]]
name = "describeNode doesn't take an object"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''            "DOM.describeNode" | "DOM.getOuterHTML"
                if params.get("nodeId").is_none()'''
to = '''            "DOM.getOuterHTML"
                if params.get("nodeId").is_none()'''

[[mutant]]
name = "resolveNode takes no backend id"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''            (None, Some(backend)) => u32::try_from(backend).ok().map(NodeId::from_raw),'''
to = '''            (None, Some(_)) => None,'''

[[mutant]]
name = "resolveNode of a node gone"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''        node.filter(|node| dom.read(|cx| cx.node_by_id(*node).is_some()))
            .ok_or_else(|| "No node with given id found".to_owned())'''
to = '''        node.ok_or_else(|| "No node with given id found".to_owned())'''

[[mutant]]
name = "$0 isn't set"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''                page.objects().inspect_node(name, node);'''
to = ''''''

[[mutant]]
name = "$0 is undefined"
file = "crates/dom_js/src/devtools_page.rs"
from = '''            Some(wrapper) => v8::Local::new(scope, wrapper).into(),'''
to = '''            Some(_) => v8::undefined(scope).into(),'''

[[mutant]]
name = "a detached subtree isn't kept"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''            self.session.kept.push(self.cx.root(root));'''
to = ''''''

[[mutant]]
name = "a detached subtree's root isn't sent"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''            events.push(("DOM.setChildNodes", json!({ "parentId": 0, "nodes": [built] })));'''
to = '''            let _ = built;'''

[[mutant]]
name = "the layout isn't put back"
file = "crates/dom_js/src/devtools_page.rs"
from = '''impl Drop for Page<'_> {
    fn drop(&mut self) {
        if self.taken'''
to = '''impl Drop for Page<'_> {
    fn drop(&mut self) {
        if false && self.taken'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools"]

# The listeners.

[[mutant]]
name = "capturing listeners don't come first"
file = "crates/dom_js/src/devtools_page.rs"
from = '''            listeners.into_iter().partition(|listener| listener.capture);'''
to = '''            listeners.into_iter().partition(|_| true);'''

[[mutant]]
name = "listeners aren't grouped by type"
file = "crates/dom_js/src/devtools_page.rs"
from = '''        for (_, flags, handler) in found.iter().filter(|(at, ..)| *at == event_type) {'''
to = '''        for (_, flags, handler) in found.iter().filter(|_| true) {'''

[[mutant]]
name = "a content attribute's handler isn't compiled"
file = "crates/dom_js/src/devtools_page.rs"
from = '''        crate::handlers::compile_event_handler(scope, target, event_type);'''
to = '''        let _ = event_type;'''

[[mutant]]
