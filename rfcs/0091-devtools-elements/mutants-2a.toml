# Mutation test of stage 2a: the box model and the node at a point, and the
# overlay (its highlight, its drawing, the inspect mode):
# python3 scripts/test.py mutate rfcs/0091-devtools-elements/mutants-2a.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools_overlay"]
timeout = 600

# The box model (`layout`, `FrameView`).

[[mutant]]
name = "a box's margin isn't outside its border"
file = "crates/layout/src/geometry.rs"
from = '''            -margins.left,
            -margins.top,'''
to = '''            0.0,
            0.0,'''

[[mutant]]
name = "a box's padding box is its border box"
file = "crates/layout/src/geometry.rs"
from = '''        let padding = contract(border, &fragment.border);'''
to = '''        let padding = border;'''

[[mutant]]
name = "an inline box's padding isn't inside its border"
file = "crates/layout/src/geometry.rs"
from = '''    let padding = contract(border, &border_sides);'''
to = '''    let padding = border;'''

[[mutant]]
name = "an inline box's margin box is its padding box"
file = "crates/layout/src/geometry.rs"
from = '''        margin: quad(border, &identity),
    })'''
to = '''        margin: quad(padding, &identity),
    })'''

[[mutant]]
name = "a border quad isn't transformed"
file = "crates/layout/src/geometry.rs"
from = '''            quads.push(quad(border, to_root));'''
to = '''            quads.push(quad(border, &Transform::IDENTITY));'''

[[mutant]]
name = "a fixed box is scrolled"
file = "crates/renderer/src/frame_view.rs"
from = '''    fn viewport_origin_of(&self, fragment: &layout::BoxFragment, element: NodeId) -> PointF {
        if layout::is_fixed(fragment, element) {'''
to = '''    fn viewport_origin_of(&self, fragment: &layout::BoxFragment, element: NodeId) -> PointF {
        if false && layout::is_fixed(fragment, element) {'''

[[mutant]]
name = "a box that just fits scrolls"
file = "crates/renderer/src/frame_view.rs"
from = '''        block.scroll_size.width > width || block.scroll_size.height > height'''
to = '''        block.scroll_size.width >= width || block.scroll_size.height >= height'''

[[mutant]]
name = "an iframe's quads stay in its viewport"
file = "crates/renderer/src/frame_view.rs"
from = '''            self.view.point_from_frame(document, a)?,'''
to = '''            a,'''

[[mutant]]
name = "the box model's size is the content box's"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''        let size = frame.view.view_of(document)?.element_box(node)?.border_box;'''
to = '''        let size = frame.view.view_of(document)?.element_box(node)?.border_box.inset(5.0);'''

[[mutant]]
name = "the node at a point isn't scrolled to"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''            gfx::PointF::new(point.x - scroll.x, point.y - scroll.y)'''
to = '''            gfx::PointF::new(point.x, point.y + 0.0 * scroll.y)'''

[[mutant]]
name = "a point outside the viewport is hit"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''        if !((0.0..viewport.width).contains(&point.x) && (0.0..viewport.height).contains(&point.y)) {'''
to = '''        if false {'''

[[mutant]]
name = "a user-agent shadow tree's node isn't its host"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''        while !user_agent && let Some(root) = cx.containing_shadow_root(node) {'''
to = '''        while false && let Some(root) = cx.containing_shadow_root(node) {'''

[[mutant]]
name = "a node scrollable isn't told"
file = "crates/renderer/src/render_thread/dom_agent.rs"
from = '''            value["isScrollable"] = true.into();'''
to = ''''''

