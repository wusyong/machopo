# Mutation test of stage 3d: `CSS.forcePseudoState` (`dom`'s forced
# pseudo-classes, the matcher's look at them in `style`, the `CSS` agent):
# python3 scripts/test.py mutate rfcs/0091-devtools-elements/mutants-3d.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools_css::forced"]
timeout = 600

[[mutant]]
name = "matching doesn't look at the forced"
file = "crates/style/src/selector.rs"
from = '''        if let Some(forced) = self.cx.forced_pseudo_class(self.node, pc) {
            return forced;
        }'''
to = ''''''

[[mutant]]
name = "the forced looked at before the dependency is kept"
file = "crates/style/src/selector.rs"
from = '''        let state = crate::invalidation::pseudo_class_state(pc);
        if state != 0 {
            self.cx.add_state_dependencies(self.node, state);
        }
        // DevTools' (`CSS.forcePseudoState`): a flag's read while none is
        // forced, after the dependency is kept, so that its change
        // restyles what it matched.
        if let Some(forced) = self.cx.forced_pseudo_class(self.node, pc) {
            return forced;
        }'''
to = '''        if let Some(forced) = self.cx.forced_pseudo_class(self.node, pc) {
            return forced;
        }
        let state = crate::invalidation::pseudo_class_state(pc);
        if state != 0 {
            self.cx.add_state_dependencies(self.node, state);
        }'''

