# `bench.py speedometer --sample` on Windows: samply through ETW, its times
# from the kernel ETL's start, the `perf` profile's exe naming its PDB,
# Windows's DLLs named after through `samply load`, and the sampling as
# Administrator in one copy of the script (`scripts/bench/common.py`,
# `scripts/bench/speedometer/speedometer.py`).
#   python3 scripts/test.py mutate rfcs/0066-windows-sampling/mutants-3.toml
test = ["python3", "scripts/bench/speedometer/speedometer_test.py", "SampleReadingTests", "WindowsNamesTests",
        "ElevatedTests", "CompareTests"]
timeout = 180

[[mutant]]
name = "no way on Windows"
file = "scripts/bench/common.py"
from = '''    if sys.platform == "win32":
        return WINDOWS_SAMPLING'''
to = '''    if False:
        return WINDOWS_SAMPLING'''

[[mutant]]
name = "perf on Windows"
file = "scripts/bench/common.py"
from = '''    return samply_sampler(samples) if sys.platform in ("darwin", "win32") else perf_sampler(samples)'''
to = '''    return samply_sampler(samples) if sys.platform == "darwin" else perf_sampler(samples)'''

[[mutant]]
name = "no V8 provider"
