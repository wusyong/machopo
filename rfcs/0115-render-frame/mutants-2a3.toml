# Stage 2a-3's mutants: `python3 scripts/test.py mutate rfcs/0115-render-frame/mutants-2a3.toml`.
# `automation_pipe::a_client_not_reading_doesnt_hold_machopo_up` is left out as well: it timed out once
# under load in 2a-3, and loads no page (progress's 2a-3).
test = ["sh", "-c", "cargo test -q -p dom --test it scripts && cargo test -q -p browser --test it navigation:: && cargo test -q -p renderer && cargo test -q -p shell --test it -- --skip webdriver::a_session_with_a_hung_page_ends_in_time --skip automation_pipe::a_client_not_reading_doesnt_hold_machopo_up"]
timeout = 120

