# Stage 1a's mutants: `python3 scripts/test.py mutate rfcs/0115-render-frame/mutants-1a.toml`.
test = ["sh", "-c", "cargo test -q -p renderer && cargo test -q -p shell --test it -- --skip webdriver::a_session_with_a_hung_page_ends_in_time"]
timeout = 900

[[mutant]]
name = "the frames of the document before stay as the top-level frame commits"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''    pub(super) fn commit_top(&mut self, top: FrameId, document: FrameDocument) {
        self.frames.clear();'''
to = '''    pub(super) fn commit_top(&mut self, top: FrameId, document: FrameDocument) {'''

[[mutant]]
name = "the documents leave out the top-level frame's"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''        self.top_document()
            .into_iter()
            .chain(self.child_documents())'''
to = '''        None.into_iter()
            .chain(self.child_documents())'''

[[mutant]]
name = "the documents leave out the children's"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''        self.top_document()
            .into_iter()
            .chain(self.child_documents())'''
to = '''        self.top_document()
            .into_iter()
            .chain(self.child_documents().filter(|_| false))'''

[[mutant]]
name = "the children's documents take in the top-level frame's"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''            .filter(move |(frame, _)| Some(**frame) != top)
            .filter_map(|(_, next)| next.document.as_ref())'''
to = '''            .filter(move |(frame, _)| Some(**frame) != top || true)
            .filter_map(|(_, next)| next.document.as_ref())'''

[[mutant]]
name = "the ids leave out the children"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''        self.top
            .into_iter()
            .chain(self.children())
            .collect()'''
to = '''        self.top.into_iter().collect()'''

[[mutant]]
name = "the children take in the top-level frame"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''            .copied()
            .filter(move |frame| Some(*frame) != self.top)'''
to = '''            .copied()'''

[[mutant]]
name = "a frame gone stays"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''        self.frames.retain(|frame, _| !gone.contains(frame));'''
to = '''        let _ = gone;'''

[[mutant]]
name = "the frames stay as the engine is replaced"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''    pub(super) fn clear(&mut self) {
        self.frames.clear();'''
to = '''    pub(super) fn clear(&mut self) {'''

[[mutant]]
name = "the top-level frame is none"
file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''    pub(super) fn top(&self) -> Option<FrameId> {
        self.top
    }'''
to = '''    pub(super) fn top(&self) -> Option<FrameId> {
        None
    }'''
