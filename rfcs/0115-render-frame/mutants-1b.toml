file = "crates/renderer/src/render_thread/render_frame.rs"
from = '''    pub(super) fn navigation_sent(&mut self, frame: FrameId, request: NavigationRequest) {
        self.navigating(frame);'''
to = '''    pub(super) fn navigation_sent(&mut self, frame: FrameId, request: NavigationRequest) {'''

