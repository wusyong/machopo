[[mutant]]
name = "a document's frame is never found"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let frame = self.engine.as_mut()?.frame_of_document(document)?;'''
to = '''        let frame = self.engine.as_mut()?.frame_of_document(document).filter(|_| false)?;'''

[[mutant]]
name = "dom_js finds no document's frame"
file = "crates/dom_js/src/engine.rs"
from = '''            .of_document(document)
            .map(|frame| frame.id)
    }'''
to = '''            .of_document(document)
            .map(|frame| frame.id)
            .filter(|_| false)
    }'''

[[mutant]]
name = "only the top-level frame's scripts are retried"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let documents: Vec<(FrameId, NodeRoot)> = self
            .frames_with_documents()
            .into_iter()'''
to = '''        let documents: Vec<(FrameId, NodeRoot)> = self
            .frames_with_documents()
            .into_iter()
            .take(1)'''

[[mutant]]
name = "only the top-level frame's network is watched"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let roots: Vec<(FrameId, NodeRoot)> = self
            .frames_with_documents()
            .into_iter()'''
to = '''        let roots: Vec<(FrameId, NodeRoot)> = self
