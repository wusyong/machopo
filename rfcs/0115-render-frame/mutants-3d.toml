# Stage 3d's mutants (the engine's frames the one list; the renderer's table what it keeps of them): `python3 scripts/test.py mutate rfcs/0115-render-frame/mutants-3d.toml`.
# `automation_pipe::a_client_not_reading_doesnt_hold_machopo_up` is left out as in 2a-3 (its cause: progress's "第 3 段做完時").
test = ["sh", "-c", "cargo test -q -p dom_js --test it && cargo test -q -p renderer && cargo test -q -p browser --test it && cargo test -q -p shell --test it -- --skip webdriver::a_session_with_a_hung_page_ends_in_time --skip automation_pipe::a_client_not_reading_doesnt_hold_machopo_up"]
timeout = 240

[[mutant]]
name = "a gone frame's document is still read"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let Some((_, owner)) = self.child_parent(frame) else {
            return false;
        };
        if self.render_frames.contains(frame) {
            return true;
        }'''
to = '''        if self.render_frames.contains(frame) {
            return true;
        }
        let Some((_, owner)) = self.child_parent(frame) else {
            return false;
        };'''

[[mutant]]
name = "a new frame's initial document isn't kept"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        if self.render_frames.contains(frame) {
            return true;
        }
        let Some((dom, view)) = engine_frame(&mut self.engine) else {'''
to = '''        if self.render_frames.contains(frame) {
            return true;
        }
        let _ = &owner;
        if true {
            return false;
        }
        let Some((dom, view)) = engine_frame(&mut self.engine) else {'''

[[mutant]]
name = "a new frame's document isn't the initial one"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        initial.initial = true;
        self.render_frames.set_child_document(frame, initial);
        true'''
to = '''        self.render_frames.set_child_document(frame, initial);
        true'''

[[mutant]]
name = "a gone frame's data isn't let go of"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        self.render_frames.remove(&gone);
        // Their iframes'''
to = '''        let _ = gone;
        // Their iframes'''

