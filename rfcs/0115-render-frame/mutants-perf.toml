# What runs after every task walks no frame tree (the Speedometer regression found as the RFC ended): `python3 scripts/test.py mutate rfcs/0115-render-frame/mutants-perf.toml`.
test = ["sh", "-c", "cargo test -q -p dom_js --test it && cargo test -q -p renderer && cargo test -q -p shell --test it -- --skip webdriver::a_session_with_a_hung_page_ends_in_time"]
timeout = 240

[[mutant]]
name = "a DOM task looks for its parser walking the frame tree"
file = "crates/dom_api/src/document_loader.rs"
from = '''    let parser = engine.frames().into_iter().find(|&frame| {'''
to = '''    let parser = engine.frames_in_tree_order().into_iter().find(|&frame| {'''

[[mutant]]
name = "dom_js's frame list walks the frame tree"
file = "crates/dom_js/src/engine.rs"
from = '''    fn frames(&mut self) -> Vec<dom_api::FrameId> {
        self.state().frames.ids()
    }'''
to = '''    fn frames(&mut self) -> Vec<dom_api::FrameId> {
        let mut frames = self.frames_in_tree_order();
        frames.sort_unstable();
        frames
    }'''

[[mutant]]
name = "the loads are finished walking the frame tree"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let mut frames = engine.frames();
        frames.reverse();'''
to = '''        let mut frames = engine.frames_in_tree_order();
        frames.reverse();'''

[[mutant]]
name = "the frames with documents are found walking the frame tree"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''            .map(|engine| engine.frames())
            .unwrap_or_default();
        frames.retain'''
to = '''            .map(|engine| engine.frames_in_tree_order())
            .unwrap_or_default();
        frames.retain'''
