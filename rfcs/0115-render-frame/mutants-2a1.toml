# Stage 2a-1's mutants: `python3 scripts/test.py mutate rfcs/0115-render-frame/mutants-2a1.toml`.
test = ["sh", "-c", "cargo test -q -p dom_api --lib && cargo test -q -p renderer && cargo test -q -p shell --test it -- --skip webdriver::a_session_with_a_hung_page_ends_in_time"]
timeout = 120

[[mutant]]
name = "the body's text isn't kept"
file = "crates/dom_api/src/document_loader.rs"
from = '''        self.text.push_str(&text);'''
to = '''        let _ = &self.text;'''

[[mutant]]
name = "the body's markup isn't given to the parser's input"
file = "crates/dom_api/src/document_loader.rs"
from = '''        self.input.push(markup);'''
to = '''        let _ = markup;'''

[[mutant]]
name = "the parser is given nothing"
file = "crates/dom_api/src/document_loader.rs"
from = '''        self.input.give(max, |text| parser.push(text))'''
to = '''        self.input.give(max, |_| ())'''

[[mutant]]
name = "there is never input left"
file = "crates/dom_api/src/document_loader.rs"
from = '''        !self.input.is_empty()'''
to = '''        false'''

[[mutant]]
name = "a srcdoc document is parsed as any other"
file = "crates/dom_api/src/document_loader.rs"
from = '''        let parser = if srcdoc {'''
to = '''        let parser = if srcdoc && false {'''

[[mutant]]
name = "the parser isn't put back after a run"
file = "crates/dom_api/src/document_loader.rs"
from = '''    if let Some(loader) = engine.document_loader(frame) {
        loader.parser = Some(parser);
    }'''
to = '''    drop(parser);'''

[[mutant]]
name = "the parser is never finished"
file = "crates/dom_api/src/document_loader.rs"
from = '''        Some(parser) => parser.finish(engine),'''
to = '''        Some(parser) => {
            drop(parser);
            engine
        }'''

[[mutant]]
name = "DevTools reads the source only once the body has all come"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let loading = self.doc(frame).is_some_and(|next| next.body.is_some());'''
to = '''        let loading = self.doc(frame).is_some_and(|next| next.body.is_some()) && false;'''

[[mutant]]
name = "a pipe over before ends the body again"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''                BodyRead::Ended => break,'''
to = '''                BodyRead::Ended => {
                    self.body_data(frame, &[], true);
                    break;
                }'''

[[mutant]]
name = "a document committed isn't parsing"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''            || (self.parsing && !self.body_parsed)'''
to = '''            || (false && !self.body_parsed)'''
