# Stage 3a's mutants (the navigations booked on the engine's frame): `python3 scripts/test.py mutate rfcs/0115-render-frame/mutants-3a.toml`.
# `automation_pipe::a_client_not_reading_doesnt_hold_machopo_up` is left out as in 2a-3 (progress's 2a-3).
# 240 s: a mutant of `dom_js` rebuilds it and relinks every test binary after it (about 140 s of the run).
test = ["sh", "-c", "cargo test -q -p dom_api --test it && cargo test -q -p dom_js --test it && cargo test -q -p dom_wasm --test it && cargo test -q -p renderer && cargo test -q -p browser --test it navigation:: && cargo test -q -p shell --test it -- --skip webdriver::a_session_with_a_hung_page_ends_in_time --skip automation_pipe::a_client_not_reading_doesnt_hold_machopo_up"]
timeout = 240

[[mutant]]
name = "an iframe's navigation isn't booked"
file = "crates/dom_js/src/frames.rs"
from = '''            found.navigation = request;'''
to = '''            found.navigation = request.filter(|_| false);'''

[[mutant]]
name = "script's navigation isn't booked"
file = "crates/dom_js/src/frames.rs"
from = '''            found.navigation = Some(request);'''
to = '''            found.navigation = Some(request).filter(|_| false);'''

[[mutant]]
name = "a new document drops its frame's navigation"
file = "crates/dom_js/src/frames.rs"
from = '''                frame.navigation = old.navigation.take();'''
to = '''                frame.navigation = old.navigation.take().filter(|_| false);'''

