# Stage 3c's mutants (the frames read between tasks are the engine's; the frames followed after the task alone): `python3 scripts/test.py mutate rfcs/0115-render-frame/mutants-3c.toml`.
# `automation_pipe::a_client_not_reading_doesnt_hold_machopo_up` is left out as in 2a-3 (progress's 2a-3).
test = ["sh", "-c", "cargo test -q -p renderer && cargo test -q -p browser --test it && cargo test -q -p shell --test it -- --skip webdriver::a_session_with_a_hung_page_ends_in_time --skip automation_pipe::a_client_not_reading_doesnt_hold_machopo_up"]
timeout = 240

[[mutant]]
name = "the frames aren't followed after a task"
file = "crates/renderer/src/render_thread.rs"
from = '''        self.handle_popup_requests();
        self.handle_frame_requests();
        self.start_image_fetches();'''
to = '''        self.handle_popup_requests();
        self.start_image_fetches();'''

[[mutant]]
name = "a parent's load is finished before its children's"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let mut frames = engine.frames_in_tree_order();
        frames.reverse();'''
to = '''        let frames = engine.frames_in_tree_order();'''

[[mutant]]
name = "only the top-level frame's load is finished"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let mut frames = engine.frames_in_tree_order();'''
to = '''        let mut frames: Vec<_> = engine.frames_in_tree_order().into_iter().take(1).collect();'''

[[mutant]]
name = "a child frame's document is never the engine's"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let (_, owner) = self.child_parent(frame)?;
        let engine = self.engine.as_mut()?;'''
to = '''        let (_, owner) = self.child_parent(frame).filter(|_| false)?;
        let engine = self.engine.as_mut()?;'''

[[mutant]]
name = "a child frame's blocked rendering doesn't hold its intersections"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''                blocked.push(document);'''
to = '''                let _ = document;'''
