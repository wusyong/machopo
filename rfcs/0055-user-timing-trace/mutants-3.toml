            slices.setdefault('''

[[mutant]]
name = "Chrome doesn't record User Timing"
file = "scripts/speedometer.py"
from = '''CHROME_TRACE_CATEGORIES = ("toplevel", "blink", "v8", "cc", "viz", "benchmark", "loading", "devtools.timeline",
                           USER_TIMING)'''
to = '''CHROME_TRACE_CATEGORIES = ("toplevel", "blink", "v8", "cc", "viz", "benchmark", "loading", "devtools.timeline")'''

[[mutant]]
name = "the report doesn't tell what found the windows"
file = "scripts/speedometer.py"
from = '''        lines += ["", f"## {name}", "", f"{totals_text(by_event)} The windows by {found_by}."]'''
to = '''        lines += ["", f"## {name}", "", totals_text(by_event)]'''

[[mutant]]
name = "compare.md takes either side's for both"
file = "scripts/speedometer.py"
from = '''                found_by[side].add(found)'''
to = '''                found_by["current"].add(found)'''

