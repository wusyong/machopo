file = "crates/dom_api/src/text_control_tree.rs"
from = '''                    crate::input::strip_newlines(&text)'''
to = '''                    text'''

[[mutant]]
name = "the placeholder always shows"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''            let display = if value.is_empty() {'''
to = '''            let display = if true {'''

[[mutant]]
name = "the placeholder stays without the attribute"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''        (None, Some(holder)) => m.remove(&holder),'''
to = '''        (None, Some(_)) => {}'''

[[mutant]]
name = "the placeholder's text isn't synced"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''                && old_text.as_deref() != Some(placeholder.as_str())'''
to = '''                && old_text.is_none()'''

[[mutant]]
name = "the trees aren't kept up to date"
file = "crates/dom_api/src/form_states.rs"
from = '''        crate::text_control_tree::update(m, element, false);'''
to = ''''''

[[mutant]]
name = "a text field's value wraps"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''"display: block; white-space: pre; overflow-wrap: normal; overflow: hidden; text-overflow: inherit"'''
to = '''"display: block; overflow-wrap: normal; overflow: hidden; text-overflow: inherit"'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "form_controls::"]

[[mutant]]
name = "a text field's value isn't clipped"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''"display: block; white-space: pre; overflow-wrap: normal; overflow: hidden; text-overflow: inherit"'''
to = '''"display: block; white-space: pre; overflow-wrap: normal; text-overflow: inherit"'''
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "form_controls::"]

[[mutant]]
name = "a UA shadow root is open"
file = "crates/dom/src/node.rs"
from = '''        self != Self::Open'''
to = '''        self == Self::Closed'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "flat_tree::a_user_agent"]

