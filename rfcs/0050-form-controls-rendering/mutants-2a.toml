# 2a: a text control's UA shadow tree (`dom_api`'s `text_control_tree`, the
# UA mode in `dom`), `::placeholder` (`css`, `style`), the value laid out in
# the control's size (`layout`), `-webkit-text-security`, and what reads
# them (`getComputedStyle`, the mouse's focus).
#   python3 scripts/test.py mutate rfcs/0050-form-controls-rendering/mutants-2a.toml
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "forms::a_text_control"]
timeout = 900

[[mutant]]
name = "a password field has no tree"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''        "text" | "url" | "tel" | "email" | "password" => Tree::Field(None),'''
to = '''        "text" | "url" | "tel" | "email" => Tree::Field(None),'''

[[mutant]]
name = "a control in no browsing context gets a tree"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''        let shown = always || {'''
to = '''        let shown = true || {'''

[[mutant]]
name = "a control that isn't a text field keeps its tree"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''    for child in stale.iter().flatten() {
        m.remove(child);
    }'''
to = ''''''

[[mutant]]
name = "the value isn't synced"
file = "crates/dom_api/src/text_control_tree.rs"
from = '''    if text.0 != value {'''
to = '''    if text.0.is_empty() && false {'''

[[mutant]]
