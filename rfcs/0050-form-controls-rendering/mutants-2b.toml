from = '''input:enabled:read-write:is(:focus, :hover)::-webkit-inner-spin-button,'''
to = '''input:enabled:is(:focus, :hover)::-webkit-inner-spin-button,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "form_controls::"]

[[mutant]]
