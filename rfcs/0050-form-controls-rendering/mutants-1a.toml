[[mutant]]
name = "a system font isn't a font"
file = "crates/css/src/properties.rs"
from = '''    if let Ok(system) = input.try_parse(crate::font::parse_system_font) {
        return Ok(vec![Value::SystemFont(system); 5]);
    }'''
to = ''''''

[[mutant]]
name = "the menu's font is the default size"
file = "crates/css/src/font.rs"
from = '''            Self::Menu | Self::SmallCaption | Self::StatusBar => 12.0,'''
to = '''            Self::Menu | Self::SmallCaption | Self::StatusBar => 16.0,'''

[[mutant]]
name = "a system font inherits the weight"
file = "crates/css/src/properties.rs"
from = '''        (FontWeight, Value::SystemFont(_)) => style.font_weight = 400.0,'''
to = '''        (FontWeight, Value::SystemFont(_)) => style.font_weight = parent.font_weight,'''

[[mutant]]
name = "a system font inherits the line height"
file = "crates/css/src/properties.rs"
from = '''            style.line_height = computed_style::LineHeight::Normal
        }'''
to = '''            style.line_height = parent.line_height
        }'''

[[mutant]]
name = "a longhand of a system font reads back as it"
file = "crates/css/src/serialize.rs"
from = '''        Value::SystemFont(_) => {}'''
to = '''        Value::SystemFont(system) => dest.push_str(system.name()),'''

[[mutant]]
name = "a system font reads back as font though a longhand changed"
file = "crates/css/src/serialize.rs"
from = '''            .all(|(value, _)| **value == Value::SystemFont(system))'''
to = '''            .any(|(value, _)| **value == Value::SystemFont(system))'''

[[mutant]]
name = "an input's type is read as written"
file = "crates/style/src/theme.rs"
from = '''            let ty = ty.as_deref().map(str::to_ascii_lowercase);'''
to = '''            let ty = ty.as_deref().map(str::to_owned);'''

