[[mutant]]
name = "base-select reads back as auto"
file = "crates/css/src/serialize.rs"
from = '''        BaseSelect => "base-select",'''
to = '''        BaseSelect => "auto",'''

[[mutant]]
name = "getComputedStyle reads appearance as none"
