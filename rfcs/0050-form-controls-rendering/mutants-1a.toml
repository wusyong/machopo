# 1a: system colors, `appearance`, system fonts, the UA stylesheet's form
# control rules and the native look `appearance` comes to.
#   python3 scripts/test.py mutate rfcs/0050-form-controls-rendering/mutants-1a.toml
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "form_controls::", "cascade::", "cssom::"]
timeout = 900

[[mutant]]
name = "system colors don't parse"
file = "crates/css/src/values.rs"
from = '''            if let Some(system) = SystemColor::from_name(&name) {
                return Ok(SpecifiedColor::System(system));
            }'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "css", "--lib", "values::"]

[[mutant]]
name = "a system color computes to the defaults whatever the platform's"
file = "crates/css/src/values.rs"
from = '''            Self::System(system) => StyleColor::Rgba(system.color(cx.system_colors)),'''
to = '''            Self::System(system) => StyleColor::Rgba(system.color(&gfx::SystemColors::DEFAULT)),'''

[[mutant]]
name = "a system color reads back as its color"
file = "crates/css/src/values.rs"
from = '''            Self::System(system) => dest.push_str(system.name()),'''
to = '''            Self::System(system) => write_rgba(dest, system.color(&gfx::SystemColors::DEFAULT)),'''

[[mutant]]
name = "the deprecated borders take the button's text color"
file = "crates/css/src/values.rs"
from = '''            | ThreeDLightShadow | ThreeDShadow | WindowFrame => colors.button_border,'''
to = '''            | ThreeDLightShadow | ThreeDShadow | WindowFrame => colors.button_text,'''
test = ["cargo", "test", "-q", "-p", "css", "--lib", "values::"]

[[mutant]]
name = "a page sees the platform's accent color"
file = "crates/css/src/values.rs"
from = '''            AccentColor => Color::from_hex(0x0075ff),'''
to = '''            AccentColor => colors.highlight,'''
test = ["cargo", "test", "-q", "-p", "css", "--lib", "values::"]

[[mutant]]
name = "the inactive caption's text is the platform's gray text"
file = "crates/css/src/values.rs"
from = '''            InactiveCaptionText => Color::from_hex(0x808080),'''
to = '''            InactiveCaptionText => colors.gray_text,'''
test = ["cargo", "test", "-q", "-p", "css", "--lib", "values::"]

[[mutant]]
name = "a canvas's system color is the default"
file = "crates/css/src/canvas.rs"
from = '''        SpecifiedColor::System(system) => CanvasColor::Color(system.color(system_colors)),'''
to = '''        SpecifiedColor::System(system) => CanvasColor::Color(system.color(&gfx::SystemColors::DEFAULT)),'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "canvas_styles::system_colors"]

[[mutant]]
name = "a canvas's currentcolor takes the default system colors"
file = "crates/css/src/canvas.rs"
from = '''    match parse_canvas_color(&declared, system_colors) {'''
to = '''    match parse_canvas_color(&declared, &gfx::SystemColors::DEFAULT) {'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "canvas_styles::system_colors"]

[[mutant]]
name = "a canvas's system colors aren't the frame's"
file = "crates/dom_api/src/frame.rs"
from = '''        .map_or(gfx::SystemColors::DEFAULT, |frame| frame.system_colors())'''
to = '''        .map_or(gfx::SystemColors::DEFAULT, |_| gfx::SystemColors::DEFAULT)'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "canvas_styles::system_colors"]

[[mutant]]
name = "the engine's system colors aren't used"
file = "crates/style/src/lib.rs"
from = '''            system_colors: self.system_colors.get(),'''
to = '''            system_colors: gfx::SystemColors::DEFAULT,'''

[[mutant]]
name = "a frame's style engine doesn't get the renderer's system colors"
file = "crates/renderer/src/frame_view.rs"
from = '''        style_engine.set_system_colors(requests.settings.system_colors);'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "it", "the_renderer_has_the_browsers_system_colors"]

[[mutant]]
name = "the renderer's flags' system colors aren't its frames'"
file = "crates/renderer/src/render_thread.rs"
from = '''                system_colors: flags.system_colors,'''
to = '''                system_colors: gfx::SystemColors::DEFAULT,'''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "it", "the_renderer_has_the_browsers_system_colors"]

[[mutant]]
name = "a frame tells script the default system colors"
file = "crates/renderer/src/frame_view.rs"
from = '''    fn system_colors(&self) -> gfx::SystemColors {
        self.settings.system_colors
    }'''
to = '''    fn system_colors(&self) -> gfx::SystemColors {
        gfx::SystemColors::DEFAULT
    }'''
test = ["cargo", "test", "-q", "-p", "browser", "--test", "it", "the_renderer_has_the_browsers_system_colors"]

[[mutant]]
name = "a window with the test fonts gets the platform's colors"
file = "crates/shell/src/system_colors.rs"
from = '''    if test_fonts {
        SystemColors::DEFAULT
    } else {
        platform()
    }'''
to = '''    let _ = test_fonts;
    platform()'''
test = ["cargo", "test", "-q", "-p", "shell", "--lib", "system_colors"]

[[mutant]]
name = "the button border is the registry's default"
file = "crates/shell/src/system_colors.rs"
from = '''            button_border: button_text,'''
to = '''            button_border: defaults.button_border,'''
test = ["cargo", "test", "-q", "-p", "shell", "--lib", "system_colors"]

[[mutant]]
name = "visited links aren't the hot tracking color"
file = "crates/shell/src/system_colors.rs"
from = '''            visited_text: hotlight,'''
to = '''            visited_text: defaults.visited_text,'''
test = ["cargo", "test", "-q", "-p", "shell", "--lib", "system_colors"]

[[mutant]]
name = "a registry color with a fourth number parses"
file = "crates/shell/src/system_colors.rs"
from = '''        channels.next().is_none().then_some(Color::rgb(r, g, b))'''
to = '''        Some(Color::rgb(r, g, b))'''
test = ["cargo", "test", "-q", "-p", "shell", "--lib", "system_colors"]

[[mutant]]
