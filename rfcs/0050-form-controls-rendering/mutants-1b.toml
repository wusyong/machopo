# 1b: form controls' sizes and baselines (`layout`'s `control`, text
# metrics), check boxes' and radio buttons' theme size and the replaced
# elements' `display` (`style`'s `theme`), a button's content centered, and
# the attributes that build a control's box again (`dom`). What 1c changed of
# the theme's `display` and of the button layout is mutants-1c.toml's.
#   python3 scripts/test.py mutate rfcs/0050-form-controls-rendering/mutants-1b.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "form_controls::", "update::form_controls"]
timeout = 900

[[mutant]]
name = "a check box is 12px"
file = "crates/style/src/theme.rs"
from = '''    const TOGGLE_SIZE: f32 = 13.0;'''
to = '''    const TOGGLE_SIZE: f32 = 12.0;'''

[[mutant]]
name = "a check box's width is 13px though given"
