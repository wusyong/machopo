# Stage 3's mutants (Windows: sunaba's starting a process in its sandbox, ipc's spawn through it, the renderer's sandbox in shell): `python scripts/test.py mutate rfcs/0117-renderer-sandbox/mutants-3.toml`, on Windows.
test = ["cmd", "/c", "cargo test -q -p sunaba && cargo test -q -p shell --lib && cargo test -q -p shell --test it -- renderer_process:: renderer_sandbox_windows:: trace::"]
timeout = 900

