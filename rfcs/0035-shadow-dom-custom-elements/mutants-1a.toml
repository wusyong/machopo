[[mutant]]
name = "a shadow root's markup is parsed with it as the context"
file = "crates/dom_api/src/markup.rs"
from = '''    if node.shadow_root_init().is_none() {
        return node.clone();
    }'''
to = '''    if true {
        return node.clone();
    }'''

