from = '''        crate::names::NameContext::Element,
    )?;
    Ok(crate::custom_elements::create_element(cx, &doc(this), name))'''
to = '''        crate::names::NameContext::Element,
    )?;
    Ok(cx.mutate().create_element(&doc(this), name, Vec::new()))'''

