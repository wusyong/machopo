        let registry = self.window_custom_elements_if_made(&window)?;'''
to = '''        let window = self.document_realm_window(document)?;
        let registry = self.window_custom_elements_if_made(&window)?;'''

[[mutant]]
name = "createElement never constructs"
file = "crates/dom_api/src/document.rs"
