to = '''                NodeKind::Element if false => {'''

[[mutant]]
name = "definitions looked up in any namespace"
file = "crates/dom/src/custom_element.rs"
from = '''        if name.namespace.url() != crate::node::Namespace::HTML {
            return None;
        }
        let window = self.document_window(document)?;'''
to = '''        let window = self.document_window(document)?;'''

[[mutant]]
name = "definitions looked up for a document without a window"
