# Mutation test of step 2b (making a defined element: `new X()`,
# `createElement` and `createElementNS`):
# python3 scripts/test.py mutate rfcs/0035-shadow-dom-custom-elements/mutants-2b.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "custom_elements::"]
timeout = 600

# dom: an element's custom element state and definition.

[[mutant]]
name = "a valid custom element name starts uncustomized"
file = "crates/dom/src/scope.rs"
from = '''        {
            crate::custom_element::CustomElementState::Undefined
        } else {'''
to = '''        {
            crate::custom_element::CustomElementState::Uncustomized
        } else {'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "any namespace's custom element name starts undefined"
file = "crates/dom/src/scope.rs"
from = '''        let custom = if name.namespace.url() == crate::node::Namespace::HTML
            && crate::custom_element::is_valid_custom_element_name(&name.local)'''
to = '''        let custom = if crate::custom_element::is_valid_custom_element_name(&name.local)'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "a custom element name may be reserved"
file = "crates/dom/src/custom_element.rs"
from = '''        && !RESERVED_CUSTOM_ELEMENT_NAMES.contains(&name)'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "the state never set"
file = "crates/dom/src/custom_element.rs"
from = '''            *custom = state;'''
to = '''            let _ = (custom, state);'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "an element's definition never set"
file = "crates/dom/src/custom_element.rs"
from = '''                rare.custom_element_definition
                    .set(self, definition.0.persistent());'''
to = '''                let _ = (rare, definition);'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "an element's definition never emptied"
file = "crates/dom/src/custom_element.rs"
from = '''                    rare.custom_element_definition.clear(self);'''
to = '''                    let _ = rare;'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "a failed element not made unknown"
file = "crates/dom/src/scope.rs"
from = '''            self.create_element_of(document, QualName::html(local_name), Vec::new(), true);'''
to = '''            self.create_element_of(document, QualName::html(local_name), Vec::new(), false);'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "a failed element not failed"
file = "crates/dom/src/scope.rs"
from = '''        self.set_custom_element_state(&element, crate::CustomElementState::Failed);'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "a window's registry never found without making it"
file = "crates/dom/src/custom_element.rs"
from = '''        Some(CustomElementRegistryHandle::new(&registry, self.roots))
    }'''
to = '''        let _ = registry;
        None
    }'''

# dom_api: the interface of a failed element, and "create an element".

[[mutant]]
