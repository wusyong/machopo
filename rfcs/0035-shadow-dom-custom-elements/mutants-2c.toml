[[mutant]]
name = "a shadow tree walked after the children"
file = "crates/dom/src/scope.rs"
from = '''        // As `record_frame_owners`: children last first, a shadow root
        // after them.
        // SAFETY: per the caller.
        let mut child = unsafe { node.last_child.get() };
        while let Some(c) = child {
            stack.push(c);
            // SAFETY: as above.
            child = unsafe { c.previous_sibling.get() };
        }
        // SAFETY: as above; the node keeps its rare data, which keeps its
        // shadow root.
        if let Some(rare) = unsafe { node.rare_data.get() } {
            // SAFETY: as above.
            if let Some(shadow) = unsafe { rare.shadow_root.get() } {
                stack.push(shadow);
            }
        }'''
to = '''        if let Some(rare) = unsafe { node.rare_data.get() } {
            if let Some(shadow) = unsafe { rare.shadow_root.get() } {
                stack.push(shadow);
            }
        }
        let mut child = unsafe { node.last_child.get() };
        while let Some(c) = child {
            stack.push(c);
            child = unsafe { c.previous_sibling.get() };
        }'''

