[[mutant]]
name = "a tree's callbacks for elements that aren't custom"
file = "crates/dom/src/custom_element.rs"
from = '''    pub(crate) fn custom_elements_in(&self, node: &Node) -> Vec<NodeHandle> {
        self.elements_in(node, &[CustomElementState::Custom])'''
to = '''    pub(crate) fn custom_elements_in(&self, node: &Node) -> Vec<NodeHandle> {
        self.elements_in(
            node,
            &[
                CustomElementState::Custom,
                CustomElementState::Failed,
                CustomElementState::Undefined,
                CustomElementState::Precustomized,
                CustomElementState::Uncustomized,
            ],
        )'''

