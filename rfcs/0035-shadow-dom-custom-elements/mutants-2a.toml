# Mutation test of step 2a (the registry, definitions, `define`, `get`,
# `getName`, `whenDefined`):
# python3 scripts/test.py mutate rfcs/0035-shadow-dom-custom-elements/mutants-2a.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "custom_elements::"]
timeout = 600

# dom: the registry and its definitions.

[[mutant]]
name = "the window doesn't keep its registry"
file = "crates/dom/src/custom_element.rs"
from = '''        window
            .object()
            .custom_elements
            .set(self, registry.persistent());'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "the registry doesn't keep its window"
file = "crates/dom/src/custom_element.rs"
from = '''        registry.object().window.set(self, window.persistent());'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "a definition doesn't link to the earlier ones"
file = "crates/dom/src/custom_element.rs"
from = '''        object.next.set_from(self, &registry.first);'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "the registry doesn't keep a new definition"
file = "crates/dom/src/custom_element.rs"
from = '''        registry.first.set(self, definition.0.persistent());'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "the disconnected callback in the adopted slot"
file = "crates/dom/src/custom_element.rs"
from = '''            object.disconnected.set(self, init.disconnected.as_ref());'''
to = '''            object.disconnected.set(self, init.adopted.as_ref());'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "no attributeChangedCallback kept"
file = "crates/dom/src/custom_element.rs"
from = '''                .set(self, init.attribute_changed.as_ref());'''
to = '''                .set(self, None);'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "connected read from the disconnected slot"
file = "crates/dom/src/custom_element.rs"
from = '''            LifecycleCallback::Connected => &object.connected,'''
to = '''            LifecycleCallback::Connected => &object.disconnected,'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "disable shadow from disable internals"
file = "crates/dom/src/custom_element.rs"
from = '''                    disable_shadow: init.disable_shadow,'''
to = '''                    disable_shadow: init.disable_internals,'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "no observed attributes kept"
file = "crates/dom/src/custom_element.rs"
from = '''                    observed_attributes: init.observed_attributes,'''
to = '''                    observed_attributes: Vec::new(),'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "a definition found by its local name"
file = "crates/dom/src/custom_element.rs"
from = '''            .find(|definition| definition.name() == name)'''
to = '''            .find(|definition| definition.local_name() == name)'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "the running flag never set"
file = "crates/dom/src/custom_element.rs"
from = '''        self.own(registry).running.set(running);'''
to = '''        self.own(registry).running.set(false);'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = "a when-defined promise not taken out"
file = "crates/dom/src/custom_element.rs"
from = '''        Some(map.remove(index).1)'''
to = '''        Some(map[index].1)'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

