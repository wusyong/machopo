from = '''        .map(|definition| DomString::from(definition.name())))'''
to = '''        .and(None))'''

[[mutant]]
name = "whenDefined takes any name"
file = "crates/dom_api/src/custom_elements.rs"
from = '''    let name = name.as_str();
    if !crate::html_element::is_valid_custom_element_name(name) {
        return Err(DomException::new(
            ExceptionName::SyntaxError,
            format!("whenDefined: '''
to = '''    let name = name.as_str();
    if false {
        return Err(DomException::new(
            ExceptionName::SyntaxError,
            format!("whenDefined: '''

[[mutant]]
name = "whenDefined of a defined name never resolves"
