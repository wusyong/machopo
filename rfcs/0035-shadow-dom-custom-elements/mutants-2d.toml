# dom_api: upgrading.

[[mutant]]
name = "an upgrade reaction does nothing"
file = "crates/dom_api/src/custom_elements.rs"
from = '''                    upgrade(cx, &element, &definition);
                    continue;'''
to = '''                    let _ = definition;
                    continue;'''

[[mutant]]
name = "an upgraded element not custom"
file = "crates/dom_api/src/custom_elements.rs"
from = '''            cx.mutate()
                .set_custom_element_state(element, CustomElementState::Custom);
            return;'''
to = '''            return;'''

[[mutant]]
name = "a failed upgrade keeps its reactions"
file = "crates/dom_api/src/custom_elements.rs"
from = '''    m.clear_custom_element_reactions(element);'''
to = ''''''

[[mutant]]
name = "what an upgrade's constructor threw not reported"
file = "crates/dom_api/src/custom_elements.rs"
from = '''        CallError::Thrown(thrown) => cx.report_exception(&constructor, thrown),'''
to = '''        CallError::Thrown(_) => {}'''

