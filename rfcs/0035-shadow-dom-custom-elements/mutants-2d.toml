# Mutation test of step 2d (upgrades, the construction stack, `failed`,
# `:defined`):
# python3 scripts/test.py mutate rfcs/0035-shadow-dom-custom-elements/mutants-2d.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "custom_elements::"]
timeout = 600

# dom: `:defined`.

[[mutant]]
name = "an uncustomized element not :defined when made"
file = "crates/dom/src/scope.rs"
from = '''                state: if custom == crate::custom_element::CustomElementState::Uncustomized {'''
to = '''                state: if false {'''

[[mutant]]
name = "only custom elements :defined"
file = "crates/dom/src/custom_element.rs"
from = '''            CustomElementState::Uncustomized | CustomElementState::Custom
        );'''
to = '''            CustomElementState::Custom
        );'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "custom_elements::"]

[[mutant]]
name = ":defined never changes"
file = "crates/dom/src/custom_element.rs"
from = '''        crate::scope::update_element_state(node, |current| {'''
to = '''        let _ = defined;
        #[allow(unreachable_code)]
        if true { return; }
        crate::scope::update_element_state(node, |current| {'''

[[mutant]]
name = "the :defined pseudo-class matches nothing"
file = "crates/style/src/selector.rs"
from = '''            Self::Defined => ElementState::DEFINED,'''
to = '''            Self::Defined => ElementState::NONE,'''

