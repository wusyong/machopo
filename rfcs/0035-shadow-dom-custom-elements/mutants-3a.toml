# Mutation test of step 3a (named slot assignment, `HTMLSlotElement`,
# `assignedSlot`, `Element.slot`):
# python3 scripts/test.py mutate rfcs/0035-shadow-dom-custom-elements/mutants-3a.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "slots::"]
timeout = 600

# dom: the assignment.

[[mutant]]
name = "a slot of any namespace"
file = "crates/dom/src/slot.rs"
from = '''        self.element_name().is_some_and(|name| name.is_html("slot"))'''
to = '''        self.element_name().is_some_and(|name| &*name.local == "slot")'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "slots::"]

[[mutant]]
name = "a comment a slottable"
file = "crates/dom/src/slot.rs"
from = '''        matches!(self.kind(), NodeKind::Element | NodeKind::Text)'''
to = '''        matches!(self.kind(), NodeKind::Element | NodeKind::Text | NodeKind::Comment)'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "slots::"]

[[mutant]]
name = "a slot outside a shadow tree assigned"
file = "crates/dom/src/slot.rs"
from = '''        let root = node.root();
        if !root.is_shadow_root() {
            return Vec::new();
        }'''
to = '''        let root = node.root();'''

[[mutant]]
name = "the assignment never computed again"
file = "crates/dom/src/slot.rs"
from = '''            .is_some_and(|assignment| assignment.version == self.dom_tree_version);'''
to = '''            .is_some();'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "slots::"]

[[mutant]]
name = "the last slot of a name"
file = "crates/dom/src/slot.rs"
from = '''                    slots.iter_mut().find(|(slot_name, ..)| *slot_name == name)'''
to = '''                    slots.iter_mut().rev().find(|(slot_name, ..)| *slot_name == name)'''

[[mutant]]
name = "the slots out of tree order"
