# Stage 1's mutants: `python3 scripts/test.py mutate rfcs/0111-measuring-across-processes/mutants-1.toml`.
test = ["python3", "scripts/bench/speedometer/speedometer_test.py", "RendererTraceTests"]
timeout = 600

[[mutant]]
name = "getProcessInfo lists no renderer"
file = "crates/shell/src/automation_session.rs"
from = '''                    .filter_map(|contents| contents.renderer_pid())'''
to = '''                    .filter_map(|contents| contents.renderer_pid().filter(|_| false))'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "automation_pipe::the_process_info"]

[[mutant]]
name = "getProcessInfo calls a renderer the browser"
file = "crates/shell/src/automation_session.rs"
from = '''                        .map(|pid| json!({ "type": "renderer", "id": pid })),'''
to = '''                        .map(|pid| json!({ "type": "browser", "id": pid })),'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "automation_pipe::the_process_info"]

[[mutant]]
name = "getProcessInfo lists the browser's process twice"
file = "crates/shell/src/automation_session.rs"
from = '''                .chain(
                    renderers'''
to = '''                .chain(std::iter::once(json!({ "type": "browser", "id": std::process::id() })))
                .chain(
                    renderers'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "automation_pipe::the_process_info"]

