[[mutant]]
name = "census reads any file beside a page's"
file = "scripts/bench/census/census.py"
from = '''                  if path.suffix == ".tsv" or (path.suffix[1:].isdigit() and path.stem.endswith(".tsv")))'''
to = '''                  if path.suffix == ".tsv" or path.stem.endswith(".tsv"))'''
test = ["python3", "scripts/bench/census/census_test.py"]

[[mutant]]
name = "census takes a renderer process that wrote nothing"
file = "scripts/bench/census/census.py"
from = '''    return f"the renderer process wrote no counts ({', '.join(missing)} missing)" if missing else None'''
to = '''    return None'''
test = ["python3", "scripts/bench/census/census_test.py"]

[[mutant]]
name = "a process of its own writes the browser's census file"
file = "crates/base/src/census.rs"
from = '''        if let Some(pid) = pid {
            path.push(format!(".{pid}"));
        }'''
to = '''        if let Some(pid) = pid {
            let _ = pid;
        }'''
test = ["cargo", "test", "-q", "-p", "base", "--features", "census", "census"]

[[mutant]]
name = "a renderer process writes the browser's census file"
file = "crates/shell/src/main.rs"
from = '''        base::census::own_file();'''
to = '''        let _ = base::census::own_file;'''
test = ["cargo", "test", "-q", "-p", "shell", "--features", "census", "--test", "it", "automation_pipe::a_renderer_process_counts"]
