[[mutant]]
name = "census reads the browser's file alone"
file = "scripts/bench/census/census.py"
from = '''                  if path.suffix == ".tsv" or (path.suffix[1:].isdigit() and path.stem.endswith(".tsv")))'''
to = '''                  if path.suffix == ".tsv")'''
