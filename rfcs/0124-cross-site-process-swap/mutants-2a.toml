[[mutant]]
name = "what Page, Network and Log commands change isn't told"
file = "crates/renderer/src/render_thread/devtools.rs"
from = '''            self.update_stacks_wanted();
            self.tell_devtools_state(session);
            return;'''
to = '''            self.update_stacks_wanted();
            return;'''

[[mutant]]
name = "what DOM, CSS and Overlay commands change isn't told"
file = "crates/renderer/src/render_thread/devtools.rs"
from = '''            self.start_css_refetches();
            self.tell_devtools_state(session);
            return;'''
to = '''            self.start_css_refetches();
            return;'''

[[mutant]]
name = "a state told again unchanged"
file = "crates/renderer/src/render_thread/devtools.rs"
from = '''        if told.get(session) == Some(&state) {'''
to = '''        if told.get(session) == Some(&state) && false {'''

[[mutant]]
name = "the state a session went on from isn't noted"
file = "crates/renderer/src/render_thread/devtools.rs"
from = '''        self.devtools_states.restored(&session, state);'''
to = '''        drop(state);'''

[[mutant]]
name = "a new renderer isn't attached to the tab's sessions"
file = "crates/browser/src/web_contents.rs"
from = '''        for (session, state) in &self.devtools_sessions {
            self.process.send(RendererMsg::DevToolsAttach {'''
to = '''        for (session, state) in self.devtools_sessions.iter().take(0) {
            self.process.send(RendererMsg::DevToolsAttach {'''

[[mutant]]
name = "the tab doesn't keep a session's state"
file = "crates/browser/src/web_contents.rs"
from = '''                    *kept = Some(state.clone());'''
to = '''                    let _ = kept;'''

[[mutant]]
name = "a state of any size is taken"
file = "crates/browser/src/web_contents.rs"
from = '''                if state.bytes() > DevToolsSessionState::MAX_BYTES {'''
to = '''                if state.bytes() > usize::MAX {'''

[[mutant]]
name = "a command for a tab with no renderer is sent to the one that has gone"
file = "crates/shell/src/automation_session.rs"
from = '''            return Dispatched::Now(Err(Error::new(SERVER_ERROR, TARGET_CRASHED)));'''
to = '''            let _ = TARGET_CRASHED;'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools::"]

[[mutant]]
name = "a command its renderer had as it crashed fails as machopo's own"
file = "crates/shell/src/automation_session.rs"
from = '''                .answer(Err(Error::new(SERVER_ERROR, TARGET_CRASHED)));'''
to = '''                .answer(Err(Error::new(SERVER_ERROR, "the tab's renderer has gone")));'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools::"]
