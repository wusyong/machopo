# Stage 2a's mutants (a DevTools session's state written by the renderer's agents, kept by the tab, given to the next renderer, which goes on from it; a command for a tab with no renderer, or one its renderer had as it crashed, fails as Chrome's): `python3 scripts/test.py mutate rfcs/0124-cross-site-process-swap/mutants-2a.toml`.
test = ["cargo", "test", "-q", "-p", "browser", "--test", "it", "devtools_session"]
timeout = 1200

[[mutant]]
name = "Page doesn't go on in the next renderer"
file = "crates/renderer/src/render_thread/devtools.rs"
from = '''        if let Some(page) = agent_state("Page") {'''
to = '''        if let Some(page) = None::<serde_json::Value> {'''

