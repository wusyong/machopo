# Mutation test of stage 2 (transfer):
# python3 scripts/test.py mutate rfcs/0034-message-channel/mutants-2.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "--", "messaging::"]
timeout = 1200

[[mutant]]
name = "a queued message's ports aren't kept"
file = "crates/dom/src/message_port.rs"
from = '''            append(self, &data.queued_ports, &data.queued_port_count, carried);'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "message_ports::"]

[[mutant]]
name = "giving the queue back keeps its ports"
file = "crates/dom/src/message_port.rs"
from = '''            slot.clear(self);'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "message_ports::"]

