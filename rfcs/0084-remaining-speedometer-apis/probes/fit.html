<script>
function report() {
  return [...document.querySelectorAll('.w')].map(w => {
    const t = w.querySelector('.t');
    const inner = [t, ...t.querySelectorAll('.f, .c, .g')].map(e => e.getBoundingClientRect().width);
    const items = [...t.querySelectorAll('.f > div, .g > div')].map(e => e.getBoundingClientRect().width);
    return w.id + ': outer ' + t.getBoundingClientRect().width + ' flex ' + inner.join('/') + ' items ' + items.join('/');
  }).join('\n');
}
</script>
