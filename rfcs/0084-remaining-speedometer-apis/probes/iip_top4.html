<!DOCTYPE html><meta charset=utf-8>
<style>body{margin:0}iframe{position:absolute;left:0;width:300px;height:100px;border:0}.c{position:absolute;left:100px;width:100px;height:100px}</style>
<iframe id=a style="top:0"></iframe><div class=c style="top:0;background:red;pointer-events:none"></div>
<iframe id=b style="top:150px"></iframe><div class=c style="top:150px"></div>
<iframe id=c style="top:300px"></iframe><div class=c style="top:300px;background:red;visibility:hidden"></div>
<iframe id=d style="top:450px"></iframe><div class=c style="top:450px;left:320px;width:10px;box-shadow:-150px 0 0 0 red"></div>
<iframe id=e style="top:600px"></iframe><div class=c style="top:600px;background:red;opacity:0"></div>
<script>
const q=new URLSearchParams(location.search);
for(const f of [a,b,c,d,e])f.src="http://127.0.0.1:"+q.get("portB")+"/iip_short.html";
window.runIn=(w,ms)=>{const f={a,b,c,d,e}[w];return new Promise(r=>{addEventListener("message",function h(ev){if(ev.data&&ev.data.reply){removeEventListener("message",h);r(ev.data.reply)}});f.contentWindow.postMessage({cmd:"busy",ms},"*")})};
</script>
