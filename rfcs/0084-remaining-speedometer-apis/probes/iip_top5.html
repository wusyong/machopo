<!DOCTYPE html><meta charset=utf-8>
<style>body{margin:0}iframe{width:300px;height:100px;border:0;display:block}</style>
<iframe id=a style="position:absolute;top:0;border-radius:10px"></iframe>
<div style="position:absolute;top:150px;width:300px;height:100px;overflow:hidden;border-radius:20px;background:#eee"></div>
<div style="position:absolute;top:300px;width:300px;height:100px;clip-path:inset(0 round 20px);background:#ddd"></div>
<div style="position:absolute;top:450px;width:300px;height:100px;overflow:hidden;border-radius:20px"><iframe id=b></iframe></div>
<script>
const q=new URLSearchParams(location.search);
for(const f of [a,b])f.src="http://127.0.0.1:"+q.get("portB")+"/iip_short.html";
window.busy=(ms)=>{const s=performance.now();let d=null;while(performance.now()-s<ms){if(d===null&&navigator.scheduling.isInputPending())d=Math.round(performance.now()-s)}return {discrete:d,origin:location.origin}};
window.runIn=(w,ms)=>{if(w=="top")return Promise.resolve(busy(ms));const f={a,b}[w];return new Promise(r=>{addEventListener("message",function h(ev){if(ev.data&&ev.data.reply){removeEventListener("message",h);r(ev.data.reply)}});f.contentWindow.postMessage({cmd:"busy",ms},"*")})};
</script>
