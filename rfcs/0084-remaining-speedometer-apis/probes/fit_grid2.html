<!doctype html><style>@font-face { font-family: Ahem; src: url(Ahem.ttf) } body { margin: 0; font: 20px/1 Ahem } #floated { float: left } #positioned { position: absolute }</style><div style='width: 150px; display: flow-root'><div id=floated style='display: grid; grid-template-columns: 1fr 1fr; column-gap: 10px'><div id=floated-a>XX XX XX</div><div>XX</div></div></div><div style='width: 150px; display: flow-root'><div style='position: relative'><div id=positioned style='display: grid; grid-template-columns: 1fr 1fr; column-gap: 10px'><div id=positioned-a>XX XX XX</div><div>XX</div></div></div></div><script>function report(){return document.fonts.check('20px Ahem')+' '+[...document.querySelectorAll('[id]')].map(e=>e.id+'='+e.getBoundingClientRect().width).join(' ')}</script>
