<!DOCTYPE html>
<body style="margin: 0">
<div id=cases></div>
<style>
.t { position: absolute; width: 40px; height: 40px; background: green }
.o { position: absolute; width: 20px; height: 20px }
.row { position: absolute; left: 0; width: 300px; height: 60px }
</style>
<script>
// [name, target left/top (in a row of its own), occluder html]
const only = new URLSearchParams(location.search).get('only');
const allCases = [
  ['control', ''],
  ['box-shadow', `<div class=o style="left: 100px; top: 10px; box-shadow: -50px 0 0 10px red"></div>`],
  ['inset-shadow-only', `<div class=o style="left: 70px; top: 10px; box-shadow: inset 0 0 5px red"></div>`],
  ['outline', `<div class=o style="left: 60px; top: 30px; outline: 15px solid red"></div>`],
  ['text-shadow', `<div style="position: absolute; left: 100px; top: 15px; font: 20px monospace; text-shadow: -60px 0 red">X</div>`],
  ['filter-blur', `<div class=o style="left: 70px; top: 10px; background: red; filter: blur(8px)"></div>`],
  ['drop-shadow', `<div class=o style="left: 100px; top: 10px; background: red; filter: drop-shadow(-70px 0 0 red)"></div>`],
  ['rotated-bbox-only', `<div class=o style="left: 62px; top: 52px; width: 30px; height: 30px; background: red; transform: rotate(45deg)"></div>`],
  ['clipped-away', `<div style="position: absolute; left: 100px; top: 0; width: 10px; height: 60px; overflow: hidden"><div class=o style="left: -80px; top: 10px; background: red"></div></div>`],
  ['clip-path-away', `<div class=o style="left: 20px; top: 10px; background: red; clip-path: inset(0 0 0 100%)"></div>`],
  ['scrolled-away', `<div style="position: absolute; left: 0; top: 52px; width: 300px; height: 8px; overflow: scroll"><div class=o style="left: 20px; top: -40px; background: red"></div></div>`],
  ['rotated-overlap', `<div class=o style="left: 45px; top: 20px; width: 20px; height: 20px; background: red; transform: rotate(45deg)"></div>`],
  ['box-shadow-spread-only', `<div class=o style="left: 60px; top: 10px; box-shadow: 0 0 0 15px red"></div>`],
  ['outline-offset', `<div class=o style="left: 75px; top: 10px; outline: 5px solid red; outline-offset: 25px"></div>`],
  ['text-ink-only', `<div style="position: absolute; left: 30px; top: -30px; font: 60px serif; line-height: 10px; height: 10px">gj</div>`],
  ['border-radius-corner', `<div class=o style="left: 50px; top: 0px; width: 30px; height: 30px; background: red; border-radius: 15px"></div>`],
  ['visibility-hidden', `<div class=o style="left: 20px; top: 10px; background: red; visibility: hidden"></div>`],
  ['pointer-events-none', `<div class=o style="left: 20px; top: 10px; background: red; pointer-events: none"></div>`],
  ['opacity-0', `<div class=o style="left: 20px; top: 10px; background: red; opacity: 0"></div>`],
  ['empty-box', `<div class=o style="left: 20px; top: 10px"></div>`],
];
const cases = only ? allCases.filter(c => only.split(',').includes(c[0])) : allCases;
// The target is at left 10, top 10 in its row, 40x40: (10..50, 10..50).
const results = {};
let done; const all = new Promise(r => done = r);
let html = '';
cases.forEach(([name, over], i) => {
  html += `<div class=row style="top: ${i * 70}px"><div class=t id="t-${name}" style="left: 10px; top: 10px"></div>${over}</div>`;
});
document.getElementById('cases').innerHTML = html;
for (const sc of document.querySelectorAll('#sc')) sc.scrollTop = 0;
const io = new IntersectionObserver(es => { for (const e of es) results[e.target.id.slice(2)] = e.isVisible; },
  { trackVisibility: true, delay: 100 });
document.querySelectorAll('.t').forEach(t => io.observe(t));
function run() { return new Promise(r => setTimeout(r, 800)).then(() => JSON.stringify(results)); }
</script>
