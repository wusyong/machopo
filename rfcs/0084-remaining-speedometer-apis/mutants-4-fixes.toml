test = ["sh", "-c", "cargo test -q -p bindings --lib trace && cargo test -q -p dom --test it -- timers:: && cargo test -q -p dom_js --test it -- dispatch:: && cargo test -q -p shell --test it -- script:: scheduling:: file_reader::"]
timeout = 2400

[[mutant]]
name = "no checkpoint after a task's callback"
file = "crates/dom_js/src/host.rs"
from = '''        self.cx.mutate().timers().finished_timer();
        self.cx.scope().perform_microtask_checkpoint();'''
to = '''        self.cx.mutate().timers().finished_timer();'''

[[mutant]]
name = "a checkpoint after a callback script calls too"
file = "crates/dom_js/src/host.rs"
from = '''        if bindings::trace::in_script() {
            return;
        }
        let _span = tracing::trace_span!("RunMicrotasks").entered();'''
to = '''        let _span = tracing::trace_span!("RunMicrotasks").entered();'''

[[mutant]]
name = "in_script is always true"
file = "crates/bindings/src/trace.rs"
from = '''    SCRIPT_DEPTH.with(|depth| depth.get() > 0)'''
to = '''    SCRIPT_DEPTH.with(|depth| depth.get() >= 0)'''

[[mutant]]
name = "the checkpoint before the report"
file = "crates/dom_api/src/host.rs"
from = '''    let result = match result {
        Ok(value) => Ok(value),'''
to = '''    cx.clean_up_after_callback();
    let result = match result {
        Ok(value) => Ok(value),'''

[[mutant]]
name = "no clean-up after a reported call"
file = "crates/dom_api/src/host.rs"
