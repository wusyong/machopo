test = ["sh", "-c", "cargo test -q -p renderer --lib navigation_timing && cargo test -q -p dom_api --lib navigation_timing && cargo test -q -p dom_js --test it -- navigation_timings:: performance_observers:: && cargo test -q -p shell --test it -- navigation_timing:: trace:: performance::"]
timeout = 2400

[[mutant]]
name = "a resolved name is at the fetch's start"
file = "crates/renderer/src/navigation_timing.rs"
from = '''        .map_or((fetch_start, fetch_start), |dns| (at(dns.start), at(dns.end)));'''
to = '''        .map_or((fetch_start, fetch_start), |_| (fetch_start, fetch_start));'''

[[mutant]]
name = "the request is sent as the fetch starts"
file = "crates/renderer/src/navigation_timing.rs"
from = '''    timing.request_start = Some(if connect.is_some() {'''
to = '''    timing.request_start = Some(if false {'''

[[mutant]]
name = "HTTP has a secure connection"
file = "crates/renderer/src/navigation_timing.rs"
from = '''    timing.secure_connection_start = (load.url.scheme() == "https").then_some(connect_start);'''
to = '''    timing.secure_connection_start = Some(connect_start);'''

[[mutant]]
name = "a redirect of another origin counts"
file = "crates/renderer/src/navigation_timing.rs"
from = '''    let exposed = load.redirects.iter().all(same_origin) || load.redirects.iter().all(opted_in);'''
to = '''    let exposed = { let _ = (same_origin, opted_in); true };'''

[[mutant]]
name = "an opt-in of any origin counts"
file = "crates/renderer/src/navigation_timing.rs"
from = '''                .any(|value| value == "*" || value == destination.ascii_serialization())'''
to = '''                .any(|value| !value.is_empty())'''

[[mutant]]
name = "a same-origin redirect needn't opt in with one of another"
file = "crates/renderer/src/navigation_timing.rs"
from = '''    let exposed = load.redirects.iter().all(same_origin) || load.redirects.iter().all(opted_in);'''
to = '''    let exposed = load.redirects.iter().all(|hop| same_origin(hop) || opted_in(hop));'''

[[mutant]]
name = "nothing came over the network"
file = "crates/renderer/src/navigation_timing.rs"
from = '''    timing.transferred = load.timing.is_some();'''
to = '''    timing.transferred = false;'''

