test = ["sh", "-c", "cargo test -q -p renderer --lib -- pending_user_input && cargo test -q -p dom_js --test it -- scheduling:: && cargo test -q -p shell --test it -- scheduling::"]
timeout = 1800

[[mutant]]
name = "the compositor's posting counts nothing"
file = "crates/renderer/src/render_thread.rs"
from = '''                posted_input.enqueue(Pending::of(event, *attribution, *document));'''
to = '''                let _ = (event, attribution, document, &posted_input);'''

[[mutant]]
name = "a move counts out when taken, not when dispatched"
file = "crates/renderer/src/render_thread.rs"
from = '''                            counts.dequeue(std::mem::replace(&mut self.pending_move_input, pending));'''
to = '''                            counts.dequeue(pending);'''

[[mutant]]
name = "a dispatched move still counts"
file = "crates/renderer/src/render_thread.rs"
from = '''        self.frame_settings
            .pending_input
            .dequeue(self.pending_move_input.take());'''
to = '''        let _ = &self.pending_move_input;'''

[[mutant]]
name = "a replaced move still counts"
file = "crates/renderer/src/render_thread.rs"
from = '''                            counts.dequeue(std::mem::replace(&mut self.pending_move_input, pending));'''
to = '''                            if self.pending_move_input.is_none() {
                                self.pending_move_input = pending;
                            }'''

[[mutant]]
name = "a taken event still counts"
file = "crates/renderer/src/render_thread.rs"
from = '''                        } else {
                            counts.dequeue(pending);
                        }'''
to = '''                        } else {
                            let _ = (counts, pending);
                        }'''

[[mutant]]
name = "nothing is continuous"
file = "crates/renderer/src/pending_user_input.rs"
from = '''        let continuous = matches!(
            event,
            InputEvent::MouseMove { .. } | InputEvent::MouseWheel { .. }
        );'''
to = '''        let continuous = matches!(event, InputEvent::MouseWheel { .. });'''

[[mutant]]
name = "continuous ones count without includeContinuous"
file = "crates/renderer/src/pending_user_input.rs"
from = '''            .filter(|p| include_continuous || !p.continuous)'''
to = '''            .filter(|_| include_continuous || true)'''

