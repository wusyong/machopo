test = ["sh", "-c", "cargo test -q -p dom --test it -- file_readers:: && cargo test -q -p dom_api --lib && cargo test -q -p dom_api --test it -- files:: && cargo test -q -p dom_js --test it -- file_reader:: && cargo test -q -p shell --test it -- file_reader::"]
timeout = 2400

[[mutant]]
name = "a read doesn't make the reader LOADING"
file = "crates/dom/src/file_reader.rs"
from = '''        data.set_state(FileReaderState::Loading);
        *data.result() = FileReaderResult::None;
        data.read.store(read, Ordering::Relaxed);'''
to = '''        *data.result() = FileReaderResult::None;
        data.read.store(read, Ordering::Relaxed);'''

[[mutant]]
name = "a read left behind finishes"
file = "crates/dom/src/file_reader.rs"
from = '''        if !self.read().file_reader_reading(reader, read) {
            return false;
        }
        let data = reader_data(self.own(reader));
        data.set_state(FileReaderState::Done);'''
to = '''        let data = reader_data(self.own(reader));
        data.set_state(FileReaderState::Done);'''

