# Mutation test of the second stage: V8's inspector behind a page's
# session, the realms and exceptions it is told of, V8's console, and what
# the browser checks of the renderer's messages:
# python3 scripts/test.py mutate rfcs/0075-remote-debugging/mutants-2.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "devtools::", "windowless::without_a_driver", "windowless::a_renderers_devtools"]
timeout = 900

# The inspector (bindings).

[[mutant]]
name = "the inspector's clock is 0"
file = "crates/bindings/src/devtools.rs"
from = '''            .map_or(0.0, |since| since.as_secs_f64() * 1000.0)'''
to = '''            .map_or(0.0, |since| since.as_secs_f64() * 0.0)'''

[[mutant]]
name = "no default context"
file = "crates/bindings/src/devtools.rs"
from = '''        let context = self.default_context.borrow();
        let context = context.as_ref()?;'''
to = '''        let context = self.default_context.borrow();
        let context = context.as_ref().filter(|_| false)?;'''

[[mutant]]
name = "the console's sink isn't told"
