# Stage 1: overflow-anchor, picking the anchor, the adjustment, the
# suppression triggers.
test = ["sh", "-c", "cargo test -q -p layout --test it scroll_anchor && cargo test -q -p renderer --lib -- content_above at_the_top a_scroll_picks a_scroll_container_keeps the_scroll_is_in a_change_on_the_way a_box_leaving an_anchor_without overflow_anchor_none an_anchor_stays what_keeps the_move_is_clamped a_containers_anchor the_whole_box_tree"]
timeout = 900

