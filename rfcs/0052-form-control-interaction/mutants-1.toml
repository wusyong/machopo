# 1: a list box's mouse and keys and a menu list's keys (`dom_api`'s
# `select_type`), the option the keys moved to (`dom`'s state, `css` and
# `style`'s pseudo-class, the UA's ring), and the scroll once laid out
# (`renderer`).
#   python3 scripts/test.py mutate rfcs/0052-form-control-interaction/mutants-1.toml
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "select_type::"]
timeout = 900

[[mutant]]
name = "a disabled select takes the events"
file = "crates/dom_api/src/select_type.rs"
from = '''        if disabled {
            return false;
        }'''
to = '''        if disabled && false {
            return false;
        }'''

[[mutant]]
name = "a menu list takes Alt's keys"
file = "crates/dom_api/src/select_type.rs"
from = '''    if key.shift_key || key.ctrl_key || key.alt_key || key.meta_key {'''
to = '''    if key.shift_key || key.ctrl_key || key.meta_key {'''

[[mutant]]
name = "a menu list takes every event's key"
file = "crates/dom_api/src/select_type.rs"
from = '''        "keydown" => menu_list_keydown(cx, select, &key),
        "keypress" if'''
to = '''        _ if event_type != "keypress" => menu_list_keydown(cx, select, &key),
        "keypress" if'''

[[mutant]]
name = "a menu list's right arrow isn't the next"
file = "crates/dom_api/src/select_type.rs"
from = '''            "ArrowDown" | "ArrowRight" => next_valid_option(&items, index, true, 1),'''
to = '''            "ArrowDown" => next_valid_option(&items, index, true, 1),'''

