# 2: a number's and a range's steps (`dom_api`'s `step_range`), the
# cancel button and the spin button (`inner_elements`), the mouse capture
# (`dom` and `renderer`) and an empty inner editor's line (`layout`).
#   python3 scripts/test.py mutate rfcs/0052-form-control-interaction/mutants-2.toml
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "input_steps::"]
timeout = 900

[[mutant]]
name = "step=any is the default step for stepUp()"
file = "crates/dom_api/src/step_range.rs"
from = '''            (Some(_), true) => (any_handling == Any::DefaultStep).then_some(DEFAULT_STEP),'''
to = '''            (Some(_), true) => Some(DEFAULT_STEP),'''

[[mutant]]
name = "a bad step is no step"
