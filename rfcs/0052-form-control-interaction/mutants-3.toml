# 3: a menu list's dropdown (`dom_api`'s `select_type`), `showPicker()`
# and the user activation it consumes, `:open` (`dom`, `css`, `style`),
# the renderer's side (`render_thread`), the browser's list (`shell`'s
# `popup_menu` and `browser_view`) and the layer over the web views
# (`compositor`).
#   python3 scripts/test.py mutate rfcs/0052-form-control-interaction/mutants-3.toml
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "select_type::"]
timeout = 900

[[mutant]]
name = "any button's press opens the dropdown"
