# Step 2b's mutants: `python3 scripts/test.py mutate rfcs/0113-http-cache/mutants-2b.toml`.
test = ["cargo", "test", "-q", "-p", "net", "http_cache"]
timeout = 900

[[mutant]]
name = "an entry may take no less than 5 MiB"
file = "crates/net/src/http_cache/disk.rs"
from = '''        (self.max_size / 8).max(MIN_MAX_ENTRY_SIZE)'''
to = '''        self.max_size / 8'''

[[mutant]]
name = "an entry may take a quarter"
file = "crates/net/src/http_cache/disk.rs"
from = '''        (self.max_size / 8).max(MIN_MAX_ENTRY_SIZE)'''
to = '''        (self.max_size / 4).max(MIN_MAX_ENTRY_SIZE)'''

