# Step 1e's mutants: `python3 scripts/test.py mutate rfcs/0113-http-cache/mutants-1e.toml`.
test = ["cargo", "test", "-q", "-p", "net", "http_cache"]
# A change to `dom_api` rebuilds the engines and the shell.
timeout = 1800

# 1e-1: the load flags in the cache.

[[mutant]]
name = "a header's no-cache doesn't bypass"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        Some(HeaderFlag::BypassCache) => flags.bypass_cache = true,'''
to = '''        Some(HeaderFlag::BypassCache) => {}'''

[[mutant]]
name = "an empty validator doesn't keep the load from the cache"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        flags.disable_cache = true;
        None
    });'''
to = '''        None
    });
'''

[[mutant]]
name = "disable_cache doesn't keep the load from the cache"
file = "crates/net/src/http_cache/transaction.rs"
from = '''    let key = (!flags.disable_cache)
        .then(|| cache_key(request, hop.url))'''
to = '''    let key = true
        .then(|| cache_key(request, hop.url))'''

[[mutant]]
name = "only from the cache without a key goes to the network"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        return if flags.only_from_cache {
            miss()'''
to = '''        return if flags.only_from_cache && false {
            miss()'''

[[mutant]]
name = "only from the cache for a POST goes to the network"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        _ if flags.only_from_cache => return miss(),
        // A change to the resource'''
to = '''        _ if flags.only_from_cache && false => return miss(),
        // A change to the resource'''

[[mutant]]
name = "only from the cache with the caller's validation goes to the network"
file = "crates/net/src/http_cache/transaction.rs"
from = '''    if external.is_some() && flags.only_from_cache {'''
to = '''    if external.is_some() && flags.only_from_cache && false {'''

[[mutant]]
name = "only from the cache with nothing stored goes to the network"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        _ if flags.only_from_cache => return miss(),
        // Nothing to use'''
to = '''        _ if flags.only_from_cache && false => return miss(),
        // Nothing to use'''

[[mutant]]
name = "only from the cache validates"
file = "crates/net/src/http_cache/transaction.rs"
from = '''    if flags.only_from_cache {
        return miss();
    }
    let validators ='''
to = '''    if flags.only_from_cache && false {
        return miss();
    }
    let validators ='''

[[mutant]]
name = "bypass_cache reads the cache"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        Some(stored) if !flags.bypass_cache => stored,'''
to = '''        Some(stored) => stored,'''

[[mutant]]
name = "skipping validation doesn't skip it"
file = "crates/net/src/http_cache/transaction.rs"
from = '''    } else if flags.skip_cache_validation {
        Validation::None'''
to = '''    } else if flags.skip_cache_validation && false {
        Validation::None'''

[[mutant]]
name = "skipping validation goes before a Vary that differs"
file = "crates/net/src/http_cache/transaction.rs"
from = '''    let validation = if vary_mismatch {
        Validation::Synchronous
    } else if flags.skip_cache_validation {'''
to = '''    let validation = if vary_mismatch && !flags.skip_cache_validation {
        Validation::Synchronous
    } else if flags.skip_cache_validation {'''

[[mutant]]
name = "validate_cache doesn't validate"
file = "crates/net/src/http_cache/transaction.rs"
from = '''    } else if flags.validate_cache {
        Validation::Synchronous'''
to = '''    } else if flags.validate_cache && false {
        Validation::Synchronous'''

[[mutant]]
name = "bypassing sends no Pragma"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        &[("pragma", "no-cache"), ("cache-control", "no-cache")]'''
to = '''        &[("cache-control", "no-cache")]'''

[[mutant]]
name = "validating sends nothing"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        &[("cache-control", "max-age=0")]'''
to = '''        &[]'''

[[mutant]]
name = "the headers a request's flags send follow the effective flags"
file = "crates/net/src/http_cache/transaction.rs"
from = '''            network(transport, &hop, hop.headers, asked).await
        };
    };'''
to = '''            network(transport, &hop, hop.headers, flags).await
        };
    };'''

[[mutant]]
name = "a request's own Cache-Control stays beside the added one"
file = "crates/net/src/http_cache/transaction.rs"
from = '''        .filter(|(name, _)| !added.iter().any(|(added, _)| name.eq_ignore_ascii_case(added)))'''
to = '''        .filter(|_| true)'''

# 1e-2: fetch()'s cache mode.

[[mutant]]
name = "no-store keeps the response"
file = "crates/renderer/src/loader.rs"
from = '''        dom::RequestCache::NoStore => {
            flags.disable_cache = true;'''
to = '''        dom::RequestCache::NoStore => {
            let _ = &mut flags;'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "loader"]

[[mutant]]
name = "reload validates"
file = "crates/renderer/src/loader.rs"
from = '''        dom::RequestCache::Reload => flags.bypass_cache = true,'''
to = '''        dom::RequestCache::Reload => flags.validate_cache = true,'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "loader"]

[[mutant]]
name = "no-cache doesn't validate"
file = "crates/renderer/src/loader.rs"
from = '''        dom::RequestCache::NoCache => flags.validate_cache = true,'''
to = '''        dom::RequestCache::NoCache => {}'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "loader"]

[[mutant]]
name = "force-cache validates a stale one"
file = "crates/renderer/src/loader.rs"
from = '''        dom::RequestCache::ForceCache => flags.skip_cache_validation = true,'''
to = '''        dom::RequestCache::ForceCache => {}'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "loader"]

[[mutant]]
name = "only-if-cached may go to the network"
file = "crates/renderer/src/loader.rs"
from = '''            flags.only_from_cache = true;
            flags.skip_cache_validation = true;
        }
    }
    flags'''
to = '''            flags.skip_cache_validation = true;
        }
    }
    flags'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "loader"]

[[mutant]]
name = "a fetch's request has no load flags"
file = "crates/renderer/src/loader.rs"
from = '''    resource.load_flags = cache_load_flags(request.cache);'''
to = '''    let _ = cache_load_flags(request.cache);'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "fetch::a_fetchs_cache_mode"]

[[mutant]]
name = "fetch() doesn't hand its cache mode to the host"
file = "crates/dom_api/src/fetch.rs"
from = '''        cache: data.cache,
        initiator,'''
to = '''        cache: dom::RequestCache::Default,
        initiator,'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "fetch::a_fetchs_cache_mode"]

