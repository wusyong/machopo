# 3b: the table elements' interfaces (`dom_api`'s `table` and
# reflections, `dom`'s collections of a table).
#   python3 scripts/test.py mutate rfcs/0070-element-interfaces/mutants-3b.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "element_interfaces"]
timeout = 900

[[mutant]]
name = "the head's rows after the others"
file = "crates/dom_api/src/table.rs"
from = '''    in_sections(local_name!("thead"))
        .chain(bodies)'''
to = '''    bodies
        .chain(in_sections(local_name!("thead")))'''

[[mutant]]
name = "the table's own rows left out"
file = "crates/dom_api/src/table.rs"
from = '''        let own = is_row(&child).then_some(child);'''
to = '''        let own = None;'''

[[mutant]]
name = "the last row not looked for in the foot"
file = "crates/dom_api/src/table.rs"
from = '''        .filter(is(&local_name!("tfoot")))
        .find_map(|foot| last_of(foot))'''
to = '''        .filter(is(&local_name!("caption")))
        .find_map(|foot| last_of(foot))'''

[[mutant]]
name = "insertRow at the number of rows refused"
file = "crates/dom_api/src/table.rs"
from = '''            if before.is_none() && seen != index {'''
to = '''            if before.is_none() {'''

[[mutant]]
name = "a row in an empty table without a tbody"
file = "crates/dom_api/src/table.rs"
from = '''                    let body = create(cx, this, local_name!("tbody"));
                    crate::node::pre_insert(cx, &body, row.clone(), None)?;
                    crate::node::pre_insert(cx, this, body, None)?;
                    return Ok(row);'''
to = '''                    return crate::node::pre_insert(cx, this, row, None);'''

[[mutant]]
name = "a row into the first tbody"
file = "crates/dom_api/src/table.rs"
from = '''                children_backwards(this.get(&read))
                    .find(is(&local_name!("tbody")))
                    .map(|body| body.to_handle())'''
to = '''                this.get(&read)
                    .children()
                    .find(is(&local_name!("tbody")))
                    .map(|body| body.to_handle())'''

[[mutant]]
name = "deleteRow(-1) of an empty table throws"
file = "crates/dom_api/src/table.rs"
from = '''        None if index == -1 => Ok(()),
        None => Err(index_size_error("no row at that index")),'''
to = '''        None => Err(index_size_error("no row at that index")),'''

