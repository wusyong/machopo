# 3c: the legacy presentational hints (`style`'s `hints`), legacy colors
# and the document's link colors (`css`, `style`).
#   python3 scripts/test.py mutate rfcs/0070-element-interfaces/mutants-3c.toml
# Left out as equivalent: none.
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "legacy_hints", "tables::", "invalidation::"]
timeout = 900

[[mutant]]
name = "a named legacy color read as digits"
file = "crates/css/src/values.rs"
from = '''    if let Ok((r, g, b)) = cssparser::color::parse_named_color(&value.to_ascii_lowercase()) {
        return Some(Color::rgb(r, g, b));
    }'''
to = ''''''

[[mutant]]
name = "#rgb read as digits"
file = "crates/css/src/values.rs"
from = '''    if bytes.len() == 4 && bytes[0] == b'#' && bytes[1..].iter().all(u8::is_ascii_hexdigit) {'''
to = '''    if false {'''

[[mutant]]
name = "outside the BMP one zero"
file = "crates/css/src/values.rs"
from = '''            digits.extend(b"00");'''
to = '''            digits.push(b'0');'''

[[mutant]]
name = "no 128 limit"
file = "crates/css/src/values.rs"
from = '''    digits.truncate(128);'''
to = ''''''

[[mutant]]
name = "a long part's first eight digits"
file = "crates/css/src/values.rs"
from = '''            *part = &part[length - 8..];'''
to = '''            *part = &part[..8];'''

[[mutant]]
name = "leading zeros kept"
file = "crates/css/src/values.rs"
from = '''    while length > 2 && parts.iter().all(|part| part[0] == b'0') {'''
to = '''    while false {'''

