file = "crates/style/src/lib.rs"
from = '''            || links_changed
'''
to = '''
'''

[[mutant]]
name = "the UA's links of a fixed color"
file = "crates/style/resources/html.css"
from = '''  color: -webkit-link;'''
to = '''  color: #0000EE;'''

[[mutant]]
name = "a font's sizes off by one"
file = "crates/style/src/hints.rs"
from = '''    Some(SIZES[size.clamp(1, 7) as usize - 1])'''
to = '''    Some(SIZES[size.clamp(0, 6) as usize])'''

[[mutant]]
name = "a smaller font relative to 0"
file = "crates/style/src/hints.rs"
from = '''        -1 => 3 - number.min(3),'''
to = '''        -1 => -number,'''

[[mutant]]
name = "a rule's color not its background"
file = "crates/style/src/hints.rs"
from = '''            push_color(out, &BORDER_COLOR, color);
            push_color(out, &[LonghandId::BackgroundColor], color);
        }
    } else if'''
to = '''            push_color(out, &BORDER_COLOR, color);
        }
    } else if'''

