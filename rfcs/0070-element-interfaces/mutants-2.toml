                // SAFETY: nothing allocates while it is used.
                unsafe { enable_style_sheet(element) };'''
to = '''            if false {
                // SAFETY: nothing allocates while it is used.
                unsafe { enable_style_sheet(element) };'''

[[mutant]]
name = "its text's data keeps its sheet's flag"
file = "crates/dom/src/scope.rs"
from = '''            // A `<style>`'s text: its sheet, a new one.
            if is_style_sheet_owner(parent) {
