            enable_style_sheet(node);'''
to = ''''''

[[mutant]]
name = "the flag set without collecting the sheets again"
file = "crates/dom/src/scope.rs"
from = '''        self.rare_data(element).style_sheet_disabled.set(disabled);
        set_tree_scope_style_sheets_changed(self.own(element));'''
to = '''        self.rare_data(element).style_sheet_disabled.set(disabled);'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "a_disabled_style"]

[[mutant]]
