test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "a_disabled_style"]

[[mutant]]
name = "a text removed from it keeps its sheet's flag"
file = "crates/dom/src/scope.rs"
from = '''        if parent_owns_sheets {
            // SAFETY: nothing allocates while it is used.
            unsafe { enable_style_sheet(parent) };
        }'''
to = ''''''

