                self.roots[slot] = root;'''
to = '''                let slot = usize::try_from(rep).expect("a slot index fits a usize");
                self.roots[0] = root;'''
test = ["cargo", "test", "-q", "-p", "dom_wasm", "--test", "it", "new_dom"]

