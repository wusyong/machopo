# --- dom_wasm: kun:next-dom --------------------------------------------------

[[mutant]]
name = "a dropped handle keeps its root"
file = "crates/dom_wasm/src/next.rs"
from = '''            && slot.take().is_some()'''
to = '''            && slot.is_some()'''
test = ["cargo", "test", "-q", "-p", "dom_wasm", "--test", "it", "new_dom"]

[[mutant]]
name = "errors' names swapped"
file = "crates/dom_wasm/src/next.rs"
from = '''            DomError::NotFound => Self::NotFound,'''
to = '''            DomError::NotFound => Self::HierarchyRequest,'''
test = ["cargo", "test", "-q", "-p", "dom_wasm", "--test", "it", "new_dom"]

[[mutant]]
name = "previous-sibling walks forward"
file = "crates/dom_wasm/src/next.rs"
from = '''walk(|cx, node| cx.previous_sibling(node))'''
to = '''walk(|cx, node| cx.next_sibling(node))'''
test = ["cargo", "test", "-q", "-p", "dom_wasm", "--test", "it", "new_dom"]

[[mutant]]
name = "insert-before appends"
file = "crates/dom_wasm/src/next.rs"
from = '''                let result = cx.insert_before(slots.node(cx, &this)?, slots.node(cx, &child)?, before);'''
to = '''                let _ = before;
                let result = cx.insert_before(slots.node(cx, &this)?, slots.node(cx, &child)?, None);'''
test = ["cargo", "test", "-q", "-p", "dom_wasm", "--test", "it", "new_dom"]

[[mutant]]
name = "a freed slot isn't reused but another's is overwritten"
