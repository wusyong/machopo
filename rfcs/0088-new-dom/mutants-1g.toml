# --- 1g's experiment 甲: the reads' floor --------------------------------------

[[mutant]]
name = "an operation without a safepoint has one"
file = "crates/gc/src/heap.rs"
from = '''    ) -> R {
        f(&Mutation {
            inner: &self.inner,
            _invariant: PhantomData,
        })
    }'''
to = '''    ) -> R {
        self.inner.safepoint();
        f(&Mutation {
            inner: &self.inner,
            _invariant: PhantomData,
        })
    }'''
test = ["cargo", "test", "-q", "-p", "gc", "--test", "it", "young::"]

