# Stage 1g: counting script's DOM calls (dom_js's call_counts,
# MACHOPO_DOM_CALLS) and `bench.py speedometer --dom-calls`'s reading and report.
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "bindings::dom_calls"]
timeout = 900

[[mutant]]
name = "a typed path's calls aren't counted"
file = "crates/dom_js/src/typed.rs"
from = '''    crate::call_counts::note(M::INTERFACE, M::MEMBER);
'''
to = ""

[[mutant]]
name = "the shared callback's calls aren't counted"
file = "crates/dom_js/src/templates.rs"
from = '''    crate::call_counts::note(index, member_index);
'''
to = ""

[[mutant]]
name = "a call is counted once whatever the member"
file = "crates/dom_js/src/call_counts.rs"
from = '''        let count = counts.calls.entry((interface, member)).or_insert(0);'''
to = '''        let count = counts.calls.entry((interface, 0)).or_insert(0);'''

[[mutant]]
name = "the counts aren't the most called first"
file = "crates/dom_js/src/call_counts.rs"
from = '''        named.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0)));'''
to = '''        named.sort_by(|a, b| a.0.cmp(&b.0));'''

[[mutant]]
name = "a thread writes no file as it ends"
file = "crates/dom_js/src/call_counts.rs"
from = '''        let Some(directory) = directory() else {
            return;
        };'''
to = '''        let Some(directory) = directory().filter(|_| false) else {
            return;
        };'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "dom_calls"]

[[mutant]]
name = "the environment doesn't turn counting on"
file = "crates/dom_js/src/call_counts.rs"
from = '''    let on = directory().is_some();'''
to = '''    let on = false;'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "dom_calls"]

[[mutant]]
name = "only one thread's file is read"
file = "scripts/bench/speedometer/speedometer.py"
from = '''    for path in sorted(folder.glob("*.tsv")):'''
to = '''    for path in sorted(folder.glob("*.tsv"))[:1]:'''
test = ["python3", "scripts/bench/speedometer/speedometer_test.py", "DomCallsTests"]

[[mutant]]
name = "a member's share is of all the calls"
file = "scripts/bench/speedometer/speedometer.py"
from = '''            shares[member] += count / total / len(counts)'''
to = '''            shares[member] += count / sum(sum(c.values()) for c in counts.values())'''
test = ["python3", "scripts/bench/speedometer/speedometer_test.py", "DomCallsTests"]

[[mutant]]
name = "the tool's summaries are counted too"
file = "scripts/bench/speedometer/speedometer.py"
from = '''    server.summaries = False
'''
to = ""
test = ["python3", "scripts/bench/speedometer/speedometer_test.py", "MeasureTests.test_dom_calls_of_kun"]

