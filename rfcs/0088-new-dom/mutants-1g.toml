# --- the registration's teardown: V8's GC finished first ---------------------
# Caught only by the loaded stress run (a race at teardown): `test.py mutate`
# runs it as a shell loop.

[[mutant]]
name = "the registration goes while V8 marks"
file = "crates/bindings/src/unified.rs"
from = '''            v8__kun__FinishMarking(isolate);
'''
to = ""
test = ["sh", "-c", "b=$(cargo test -q -p dom_js --test it --no-run --message-format=json 2>/dev/null | python3 -c \"import sys,json;[print(m['executable']) for m in map(json.loads,sys.stdin) if m.get('executable') and m['target']['name']=='it']\" | tail -1); fails=0; for p in 1 2 3 4; do (for i in $(seq 1 120); do MACHOPO_V8_FLAGS=--stress-compaction $b next_dom >/dev/null 2>&1; [ $? -gt 128 ] && echo crash; done) & done | grep -q crash && exit 1; wait; exit 0"]
timeout = 1800

