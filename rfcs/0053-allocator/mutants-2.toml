# 2: the `kun` executable's Rust allocations go through mimalloc.
#   python3 scripts/test.py mutate rfcs/0053-allocator/mutants-2.toml
test = ["cargo", "test", "-q", "-p", "shell", "--bin", "kun"]
timeout = 900

[[mutant]]
name = "the platform's allocator"
file = "crates/shell/src/main.rs"
from = '''#[global_allocator]
static GLOBAL: mimalloc::MiMalloc = mimalloc::MiMalloc;'''
to = ''''''
