# Mutation test of the inventory's four false positives (empty longhands,
# at-rules, selectors, elements in a namespace):
# python3 scripts/test.py mutate rfcs/0012-speedometer/mutants-inventory-false-positives.toml
# The Chrome test needs a Chrome that runs: on Windows its sandbox can't
# read target/'s chrome.exe (progress.md, 2026-10-12).
test = [
    "python3", "scripts/speedometer_test.py", "InventoryReportTests",
    "ChromeTests.test_the_recording_has_what_kuns_probe_tries",
    "KunTests.test_the_probe_posts_what_kun_lacks",
]
timeout = 300

[[mutant]]
name = "the recording leaves out an element's namespace"
file = "scripts/speedometer/record.js"
from = '''      return `element:${namespaces[args[0]] ?? ""}|${local}:${result?.constructor?.name}`;'''
to = '''      return `element:${local}:${result?.constructor?.name}`;'''

[[mutant]]
name = "the recording keeps a qualified name's prefix"
file = "scripts/speedometer/record.js"
from = '''      const local = String(args[1]).split(":").pop();'''
to = '''      const local = String(args[1]);'''

[[mutant]]
name = "empty longhands are recorded"
file = "scripts/speedometer/inventory.mjs"
from = '''      if (value === "") pending = true;
      else add(out.declarations, `${property}: ${value}`);'''
to = '''      if (value === "") pending = true;
      add(out.declarations, `${property}: ${value}`);'''

[[mutant]]
name = "a shorthand with empty longhands isn't recorded"
file = "scripts/speedometer/inventory.mjs"
from = '''    if (!pending) return;'''
to = '''    return;'''

[[mutant]]
name = "a custom property is recorded as if a shorthand"
file = "scripts/speedometer/inventory.mjs"
from = '''      if (name.startsWith("--")) continue;'''
to = ''''''

[[mutant]]
name = "a nested at-rule's text is its own"
file = "scripts/speedometer/inventory.mjs"
from = '''      const text = top ?? rule.cssText;'''
to = '''      const text = rule.cssText;'''

[[mutant]]
name = "nesting has no text"
file = "scripts/speedometer/inventory.mjs"
from = '''          out.atRuleTexts.nesting ??= text;'''
to = ''''''

[[mutant]]
name = "an at-rule has no text"
file = "scripts/speedometer/inventory.mjs"
from = '''        out.atRuleTexts[kind] ??= text;'''
to = ''''''

[[mutant]]
name = "selector lists split inside parentheses"
file = "scripts/speedometer/probe.js"
from = '''      else if (c === "(" || c === "[") depth++;
      else if (c === ")" || c === "]") depth--;
      else if ((c === "," || c === undefined) && depth === 0) {
        out.push(list.slice(start, i).trim());'''
to = '''      else if ((c === "," || c === undefined) && depth === 0) {
        out.push(list.slice(start, i).trim());'''

