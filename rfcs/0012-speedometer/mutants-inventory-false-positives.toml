[[mutant]]
name = "an item that parses has culprits"
file = "scripts/speedometer/probe.js"
from = '''    for (const item of items(selector)) {
      if (parses(item)) continue;'''
to = '''    for (const item of items(selector)) {'''

[[mutant]]
name = "every pseudo is a culprit"
file = "scripts/speedometer/probe.js"
from = '''      const alone = (item.match(pseudo) ?? []).filter((p) => !parses(`*${p}`));'''
to = '''      const alone = item.match(pseudo) ?? [];'''

[[mutant]]
name = "an item whose pseudos each parse has no culprit"
file = "scripts/speedometer/probe.js"
from = '''      for (const p of alone.length ? alone : [item]) culprits.add(p);'''
to = '''      for (const p of alone) culprits.add(p);'''

