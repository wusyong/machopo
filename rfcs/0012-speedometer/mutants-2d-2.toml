# Mutation test of step 2d-2 (spans named and nested as Chrome's trace has
# them: calls into script, HTML's parse, custom element reactions, the main
# frame's steps):
# python3 scripts/test.py mutate rfcs/0012-speedometer/mutants-2d-2.toml
test = ["python3", "scripts/speedometer_test.py", "MeasureTests.test_traces_of_both"]
timeout = 900

[[mutant]]
name = "every call is a FunctionCall"
file = "crates/dom_js/src/host.rs"
from = '''        let _outermost = entry
            .is_outermost()'''
to = '''        let _outermost = (entry.is_outermost() || true)'''

[[mutant]]
name = "a call isn't a v8.callFunction"
file = "crates/dom_js/src/host.rs"
from = '''        let _span = tracing::trace_span!("v8.callFunction").entered();'''
to = ''''''

[[mutant]]
name = "script a call runs isn't script on the stack"
file = "crates/dom_js/src/host.rs"
from = '''        let entry = bindings::trace::enter_script();
        let _outermost = entry
            .is_outermost()'''
to = '''        let outermost = bindings::trace::enter_script().is_outermost();
        let _outermost = outermost'''

[[mutant]]
name = "a construction isn't a v8.callAsConstructor"
file = "crates/dom_js/src/host.rs"
from = '''        let _span = tracing::trace_span!("v8.callAsConstructor").entered();'''
to = ''''''

[[mutant]]
name = "script a construction runs isn't script on the stack"
file = "crates/dom_js/src/host.rs"
from = '''        let _entry = bindings::trace::enter_script();'''
to = ''''''

[[mutant]]
name = "microtasks aren't script on the stack"
file = "crates/dom_js/src/engine.rs"
from = '''        let _entry = bindings::trace::enter_script();'''
to = ''''''

[[mutant]]
name = "a classic script isn't script on the stack"
file = "crates/bindings/src/script_state.rs"
from = '''        let _entry = crate::trace::enter_script();'''
to = ''''''

[[mutant]]
name = "a module isn't script on the stack"
file = "crates/bindings/src/module_record.rs"
from = '''        let _entry = crate::trace::enter_script();'''
to = ''''''

[[mutant]]
name = "leaving script doesn't lower the depth"
file = "crates/bindings/src/trace.rs"
from = '''        SCRIPT_DEPTH.with(|depth| depth.set(depth.get() - 1));'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "bindings", "--lib", "trace::"]

[[mutant]]
name = "every entry into script is the outermost"
file = "crates/bindings/src/trace.rs"
from = '''        outermost: depth == 0,'''
to = '''        outermost: depth == depth,'''
test = ["cargo", "test", "-q", "-p", "bindings", "--lib", "trace::"]

[[mutant]]
name = "markup script sets isn't a ParseHTML"
file = "crates/dom_api/src/markup.rs"
from = '''    let _span = tracing::trace_span!("ParseHTML").entered();'''
to = ''''''

[[mutant]]
name = "a run of the parser isn't a ParseHTML"
file = "crates/html/src/parser.rs"
from = '''        let _span = tracing::trace_span!("ParseHTML").entered();
        loop {'''
to = '''        loop {'''
test = ["cargo", "test", "-q", "-p", "html", "--test", "it", "spans::"]

[[mutant]]
name = "the parser's end isn't a ParseHTML"
file = "crates/html/src/parser.rs"
from = '''        let _span = tracing::trace_span!("ParseHTML").entered();
        self.tokenizer.end();'''
to = '''        self.tokenizer.end();'''
test = ["cargo", "test", "-q", "-p", "html", "--test", "it", "spans::"]

[[mutant]]
name = "a document parsed at once isn't a ParseHTML"
file = "crates/html/src/lib.rs"
from = '''    let _span = tracing::trace_span!("ParseHTML").entered();'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "html", "--test", "it", "spans::"]

