# --- values ---

[[mutant]]
name = "a tie rounds down"
file = "crates/css/src/calc.rs"
from = '''        Rounding::Nearest if a - lower < upper - a => lower,'''
to = '''        Rounding::Nearest if a - lower <= upper - a => lower,'''

[[mutant]]
name = "to-zero of a negative is the lower"
file = "crates/css/src/calc.rs"
from = '''        Rounding::ToZero if a < 0.0 => upper,'''
to = '''        Rounding::ToZero if a < 0.0 => lower,'''

[[mutant]]
name = "a 0 rounded up to is +0"
file = "crates/css/src/calc.rs"
from = '''    } else if rounded == upper {
        -0.0'''
to = '''    } else if rounded == upper {
        0.0'''

[[mutant]]
name = "mod() is rem()"
file = "crates/css/src/calc.rs"
from = '''            Self::Mod => modulus(a, b.unwrap_or(f64::NAN), true),'''
to = '''            Self::Mod => modulus(a, b.unwrap_or(f64::NAN), false),'''

[[mutant]]
name = "mod()'s 0 has the value's sign"
file = "crates/css/src/calc.rs"
from = '''        0.0_f64.copysign(b)'''
to = '''        r'''

[[mutant]]
name = "a sign of 0 is 1"
file = "crates/css/src/calc.rs"
from = '''                if a == 0.0 || a.is_nan() {'''
to = '''                if a.is_nan() {'''

[[mutant]]
name = "degrees taken as radians"
file = "crates/css/src/calc.rs"
from = '''        let radians = |v: f64| if arg == Kind::Angle { v.to_radians() } else { v };'''
to = '''        let radians = |v: f64| v;'''

[[mutant]]
name = "no infinity at tan()'s asymptote"
file = "crates/css/src/calc.rs"
from = '''                if degrees == Some(90.0) {'''
to = '''                if degrees == Some(91.0) {'''

[[mutant]]
name = "hypot() a sum"
file = "crates/css/src/calc.rs"
from = '''            Self::Hypot => values.iter().fold(0.0, |sum: f64, v| sum.hypot(*v)),'''
to = '''            Self::Hypot => values.iter().fold(0.0, |sum: f64, v| sum + v.abs()),'''

[[mutant]]
name = "log()'s base ignored"
file = "crates/css/src/calc.rs"
from = '''                Some(base) => a.ln() / base.ln(),'''
to = '''                Some(_) => a.ln(),'''

[[mutant]]
name = "a computed -0 is +0"
file = "crates/css/src/calc.rs"
from = '''    let negative_zero = |part: f32| part == 0.0 && part.is_sign_negative();'''
to = '''    let negative_zero = |part: f32| part == 0.0 && false;'''

[[mutant]]
name = "min() of zeros not -0, computed"
file = "crates/css/src/calc.rs"
from = '''                        y.is_sign_negative().cmp(&x.is_sign_negative())'''
to = '''                        Ordering::Equal'''

[[mutant]]
name = "min() of zeros not -0"
file = "crates/css/src/calc.rs"
from = '''        if a.is_sign_negative() { a } else { b }'''
to = '''        b'''

[[mutant]]
name = "max() of zeros not +0"
file = "crates/css/src/calc.rs"
from = '''        if a.is_sign_positive() { a } else { b }'''
to = '''        b'''

[[mutant]]
name = "a quotient scaled in its denominator"
file = "crates/css/src/calc.rs"
from = '''            Node::Divide(Box::new([scale(numerator, k), denominator]))'''
to = '''            Node::Divide(Box::new([numerator, scale(denominator, k)]))'''

# --- writing back ---

[[mutant]]
name = "a product's leaves last"
file = "crates/css/src/calc.rs"
from = '''    let mut factors: Vec<Node> = leaf
        .filter(|leaf| *leaf != Node::Number(1.0) || others.is_empty())
        .into_iter()
        .collect();
    factors.extend(others);'''
to = '''    let mut factors: Vec<Node> = others;
    factors.extend(leaf.filter(|leaf| *leaf != Node::Number(1.0) || factors.is_empty()));'''

[[mutant]]
name = "a number 1 kept as a factor"
file = "crates/css/src/calc.rs"
from = '''        .filter(|leaf| *leaf != Node::Number(1.0) || others.is_empty())'''
to = '''        .filter(|_| true)'''

