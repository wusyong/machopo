# Stage 2: css-values-4's other math functions.
test = ["sh", "-c", "cargo test -q -p style --test it calc:: && cargo test -q -p gfx --lib a_product_stays_finite && cargo test -q -p css --lib"]
timeout = 900

# --- parsing ---

