from = '''    if !is_link(node) || !rel_has(node, "stylesheet") || !is_css_type(node) {'''
to = '''    if !is_link(node) || !rel_has(node, "stylesheet") || rel_has(node, "alternate") || !is_css_type(node) {'''

[[mutant]]
name = "the list kept whatever the DOM did"
file = "crates/dom/src/style_element.rs"
from = '''            .is_some_and(|cache| cache.version == self.dom_tree_version);'''
to = '''            .is_some();'''

[[mutant]]
name = "the list found again each time"
