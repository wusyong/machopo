# --- style: sets ---

[[mutant]]
name = "every sheet small"
file = "crates/style/src/lib.rs"
from = '''    let large = |sheet: &DocumentSheet| sheet.contents.rules().len() >= LARGE_SHEET_RULES;'''
to = '''    let large = |sheet: &DocumentSheet| sheet.contents.rules().len() >= usize::MAX;'''

[[mutant]]
name = "a run's set never taken again"
file = "crates/style/src/lib.rs"
from = '''                old.len() == run.len()
                    && old'''
to = '''                old.len() == run.len() + 1
                    && old'''

[[mutant]]
name = "a run's set taken again whatever its media"
file = "crates/style/src/lib.rs"
from = '''                    && !set.did_media_query_results_change(environment)
            });'''
to = '''                    && !set.depends_on_media() | true
            });'''

[[mutant]]
name = "a large sheet's media not looked at"
file = "crates/style/src/lib.rs"
from = '''            let matched = sheet.applies(environment);
            SheetGroup {'''
to = '''            let matched = true;
            SheetGroup {'''

[[mutant]]
name = "a large sheet's media change not seen"
file = "crates/style/src/lib.rs"
from = '''            sheets[self.sheets.start].applies(environment) != matched'''
to = '''            false && matched'''

[[mutant]]
name = "a set's features worked out each time"
file = "crates/style/src/lib.rs"
from = '''        if let Some((_, features)) = self.sets.get(&key) {'''
to = '''        if let Some((_, features)) = self.sets.get(&key).filter(|_| false) {'''

[[mutant]]
name = "only the first set's features"
file = "crates/style/src/lib.rs"
from = '''                for (_, features) in many {
                    merged.merge(&features.features);
                }'''
to = '''                merged.merge(&many[0].1.features);'''

[[mutant]]
name = "the descendant sets not merged"
file = "crates/style/src/lib.rs"
from = '''        self.descendants.merge(&other.descendants);'''
to = '''        let _ = &other.descendants;'''

[[mutant]]
name = "only the first set's dependencies"
file = "crates/style/src/lib.rs"
from = '''            for (all, of_set) in dependencies.iter_mut().zip(features.dependencies) {
                *all = all.or(of_set);
            }'''
to = '''            let _ = features;'''

