# Stage 4: the CSSOM of the document's sheets (`sheet`, `styleSheets`, the
# edits the element takes, origin-clean, titles), the sets of rules each
# large sheet has and their features, and an edit resolving only its
# rule's `url()`s.
test = ["sh", "-c", "cargo test -q -p dom --test it style_elements && cargo test -q -p style --test it -- invalidation:: stylesheet:: && cargo test -q -p dom_js --test it style_sheets:: && cargo test -q -p shell --test it -- style_sheets::"]
timeout = 2400

# --- dom: the element's sheet and script's object ---

[[mutant]]
name = "the old object still the sheet when it is made again"
file = "crates/dom/src/scope.rs"
from = '''            crate::version::bump(&mut sheet.generation);'''
to = '''            let _ = &sheet.generation;'''

[[mutant]]
name = "any object of the element its sheet"
file = "crates/dom/src/style_element.rs"
from = '''            .is_some_and(|data| data.sheet.borrow().generation == owner.generation);'''
to = '''            .is_some();'''

[[mutant]]
name = "an edit through the object not the element's"
file = "crates/dom/src/css_style_sheet.rs"
from = '''        if let Some(element) = self.read().css_style_sheet_owner_node(sheet) {'''
to = '''        if let Some(element) = self.read().css_style_sheet_owner_node(sheet).filter(|_| false) {'''

[[mutant]]
name = "the object's media not the element's"
file = "crates/dom/src/css_style_sheet.rs"
from = '''                owned.media = Some(object.media.borrow().clone());'''
to = '''                let _ = &owned.media;'''

[[mutant]]
name = "the object's disabled not the element's"
file = "crates/dom/src/css_style_sheet.rs"
from = '''                .set(object.disabled.get());'''
to = '''                .set(false && object.disabled.get());'''

[[mutant]]
name = "the element's disabled not the object's"
file = "crates/dom/src/scope.rs"
from = '''            object.object().disabled.set(disabled);'''
to = '''            let _ = object.object();'''

[[mutant]]
name = "a media attribute not the object's"
file = "crates/dom/src/style_element.rs"
from = '''            *object.media.borrow_mut() = new.clone();'''
to = '''            let _ = object;'''

[[mutant]]
name = "a title attribute not the object's"
file = "crates/dom/src/style_element.rs"
from = '''        *owner.title.borrow_mut() = attribute(element, local_name!("title"));'''
to = '''        let _ = owner;'''

[[mutant]]
name = "a title marks the tree scope"
file = "crates/dom/src/scope.rs"
from = '''            if !name.is_attr(&local_name!("title")) {'''
to = '''            if true {'''

[[mutant]]
