from = '''    let x = match layer_origin(cx, this) {'''
to = '''    let x = match layer_origin(cx, this).filter(|_| false) {'''

[[mutant]]
name = "layerY from the layer's x"
file = "crates/dom_api/src/ui_event.rs"
from = '''        Some((_, y)) => mouse(this).client_y - y,'''
to = '''        Some((y, _)) => mouse(this).client_y - y,'''

