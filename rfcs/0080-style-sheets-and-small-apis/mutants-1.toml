# Stage 1: `toJSON`, `layerX`/`layerY`, `focus()`'s scrolling and the
# caret an editing host takes the focus with.
test = ["sh", "-c", "cargo test -q -p renderer --lib scroll:: && cargo test -q -p dom_js --test it geometry:: && cargo test -q -p shell --test it -- focus:: geometry::mouse_event_layer_coordinates"]
timeout = 1200

# --- toJSON ---

[[mutant]]
name = "toJSON out of the interface's order"
file = "crates/dom_api/src/geometry.rs"
from = '''        ("x", x),
        ("y", y),'''
to = '''        ("y", y),
        ("x", x),'''

[[mutant]]
name = "toJSON's left is right"
file = "crates/dom_api/src/geometry.rs"
from = '''        ("left", left),'''
to = '''        ("left", right),'''

