[[mutant]]
name = "the longest pause: the shortest run's"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''    longest = max((gc["longest_pause"] for gc in gcs), key=lambda pause: pause["ns"])'''
to = '''    longest = min((gc["longest_pause"] for gc in gcs), key=lambda pause: pause["ns"])'''

[[mutant]]
name = "the score: the first run's"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''        "value": common.median([value for got in runs for value in got["values"]]),'''
to = '''        "value": common.median(runs[0]["values"]),'''

[[mutant]]
name = "a pause of 1 ms isn't long"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''        "long_pauses": common.median([sum(ns >= LONG_PAUSE_NS for ns in gc["pauses_ns"]) for gc in gcs]),'''
to = '''        "long_pauses": common.median([sum(ns > LONG_PAUSE_NS for ns in gc["pauses_ns"]) for gc in gcs]),'''

[[mutant]]
name = "the GC's share of the whole GC"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''    return f"{100 * summary['gc_ns'] / summary['window_ns']:.0f}" if summary["window_ns"] else ""'''
to = '''    return f"{100 * summary['dom_ns'] / summary['window_ns']:.0f}" if summary["window_ns"] else ""'''

[[mutant]]
