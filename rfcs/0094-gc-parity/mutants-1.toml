# Stage 1: `bench.py blink-perf --gc`, `v8.memory` in both traces, V8's
# schedule in the report. The tool's own tests (the fake pages, in the
# dev build and Chrome for Testing; the dev build rebuilt for `bindings`'
# mutant).
test = ["python3", "scripts/bench/blink_perf/blink_perf_test.py"]
timeout = 900

[[mutant]]
name = "the span from any slice of the name"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''    user_timing = [event for event in events if event[4] == TIMED and common.USER_TIMING in event[5]]'''
to = '''    user_timing = [event for event in events if event[4] == TIMED]'''

[[mutant]]
name = "the runner's thread is the measure's track"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''    main = next((event[0] for event in user_timing if event[3] == 3), None)'''
to = '''    main = next((event[0] for event in user_timing if event[3] == 1), None)'''

[[mutant]]
name = "the measure's end: any on its track"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''if event[0] == begin[0] and event[3] == 2 and event[1:3] > begin[1:3]), default=None)'''
to = '''if event[0] == begin[0] and event[3] == 2), default=None)'''

[[mutant]]
name = "the measure's end: the last on its track"
file = "scripts/bench/blink_perf/blink_perf.py"
from = '''    last = min((event[1:3] for event in events'''
to = '''    last = max((event[1:3] for event in events'''

