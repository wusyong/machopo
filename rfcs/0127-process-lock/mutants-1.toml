# Stage 1's mutants (what the renderer says for itself: blob URLs by their loader, a new tab's initiator): `python3 scripts/test.py mutate rfcs/0127-process-lock/mutants-1.toml`.
test = ["sh", "-c", "cargo test -q -p browser --lib render_process_host && cargo test -q -p net --lib blob"]
timeout = 1200

[[mutant]]
name = "a blob URL of any origin is taken"
file = "crates/browser/src/render_process_host.rs"
from = '''        origin if origin == params.origin => Ok(true),
        url::Origin::Tuple(..) => Err(BadMessageReason::BlobUrlOriginMismatch),'''
to = '''        _ => Ok(true),'''

[[mutant]]
name = "an opaque blob URL is refused"
file = "crates/browser/src/render_process_host.rs"
from = '''        url::Origin::Opaque(_) => Ok(true),
        origin if origin == params.origin => Ok(true),'''
to = '''        url::Origin::Opaque(_) => Err(BadMessageReason::BlobUrlOriginMismatch),
        origin if origin == params.origin => Ok(true),'''

