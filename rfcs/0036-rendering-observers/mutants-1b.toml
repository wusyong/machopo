# Mutation test of step 1b (the rendering update's gather, broadcast and
# loop):
# python3 scripts/test.py mutate rfcs/0036-rendering-observers/mutants-1b.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "resize_observers::"]
timeout = 900

# dom_api: the sizes.

[[mutant]]
name = "the content box keeps the padding"
file = "crates/dom_api/src/resize_observer.rs"
from = '''                (border_box.width - left - right - padding_left - padding_right).max(0.0);'''
to = '''                (border_box.width - left - right).max(0.0);'''

[[mutant]]
name = "the content rect starts at the border box"
file = "crates/dom_api/src/resize_observer.rs"
from = '''                    f64::from(padding_left),
                    f64::from(padding_top),'''
to = '''                    0.0,
                    0.0,'''

[[mutant]]
name = "an SVG element without a box is 0x0"
file = "crates/dom_api/src/resize_observer.rs"
from = '''        (None, Some(svg)) if svg.client_rect.is_some() => ('''
to = '''        (None, Some(svg)) if svg.client_rect.is_some() && false => ('''

[[mutant]]
name = "an inline element has its box"
file = "crates/dom_api/src/resize_observer.rs"
from = '''    let block_box = element_box.and_then(|b| b.block.map(|block| (b.border_box, block)));'''
to = '''    let block_box = element_box.map(|b| (b.border_box, b.block.unwrap_or(dom::BlockBox { border: [0.0; 4], padding: [0.0; 4], margin: [0.0; 4], inset: [0.0; 4], scroll_size: gfx::SizeF::new(0.0, 0.0), scroll: None })));'''

