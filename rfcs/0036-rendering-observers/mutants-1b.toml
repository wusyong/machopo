# renderer: the loop.

[[mutant]]
name = "one round only"
file = "crates/renderer/src/render_thread.rs"
from = '''            if !broadcast {
                break;
            }'''
to = '''            break;'''

[[mutant]]
name = "the rounds after the first aren't laid out"
file = "crates/renderer/src/render_thread.rs"
from = '''        loop {
            self.update_lifecycle_to_pre_paint();
            let mut broadcast = false;'''
to = '''        self.update_lifecycle_to_pre_paint();
        loop {
            let mut broadcast = false;'''

[[mutant]]
name = "the depth stays where it started"
file = "crates/renderer/src/render_thread.rs"
from = '''                    depths[index] = depth;'''
to = '''                    let _ = depth;'''

[[mutant]]
name = "the loop runs after the focus fixup"
file = "crates/renderer/src/render_thread.rs"
from = '''        self.run_resize_observer_steps();
        self.run_focus_fixup();'''
to = '''        self.run_focus_fixup();
        self.update_title(false);
        self.run_resize_observer_steps();'''

[[mutant]]
name = "observing doesn't ask for a frame"
file = "crates/renderer/src/render_thread.rs"
from = '''        let newly_observed = observed != self.rendered_observations_versions;'''
to = '''        let newly_observed = false;'''
