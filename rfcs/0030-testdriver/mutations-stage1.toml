# The first stage's mutation tests: `python3 scripts/test.py mutate
# rfcs/0030-testdriver/mutations-stage1.toml`. Each runs `dom_js`'s
# `messaging` test (V8, real iframes, the DOM's tasks run as the renderer
# runs them), unless it names its own.
#
# Not here, as it is equivalent for now: `"/"` taken as `"*"`. They differ
# only when the caller's origin isn't the target document's, and kun's
# script reaches no window of another origin (not even its `postMessage`)
# and has no `document.domain` (`docs/testing.md`, the equivalent mutants).
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "messaging"]
timeout = 900

[[mutant]]
name = "the message is dispatched at once, not in a task"
file = "crates/dom_api/src/window.rs"
from = '''    queue_task(
        &mut cx.mutate(),
        this,
        TaskSource::PostedMessage,
        0.0,
        Task::PostMessage(Box::new(posted)),
    );'''
to = '''    let _ = TaskSource::PostedMessage;
    let _ = queue_task;
    let _ = Task::PostMessage;
    deliver_message(cx, posted);'''

