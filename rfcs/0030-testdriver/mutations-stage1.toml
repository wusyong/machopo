        origin: origin.into_string(),
        last_event_id: last_event_id.into_string(),
        serialized: None,
    };
    let mut m = cx.mutate();'''
to = '''    let fields = MessageEventData {
        origin: origin.into_string(),
        last_event_id: last_event_id.into_string(),
        serialized: cx.read().message_event_data(this).and_then(|data| data.serialized),
    };
    let mut m = cx.mutate();'''

