[[mutant]]
name = "the event's data isn't kept on the event"
file = "crates/dom_api/src/event.rs"
from = '''        let cache = Object::Event(this.clone());
        return Ok(ScriptOrSerialized::Serialized(SerializedState { state, cache }));'''
to = '''        let cache = Object::Window(cx.realm_window().expect("a realm"));
        return Ok(ScriptOrSerialized::Serialized(SerializedState { state, cache }));'''

[[mutant]]
name = "initMessageEvent keeps a posted message"
