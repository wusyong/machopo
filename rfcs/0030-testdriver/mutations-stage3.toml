# The third stage's mutation tests: `python3 scripts/test.py mutate
# rfcs/0030-testdriver/mutations-stage3.toml`. Each runs machopodriver's own
# `actions` tests (the key tables, the ticks, a window on a clock the test
# moves), unless it names its own: machopodriver against kun (`webdriver`), or
# kun's automation messages (`automation_pipe`).
#
# Not here: the input state a closed window leaves in the session's map
# (equivalent: nothing reaches it again, a window's handle isn't reused);
# the renderer dispatching the move waiting for a frame as its tab is
# hidden (no test can make the move reach the main thread before the
# hiding and after its last frame: input comes through the compositor
# thread, the hiding straight; in `docs/testing.md`).
test = ["cargo", "test", "-q", "-p", "driver", "--lib"]
timeout = 900

[[mutant]]
name = "the numpad's Enter isn't Enter"
file = "crates/driver/src/actions.rs"
from = '''        '\u{E006}' | '\u{E007}' => "Enter",'''
to = '''        '\u{E006}' => "Enter",'''

[[mutant]]
name = "the right-hand modifiers are on the left"
file = "crates/driver/src/actions.rs"
from = '''        Some('\u{E050}'..='\u{E053}') => 2,'''
to = '''        Some('\u{E050}'..='\u{E053}') => 1,'''

