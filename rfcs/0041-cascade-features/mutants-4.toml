# Mutation test of stage 4 (4a: :hover, :active and the mouse's boundary
# events; 4b: :lang(), :read-only / :read-write, :required / :optional and
# :target):
# python3 scripts/test.py mutate rfcs/0041-cascade-features/mutants-4.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "mouse::"]
timeout = 1800

# dom: the hover and active elements and their states.

[[mutant]]
name = "only the hover element is hovered, not its ancestors"
file = "crates/dom/src/scope.rs"
from = '''    let keep = new.map(|new| chain(new, state)).unwrap_or_default();'''
to = '''    let keep: Vec<&Node> = new.map(|new| vec![new]).unwrap_or_default();'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "focus::"]

[[mutant]]
name = "the old chain keeps its state"
file = "crates/dom/src/scope.rs"
from = '''                update_element_state(node, |current| current.difference(state));'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "focus::"]

[[mutant]]
name = "the active element's state is the hover one"
file = "crates/dom/src/scope.rs"
from = '''    if state == ElementState::HOVER {
        hover_element'''
to = '''    if true {
        hover_element'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "focus::"]

[[mutant]]
name = "removing the hover element leaves it hovered"
file = "crates/dom/src/scope.rs"
from = '''        unhover_removed(self, node);'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "focus::"]

[[mutant]]
name = "removing anything moves the hover element"
file = "crates/dom/src/scope.rs"
from = '''        if !is_shadow_including_inclusive_ancestor(removed, element) {
            continue;
        }'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "focus::"]

[[mutant]]
name = "the removed node's parent doesn't take its place"
file = "crates/dom/src/scope.rs"
from = '''        move_chain_state(Some(element), parent, state);'''
to = '''        let parent: Option<&Node> = None;
        move_chain_state(Some(element), parent, state);'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "--", "focus::"]

# style: matching.

[[mutant]]
name = ":hover matches the active state"
file = "crates/style/src/selector.rs"
from = '''        PseudoClass::Hover => ElementState::HOVER,'''
to = '''        PseudoClass::Hover => ElementState::ACTIVE,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "invalidation::"]

[[mutant]]
name = ":active never matches"
file = "crates/style/src/selector.rs"
from = '''            PseudoClass::Visited => false,'''
to = '''            PseudoClass::Visited | PseudoClass::Active => false,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "invalidation::"]

