to = '''        if !first.eq_ignore_ascii_case(tag_first) {'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "invalidation::lang"]

[[mutant]]
name = "lang matches the later subtags case-sensitively"
