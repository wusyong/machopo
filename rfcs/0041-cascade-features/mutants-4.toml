[[mutant]]
name = "a meta taken out again sets the content language"
file = "crates/dom_api/src/html_element.rs"
from = '''            Some(content) if pragma && crate::script::is_connected(meta) => {'''
to = '''            Some(content) if pragma => {'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "api::a_content_language"]

[[mutant]]
name = "an inserted meta does nothing"
file = "crates/dom_api/src/frame.rs"
from = '''            ElementChange::Meta(element) => crate::html_element::meta_inserted(cx, element),'''
to = '''            ElementChange::Meta(_) => {}'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "api::a_content_language"]

[[mutant]]
name = "a navigation to a fragment doesn't set the target"
file = "crates/dom_api/src/navigation.rs"
from = '''        update_target_element(m, document, &url);
'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "location::"]

[[mutant]]
name = "a fragment naming nothing keeps the old target"
file = "crates/dom_api/src/navigation.rs"
from = '''    m.set_target_element(document, target.as_ref());'''
to = '''    if target.is_some() {
        m.set_target_element(document, target.as_ref());
    }'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "location::"]

# renderer and browser: when the target is set, and where the content
# language comes from.

[[mutant]]
name = "parsing doesn't set the target"
file = "crates/renderer/src/render_thread.rs"
from = '''                        dom_api::navigation::update_target_element(
                            &mut dom.mutate(),
                            document,
                            &url,
                        );'''
to = '''                        let _ = (document, url);'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "history::the_target"]

[[mutant]]
name = "a traversal doesn't set the target"
file = "crates/renderer/src/render_thread.rs"
from = '''        dom_api::navigation::update_target_element(
            &mut self.dom.borrow_mut().mutate(),
            &document,
            &new_url,
        );
'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "history::the_target"]

[[mutant]]
name = "a committed document has no content language"
file = "crates/renderer/src/render_thread.rs"
from = '''            if let Some(language) = content_language.and_then(document::content_language) {
                m.set_content_language(&document, &language);
            }
'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "network::content_language"]

[[mutant]]
name = "an iframe's document has no content language"
file = "crates/renderer/src/render_thread.rs"
from = '''        if let Some(language) = &content_language {
            self.dom
                .borrow_mut()
                .mutate()
                .set_content_language(&document, language);
        }
'''
to = ''''''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "network::content_language"]

[[mutant]]
name = "the content language is the whole header"
file = "crates/renderer/src/document.rs"
from = '''    let language = header.split(',').next().unwrap_or_default();'''
to = '''    let language = header;'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "network::content_language"]

[[mutant]]
name = "the browser doesn't pass on Content-Language"
file = "crates/browser/src/web_contents.rs"
from = '''                    response.charset,
                    content_language,
                    response.body,'''
to = '''                    response.charset,
                    None,
                    response.body,'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "network::content_language"]
