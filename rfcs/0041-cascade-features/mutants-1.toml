# dom, dom_api and style: the inline style kept as declarations.

[[mutant]]
name = "CSSOM's declarations are parsed again from their text"
file = "crates/dom/src/scope.rs"
from = '''            text,
            Some(Arc::new(declarations)),'''
to = '''            text,
            None.filter(|_: &Arc<CssPropertyValueSet>| !declarations.is_empty()),'''
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it", "style_data::"]

[[mutant]]
