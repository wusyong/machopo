from = '''            let mut fallback = Output::default();
            substitute_into(input, &mut fallback, lookup)?;
            out.failed |= fallback.failed;'''
to = '''            let mut fallback = Output::default();
            substitute_into(input, &mut fallback, lookup)?;
            out.failed = true;'''

[[mutant]]
name = "a failed fallback is taken"
file = "crates/css/src/variables.rs"
from = '''            out.failed |= fallback.failed;'''
to = ''''''

