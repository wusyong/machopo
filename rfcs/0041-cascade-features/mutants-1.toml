# Mutation test of stage 1 (custom properties and var(): the trie, parsing
# and substituting, the cascade's winners, CSSOM):
# python3 scripts/test.py mutate rfcs/0041-cascade-features/mutants-1.toml
test = ["cargo", "test", "-q", "-p", "computed_style", "-p", "css", "-p", "style"]
timeout = 600

# computed_style: the trie.

[[mutant]]
name = "setting the same value copies the path anyway"
file = "crates/computed_style/src/variables.rs"
from = '''        if self.entry(&entry.name) == Some(&entry) {
            return;
        }'''
to = ''''''

[[mutant]]
name = "a split slot's entries stay at the same level"
file = "crates/computed_style/src/variables.rs"
from = '''                for old in std::mem::take(entries) {
                    child.insert(old, shift + BITS);
                }
                child.insert(entry, shift + BITS);'''
to = '''                for old in std::mem::take(entries) {
                    child.insert(old, shift);
                }
                child.insert(entry, shift);'''

