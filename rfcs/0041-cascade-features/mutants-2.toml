file = "crates/css/src/values.rs"
from = '''                        ViewportAxis::Min => size.width.min(size.height),'''
to = '''                        ViewportAxis::Min => size.width.max(size.height),'''

[[mutant]]
name = "a style that used the viewport doesn't say so"
file = "crates/css/src/values.rs"
from = '''                    used.set(true);'''
to = ''''''

# style: viewport units' recalc.

[[mutant]]
name = "a new viewport styles nothing again"
file = "crates/style/src/lib.rs"
from = '''                || (viewport_changed && old.as_ref().is_some_and(|old| old.has_viewport_units))'''
to = ''''''

[[mutant]]
name = "a new viewport visits only what is marked"
file = "crates/style/src/lib.rs"
from = '''            if restyle || flags.child_needs_style_recalc || viewport_changed {'''
to = '''            if restyle || flags.child_needs_style_recalc {'''

[[mutant]]
name = "any new viewport asks for a recalc"
file = "crates/style/src/lib.rs"
from = '''        self.viewport_changed.set(true);
        self.viewport_used.get()'''
to = '''        self.viewport_changed.set(true);
        true'''

[[mutant]]
name = "the same viewport asks for a recalc"
file = "crates/style/src/lib.rs"
from = '''        if self.viewport.replace(viewport) == viewport {
            return false;
        }'''
to = '''        if self.viewport.replace(viewport) == viewport {
            return self.viewport_used.get();
        }'''

# style: sizes.

[[mutant]]
name = "a lone calc() in sizes is a condition"
file = "crates/css/src/media.rs"
from = '''                if with_condition.is_ok() {
                    return with_condition;
                }'''
to = '''                return with_condition;'''
test = ["cargo", "test", "-q", "-p", "css", "--lib", "media::"]

# layout: calc() through taffy.

[[mutant]]
name = "taffy's calc() isn't clamped"
file = "crates/layout/src/calc.rs"
from = '''        if calc.non_negative { v.max(0.0) } else { v }'''
to = '''        v'''
test = ["cargo", "test", "-q", "-p", "layout", "calc"]

[[mutant]]
name = "a calc() is its percentage alone in taffy"
file = "crates/layout/src/lib.rs"
from = '''        } => taffy::LengthPercentage::calc(calcs.handle(px, percent, non_negative)),'''
to = '''        } => {
            let _ = (px, non_negative);
            taffy::LengthPercentage::percent(percent / 100.0)
        }'''
test = ["cargo", "test", "-q", "-p", "layout", "calc"]

# renderer: a new viewport restyles. (The resize scenario can't tell:
# about:demo's animation dirties the style every frame.)

[[mutant]]
name = "the renderer ignores a new viewport's styles"
file = "crates/renderer/src/frame_view.rs"
from = '''        if self.style_engine.set_viewport(self.viewport) {
            self.style_dirty = true;
        }'''
to = '''        let _ = self.style_engine.set_viewport(self.viewport);'''
test = ["cargo", "test", "-q", "-p", "renderer", "--lib", "frame_view::tests::a_new_viewport"]
