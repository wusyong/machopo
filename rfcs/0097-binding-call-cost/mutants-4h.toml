# Before stage 4h (decision 35): what a member's function asks of the
# front end's side in its operation every front end has (an aborted
# signal's reason carried by the error, an `ImageData`'s pixels by the
# result, an array's bytes read from its edge, `HTMLElement`'s
# constructor's `new.target`; three argument types carry their nodes as
# handles). Stage 4h: a constructor is called with V8's callback info
# alone.
test = ["cargo", "test", "-q", "-p", "dom_api", "-p", "dom_js", "-p", "dom_wasm"]
timeout = 1800

[[mutant]]
name = "an aborted signal's reason is undefined when thrown"
file = "crates/dom_js/src/front.rs"
from = '''            cx.abort_reason(signal.get(cx.gc))
                .and_then(|edge| no_gc.strong_value(edge))'''
to = '''            let _ = (cx, &mut no_gc);
            None::<v8::Local<'_, v8::Value>>'''

[[mutant]]
name = "an aborted body's read throws nothing"
file = "crates/dom_api/src/body.rs"
from = '''            .filter(|&signal| cx.abort_reason(signal).is_some())'''
to = '''            .filter(|&signal| cx.abort_reason(signal).is_none())'''

[[mutant]]
name = "a signal not aborted throws"
file = "crates/dom_api/src/abort.rs"
from = '''        None => Ok(()),
        Some(_) => Err(ApiError::aborted(cx, this)),'''
to = '''        None | Some(_) => Err(ApiError::aborted(cx, this)),'''

[[mutant]]
name = "an image data's pixels aren't made its array"
file = "crates/dom_api/src/typed.rs"
from = '''        front.finish_image_data_pixels(image_data, pixels);
        <crate::interfaces::ImageData as RetType>::finish(front, object);'''
to = '''        let _ = (image_data, pixels);
        <crate::interfaces::ImageData as RetType>::finish(front, object);'''

[[mutant]]
name = "a constructed image data's pixels aren't made its array"
file = "crates/dom_api/src/typed.rs"
from = '''        ConstructPending::Pixels(image_data, bytes) => {
            front.finish_image_data_pixels(image_data, bytes);
        }'''
to = '''        ConstructPending::Pixels(image_data, bytes) => {
            let _ = (image_data, bytes);
        }'''

[[mutant]]
name = "the info front end makes no array of pixels"
file = "crates/dom_js/src/info_front.rs"
from = '''        self.with_front(|front| front.finish_image_data_pixels(image_data, bytes));'''
to = '''        let _ = (image_data, bytes);'''

[[mutant]]
name = "an array's bytes are never there"
file = "crates/dom_js/src/info_front.rs"
from = '''            Some(array) => {
                let mut storage = [0; v8::TYPED_ARRAY_MAX_SIZE_IN_HEAP];
                f(Some(array.get_contents(&mut storage)));
            }
            None => f(None),
        }
    }

    /// The current realm's window, of a member that asked for it'''
to = '''            Some(_) | None => f(None),
        }
    }

    /// The current realm's window, of a member that asked for it'''

