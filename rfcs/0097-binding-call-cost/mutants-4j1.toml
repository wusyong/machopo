# blob and `URLSearchParams`, `RequestInit`'s signal and a
# `Uint8ClampedArray` argument are the front end's handles
# (`FrontTypes::Node`, `Any`), made the DOM's in the operation.
test = ["cargo", "test", "-q", "-p", "dom_api", "-p", "dom_js", "-p", "dom_wasm"]
