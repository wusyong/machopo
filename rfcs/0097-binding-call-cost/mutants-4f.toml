# Stage 4f: a result the engine allocates for (an array, a dictionary, a
# promise, a value made at the first ask) leaves the operation as its
# type's own data (`RetType::Pending`) and is made after it by a method of
# the front end's of its own (`Front::finish_objects`...); no promise is
# made ahead of an operation.
test = ["cargo", "test", "-q", "-p", "dom_api", "-p", "dom_js", "-p", "dom_wasm"]
timeout = 1800

[[mutant]]
name = "the info front end gives no objects"
file = "crates/dom_js/src/info_front.rs"
from = '''        self.with_front(|front| front.finish_objects(objects));'''
to = '''        let _ = objects;'''

