[[mutant]]
name = "a sequence loses its last object"
file = "crates/dom_api/src/typed.rs"
from = '''            (cx.root_object(object), interface_of(cx, object))
        })
        .collect()
}'''
to = '''            (cx.root_object(object), interface_of(cx, object))
        })
        .skip(1)
        .collect()
}'''

[[mutant]]
name = "a frozen array of numbers is new each time"
file = "crates/dom_js/src/front.rs"
from = '''        let array = frozen_array(scope, this, &values);
        self.rv().set(array.into());
    }

    fn finish_dictionary('''
to = '''        let _ = this;
        let array = v8::Array::new_with_elements(scope, &values);
        self.rv().set(array.into());
    }

    fn finish_dictionary('''

[[mutant]]
name = "a frozen array of objects is new each time"
file = "crates/dom_js/src/front.rs"
from = '''        let this = self.args.this();
        let array = frozen_array(self.scope.scope(), this, &wrappers);'''
to = '''        let array = v8::Array::new_with_elements(self.scope.scope(), &wrappers);'''

[[mutant]]
name = "a promise resolved with undefined isn't given"
file = "crates/dom_js/src/front.rs"
from = '''        let undefined = v8::undefined(self.scope.scope());
        self.resolve(undefined.into());'''
to = ''''''

[[mutant]]
name = "a promise of bytes is of a view when it isn't"
file = "crates/dom_js/src/front.rs"
from = '''        let value: v8::Local<'_, v8::Value> = if view {
            v8::Uint8Array::new(scope, buffer, 0, len)'''
to = '''        let value: v8::Local<'_, v8::Value> = if !view {
            v8::Uint8Array::new(scope, buffer, 0, len)'''

[[mutant]]
name = "an existing pending promise is made again"
file = "crates/dom_api/src/typed.rs"
from = '''            PromiseOf::Existing(id) => PromisePending::Pending(id, true),'''
to = '''            PromiseOf::Existing(id) => PromisePending::Pending(id, false),'''

[[mutant]]
name = "a pending promise's resolver isn't kept"
file = "crates/dom_js/src/front.rs"
from = '''            let global = v8::Global::new(self.scope.scope(), resolver);
            let (state, _) = self.scope.state_mut();
            state.when_defined.insert(id, global);
            resolver'''
to = '''            resolver'''

[[mutant]]
name = "a defined name's promise is pending"
file = "crates/dom_api/src/custom_elements.rs"
from = '''        return Ok(PromiseOf::Defined(definition));'''
to = '''        let _ = definition;'''

[[mutant]]
name = "an animation's finished promise is its ready one"
file = "crates/dom_api/src/typed.rs"
from = '''            interface_of(cx, ObjectRef::EventTarget(promise.object)),
            promise.ready,'''
to = '''            interface_of(cx, ObjectRef::EventTarget(promise.object)),
            true,'''

[[mutant]]
name = "a reader's buffer is never made"
file = "crates/dom_api/src/typed.rs"
from = '''            Some(ReaderPending::Buffer(reader)) => front.finish_reader_buffer(reader),'''
to = '''            Some(ReaderPending::Buffer(_)) => {}'''

[[mutant]]
name = "a dictionary as a result has no members"
file = "crates/dom_api_macros/src/lib.rs"
from = '''                let mut #dict = ::std::vec::Vec::new();
                #(#outs)*
                #dict
            }'''
to = '''                let #dict = ::std::vec::Vec::new();
                let _ = #value;
                #dict
            }'''

[[mutant]]
name = "a body's promise is plain"
file = "crates/dom_api/src/interfaces.rs"
from = '''        method text() -> Rethrowing<PromiseOfString> = request::text;'''
to = '''        method text() -> PromiseOfString = request::text;'''

[[mutant]]
name = "a sequence isn't plain"
file = "crates/dom_api/src/typed.rs"
from = '''    const DESC: TypeDesc = TypeDesc::Sequence(I::DESC.name);
    const PLAIN: bool = true;'''
to = '''    const DESC: TypeDesc = TypeDesc::Sequence(I::DESC.name);'''
