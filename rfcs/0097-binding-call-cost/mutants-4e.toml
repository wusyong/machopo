# Stage 4e: a value of any type, a call's rest arguments and a
# dictionary's object are the front end's handles (`FrontTypes`' `Any`,
# `Rest`; a dictionary of its handle types); nodes or strings and an
# element or a number taken from the callback's info; an event handler's
# getter one operation, its uncompiled source compiled after it; any
# value as a result from its edge's handle.
test = ["cargo", "test", "-q", "-p", "dom_api", "-p", "dom_js", "-p", "dom_wasm"]
timeout = 1800

[[mutant]]
name = "a node among nodes or strings is converted to a string"
file = "crates/dom_js/src/info_front.rs"
from = '''        if bindings::is_wrapper::<Node>(self.info.isolate(), value) {
            return v8::Local::<v8::Object>::try_from(value)
                .ok()
                .map(dom_api::typed::NodeOrStr::Node);
        }
        self.string_arg(index).map(dom_api::typed::NodeOrStr::Str)'''
to = '''        self.string_arg(index).map(dom_api::typed::NodeOrStr::Str)'''

