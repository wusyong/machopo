# Mutation test of stage 2: list items, `::marker`, `list-style-*` and the
# counters (2026-10-14):
# python3 scripts/test.py mutate rfcs/0045-generated-content-lists/mutants-2.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "lists::", "update::markers", "update::counters"]
timeout = 600

[[mutant]]
name = "::marker isn't parsed"
file = "crates/css/src/selector.rs"
from = '''        } else if name.eq_ignore_ascii_case("marker") {'''
to = '''        } else if false {'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "matching::a_list"]

