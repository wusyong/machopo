# Mutation test of stage 1: `::before`, `::after` and `content`, and the
# table `display` values (2026-10-14):
# python3 scripts/test.py mutate rfcs/0045-generated-content-lists/mutants-1.toml
test = ["cargo", "test", "-q", "-p", "layout", "--test", "it", "--", "generated::", "update::pseudo"]
timeout = 600

[[mutant]]
name = "::before isn't parsed"
file = "crates/css/src/selector.rs"
from = '''        if name.eq_ignore_ascii_case("before") {'''
to = '''        if false {'''

[[mutant]]
name = "attr() isn't parsed"
file = "crates/css/src/properties.rs"
from = '''            cssparser::Token::Function(name) if name.eq_ignore_ascii_case("attr") => input'''
to = '''            cssparser::Token::Function(name) if false && name.eq_ignore_ascii_case("attr") => input'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "cssom::"]

[[mutant]]
name = "attr() is serialized without its name"
file = "crates/css/src/serialize.rs"
from = '''                        dest.push_str("attr(");'''
to = '''                        dest.push_str("(");'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "cssom::"]

[[mutant]]
name = "display: table isn't parsed"
file = "crates/css/src/properties.rs"
from = '''                    "table" => computed_style::Display::Table(TableDisplay::Table),'''
to = '''                    "tabl" => computed_style::Display::Table(TableDisplay::Table),'''

[[mutant]]
name = "a pseudo-element's rule is in the other bucket"
file = "crates/css/src/rule_set.rs"
from = '''            if iter.next_sequence() != Some(Combinator::PseudoElement) {'''
to = '''            if true {'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "matching::"]

[[mutant]]
name = "a table isn't block-level"
file = "crates/computed_style/src/lib.rs"
from = '''            Self::Block | Self::Flex | Self::Grid | Self::Table(_) | Self::ListItem'''
to = '''            Self::Block | Self::Flex | Self::Grid | Self::ListItem'''

[[mutant]]
name = "an inline-table isn't blockified"
file = "crates/computed_style/src/lib.rs"
from = '''            Self::InlineTable => Self::Table(TableDisplay::Table),'''
to = '''            Self::InlineTable => Self::InlineTable,'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "computed::table"]

[[mutant]]
name = "an inline-table isn't an atomic inline"
file = "crates/computed_style/src/lib.rs"
from = '''            Self::InlineBlock | Self::InlineFlex | Self::InlineGrid | Self::InlineTable'''
to = '''            Self::InlineBlock | Self::InlineFlex | Self::InlineGrid'''

[[mutant]]
name = "a table column has a box"
file = "crates/computed_style/src/lib.rs"
from = '''            Self::None | Self::Table(TableDisplay::Column | TableDisplay::ColumnGroup)'''
to = '''            Self::None'''

[[mutant]]
name = "a pseudo-element's selector matches as an element's"
file = "crates/style/src/lib.rs"
from = '''                    let context = &mut *contexts[usize::from(pseudo.is_some())];'''
to = '''                    let context = &mut *contexts[0];'''

[[mutant]]
name = "a pseudo-element's rule is the element's"
file = "crates/style/src/lib.rs"
from = '''                        let slot = &mut specificity[target_index(pseudo)];'''
to = '''                        let slot = &mut specificity[0];'''
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "matching::"]

[[mutant]]
