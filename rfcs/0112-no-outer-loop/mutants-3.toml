[[mutant]]
name = "a timer due later is queued at once"
file = "crates/renderer/src/task_queue.rs"
from = '''        if at <= Instant::now() {
            let _ = self.post(queue, task, false);'''
to = '''        if at <= Instant::now() || queue == TaskQueue::Dom {
            let _ = self.post(queue, task, false);'''

[[mutant]]
name = "a token's task runs by the DOM's clock alone"
