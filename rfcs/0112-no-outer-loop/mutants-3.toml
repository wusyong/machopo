# Stage 3's mutants: `python3 scripts/test.py mutate rfcs/0112-no-outer-loop/mutants-3.toml`.
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it"]
timeout = 240

[[mutant]]
name = "a task queued now isn't told to the scheduler"
file = "crates/dom/src/tasks.rs"
from = '''        let number = self.next_task_number();
        self.wake_for_task(number, None);'''
to = '''        let number = self.next_task_number();'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "event_loop::"]

