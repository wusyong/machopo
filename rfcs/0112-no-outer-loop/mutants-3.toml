name = "a timer set isn't told to the scheduler"
file = "crates/dom/src/window.rs"
from = '''        timers.push(self.gc, timer);
        self.wake_for_task('''
to = '''        timers.push(self.gc, timer);
        let _ = ('''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "event_loop::"]

