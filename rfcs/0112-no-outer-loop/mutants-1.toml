# Stage 1's mutants: `python3 scripts/test.py mutate rfcs/0112-no-outer-loop/mutants-1.toml`.
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "devtools"]
timeout = 1200

[[mutant]]
name = "a frame made isn't told attached as it is made"
file = "crates/renderer/src/render_thread/page_agent.rs"
from = '''        if self.enabled.borrow().is_empty() {
            return;
        }
        let mut attached = json!({ "frameId": id, "parentFrameId": parent });'''
to = '''        if self.enabled.borrow().len() < 9 {
            return;
        }
        let mut attached = json!({ "frameId": id, "parentFrameId": parent });'''

[[mutant]]
name = "a frame made doesn't flush the DOM's changes first"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        if self.dom_agent.any_enabled() {
            self.dom_agent.take_changes(dom);
        }'''
to = '''        if self.dom_agent.any_enabled() && false {
            self.dom_agent.take_changes(dom);
        }'''

[[mutant]]
name = "a frame made isn't told to the host"
file = "crates/dom_js/src/frames.rs"
from = '''            client.child_frame_created(
                parent_token,
                token,
                &name,
                created_by_script,
                stack.as_deref(),
                &state.dom,
            );'''
to = '''            let _ = (parent_token, client, created_by_script, &name);'''

[[mutant]]
name = "a frame made has no stack"
file = "crates/dom_js/src/frames.rs"
from = '''        .frame_stacks_wanted()
        .then(|| crate::state::capture_stack(scope))'''
to = '''        .frame_stacks_wanted()
        .then(|| None::<std::rc::Rc<str>>)'''

[[mutant]]
name = "a frame gone isn't told at once"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        self.page_agent.frame_detached(&frame.to_string());'''
to = '''        let _ = frame;'''

[[mutant]]
name = "a frame gone is told before the frames in it"
file = "crates/renderer/src/render_thread/page_agent.rs"
from = '''        for frame in gone.iter().rev() {'''
to = '''        for frame in gone.iter() {'''

[[mutant]]
name = "a frame gone doesn't take the frames attached in it"
file = "crates/renderer/src/render_thread/page_agent.rs"
from = '''            .chain(
                attached
                    .iter()
                    .map(|(frame, parent)| (frame.clone(), Some(parent.clone()))),
            )'''
to = '''            .chain(
                attached
                    .iter()
                    .map(|(frame, parent)| (frame.clone(), Some(parent.clone())))
                    .filter(|_| false),
            )'''

