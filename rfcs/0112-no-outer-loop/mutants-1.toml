[[mutant]]
name = "a document the renderer commits isn't named by its number"
file = "crates/renderer/src/render_thread/page_agent.rs"
from = '''        if loader_is_document {
            frame.loader_id = document.to_string();
        }'''
to = '''        if loader_is_document && document == 0 {
