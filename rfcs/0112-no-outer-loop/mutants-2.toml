from = '''                if !replace && self.frame_token(frame).is_some() {
                    self.own_history_entries.sent_one();
                }'''
to = '''                if !replace && self.frame_token(frame).is_some() && false {
                    self.own_history_entries.sent_one();
                }'''
test = ["cargo", "test", "-q", "-p", "browser"]

[[mutant]]
