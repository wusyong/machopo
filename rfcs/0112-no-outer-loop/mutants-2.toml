# Stage 2's mutants: `python3 scripts/test.py mutate rfcs/0112-no-outer-loop/mutants-2.toml`.
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it"]
timeout = 1800

[[mutant]]
name = "script's navigation isn't told to the client as it is asked"
file = "crates/dom_js/src/frames.rs"
from = '''        .and_then(|client| client.navigate(&asked, &state.dom));'''
to = '''        .and_then(|client| client.navigate(&asked, &state.dom).filter(|_| false));'''

[[mutant]]
name = "the wasm engine doesn't tell its client of a navigation"
file = "crates/dom_wasm/src/engine.rs"
from = '''            .and_then(|client| client.navigate(&asked, dom));'''
to = '''            .and_then(|client| client.navigate(&asked, dom).filter(|_| false));'''
test = ["cargo", "test", "-q", "-p", "dom_wasm", "--test", "it"]

[[mutant]]
name = "an iframe's navigation isn't told to the client as it is asked"
file = "crates/dom_js/src/frames.rs"
from = '''        .and_then(|client| client.navigate_child(&asked, &state.dom));'''
to = '''        .and_then(|client| client.navigate_child(&asked, &state.dom).filter(|_| false));'''

[[mutant]]
name = "an iframe's navigation doesn't make its frame loading at once"
file = "crates/dom_js/src/frames.rs"
from = '''    if begin_id.is_some() {
        state
            .dom
            .mutate(|cx| cx.set_frame_navigating(frame_document.get(cx.gc), true));
    }'''
to = '''    if begin_id.is_some() && false {
        state
            .dom
            .mutate(|cx| cx.set_frame_navigating(frame_document.get(cx.gc), true));
    }'''

[[mutant]]
name = "script's navigation of a child frame doesn't make it loading at once"
file = "crates/dom_js/src/frames.rs"
from = '''    if begin_id.is_some() && frame != TOP {'''
to = '''    if begin_id.is_some() && frame != TOP && false {'''

[[mutant]]
name = "the client sends no navigation to another document"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''        let id = crate::loader::next_begin_navigation_id();
        let _ = self.to_browser.send(RendererHostMsg::BeginNavigation {
            frame,
            initiator,
            id,
            kind,
            devtools_initiator: None,
            history_in_new_child_frame: false,
        });
        Some(id)'''
to = '''        let _ = (frame, initiator, kind);
        None'''

[[mutant]]
name = "the client sends a child frame's navigation to a fragment"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''    if wanted.fragment().is_none() {
        return false;
    }'''
to = '''    if wanted.fragment().is_none() || true {
        return false;
    }'''

[[mutant]]
name = "the browser hears of no iframe's srcdoc"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''                .send(RendererHostMsg::DidChangeSrcDoc { frame, srcdoc });'''
to = '''                .send(RendererHostMsg::DidChangeSrcDoc { frame, srcdoc: String::new() });'''

[[mutant]]
name = "an iframe's navigation has no script's stack for DevTools"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''            Some(stack) => Some(Initiator::Script(Rc::from(stack))),'''
to = '''            Some(_) => None,'''

[[mutant]]
name = "an iframe's navigation is never the session history's"
file = "crates/renderer/src/render_thread/documents.rs"
from = '''            history_in_new_child_frame: history_navigation_in_new_child_frame('''
to = '''            history_in_new_child_frame: false && history_navigation_in_new_child_frame('''
test = ["cargo", "test", "-q", "-p", "browser"]

[[mutant]]
name = "a new frame's initial document isn't told before its navigation"
