from = '''        if asked.initial && self.page_agent.any_enabled() {'''
to = '''        if asked.initial && self.page_agent.any_enabled() && false {'''

[[mutant]]
name = "the initial document's init is told twice"
file = "crates/renderer/src/render_thread/page_agent.rs"
from = '''        if !told {
            event("init");
        }'''
to = '''        if !told || true {
            event("init");
        }'''

[[mutant]]
name = "a pushState's entry isn't counted"
