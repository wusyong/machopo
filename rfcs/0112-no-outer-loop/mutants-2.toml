        self.end_cancellation_windows();
        self.tell_devtools_after_task();'''
to = '''        self.blob_urls.flush_revoked();
        self.tell_devtools_after_task();'''

[[mutant]]
name = "the windows end before the revokes"
file = "crates/renderer/src/render_thread.rs"
from = '''        self.blob_urls.flush_revoked();
        self.end_cancellation_windows();
        self.tell_devtools_after_task();'''
to = '''        self.end_cancellation_windows();
        self.blob_urls.flush_revoked();
        self.tell_devtools_after_task();'''
