                };'''
to = '''                    text_right - fragment.advance
                };'''

[[mutant]]
name = "the first run has the soft hyphen"
file = "crates/layout/src/text.rs"
from = '''        .any(|cluster| cluster.style_index() == style && cluster.text_range().end == end)'''
to = '''        .any(|cluster| cluster.style_index() == style || cluster.text_range().end == end)'''

[[mutant]]
name = "the hyphen keeps the style it was shaped in"
file = "crates/layout/src/text.rs"
from = '''                fragment.style = style;
'''
to = ''''''

[[mutant]]
name = "the hyphen is no element's"
file = "crates/layout/src/text.rs"
from = '''                fragment.node = owner.map(|owner| owner.node);
                fragment.pseudo = owner.and_then(|owner| owner.pseudo);
                fragment.style = style;'''
to = '''                fragment.style = style;'''

[[mutant]]
name = "the hyphen isn't moved with its element"
file = "crates/layout/src/text.rs"
from = '''                fragment.translate(by);
                children.push(('''
to = '''                children.push(('''

[[mutant]]
name = "hyphens lay nothing out again"
file = "crates/layout/src/lib.rs"
from = '''                    user_modify: old.rare_inherited.user_modify,
'''
to = '''                    user_modify: old.rare_inherited.user_modify,
                    hyphens: old.rare_inherited.hyphens,
'''
