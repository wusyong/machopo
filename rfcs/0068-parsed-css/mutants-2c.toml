from = '''        StyleProperty::SoftHyphens(s.soft_hyphens),
'''
to = ''''''

[[mutant]]
name = "no room on the left in RTL"
file = "crates/layout/src/text.rs"
from = '''                metrics.hyphen_advance
            } else {
                0.0
            };'''
to = '''                0.0
            } else {
                0.0
            };'''

[[mutant]]
