from = '''                    BorderImageWidth::LengthPercentage(v) => lp(v),'''
to = '''                    BorderImageWidth::LengthPercentage(_) => {}'''

[[mutant]]
name = "a negative outset"
file = "crates/css/src/interpolate.rs"
from = '''                    BorderImageOutset::Number(v) | BorderImageOutset::Px(v) => *v = v.max(0.0),'''
to = '''                    BorderImageOutset::Number(_) | BorderImageOutset::Px(_) => {}'''

