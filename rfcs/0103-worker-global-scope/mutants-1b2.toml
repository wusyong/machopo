# 1b-2: a worker's global in dom, its execution context's timers, tasks and
# messages (the functions taking an execution context, not a window).
test = ["cargo", "test", "-q", "-p", "dom", "--test", "it"]
timeout = 600

[[mutant]]
name = "a worker's base URL is its document's"
file = "crates/dom/src/execution_context.rs"
from = '''        if let Some(global) = context.worker.get(self.gc) {
            return Some(self.worker_global_url(global).clone());'''
to = '''        if let Some(global) = None::<Gc<'gc, crate::WorkerGlobalScope>> {
            return Some(self.worker_global_url(global).clone());'''

[[mutant]]
name = "a worker's URL is its document's"
file = "crates/dom/src/execution_context.rs"
from = '''        if let Some(global) = context.worker.get(self.gc) {
            return Some(crate::DomString::new('''
to = '''        if let Some(global) = None::<Gc<'gc, crate::WorkerGlobalScope>> {
            return Some(crate::DomString::new('''

[[mutant]]
name = "a worker's origin is its document's"
file = "crates/dom/src/execution_context.rs"
from = '''        if let Some(global) = context.worker.get(self.gc) {
            return Some(self.worker_global_origin(global).clone());'''
to = '''        if let Some(global) = None::<Gc<'gc, crate::WorkerGlobalScope>> {
            return Some(self.worker_global_origin(global).clone());'''

[[mutant]]
name = "a message posted to a worker's global is for a window"
file = "crates/dom/src/execution_context.rs"
from = '''            Some(global) => crate::TargetRef::WorkerGlobal(global),'''
to = '''            Some(_) => crate::TargetRef::Window(self.context_window(context).expect("a context's global")),'''

[[mutant]]
name = "a worker's global isn't its context's global"
file = "crates/dom/src/worker_global.rs"
from = '''        self.set_context_worker_global(context, global);'''
to = '''        let _ = context;'''

[[mutant]]
name = "a worker's global has no context as a target"
file = "crates/dom/src/event.rs"
from = '''            TargetRef::WorkerGlobal(global) => Some(self.worker_global_context(global)),'''
to = '''            TargetRef::WorkerGlobal(_) => None,'''

[[mutant]]
name = "a worker's global's listeners aren't read"
file = "crates/dom/src/event.rs"
from = '''            TargetRef::WorkerGlobal(global) => global.listeners.get(self.gc),'''
to = '''            TargetRef::WorkerGlobal(_) => None,'''

[[mutant]]
name = "an erased worker's global is a plain target"
file = "crates/dom/src/event.rs"
from = '''        match object.downcast::<crate::WorkerGlobalScope>() {
            Some(global) => Self::WorkerGlobal(global),'''
to = '''        match None::<Gc<'gc, crate::WorkerGlobalScope>> {
            Some(global) => Self::WorkerGlobal(global),'''

[[mutant]]
name = "a window's idle timeout isn't its task"
file = "crates/dom/src/tasks.rs"
from = '''                .and_then(|window| self.next_due_idle_timeout(window))'''
to = '''                .and_then(|_| None::<(f64, u64)>)'''
test = ["cargo", "test", "-q", "-p", "dom", "-p", "dom_api", "-p", "dom_js"]

[[mutant]]
name = "a window's idle timeout isn't due"
file = "crates/dom/src/window.rs"
from = '''            self.context_window(context)
                .and_then(|window| self.next_idle_timeout(window)),'''
to = '''            self.context_window(context)
                .and_then(|_| None::<f64>),'''
test = ["cargo", "test", "-q", "-p", "dom", "-p", "dom_api", "-p", "dom_js"]
