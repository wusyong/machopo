# 1b-1: script stopped from another thread (`TerminateExecution`) stops
# with what called it: no callback reports or clears it, no throw replaces
# it, no exception is made while it is pending, it is asked for again when
# a callback caught it (until the next outermost entry into script), and
# what would call script back while it is pending doesn't.
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it"]
timeout = 900

[[mutant]]
name = "a caught stop is reported and cleared"
file = "crates/dom_js/src/listeners.rs"
from = '''    if tc.has_terminated() {
        bindings::stop_again(tc);
        return;
    }'''
to = '''    if false {
        bindings::stop_again(tc);
        return;
    }'''

[[mutant]]
name = "a callback's caught stop isn't asked for again"
file = "crates/dom_js/src/listeners.rs"
from = '''    if tc.has_terminated() {
        bindings::stop_again(tc);'''
to = '''    if tc.has_terminated() {
        let _ = &tc;'''

[[mutant]]
name = "asking to stop again asks nothing"
file = "crates/bindings/src/lib.rs"
from = '''    scope.terminate_execution();
    trace::stop_until_next_entry(scope.thread_safe_handle());'''
to = '''    let _ = scope;
    trace::stop_until_next_entry(scope.thread_safe_handle());'''
test = ["cargo", "test", "-q", "-p", "bindings", "--test", "it", "termination::"]

[[mutant]]
name = "a stop asked for again outlives its script"
file = "crates/bindings/src/trace.rs"
from = '''        isolate.cancel_terminate_execution();'''
to = '''        let _ = isolate;'''
test = ["cargo", "test", "-q", "-p", "bindings", "--test", "it", "termination::"]

[[mutant]]
name = "a throw replaces the stop"
file = "crates/bindings/src/lib.rs"
from = '''    if scope.is_execution_terminating() {
        return;
    }
    scope.throw_exception(exception);'''
to = '''    if false {
        return;
    }
    scope.throw_exception(exception);'''

[[mutant]]
name = "nothing is ever stopped"
file = "crates/dom_js/src/listeners.rs"
from = '''    scope.is_execution_terminating()
}'''
to = '''    false
}'''

