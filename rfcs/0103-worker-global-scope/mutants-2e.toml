from = '''                            Some(true) => {
                                for message in early.take().into_iter().flatten() {
                                    engine.post_message(message);
                                }
                            }'''
to = '''                            Some(true) => {
                                drop(early.take());
                            }'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "workers::a_module_worker_s_graph"]

