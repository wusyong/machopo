# 2e: module workers, and import() in a worker.
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "worker::"]
timeout = 900

[[mutant]]
name = "a worker's graph's root isn't in the map"
file = "crates/dom_api/src/module.rs"
from = '''        self.map.insert(url.clone(), Entry::Fetched(module));
        let linker = self.new_linker(GraphFor::Worker, credentials);'''
to = '''        let linker = self.new_linker(GraphFor::Worker, credentials);'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--lib", "module::"]

[[mutant]]
name = "a worker's graph isn't linked"
file = "crates/dom_api/src/module.rs"
from = '''        if let GraphFor::Script(_) | GraphFor::Worker = target {'''
to = '''        if let GraphFor::Script(_) = target {'''

[[mutant]]
name = "a worker's graph is run before its imports come"
file = "crates/dom_api/src/module.rs"
from = '''        self.fetch_descendants(host, linker, module);
        let done = self.check_done(host, linker);
        let mut finished: Vec<Finished> = done.into_iter().collect();
        finished.extend(self.run(host));
        finished
    }

    /// HTML "fetch an inline module script graph": `source`, in the'''
to = '''        let done = self.check_done(host, linker);
        self.fetch_descendants(host, linker, module);
        let mut finished: Vec<Finished> = done.into_iter().collect();
        finished.extend(self.run(host));
        finished
    }

    /// HTML "fetch an inline module script graph": `source`, in the'''

[[mutant]]
name = "a module worker's graph is never told done"
file = "crates/dom_js/src/modules.rs"
from = '''                            worker.graph = Some(done);'''
to = '''                            drop(done);'''

