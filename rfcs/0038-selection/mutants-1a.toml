# dom_api: script setting the selection's range.

[[mutant]]
name = "setting the selection's range leaves the selection"
file = "crates/dom_api/src/range.rs"
from = '''    if let Some(selection) = selection {
        crate::selection::range_set(cx, &selection, this, before);
    }'''
to = ''''''

[[mutant]]
name = "the selection's range set out of the document stays"
file = "crates/dom_api/src/selection.rs"
from = '''    } else {
        cx.mutate().set_selection(selection, None, false);
    }'''
to = '''    } else {
        cx.mutate().set_selection(selection, Some(range), false);
    }'''

[[mutant]]
name = "setting the selection's range keeps its direction"
file = "crates/dom_api/src/selection.rs"
from = '''    if in_document(cx, selection, &start) && in_document(cx, selection, &end) {
        cx.mutate().set_selection(selection, Some(range), false);'''
to = '''    if in_document(cx, selection, &start) && in_document(cx, selection, &end) {
        let backward = cx.read().selection_is_backward(selection);
        cx.mutate().set_selection(selection, Some(range), backward);'''
