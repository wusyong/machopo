# Step 3b: `storage` events and `sessionStorage`. The browser tells every
# renderer with a `localStorage` area its changes (the one that made it
# with its `Storage`'s number), keeps each tab's `sessionStorage` in
# memory; the DOM takes the news in (not over a change made here and not
# told back yet), fires `storage` at the windows of the area but the
# source's (a `sessionStorage` change's at once), and a `storage`
# listener opens its window's areas.
test = [
    "sh", "-c",
    "cargo test -q -p dom --test it storage:: && cargo test -q -p browser --test it dom_storage::",
]
timeout = 1800

[[mutant]]
name = "a sessionStorage change fires nothing"
file = "crates/dom/src/storage.rs"
from = '''            self.queue_storage_events(area, Some(source), &event);
        }'''
to = '''            let _ = event;
        }'''

[[mutant]]
name = "a localStorage change made here isn't pending"
file = "crates/dom/src/storage.rs"
from = '''                entry.pending.push_back(mutation.key().map(str::to_owned));'''
to = ''''''

[[mutant]]
name = "a change told back stays pending"
file = "crates/dom/src/storage.rs"
from = '''                entry.pending.pop_front();'''
to = ''''''

[[mutant]]
name = "a clear made here doesn't hold another's change back"
file = "crates/dom/src/storage.rs"
from = '''.any(|pending| pending.as_deref().is_none_or(|pending| pending == key))'''
to = '''.any(|pending| pending.as_deref() == Some(key))'''

[[mutant]]
name = "another's clear clears the keys changed here"
file = "crates/dom/src/storage.rs"
from = '''                    entry.items.retain(|key, _| kept.contains(key));'''
to = '''                    let _ = kept;
                    entry.items.clear();'''

