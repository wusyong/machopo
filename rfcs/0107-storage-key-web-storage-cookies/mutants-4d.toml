# Step 4d: partitioned cookies (CookiePartitionKey: the top-level site and
# the ancestor chain bit), the jar's limits (a key's 180, the jar's 3300, a
# partition's key's 180 and 10 KiB; the least recently used first, those
# not Secure before), and the profile's Cookies database (read in all at
# once in the background, a hop waiting for it; written in batches).
test = [
    "sh", "-c",
    "cargo test -q -p net --lib cookies && cargo test -q -p net --test it cookie && cargo test -q -p browser --test it cookies::a_profiles",
]
timeout = 1800

