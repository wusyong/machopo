# Step 5a: document.cookie and navigator.cookieEnabled. The DOM finds the
# document's cookie URL (its creator's for about:blank and srcdoc) and asks
# through it, a read waiting for the browser, a write queued and handed
# over with localStorage's changes; the IO thread checks the loader and
# the URL's origin; net reads and sets as script does (no HttpOnly, the
# script SameSite context, the partition and the policy), in order with
# the loads.
test = [
    "sh", "-c",
    "cargo test -q -p net --test it cookie_loads:: && cargo test -q -p browser --lib script_cookies && cargo test -q -p browser --test it cookies::",
]
timeout = 1800

