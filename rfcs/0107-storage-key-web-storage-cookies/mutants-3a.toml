# Step 3a: the main thread's call that waits for the browser's answer
# (the scheduler's place for answers), the browser's localStorage thread
# (an area a renderer's once, with its items; on disk; each key's own),
# the UI thread opening a frame's area by its key, the IO thread's
# changes, and the DOM's `Storage` (the window's own, the renderer's copy
# shared by a key's documents, the changes handed over as the call
# returns).
test = [
    "sh", "-c",
    "cargo test -q -p renderer --lib task_queue && cargo test -q -p site && cargo test -q -p browser --test it dom_storage:: && cargo test -q -p shell --test it local_storage_outlasts",
]
timeout = 1800

[[mutant]]
name = "a call takes any answer"
file = "crates/renderer/src/task_queue.rs"
from = '''            if let Some(reply) = state.replies.remove(&id) {
                return Some(reply);
            }'''
to = '''            if let Some(&any) = state.replies.keys().next() {
                return state.replies.remove(&any);
            }'''

[[mutant]]
name = "a call doesn't give up as the renderer shuts down"
file = "crates/renderer/src/task_queue.rs"
from = '''                    scheduler.lock().shutting_down = true;'''
to = ''''''

[[mutant]]
name = "a call doesn't give up once the main thread has gone"
file = "crates/renderer/src/task_queue.rs"
from = '''            if state.closed || state.shutting_down {'''
to = '''            if state.shutting_down {'''

