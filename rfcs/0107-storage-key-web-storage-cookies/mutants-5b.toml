# Step 5b: automation's cookies. net's cookie calls for the browser
# (CookieManager: a URL's cookies of any context, all of them, set as from
# their own https: URL, deleted by a filter) and a cookie from its parts
# (CreateSanitizedCookie); the browser's CDP Network and Storage cookie
# commands; machopodriver's five WebDriver cookie commands, as chromedriver.
test = [
    "sh", "-c",
    "cargo test -q -p net --test it -- cookies::a_cookie_from cookie_monster:: cookie_loads::the_browsers && cargo test -q -p shell --test it -- devtools_cookies:: webdriver::cookies webdriver::an_added_cookie",
]
timeout = 1800

# --- net -----------------------------------------------------------------

