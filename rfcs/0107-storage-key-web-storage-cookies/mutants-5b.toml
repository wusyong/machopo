file = "crates/net/src/cookies/cookie_options.rs"
from = '''    pub fn make_all_inclusive() -> Self {
        Self {
            include_httponly: true,'''
to = '''    pub fn make_all_inclusive() -> Self {
        Self {
            include_httponly: false,'''

