# Stage 1's mutants (what a client's message to Viz can't be, checked as the browser's IO thread reads it; the compositor keeps within the limits): `python3 scripts/test.py mutate rfcs/0123-browser-survives-renderer/mutants-1.toml`.
test = ["cargo", "test", "-q", "-p", "protocol", "--lib", "--", "viz::"]
timeout = 900

[[mutant]]
name = "a frame of no pass is taken"
file = "crates/protocol/src/viz.rs"
from = '''        let Some(root) = self.root_pass() else {
            return Err(InvalidFrameSinkMsg::NoRenderPass);
        };
        if !(root.output_rect.width > 0.0 && root.output_rect.height > 0.0) {'''
to = '''        let Some(root) = self.root_pass() else {
            return Ok(());
        };
        if !(root.output_rect.width > 0.0 && root.output_rect.height > 0.0) {'''

[[mutant]]
name = "a root of no height draws"
file = "crates/protocol/src/viz.rs"
from = '''        if !(root.output_rect.width > 0.0 && root.output_rect.height > 0.0) {'''
to = '''        if !(root.output_rect.width > 0.0) {'''

