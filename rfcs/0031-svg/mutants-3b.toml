to = '''            || (svg && client.svg_geometry(scope, id).client_rect.is_none()))'''

[[mutant]]
name = "a focus listener makes nothing focusable"
file = "crates/dom_api/src/focus.rs"
from = '''    focusable_by_default(cx, element) || has_focus_listeners(cx, element)'''
to = '''    focusable_by_default(cx, element)'''

[[mutant]]
name = "an HTML element's focus listener makes it focusable"
file = "crates/dom_api/src/focus.rs"
from = '''    graphics
        && ["focus", "blur", "focusin", "focusout"]'''
to = '''    (graphics || true)
        && ["focus", "blur", "focusin", "focusout"]'''

[[mutant]]
name = "a focus listener puts an element in sequential navigation"
file = "crates/dom_api/src/focus.rs"
from = '''                    && focusable_by_default(cx, &element)) =>'''
to = '''                    && supports_focus(cx, &element)) =>'''

[[mutant]]
name = "getCTM gives the screen matrix"
file = "crates/dom_api/src/svg_geometry.rs"
from = '''    let ctm = geometry(cx, this).ctm;'''
to = '''    let ctm = geometry(cx, this).screen_ctm;'''

[[mutant]]
name = "an SVG element has no outline"
file = "crates/paint/src/svg.rs"
from = '''        if node.style.outline_style.is_drawn()
            && let Some(rect) = outline_rect(node)'''
to = '''        if node.style.outline_style.is_drawn()
            && false
            && let Some(rect) = outline_rect(node)'''
test = ["python3", "scripts/test.py", "reftest", "svg/outline.html", "svg/focus-outline.html"]

[[mutant]]
name = "an outline leaves out the stroke"
