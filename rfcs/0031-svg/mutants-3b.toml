to = '''            PathEl::MoveTo(p) => {'''
test = ["cargo", "test", "-q", "-p", "gfx", "--lib"]

[[mutant]]
name = "the screen matrix keeps the viewport's scroll"
file = "crates/renderer/src/frame_view.rs"
from = '''        geometry.screen_ctm = Transform::translate(-at.x, -at.y).then(&geometry.screen_ctm);'''
to = '''        geometry.screen_ctm = Transform::translate(0.0, -at.y * 0.0).then(&geometry.screen_ctm);'''

[[mutant]]
name = "an SVG element's client rect keeps the viewport's scroll"
file = "crates/renderer/src/frame_view.rs"
from = '''        geometry.client_rect = geometry.client_rect.map(|rect| rect.offset(-at.x, -at.y));'''
to = '''        geometry.client_rect = geometry.client_rect.map(|rect| rect.offset(-at.x, 0.0));'''

[[mutant]]
name = "an SVG element has no client rects"
file = "crates/renderer/src/layout_client.rs"
