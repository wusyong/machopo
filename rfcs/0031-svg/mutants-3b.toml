# Mutation test of step 3b (getBBox(), getCTM(), getScreenCTM(), SVG
# elements' client rects, their focus and outlines):
# python3 scripts/test.py mutate rfcs/0031-svg/mutants-3b.toml
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "geometry::svg", "keys::tab_and_enter"]
timeout = 900

[[mutant]]
name = "a <use>'s x and y count in its matrices"
file = "crates/layout/src/svg_geometry.rs"
from = '''            Laid::Node(node) if element.element_name().is_some_and(|n| n.is_svg("use")) => {'''
to = '''            Laid::Node(node) if element.element_name().is_some_and(|n| n.is_svg("nothing")) => {'''

[[mutant]]
name = "getCTM goes past the nearest viewport"
