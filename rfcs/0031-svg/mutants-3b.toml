[[mutant]]
name = "a path's moves don't count in its box"
file = "crates/gfx/src/lib.rs"
from = '''        let r = moves.chain(curves).reduce(|a, b| a.union(b))?;'''
to = '''        let r = moves.filter(|_| false).chain(curves).reduce(|a, b| a.union(b))?;'''
