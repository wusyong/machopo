# --- CSSOM
[[mutant]]
name = "a @keyframes has no rules"
file = "crates/css/src/stylesheet.rs"
from = '''            Self::Keyframes(rule) => Some(&rule.rules),'''
to = '''            Self::Keyframes(_) => None,'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "css_style_sheet::"]

[[mutant]]
name = "a @keyframes is a keyframe's kind"
file = "crates/dom/src/css_style_sheet.rs"
from = '''            Rule::Keyframes(_) => Self::Keyframes,'''
to = '''            Rule::Keyframes(_) => Self::Keyframe,'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "css_style_sheet::"]

[[mutant]]
name = "KEYFRAMES_RULE is KEYFRAME_RULE"
file = "crates/dom_api/src/css_style_sheet.rs"
from = '''        CssRuleKind::Keyframes => 7,'''
to = '''        CssRuleKind::Keyframes => 8,'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "css_style_sheet::"]

[[mutant]]
name = "a keyframe is a CSSKeyframesRule"
file = "crates/dom_api/src/object.rs"
from = '''                CssRuleKind::Keyframe => ObjectKind::CssKeyframeRule,'''
to = '''                CssRuleKind::Keyframe => ObjectKind::CssKeyframesRule,'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "css_style_sheet::"]

[[mutant]]
name = "the name not the rule's"
file = "crates/dom_api/src/css_style_sheet.rs"
from = '''    Ok((*rule.name).into())'''
to = '''    Ok(rule.name[..1].into())'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "css_style_sheet::"]

[[mutant]]
name = "a keyframe's style reads nothing"
file = "crates/dom_api/src/css_style_declaration.rs"
from = '''                style::CssRule::Keyframe(keyframe) => keyframe.block.clone(),'''
to = '''                style::CssRule::Keyframe(_) => CssPropertyValueSet::default(),'''
test = ["cargo", "test", "-q", "-p", "dom_api", "--test", "it", "--", "css_style_sheet::"]

