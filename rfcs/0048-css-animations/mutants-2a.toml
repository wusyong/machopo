[[mutant]]
name = "auto computes to 1s"
file = "crates/css/src/properties.rs"
from = '''            style.animations.duration = v.iter().map(|t| t.map_or(0.0, |t| t.seconds())).collect();'''
to = '''            style.animations.duration = v.iter().map(|t| t.map_or(1.0, |t| t.seconds())).collect();'''

