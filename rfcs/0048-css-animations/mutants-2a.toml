# Mutation test of step 2a: the `animation-*` properties and the
# `animation` shorthand, `@keyframes` (parsing, `RuleSet`, the lookup by
# tree scope) and its CSSOM (2026-10-15):
# python3 scripts/test.py mutate rfcs/0048-css-animations/mutants-2a.toml
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "animation_properties::", "keyframes::"]
timeout = 900

# --- animation-*
[[mutant]]
name = "animation-name's none is a name"
file = "crates/css/src/animation.rs"
from = '''        Token::Ident(ident) if ident.eq_ignore_ascii_case("none") => Ok(AnimationName::None),'''
to = '''        Token::Ident(ident) if false && ident.eq_ignore_ascii_case("none") => Ok(AnimationName::None),'''

[[mutant]]
name = "a CSS-wide keyword is an animation name"
file = "crates/css/src/animation.rs"
from = '''        Token::Ident(ident) if !is_reserved(ident) => Ok(AnimationName::Name(Arc::from(&**ident))),'''
to = '''        Token::Ident(ident) if true => Ok(AnimationName::Name(Arc::from(&**ident))),'''

[[mutant]]
name = "an empty string is an animation name"
file = "crates/css/src/animation.rs"
from = '''        Token::QuotedString(name) if !name.is_empty() => {
            Ok(AnimationName::Name(Arc::from(&**name)))'''
to = '''        Token::QuotedString(name) if true => {
            Ok(AnimationName::Name(Arc::from(&**name)))'''

[[mutant]]
name = "a name that reads as a keyword written bare"
file = "crates/css/src/animation.rs"
from = '''        AnimationName::Name(name) if name.eq_ignore_ascii_case("none") || is_reserved(name) => {'''
to = '''        AnimationName::Name(name) if is_reserved(name) => {'''

[[mutant]]
name = "a CSS-wide keyword name written bare"
file = "crates/css/src/animation.rs"
from = '''        AnimationName::Name(name) if name.eq_ignore_ascii_case("none") || is_reserved(name) => {'''
to = '''        AnimationName::Name(name) if name.eq_ignore_ascii_case("none") => {'''

