from = '''                Notice::Finished { .. } => self.finish_time().map_or(now, |time| time.min(now)),'''
to = '''                Notice::Finished { .. } => now,'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "web_animations::"]

