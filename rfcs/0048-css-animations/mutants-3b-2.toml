# Mutation test of step 3b-2: replaced animations removed (`animation`'s
# `remove_replaced`, `dom`'s, the renderer's step), `replaceState`,
# `persist()`, `remove` events and `commitStyles()` (`dom_api`'s
# `animation`) (2026-10-16):
# python3 scripts/test.py mutate rfcs/0048-css-animations/mutants-3b-2.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "--", "animations::"]
timeout = 900

# --- Removing replaced animations
[[mutant]]
name = "an animation markup makes is replaceable"
file = "crates/animation/src/animation.rs"
from = '''        (matches!(self.owner, Owner::Script) || !self.owning)
            && self.replace_state != ReplaceState::Removed'''
to = '''        self.replace_state != ReplaceState::Removed'''

[[mutant]]
name = "a running animation is replaceable"
file = "crates/animation/src/animation.rs"
from = '''            && self.play_state(now) == PlayState::Finished
            && self.computed(now).progress.is_some()'''
to = '''            && self.computed(now).progress.is_some()'''

[[mutant]]
name = "an animation not in effect is replaceable"
file = "crates/animation/src/animation.rs"
from = '''            && self.play_state(now) == PlayState::Finished
            && self.computed(now).progress.is_some()'''
to = '''            && self.play_state(now) == PlayState::Finished'''

[[mutant]]
name = "a removed animation still gives values"
file = "crates/animation/src/animation.rs"
from = '''        if self.replace_state != ReplaceState::Removed {
            self.apply_effect(now, style);
        }'''
to = '''        self.apply_effect(now, style);'''

[[mutant]]
name = "a removed animation is still reachable"
file = "crates/animation/src/animation.rs"
from = '''        if self.replace_state == ReplaceState::Removed {
            return false;
        }
        match self.play_state(now) {'''
to = '''        match self.play_state(now) {'''

[[mutant]]
name = "removing sends no remove event"
file = "crates/animation/src/animation.rs"
from = '''        self.notify(vec![notice], now, events);'''
to = '''        let _ = notice;'''

[[mutant]]
name = "an animation partly covered is removed"
file = "crates/animation/src/transition.rs"
from = '''                covered &= !replaced.insert(id);'''
to = '''                covered |= !replaced.insert(id);'''

[[mutant]]
name = "later animations don't cover"
file = "crates/animation/src/transition.rs"
from = '''        order.sort_by_key(|&i| std::cmp::Reverse(self.others[i].global_order));'''
to = '''        order.sort_by_key(|&i| self.others[i].global_order);'''

[[mutant]]
name = "a persisted animation is removed"
file = "crates/animation/src/transition.rs"
from = '''            if covered && animation.replace_state == ReplaceState::Active {'''
to = '''            if covered {'''

[[mutant]]
name = "the renderer removes nothing"
file = "crates/renderer/src/render_thread.rs"
from = '''                for (_, document, _) in &frames {
                    table.remove_replaced(*document);
                }'''
to = '''                let _ = &frames;'''
test = ["cargo", "test", "-q", "-p", "shell", "--test", "it", "--", "web_animations::"]

[[mutant]]
