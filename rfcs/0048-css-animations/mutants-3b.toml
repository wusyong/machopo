# Mutation test of step 3b-1: script's effects and animations (`dom_api`'s
# `effect` and `animation`: `KeyframeEffect`, `element.animate()`,
# `new Animation()`, `effect` and `timeline` set), reading keyframes
# (`dom_js`'s `keyframes`), script's keyframes computed by style (`style`'s
# and `animation`'s), and what `dom` keeps of them (2026-10-16):
# python3 scripts/test.py mutate rfcs/0048-css-animations/mutants-3b.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "--", "animations::"]
timeout = 900

# --- Timing
[[mutant]]
name = "a negative iterationStart is taken"
file = "crates/dom_api/src/effect.rs"
from = '''    if timing.iteration_start.is_some_and(|start| start < 0.0) {'''
to = '''    if timing.iteration_start.is_some_and(|start| start < -1.0) {'''

[[mutant]]
name = "negative iterations are taken"
file = "crates/dom_api/src/effect.rs"
from = '''    if timing.iterations.is_some_and(|n| n.is_nan() || n < 0.0) {'''
to = '''    if timing.iterations.is_some_and(|n| n.is_nan()) {'''

[[mutant]]
name = "a negative duration is taken"
file = "crates/dom_api/src/effect.rs"
from = '''        Some(DurationValue::Number(d)) if d.is_nan() || *d < 0.0 => {'''
to = '''        Some(DurationValue::Number(d)) if d.is_nan() => {'''

[[mutant]]
name = "any duration string is auto"
file = "crates/dom_api/src/effect.rs"
from = '''        Some(DurationValue::String(s)) if s.as_str() == "auto" => Some(None),'''
to = '''        Some(DurationValue::String(_)) => Some(None),'''

