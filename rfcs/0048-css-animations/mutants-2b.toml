# Mutation test of step 2b: CSS animations (the `animation` crate's
# model, keyframes computed on the element, the animation origin) in style
# recalc (2026-10-15):
# python3 scripts/test.py mutate rfcs/0048-css-animations/mutants-2b.toml
test = ["cargo", "test", "-q", "-p", "style", "--test", "it", "--", "css_animations::", "animations::"]
timeout = 900

