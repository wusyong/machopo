# Mutation test of step 3a: Web Animations' script API (`dom_api`'s
# `animation`), the playback procedures (`animation`'s `playback`), the
# animations' objects (`dom`'s `animation_objects`), the animations that left
# their elements and what is let go of (`dom`'s `animations`), kept promises
# (`bindings`, `dom_wasm`) and the renderer's steps (2026-10-15):
# python3 scripts/test.py mutate rfcs/0048-css-animations/mutants-3a.toml
test = ["cargo", "test", "-q", "-p", "dom_js", "--test", "it", "--", "animations::"]
timeout = 900

# --- dom_api's members
[[mutant]]
name = "a member doesn't apply what style sent first"
file = "crates/dom_api/src/animation.rs"
from = '''    for notice in notices {
        settle(cx, this, id, notice);
    }'''
to = '''    let _ = notices;'''

[[mutant]]
name = "a new ready isn't new"
file = "crates/dom_api/src/animation.rs"
from = '''        Notice::NewReady => forget_ready(cx),'''
to = '''        Notice::NewReady => {}'''

[[mutant]]
name = "a new finished isn't new"
file = "crates/dom_api/src/animation.rs"
from = '''        Notice::NewFinished => forget_finished(cx),'''
to = '''        Notice::NewFinished => {}'''

[[mutant]]
name = "an aborted ready doesn't reject"
file = "crates/dom_api/src/animation.rs"
from = '''        Notice::ReadyAborted => {
            if let Some(number) = ready {
                resolver(number).reject(cx, abort_error());
            }'''
to = '''        Notice::ReadyAborted => {
            if let Some(number) = ready {
                let _ = number;
            }'''

[[mutant]]
name = "a canceled finished doesn't reject"
file = "crates/dom_api/src/animation.rs"
from = '''        Notice::Canceled { .. } => {
            if let Some(number) = finished {
                resolver(number).reject(cx, abort_error());
            }'''
to = '''        Notice::Canceled { .. } => {
            if let Some(number) = finished {
                let _ = number;
            }'''

