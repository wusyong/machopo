# Mutation test of step 1c: the timing model and CSS transitions in the
# `animation` crate (2026-10-15):
# python3 scripts/test.py mutate rfcs/0048-css-animations/mutants-1c.toml
test = ["cargo", "test", "-q", "-p", "animation", "--test", "it"]
timeout = 600

