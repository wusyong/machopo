# The commits of the projects machopo builds and tests against, checked out next
# to the repo in `../third_party/<name>`: our forks and elise (Cargo.toml
# depends on them by path), and upstream WPT, Speedometer and Blink's perf
# tests (read in place, never changed).
# `python scripts/ci.py third-party` clones them there at these commits, or
# checks that the existing checkouts match; a project with `archive` is the
# folder of that path in the repository at `rev`, downloaded rather than
# cloned. A fork with `upstream_rev` is that upstream commit and the patches
# in `patches/<name>/`, which `ci.py third-party` checks give `rev`'s tree
# and `python scripts/ci.py patches <name>` exports from the checkout.
#
# rusty_v8's repository and release tag are `RUSTY_V8_MIRROR` and
# `RUSTY_V8_MIRROR_TAG` in `.cargo/config.toml`: machopo links that release's
# prebuilt V8.

[elise]
# The DOM's GC: machopo's own project, not a fork. Its `main` branch, a commit
# its CI has tested (it runs on every push).
repository = "https://github.com/wusyong/elise"
rev = "c3b56ff3393838ba2c032baa7b0e1530c201b5fa"

[wasmtime]
# wasm scripts' engine, with elise as a collector (`gc-elise`). The `machopo`
# branch, from upstream's tag v50.0.1.
repository = "https://github.com/wusyong/wasmtime"
rev = "ef4e89208a52fc6b017e16197e76033fa500190b"

[parley]
repository = "https://github.com/wusyong/parley"
# The `machopo` branch: upstream's main at `upstream_rev` (2026-11-08) and
# the commits in `patches/parley/`.
rev = "227d7191625d7f14a4c29099cdc3f840b1bbfed7"
upstream = "https://github.com/linebender/parley"
upstream_rev = "1b67b7539616e5c7dc92d8fc79a1f7678525993c"

[taffy]
repository = "https://github.com/wusyong/taffy"
# The `machopo` branch: upstream's main (2026-11-06) at `upstream_rev` and the
# commits in `patches/taffy/`.
rev = "0de7a64fed42872d210b16c3e35cfdcfb12e7007"
upstream = "https://github.com/DioxusLabs/taffy"
upstream_rev = "4aca4f4933aa9cb7a3266050c788aad4c90288d2"

[vello]
repository = "https://github.com/wusyong/vello"
# The `machopo` branch: upstream's main (2026-11-10) at `upstream_rev` and the
# commits in `patches/vello/`.
rev = "b52311f2b3aea758a0a69d3c23e55305fefc91d1"
upstream = "https://github.com/linebender/vello"
upstream_rev = "112736df245f36181b73b0f34cf29de8159fb1a2"

[wpt]
# Upstream, not a fork: machopo never changes it. Its files must stay byte for
# byte as upstream's (html5lib's `.dat` files hold carriage returns), so
# it is checked out without line-ending conversion.
repository = "https://github.com/web-platform-tests/wpt"
# 2026-09-30.
rev = "0f195499f06d0833e768b01a1a8ce942b8622fc8"
byte_exact = true

[speedometer]
# Upstream, not a fork: machopo never changes it; `bench.py speedometer` serves it
# with its own scripts added on the way. The `release/3.1` branch, whose
# `dist/` holds every suite built.
repository = "https://github.com/WebKit/Speedometer"
rev = "1386415be8fef2f6b6bbdbe1828872471c5d802a"

[blink_perf]
# Chromium's `third_party/blink/perf_tests`, upstream: machopo never changes it;
# `bench.py blink-perf` serves it. Not a checkout (Chromium is too big to
# clone): gitiles' tarball of that folder at `rev`, which `ci.py
# third-party` downloads again when `rev` changes. 2026-10-20's `main`.
repository = "https://chromium.googlesource.com/chromium/src"
rev = "8c07befe7a00f68ea872b741d25744f6729dee38"
archive = "third_party/blink/perf_tests"

[rusty_v8]
# The release tag itself. Past it with changes to the fork's Rust only,
# `rev` names the `machopo` branch's commit, which machopo builds from this
# checkout; `ci.py third-party` checks that nothing the prebuilt V8 holds
# changed since the tag (unless RUSTY_V8_ARCHIVE is set: builds link a V8
# built locally from this checkout, `ci.py v8`). A new release moves the
# tag and drops `rev`.
rev = "5c327d3d08d570698ef2ae8bae549d39e4d7f09d"
