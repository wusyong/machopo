[package]
name = "sunaba"
description = "A process's sandbox, entered by the process itself as it starts: on Linux, Landlock and seccomp-bpf."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc examples: skip rustdoc's pass in `cargo test`.
[lib]
doctest = false

[lints]
workspace = true

# Nothing of the workspace's: the crate is written to stand on its own.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.8"
seccompiler = "0.5.0"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
