[package]
name = "sunaba"
description = "A process's sandbox: on Linux, Landlock and seccomp-bpf, and on macOS, Seatbelt, entered by the process itself as it starts; on Windows, an app container, a job and mitigations, given as the process is started."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

# No doc examples: skip rustdoc's pass in `cargo test`.
[lib]
doctest = false

[lints]
workspace = true

[features]
default = ["delay-load-hook"]
# Windows (MSVC): the crate defines the delay-load helper's failure hook
# (`__pfnDliFailureHook2`), which says which DLL a lowered process couldn't
# load. One definition per program: a program with a hook of its own turns
# this off.
delay-load-hook = []

# Nothing of the workspace's: the crate is written to stand on its own.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.8"
seccompiler = "0.5.0"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
