[package]
name = "sunaba"
description = "A process's sandbox: on Linux, Landlock and seccomp-bpf, and on macOS, Seatbelt, entered by the process itself as it starts; on Windows, an app container, a job and mitigations, given as the process is started."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc examples: skip rustdoc's pass in `cargo test`.
[lib]
doctest = false

[lints]
workspace = true

# Nothing of the workspace's: the crate is written to stand on its own.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.8"
seccompiler = "0.5.0"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
