[package]
name = "compositor"
description = "Chromium-style compositor: layer tree, tiling, raster scheduling, draw (//cc)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc examples: skip rustdoc's pass in `cargo test`.
[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base.workspace = true
bytes.workspace = true
gfx.workspace = true
compositor_paint.workspace = true
raster.workspace = true
protocol.workspace = true
tracing.workspace = true
trace_event.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true

[dev-dependencies]
# Pixels in a region of shared memory with no channel under it, for the
# tests of what draws in one and what reads one.
ipc.workspace = true
