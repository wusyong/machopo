[package]
name = "ipc"
description = "The process boundary (Chromium's ipc/ and mojo/): the clock every process reads (TimeTicks), data pipes, and the channels' core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc examples: skip rustdoc's pass in `cargo test`.
[lib]
doctest = false

[lints]
workspace = true

[package.metadata.verus]
verify = true

[dependencies]
base.workspace = true
bytes.workspace = true
# Mapping a memfd (the channel's shared memory on Linux), and a file that
# crossed with a message.
memmap2.workspace = true
postcard.workspace = true
serde.workspace = true
tokio.workspace = true
# Verus's `verus!` and its specs, erased in a plain build: `src/core/fit.rs`
# is proved (`python3 scripts/test.py ipc verus`).
vstd.workspace = true

# The checks of what a channel's threads share, only when built with
# `--cfg ipc_loom` / `--cfg ipc_shuttle` (`python3 scripts/test.py ipc
# models`).
[target.'cfg(ipc_loom)'.dependencies]
loom = "0.7"
[target.'cfg(ipc_shuttle)'.dependencies]
shuttle = "0.9"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
# `_exit`: how a child whose host is gone ends.
libc.workspace = true

# A child's own user and network namespaces, made as it is started.
[target.'cfg(target_os = "linux")'.dependencies]
sunaba.workspace = true

# Mach ports and memory entries: the channel and its shared memory.
[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Starting a child with only the handles named, and in a sandbox.
sunaba.workspace = true

[dev-dependencies]
serde_json.workspace = true

# `mprotect`, for the tests that a mapping to read stays one.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["mm"] }
