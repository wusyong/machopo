# ipc's fuzzers (cargo-fuzz): a workspace of its own, on the nightly its
# rust-toolchain.toml pins. `python3 scripts/test.py ipc fuzz` runs them.
[package]
name = "ipc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ipc = { path = ".." }
# What the regions' and the pipes' checks name (`tests/it/region_fuzz.rs`,
# `tests/it/pipe_fuzz.rs`).
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipe"
path = "fuzz_targets/pipe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "region"
path = "fuzz_targets/region.rs"
test = false
doc = false
bench = false

[workspace]
