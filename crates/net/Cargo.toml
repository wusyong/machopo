[package]
name = "net"
description = "Resource loading (//services/network)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc examples: skip rustdoc's pass in `cargo test`.
[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base.workspace = true
brotli-decompressor.workspace = true
bytes.workspace = true
# Waiting for the databases' threads with a deadline as machopo ends.
crossbeam-channel.workspace = true
flate2.workspace = true
# Only to tell its error for a connection that closed before answering
# (reqwest's error doesn't say), whose request goes out again.
hyper.workspace = true
ipc.workspace = true
data-url.workspace = true
# A CSP source's path, decoded as Chromium's parser decodes it.
percent-encoding.workspace = true
protocol.workspace = true
reqwest.workspace = true
# To recognise certificate errors in reqwest's error chain, to read PEM
# certificates, and for the test server's HTTPS; the client's TLS backend
# itself comes with reqwest. aws-lc-rs is the provider reqwest uses too.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
# The HTTP cache's `Vary` on disk: a SHA-256 of the values.
sha2.workspace = true
# The public suffix list, for which domains a cookie can't be set on.
site.workspace = true
# The profile's `Cookies` database.
sql.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tower-layer.workspace = true
tower-service.workspace = true
url.workspace = true
tracing.workspace = true

[dev-dependencies]
flate2.workspace = true
