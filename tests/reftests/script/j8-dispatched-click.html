<!DOCTYPE html>
<html class="reftest-wait">
<title>J8: a click script sends a link follows it unless a listener cancels it; a plain Event named click follows nothing</title>
<link rel="match" href="j8-dispatched-click-ref.html">
<style>
  html, body { margin: 0 }
  div { width: 100px; height: 100px; background-color: red }
</style>
<a id="canceled" href="resources/j8-navigated.html"></a>
<a id="plain" href="resources/j8-navigated.html"></a>
<div id="returned"></div>
<div id="listened"></div>
<script>
  const pass = (id) => document.getElementById(id).setAttribute("style", "background-color: green");
  const canceled = document.getElementById("canceled");
  let heard = false;
  canceled.addEventListener("click", (e) => {
    heard = e instanceof MouseEvent && !e.isTrusted;
    e.preventDefault();
  });
  // Canceled: `dispatchEvent` says so, and the link isn't followed.
  const click = new MouseEvent("click", { bubbles: true, cancelable: true });
  if (canceled.dispatchEvent(click) === false) pass("returned");
  if (heard) pass("listened");
  // Not a `MouseEvent`: no activation behavior.
  document.getElementById("plain").dispatchEvent(new Event("click", { bubbles: true }));
  // A followed link would have replaced this document by now; then this
  // never runs, and the test times out.
  let frames = 0;
  requestAnimationFrame(function wait() {
    if (++frames < 10) {
      requestAnimationFrame(wait);
      return;
    }
    document.documentElement.classList.remove("reftest-wait");
  });
</script>
