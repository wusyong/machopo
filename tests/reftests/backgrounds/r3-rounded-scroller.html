<!DOCTYPE html>
<title>Border radius 3: a scroll container with rounded corners is a layer, and the compositor cuts it to its corners</title>
<link rel="match" href="r3-rounded-scroller-ref.html">
<!-- The compositor's coverage is the curve's distance from each pixel's
     centre, Skia's anti-aliased clip a coarser mask: only the curves'
     anti-aliasing differs. -->
<meta name="fuzzy" content="maxDifference=0-60;totalPixels=0-240">
<style>
  html, body { margin: 0 }
  .scroller { margin: 10px; width: 120px; height: 100px; border-radius: 30px;
              overflow: auto; background: white }
</style>
<!-- Its content overflows: it scrolls, so it is a layer. -->
<div class="scroller"><div style="height: 300px; background: green"></div></div>
