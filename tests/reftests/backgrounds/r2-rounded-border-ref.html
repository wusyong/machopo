<!DOCTYPE html>
<title>Border radius 2 reference</title>
<style>
  html, body { margin: 0 }
</style>
<!-- The same ring: a green rounded box, and a white one inside it with the
     radii less the width. -->
<div style="margin: 10px; width: 120px; height: 80px; border-radius: 30px; background: green;
            position: relative">
  <div style="position: absolute; left: 10px; top: 10px; width: 100px; height: 60px;
              border-radius: 20px; background: white"></div>
</div>
