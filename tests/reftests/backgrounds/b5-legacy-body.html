<!DOCTYPE html>
<title>A body's legacy colors, margins and link color paint as their CSS</title>
<link rel="match" href="b5-legacy-body-ref.html">
<!-- `bgcolor` (the canvas's, as a body's background is), `text`,
     `marginwidth` and `topmargin`, and `link`, the document's link color. -->

  body { font: 20px/1 Ahem }

</style>

</body>
