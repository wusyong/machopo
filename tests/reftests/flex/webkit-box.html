<!DOCTYPE html>
<title>-webkit-box: its items flex, order, pack and align by the -webkit-box longhands</title>
<link rel="match" href="webkit-box-ref.html">
<style>
  html, body { margin: 0 }
  .box { display: -webkit-box; width: 300px; height: 100px; margin-bottom: 10px;
         background-color: yellow }
  .box div { width: 20px; min-height: 20px; background-color: green }
</style>
<div class="box"><div style="-webkit-box-flex: 1"></div><div style="-webkit-box-flex: 2; background-color: blue"></div><div style="flex-grow: 5"></div></div>
<div class="box" style="-webkit-box-direction: reverse; -webkit-box-align: center"><div style="-webkit-box-ordinal-group: 2; align-self: end"></div><div style="background-color: blue"></div></div>
<div class="box" style="-webkit-box-orient: vertical; -webkit-box-pack: justify; -webkit-box-align: start"><div></div><div style="background-color: blue"></div></div>
