<!DOCTYPE html>
<title>F7: a list of dated links, each line a flex row (as on danluu.com): the titles line up after the dates and wrap in their column</title>
<link rel="match" href="f7-dated-list-ref.html">
<style>
  html, body { margin: 0 }
  ul { margin: 0; padding: 0; width: 200px; font: 20px/1 Ahem }
  li { display: flex }
  .d { flex: 0 0 100px; color: gray }
  a { color: blue }
</style>
<ul>
  <li><span class="d">XX</span><a href="a">XXXX</a></li>
  <li><span class="d">XXX</span><a href="b">XXXX XXXX</a></li>
  <li><span class="d">X</span><a href="c">XX</a></li>
</ul>
