<!DOCTYPE html>
<title>transform-box: content-box: the origin and translate()'s percentages are the content box's</title>
<link rel="match" href="content-box-ref.html">
<style>html, body { margin: 0 } div { position: absolute; padding: 10px; width: 30px; height: 30px; background-color: green; transform-box: content-box }</style>
<div style="left: 50px; top: 50px; transform-origin: 0 0; transform: scale(2)"></div>
<div style="left: 300px; top: 50px; transform-box: fill-box; transform: translate(100%, 0)"></div>
<div style="left: 500px; top: 50px; transform-box: border-box; transform: translate(100%, 0)"></div>
