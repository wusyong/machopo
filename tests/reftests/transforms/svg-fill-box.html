<!DOCTYPE html>
<title>An SVG shape's transform is about its viewport's origin, or its fill box with transform-box: fill-box</title>
<link rel="match" href="svg-fill-box-ref.html">
<style>html, body { margin: 0 }</style>
<svg width="400" height="300" style="display: block">
  <rect x="20" y="60" width="100" height="40" fill="green" style="transform-box: fill-box; transform-origin: center; transform: rotate(90deg)" />
  <rect x="100" y="-300" width="100" height="40" fill="green" style="transform: rotate(90deg)" />
</svg>
