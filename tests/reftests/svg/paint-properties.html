<!DOCTYPE html>
<title>Fill inherits; currentColor is the color; visibility hidden hides one shape; fill-opacity</title>
<link rel="match" href="rect-ref.html">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="100" height="60" style="color: lime">
  <g fill="currentColor"><rect x="10" y="10" width="20" height="20"/></g>
  <rect x="30" y="10" width="20" height="20" fill="lime"/>
  <rect x="60" y="10" width="20" height="20" fill="red" visibility="hidden"/>
  <rect x="60" y="40" width="20" height="20" fill="red" fill-opacity="0"/>
</svg>
