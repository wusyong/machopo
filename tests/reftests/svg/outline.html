<!DOCTYPE html>
<title>An SVG element's outline goes around what it draws, its stroke included, in its own space; hidden containers draw nothing</title>
<link rel="match" href="outline-ref.html">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="200" height="100">
  <g transform="translate(10,10)">
    <rect x="10" y="10" width="30" height="20" fill="blue" stroke="green" stroke-width="4" style="outline: 2px solid red"/>
  </g>
  <g style="outline: 2px solid red">
    <rect x="100" y="10" width="10" height="10" fill="blue"/>
    <rect x="110" y="20" width="10" height="10" fill="blue" transform="translate(10,10)"/>
  </g>
  <defs><rect width="200" height="100" fill="red"/></defs>
  <g style="display: none"><rect width="200" height="100" fill="red"/></g>
  <symbol><rect width="200" height="100" fill="red"/></symbol>
</svg>
