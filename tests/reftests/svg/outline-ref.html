<!DOCTYPE html>
<title>Reference: the outlines as rects</title>
<style>body { margin: 0 } svg { display: block }</style>
<svg width="200" height="100">
  <rect x="20" y="20" width="30" height="20" fill="blue" stroke="green" stroke-width="4"/>
  <g fill="red">
    <rect x="16" y="16" width="38" height="2"/>
    <rect x="16" y="42" width="38" height="2"/>
    <rect x="16" y="18" width="2" height="24"/>
    <rect x="52" y="18" width="2" height="24"/>
  </g>
  <rect x="100" y="10" width="10" height="10" fill="blue"/>
  <rect x="120" y="30" width="10" height="10" fill="blue"/>
  <g fill="red">
    <rect x="98" y="8" width="34" height="2"/>
    <rect x="98" y="40" width="34" height="2"/>
    <rect x="98" y="10" width="2" height="30"/>
    <rect x="130" y="10" width="2" height="30"/>
  </g>
</svg>
