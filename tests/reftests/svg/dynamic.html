<!DOCTYPE html>
<html class="reftest-wait">
<title>Changing an attribute that isn't style, and adding a shape, draws again</title>
<link rel="match" href="rect-ref.html">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="100" height="60"><rect id="r" x="60" y="10" width="20" height="20" fill="lime"/></svg>
<script>
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getElementById("r").setAttribute("x", "10");
  const svg = document.querySelector("svg");
  const second = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  for (const [k, v] of [["x", 30], ["y", 10], ["width", 20], ["height", 20], ["fill", "lime"]]) second.setAttribute(k, v);
  svg.append(second);
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("reftest-wait")));
}));
</script>
</html>
