<!DOCTYPE html>
<style>body { margin: 0 } div { position: absolute; height: 10px; background: lime }</style>
<!-- "X X X": collapsed, the leading and trailing space dropped. -->
<div style="left: 10px; top: 10px; width: 20px"></div>
<div style="left: 40px; top: 10px; width: 10px"></div>
<!-- X at 10, then X at 50, X at 65 (dx 5 on the third). -->
<div style="left: 10px; top: 30px; width: 10px"></div>
<div style="left: 50px; top: 30px; width: 10px"></div>
<div style="left: 65px; top: 30px; width: 10px"></div>
<!-- X at (10, 50), X at (20, 60), the tspan's X back up and 10 on: (40, 50). -->
<div style="left: 10px; top: 50px; width: 10px"></div>
<div style="left: 20px; top: 60px; width: 10px"></div>
<div style="left: 40px; top: 50px; width: 10px"></div>
<!-- Preserved: the space before X. -->
<div style="left: 20px; top: 80px; width: 10px"></div>
<!-- Chunks: X centered on 100, X centered on 150, XX ending at 190. -->
<div style="left: 95px; top: 90px; width: 10px"></div>
<div style="left: 145px; top: 90px; width: 10px"></div>
<div style="left: 170px; top: 90px; width: 20px"></div>
