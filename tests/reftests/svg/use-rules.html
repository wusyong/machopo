<!DOCTYPE html>
<title>A copy matches its rules as the element it copies; a use of a use; a cycle draws nothing more</title>
<link rel="match" href="rect-ref.html">
<style>body { margin: 0 } svg { display: block } .lime { fill: lime } #r2 { fill: lime }</style>
<svg width="100" height="60">
  <defs>
    <rect id="r1" class="lime" width="20" height="20"/>

  </defs>
  <use href="#r1" x="10" y="10"/>

</svg>
