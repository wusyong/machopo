<!DOCTYPE html>
<html class="reftest-wait">
<title>K2: a scroll container's layer is clipped by the container around it, and stays clipped when scrolled</title>
<link rel="match" href="green-square-ref.html">
<script>
  // Go to #target as following a link to it would, then end the test once
  // the scroll is drawn (wptrunner loads a test at its own URL, without a
  // fragment).
  addEventListener("load", () => {
    location.hash = "target";
    requestAnimationFrame(() => requestAnimationFrame(() =>
      document.documentElement.classList.remove("reftest-wait")));
  });
</script>
<style>html, body { margin: 0 }</style>
<!-- The outer box only clips (nothing in it overflows sideways); the
     scroller sticks out of it by 100px to the right, all red there. -->
<div style="width: 100px; height: 100px; overflow: hidden">
  <div style="width: 200px; height: 100px; overflow: auto">
    <div style="height: 200px; background-color: red"></div>
    <div id="target" style="height: 100px; background-color: green"></div>
    <div style="height: 200px; background-color: red"></div>
  </div>
</div>
