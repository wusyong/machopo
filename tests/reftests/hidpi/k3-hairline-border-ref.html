<!DOCTYPE html>
<style>html, body { margin: 0 }</style>
<!-- A 1px border on a box twice the size, scaled to half: whole device
     pixels at 2x without any rounding. The translation moves it back to
     the top left (the transform is about the box's center). -->
<div style="width: 198px; height: 98px; border: 1px solid green; transform: translate(-50px, -25px) scale(0.5)"></div>
