<title>Reference: the same SVG inline</title>
<style>html, body { margin: 0 } svg { display: block }</style>
<svg width="30" height="30" viewBox="0 0 2 2">
  <rect width="1" height="1" fill="lime"/><rect x="1" width="1" height="1" fill="blue"/>
  <rect y="1" width="1" height="1" fill="blue"/><rect x="1" y="1" width="1" height="1" fill="lime"/>
</svg>
<svg width="45" height="45" viewBox="0 0 2 2">

</svg>
