<!DOCTYPE html>
<title>position: sticky in scrolled containers: stuck at the top, at the bottom, at the left, stopped at its containing block's end, and a sticky box in a sticky box</title>
<link rel="match" href="p3-sticky-ref.html">
<style>
  html, body { margin: 0 }
  .s { position: absolute; top: 0; width: 100px; height: 100px; overflow: hidden }
  .g { position: sticky; height: 20px; background: green }
</style>
<div class="s" id="top" style="left: 0">
  <div style="height: 50px"></div>
  <div class="g" style="top: 10px"></div>
  <div style="height: 300px"></div>
</div>
<div class="s" style="left: 120px">
  <div style="height: 200px"></div>
  <div class="g" style="bottom: 10px"></div>
  <div style="height: 100px"></div>
</div>
<div class="s" id="left" style="left: 240px">
  <div style="display: flex; width: 400px; height: 100px">
    <div style="flex: none; width: 150px"></div>
    <div class="g" style="left: 5px; flex: none; width: 20px; height: auto"></div>
  </div>
</div>
<div class="s" id="end" style="left: 360px">
  <div style="height: 150px">
    <div class="g" style="top: 0"></div>
  </div>
  <div style="height: 300px"></div>
</div>
<div class="s" id="nested" style="left: 480px">
  <div style="height: 50px"></div>
  <div style="position: sticky; top: 0; height: 80px">
    <div class="g" style="top: 30px"></div>
  </div>
  <div style="height: 300px"></div>
</div>
<script>
  document.getElementById("top").scrollTop = 100;
  document.getElementById("left").scrollLeft = 200;
  document.getElementById("end").scrollTop = 140;
  document.getElementById("nested").scrollTop = 100;
</script>
