<!DOCTYPE html>
<title>A table's columns and rows are sized from its cells (reference)</title>
<style>
  body { margin: 0 }
  div { position: absolute; background: green }
</style>
<div style="left: 0; top: 0; width: 40px; height: 40px"></div>
<div style="left: 40px; top: 10px; width: 20px; height: 20px"></div>
<div style="left: 0; top: 40px; width: 60px; height: 20px"></div>
<div style="left: 0; top: 60px; width: 30px; height: 10px; background: blue"></div>
<div style="left: 30px; top: 60px; width: 70px; height: 10px"></div>
