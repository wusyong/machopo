<!DOCTYPE html>
<title>A table's legacy colors, border color and backgrounds paint as their CSS (reference)</title>
<style>
  body { margin: 0 }
  table { background-color: yellow; border: 5px solid blue; border-spacing: 10px }
  tr { background-color: lime }
  td { width: 40px; height: 40px; padding: 0; border: 1px solid blue }
</style>
<table>
  <tr>
    <td></td>
    <td style="background-color: #c00000"></td>
    <td style="background-image: url(../images/resources/green-blue-20x10.png)"></td>
  </tr>
</table>
