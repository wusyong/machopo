<!DOCTYPE html>
<title>A font element's size, color and face paint as their CSS (reference)</title>
<style>
  body { margin: 0; font: 20px/1 serif }
  div { line-height: 1 }
  span { font-family: Ahem }
</style>
<div><span style="font-size: x-small; color: green">x</span></div>
<div><span style="font-size: x-large; color: #c00000">x</span></div>
<div><span style="font-size: xxx-large; color: blue">x</span></div>
<div><span style="font-size: x-small">x</span></div>
