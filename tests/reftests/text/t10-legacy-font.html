<!DOCTYPE html>
<title>A font element's size, color and face paint as their CSS</title>
<link rel="match" href="t10-legacy-font-ref.html">
<!-- The legacy font sizes (1 to 7, and relative to 3) are the keywords
     x-small to xxx-large. -->
<style>
  body { margin: 0; font: 20px/1 serif }
  div { line-height: 1 }
</style>
<div><font face=Ahem size=1 color=green>x</font></div>
<div><font face=Ahem size="+2" color=chucknorris>x</font></div>
<div><font face=Ahem size=7 color=blue>x</font></div>
<div><font face=Ahem size="-9">x</font></div>
