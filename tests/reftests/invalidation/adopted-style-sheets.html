<!DOCTYPE html>
<html class="reftest-wait">
<title>Adopted stylesheets: a sheet's new contents and one more adopted style everything again</title>
<link rel="match" href="k4-style-ref.html">
<style>html, body { margin: 0 } div { width: 100px; height: 50px; background-color: red }</style>
<div></div><div></div>
<script src="after-frames.js"></script>
<script>
const first = new CSSStyleSheet();
first.replaceSync("div { background-color: red }");
document.adoptedStyleSheets = [first];
afterFrames(() => {
  first.replaceSync("div:first-child { background-color: green }");
  const second = new CSSStyleSheet();
  second.replaceSync("div + div { background-color: green }");
  document.adoptedStyleSheets.push(second);
});
</script>
</html>
