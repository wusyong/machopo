<!DOCTYPE html>
<html class="reftest-wait">
<title>K4: a box that changes color is drawn in its new color, the rest as it was</title>
<link rel="match" href="k4-color-ref.html">
<style>html, body { margin: 0 } div { width: 100px; height: 50px }</style>
<div style="background-color: green"></div>
<div id="box" style="background-color: red"></div>
<div style="background-color: blue"></div>
<script src="after-frames.js"></script>
<script>afterFrames(() => document.getElementById("box").setAttribute("style", "background-color: green"));</script>
</html>
