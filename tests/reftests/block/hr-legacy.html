<!DOCTYPE html>
<title>A rule's color, noshade, size, width and align paint as Chrome maps them</title>
<link rel="match" href="hr-legacy-ref.html">
<!-- Chrome's, not HTML's: `color` the border's and the background's,
     `noshade` gray ones, `size` a height of two less. -->
<style>
  body { margin: 0 }
</style>
<hr color=red size=10 width=100 align=left>
<hr noshade size=6 width=200 align=right>
<hr size=1 width="50%">
