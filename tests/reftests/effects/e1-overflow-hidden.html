<!DOCTYPE html>
<title>E1: overflow: hidden clips children to the padding box, stacking contexts included</title>
<link rel="match" href="e1-overflow-hidden-ref.html">
<style>html, body { margin: 0 }</style>
<div style="width: 100px; height: 100px; border: 10px solid blue; overflow: hidden">
  <div style="width: 300px; height: 50px; background-color: green"></div>
  <!-- An identity transform: its own stacking context, still clipped. -->
  <div style="width: 300px; height: 300px; background-color: green; transform: translate(0, 0)"></div>
</div>
