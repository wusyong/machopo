<!DOCTYPE html>
<title>matrix() applies about the center of the border box</title>
<link rel="match" href="transform-matrix-ref.html">
<style>html, body { margin: 0 }</style>
<!-- x -> 2(x - 25) + 25 + 25 = 2x, y -> y + 10 -->
<div style="width: 50px; height: 50px; background-color: green; transform: matrix(2, 0, 0, 1, 25, 10)"></div>
