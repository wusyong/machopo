# The markers inherit a `line-height` of 4,000,000,000 times the font: a
# list item without lines is as tall as its marker, and the compositor
# makes a tile entry for each 256 px of the whole layer before it rasters
# any, so machopo hangs (with `display: block` items it doesn't).
[firefox-bug-1715631.html]
  disabled: the compositor allocates every tile of a layer this tall
