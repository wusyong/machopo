# machopo has no `ch` unit: each block's `width: 4ch` is dropped, it is as
# wide as its container, and its text doesn't wrap.
[bidi-line-break-001.html]
  [\n    <span class="isolate" dir="ltr">00</span> <span class="isolate" dir="ltr">00</span>\n  ]
    expected: FAIL

  [\n    <span class="embed" dir="ltr">00</span> <span class="embed" dir="ltr">00</span>\n  ]
    expected: FAIL

  [\n    <span class="isolate" dir="ltr">aa</span>-<span class="isolate" dir="ltr">bb</span>\n  ]
    expected: FAIL

  [\n    <span class="embed" dir="ltr">aa</span>-<span class="embed" dir="ltr">bb</span>\n  ]
    expected: FAIL

  [\n    <span dir="ltr">00</span> <span dir="ltr">00</span>\n  ]
    expected: FAIL

  [\n    <bdi dir="ltr">00</bdi> <bdi dir="ltr">00</bdi>\n  ]
    expected: FAIL

  [\n    <bdo dir="ltr">00</bdo> <bdo dir="ltr">00</bdo>\n  ]
    expected: FAIL

  [\n    <span class="isolate" dir="ltr">00 </span><span class="isolate" dir="ltr">00</span>\n  ]
    expected: FAIL

  [\n    <span class="embed" dir="ltr">00 </span><span class="embed" dir="ltr">00</span>\n  ]
    expected: FAIL

  [\n    <span class="isolate" dir="ltr">aa-</span><span class="isolate" dir="ltr">bb</span>\n  ]
    expected: FAIL

  [\n    <span class="embed" dir="ltr">aa-</span><span class="embed" dir="ltr">bb</span>\n  ]
    expected: FAIL
