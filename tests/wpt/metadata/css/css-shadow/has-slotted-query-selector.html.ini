# It needs declarative shadow DOM (`<template shadowrootmode>`), which machopo
# doesn't parse: `ancestor.shadowRoot` is null and the script throws. It
# needs `:has-slotted` too, which machopo doesn't have.
[has-slotted-query-selector.html]
  [:has-slotted does not match or querySelector when there are no assigned nodes]
    expected: FAIL

  [:has-slotted must match/querySelector when an element is assigned]
    expected: FAIL

  [:has-slotted does not when child nodes are replaced]
    expected: FAIL

  [:has-slotted must match/querySelector when a text node is assigned]
    expected: FAIL

  [:has-slotted does not match or querySelector when there are no assigned nodes (flattened)]
    expected: FAIL

  [:has-slotted must match/querySelector when an element is assigned (flattened)]
    expected: FAIL

  [:has-slotted does not when child nodes are replaced (flattened)]
    expected: FAIL

  [:has-slotted must match/querySelector when a text node is assigned (flattened)]
    expected: FAIL
