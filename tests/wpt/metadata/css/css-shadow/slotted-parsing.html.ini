# `::slotted()` followed by `:is()` or `:where()`, which machopo's parser
# refuses, or by a pseudo-element machopo doesn't have (`::details-content`,
# `::picker()`, `::scroll-marker`...).
[slotted-parsing.html]
  ["::slotted(*):is()" should be a valid selector]
    expected: FAIL

  ["::slotted(*):is(:hover)" should be a valid selector]
    expected: FAIL

  ["::slotted(*):is(#id)" should be a valid selector]
    expected: FAIL

  ["::slotted(*):where()" should be a valid selector]
    expected: FAIL

  ["::slotted(*):where(:hover)" should be a valid selector]
    expected: FAIL

  ["::slotted(*):where(#id)" should be a valid selector]
    expected: FAIL

  ["::slotted(*):where(::before)" should be a valid selector]
    expected: FAIL

  ["::slotted(*)::details-content" should be a valid selector]
    expected: FAIL

  ["::slotted(*)::file-selector-button" should be a valid selector]
    expected: FAIL

  ["::slotted(select)::picker(select)" should be a valid selector]
    expected: FAIL

  ["::slotted(*)::picker-icon" should be a valid selector]
    expected: FAIL

  ["::slotted(*)::scroll-marker-group" should be a valid selector]
    expected: FAIL

  ["::slotted(*)::scroll-marker" should be a valid selector]
    expected: FAIL

  ["::slotted(*)::scroll-button(up)" should be a valid selector]
    expected: FAIL
