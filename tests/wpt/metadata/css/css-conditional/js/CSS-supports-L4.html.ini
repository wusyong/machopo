[CSS-supports-L4.html]
  # `selector()` takes `:is()` and `:where()` unforgivingly; machopo's selector
  # parser always forgives, as in a style rule.
  [selector() with forgiving :is, 1 arg]
    expected: FAIL

  [selector() with forgiving :is, multiple args]
    expected: FAIL

  [selector() with forgiving :where, 1 arg]
    expected: FAIL

  [selector() with forgiving :where, multiple args]
    expected: FAIL
