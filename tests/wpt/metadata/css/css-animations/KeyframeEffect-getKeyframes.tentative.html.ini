# A CSS animation's `getKeyframes()` in machopo merges the keyframes at one offset whatever their easing, leaves out those with only a timing function, and gives the 0% and 100% it adds `composite: auto` (not `replace`).
# Also `animation-composition`, which machopo doesn't have (the `filter` and `text-shadow` ones with missing keyframes are the merged keyframes above); machopo takes `var()` in a keyframe's `animation-timing-function`, and writes `translate(100px, 0)` as `translate(100px, 0px)`.
