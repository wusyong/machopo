# machopo's scroll methods' promises resolve with `undefined`, not a
# `ScrollResult`; the subtest that waits for `scrollend` too times out
# (machopo never fires it).
[element-scroll-promise-after-removal.html]
  expected: TIMEOUT
  [Element.scrollTo promise after scroller removal]
    expected: FAIL

  [Element.scrollBy promise after scroller removal]
    expected: FAIL

  [Element.scrollIntoView promise after outer scroller removal]
    expected: FAIL

  [Element.scrollIntoView promise after inner scroller removal]
    expected: TIMEOUT

  [Element.scrollBy promise after iframe removal]
    expected: NOTRUN
