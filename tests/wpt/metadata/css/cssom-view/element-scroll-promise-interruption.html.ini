# machopo's scroll methods' promises resolve with `undefined`, not a
# `ScrollResult` (`interrupted`), and machopo scrolls instantly whatever the
# `behavior`.
[element-scroll-promise-interruption.html]
  [Element.scrollTo interrupted by a non-promise scroll]
    expected: FAIL

  [Element.scrollTo uninterrupted by an unrelated non-promise scroll]
    expected: FAIL

  [Element.scrollBy interrupted by a non-promise scroll]
    expected: FAIL

  [Element.scrollBy uninterrupted by an unrelated non-promise scroll]
    expected: FAIL

  [Element.scrollIntoView interrupted by a non-promise scroll]
    expected: FAIL

  [Element.scrollIntoView uninterrupted by an unrelated non-promise scroll]
    expected: FAIL

  [Element.scrollTo: interrupted by auto scroll]
    expected: FAIL

  [Element.scrollBy: interrupted by auto scroll]
    expected: FAIL

  [Element.scrollIntoView: interrupted by auto scroll]
    expected: FAIL

  [Element.scrollTo: interrupted by smooth scroll]
    expected: FAIL

  [Element.scrollBy: interrupted by smooth scroll]
    expected: FAIL

  [Element.scrollIntoView: interrupted by smooth scroll]
    expected: FAIL

  [Element.scrollIntoView: interrupted by inner scroll]
    expected: FAIL

  [Element.scrollIntoView: interrupted by outer scroll]
    expected: FAIL
