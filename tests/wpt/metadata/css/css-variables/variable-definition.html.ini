# css/css-variables, checked 2026-10-13.
#
# css-variables-2's newer rules: `var()`'s name is substituted and only then
# parsed, and a value of white space alone keeps one space. Chrome 152 fails
# these as machopo does (Chromium's own expectations for the testharness ones;
# `variable-declaration-29.html` is the name rule as a reftest). Also
# `var(var(--x))`, which Chrome takes as valid and machopo doesn't. `setProperty` takes any name
# that starts with `--`, white space in it too, in Chrome as in machopo (the
# "CSSOM.setProperty with space" subtests).
[variable-definition.html]
  [white space value (single space)]
    expected: FAIL

  [white space value (double space)]
    expected: FAIL

  [can overwrite with no value]
    expected: FAIL

  [can overwrite with space value]
    expected: FAIL

  [white space value (single space) (Computed Style)]
    expected: FAIL

  [white space value (double space) (Computed Style)]
    expected: FAIL

  [can overwrite with no value (Computed Style)]
    expected: FAIL

  [can overwrite with space value (Computed Style)]
    expected: FAIL

  [white space value (single space) (Cascading)]
    expected: FAIL

  [white space value (double space) (Cascading)]
    expected: FAIL

  [can overwrite with no value (Cascading)]
    expected: FAIL

  [can overwrite with space value (Cascading)]
    expected: FAIL

  [CSSOM.setProperty with space 1]
    expected: FAIL

  [CSSOM.setProperty with space 2]
    expected: FAIL
