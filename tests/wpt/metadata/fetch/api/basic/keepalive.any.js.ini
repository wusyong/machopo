# `keepalive`: machopo's requests end with their client, a request sent
# as a page unloads, or as a worker closes itself, closed with it. The
# worker's test sends its request and closes at once: whether the request
# reached the server before the browser closed the worker's loads (on
# `DedicatedWorkerGone`) changes from run to run.
[keepalive.any.html]
  [[keepalive\] simple GET request on 'unload' [no payload\]]
    expected: FAIL

  [[keepalive\] simple GET request on 'pagehide' [no payload\]]
    expected: FAIL

  [[keepalive\] simple POST request on 'unload' [no payload\]]
    expected: FAIL

  [[keepalive\] simple POST request on 'pagehide' [no payload\]]
    expected: FAIL

  [simple keepalive test for web workers]
    expected: [FAIL, PASS]
