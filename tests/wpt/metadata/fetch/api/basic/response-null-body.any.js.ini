# And one whose result changes from run to run: its handler sends a body with
# a 204, 205 or 304, which HTTP doesn't allow; hyper keeps the connection with
# those bytes unread, and the next request on it fails to parse its response
# (Chrome doesn't reuse such a connection).
[response-null-body.any.html]
  disabled: its result changes from run to run: a 204, 205 or 304 with a body leaves hyper's connection unusable

[response-null-body.any.serviceworker.html]
  disabled: its result changes from run to run: a 204, 205 or 304 with a body leaves hyper's connection unusable

[response-null-body.any.sharedworker.html]
  disabled: its result changes from run to run: a 204, 205 or 304 with a body leaves hyper's connection unusable

[response-null-body.any.worker.html]
  disabled: its result changes from run to run: a 204, 205 or 304 with a body leaves hyper's connection unusable
