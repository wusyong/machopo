[SVGMatrix.html]
  # These ask for `DOMMatrix`'s `multiply()` (a `DOMMatrixInit`, optional),
  # as SVG 2 makes `SVGMatrix` its alias; machopo's `SVGMatrix` is Chrome's own
  # interface, whose `multiply()` takes an `SVGMatrix` (Chrome 152 fails
  # these too).
  [multiply]
    expected: FAIL

  [multiply accepts the m11..m42 spelling]
    expected: FAIL

  [multiply accepts m41/m42 as the translation components]
    expected: FAIL

  [multiply accepts an alias and its element when they hold the same value]
    expected: FAIL

  [multiply compares an alias and its element with SameValueZero]
    expected: FAIL

  [multiply with no argument multiplies by the identity matrix]
    expected: FAIL

  [multiply with an object holding no recognized members multiplies by the identity matrix]
    expected: FAIL
