# Intermittent: the worker's error listener calls done(), which posts the
# results, then lets the error go on to its Worker; once the page had them,
# testharness.js no longer cancels the Worker's error event (remote_done
# clears onerror), so it reaches the window and errs the harness unless the
# page has reported by then, which it does from a setTimeout: whether the
# page runs a pass of its tasks between the worker's two is timing. The
# filename subtest fails as `location` isn't in a worker yet.
[report-error-setTimeout-cross-origin.sub.any.worker.html]
  expected: [OK, ERROR]

[report-error-setTimeout-cross-origin.sub.any.sharedworker.html]
  disabled: shared workers, which machopo doesn't have
