# `toJSON()`, which machopo's `Performance` doesn't have.
# In a worker: `WorkerGlobalScope`'s members are its global's own
# properties in machopo, not its prototype's (only
# `DedicatedWorkerGlobalScope` is `[Global]`).
[idlharness.any.serviceworker.html]
  expected: ERROR

[idlharness.any.worker.html]
  [Performance interface: operation toJSON()]
    expected: FAIL

  [Performance interface: performance must inherit property "toJSON()" with the proper type]
    expected: FAIL

  [Performance interface: default toJSON operation on performance]
    expected: FAIL

  [WorkerGlobalScope interface: attribute performance]
    expected: FAIL

  [WorkerGlobalScope interface: self must inherit property "performance" with the proper type]
    expected: FAIL


[idlharness.any.html]
  [Performance interface: operation toJSON()]
    expected: FAIL

  [Performance interface: performance must inherit property "toJSON()" with the proper type]
    expected: FAIL

  [Performance interface: default toJSON operation on performance]
    expected: FAIL


[idlharness.any.sharedworker.html]
  expected: ERROR
