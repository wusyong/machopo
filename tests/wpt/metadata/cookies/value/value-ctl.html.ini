# A tab in a cookie line is a control character that sets no cookie, as
# Chromium's `ParsedCookie`. A line feed ends the header line (%xa): the
# cookie is the part before it, and the rest, no header line, is left out;
# the test wants the two parts as one cookie, or the fetch to fail.
[value-ctl.html]
  [Cookie with %x9 in value is accepted (DOM).]
    expected: FAIL

  [Cookie with %x9 in value is accepted (HTTP).]
    expected: FAIL

  [Cookie with %xa in name is rejected or modified (HTTP).]
    expected: FAIL
