    expected: FAIL

  [fetch with method "OPTIONS" should fail]
    expected: FAIL

  [fetch with method "PUT" should fail]
    expected: FAIL

  [fetch with method "CUSTOM" should fail]
    expected: FAIL

  [fetch should return Content-Type from Blob]
