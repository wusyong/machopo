# Windows: a sleeping thread wakes on the system timer's tick, about 15.6 ms,
# so a 1 ms timer fires after up to 16 ms; the delay changes every run, so no
# `-expected.txt` would hold it. Checked 2026-10-07 on Windows 11.
# Elsewhere it can fail too: the timer set in a microtask has to fire within
# 4 ms, and under the load of a whole run it can take a few ms longer though
# it isn't clamped (6.7 ms once on macOS); run alone it passes. shell's
# `a_timer_set_in_a_microtask_is_not_nested` checks the same by order.
[timer-nesting-not-inherited-in-microtask.html]
  disabled:
    if os == "win": a 1 ms timer fires after up to 16 ms on Windows, a delay that changes every run

  [Test that a timer scheduled during a microtask checkpoint does not inherit the timer nesting level of the task that just ran.]
