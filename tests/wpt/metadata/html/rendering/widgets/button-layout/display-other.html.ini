# A button holding only a float is short of its bottom padding and border
# (taffy's block formatting context roots); as Chrome, a button's
# table-internal `display` computes to `inline-block`
# (`LayoutTheme::AdjustStyle`), where the test expects it laid out as `block`;
# machopo has no `run-in`, `flow` or `ruby` values.
