    expected: FAIL

  [display: table-header-group]
    expected: FAIL

  [display: table-footer-group]
    expected: FAIL

  [display: table-row]
    expected: FAIL

  [display: table-cell]
    expected: FAIL

  [display: table-column-group]
    expected: FAIL

  [display: table-column]
    expected: FAIL

  [display: table-caption]
    expected: FAIL

  [display: ruby-base]
