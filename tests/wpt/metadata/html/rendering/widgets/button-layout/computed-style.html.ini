# As Chrome (`LayoutTheme::AdjustStyle`), an element with an `appearance` is
# no table part and not `inline` (`block` or `inline-block`), where the test
# expects the computed `display` unchanged; `display: contents` on an
# `<input>` is `none` only when machopo builds the boxes (its computed value stays
# `contents`); machopo computes `overflow: clip` as `hidden`, so its UA stylesheet
# leaves the `<input>`'s out; machopo has no `flow` or `ruby` values.
