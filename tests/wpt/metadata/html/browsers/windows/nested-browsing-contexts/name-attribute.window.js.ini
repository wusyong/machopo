# A child frame's name: machopo has no `window.name`, nor `<frame>`,
# `<object>` or `<embed>` frames.
[name-attribute.window.html]
  disabled: needs window.name and frame, object and embed frames, and times out
  expected: TIMEOUT
  [same-origin <frame>]
    expected: TIMEOUT

  [cross-origin <frame>]
    expected: TIMEOUT

  [same-origin <frame name=>]
    expected: TIMEOUT

  [cross-origin <frame name=>]
    expected: TIMEOUT

  [same-origin <frame name=initialvalue>]
    expected: TIMEOUT

  [cross-origin <frame name=initialvalue>]
    expected: TIMEOUT

  [same-origin <iframe>]
    expected: FAIL

  [cross-origin <iframe>]
    expected: FAIL

  [same-origin <iframe name=>]
    expected: FAIL

  [cross-origin <iframe name=>]
    expected: FAIL

  [same-origin <iframe name=initialvalue>]
    expected: FAIL

  [cross-origin <iframe name=initialvalue>]
    expected: FAIL

  [same-origin <object>]
    expected: TIMEOUT

  [cross-origin <object>]
    expected: TIMEOUT

  [same-origin <object name=>]
    expected: TIMEOUT

  [cross-origin <object name=>]
    expected: TIMEOUT

  [same-origin <object name=initialvalue>]
    expected: TIMEOUT

  [cross-origin <object name=initialvalue>]
    expected: TIMEOUT

  [same-origin <embed>]
    expected: TIMEOUT

  [cross-origin <embed>]
    expected: TIMEOUT

  [same-origin <embed name=>]
    expected: TIMEOUT

  [cross-origin <embed name=>]
    expected: TIMEOUT

  [same-origin <embed name=initialvalue>]
    expected: TIMEOUT

  [cross-origin <embed name=initialvalue>]
    expected: TIMEOUT
