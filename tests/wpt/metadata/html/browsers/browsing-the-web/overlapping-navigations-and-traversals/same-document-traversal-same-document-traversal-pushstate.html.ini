# Two traversals before the first commits, back then forward: the second
# counts from the first's entry, the current one, so every frame stops
# loading and nothing else happens (Chromium's NavigateToExistingPendingEntry;
# HTML queues them), and they wait for the second's `popstate`. Chromium times
# out the same (wpt.fyi, 2026-11-19).
[same-document-traversal-same-document-traversal-pushstate.html]
  disabled: back then forward before the first commits goes nowhere, as in Chromium, and times out
  expected: TIMEOUT
  [same-document traversals in opposite directions: queued up]
    expected: TIMEOUT

  [same-document traversals in opposite directions, second traversal invalid at queuing time: queued up]
    expected: NOTRUN

  [same-document traversals in the same (back) direction: queue up]
    expected: NOTRUN

  [same-document traversals in the same (forward) direction: queue up]
    expected: NOTRUN
