# It sets its child frames' `location.protocol`, which navigates them to
# another document: machopo doesn't navigate a child frame to another document,
# so their messages never come again. It passes only when the frames' first
# messages (posted as they load) come after the page's `load` event, where
# it starts listening, which depends on timing: under a whole run's load it
# timed out 1 run in 4 (2026-10-10).
[location-protocol-setter-with-colon.sub.html]
  disabled: navigates its child frames to another document, which machopo doesn't do; passes only by timing
