# machopo scrolls to a fragment with the next frame (Chrome at once). Each test
# waits 10 ms for the scroll, which the next frame usually makes (it may
# not with the machine busy: known intermittent); each test's cleanup sets
# `location.hash = ""` and the next one reads `scrollY` at once, so from the
# first test that ends scrolled down each one starts scrolled.
[same-hash.html]
  [Using location.hash = "#te<st" must not reset scroll position]
    expected: [PASS, FAIL]

  [Using location.hash = "te<st" must not reset scroll position]
    expected: [PASS, FAIL]

  [Using location.hash = "#te%3Cst" must not reset scroll position]
    expected: [PASS, FAIL]

  [Using location.hash = "te%3Cst" must not reset scroll position]
    expected: [PASS, FAIL]

  [Using location.hash = "#te%3cst" must reset scroll position]
    expected: [PASS, FAIL]

  [Using location.hash = "te%3cst" must reset scroll position]
    expected: [FAIL, PASS]

  [Using location.href = "about:srcdoc#te<st" must reset scroll position]
    expected: [FAIL, PASS]

  [Using location.assign("about:srcdoc#te<st") must reset scroll position]
    expected: [FAIL, PASS]

  [Using location.href = "about:srcdoc#te%3cst" must reset scroll position]
    expected: [FAIL, PASS]

  [Using location.assign("about:srcdoc#te%3cst") must reset scroll position]
    expected: [FAIL, PASS]

  [Using location.href = "about:srcdoc#te%3Cst" must reset scroll position]
    expected: [FAIL, PASS]

  [Using location.assign("about:srcdoc#te%3Cst") must reset scroll position]
    expected: [FAIL, PASS]
