# Canvas 2D, checked 2026-10-12.
#
# A canvas's fallback content gets no boxes (machopo always runs script), so
# its elements aren't being rendered and can't be focused; HTML (and
# Chrome) let the fallback content of a canvas that is rendered take the
# focus.
[canvas-descendants-focusability-005.html]
  [<button data-focusable="true">]
    expected: FAIL

  [<section tabindex="-1" data-focusable="true">]
    expected: FAIL

  [<div tabindex="-1" data-focusable="true">]
    expected: FAIL

  [<span tabindex="-1" data-focusable="true">]
    expected: FAIL

  [<a href="#" data-focusable="true">]
    expected: FAIL
