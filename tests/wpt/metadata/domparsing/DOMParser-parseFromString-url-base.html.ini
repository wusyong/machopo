# A race in the test: its iframe's onload calls window.resolveLoadPromise,
# which a later external script defines. When the iframe finishes loading
# while the parser waits for that script (HTML allows either order), the
# handler throws and the harness errors before any subtest; under the
# load of a whole run that happens about one run in six.
