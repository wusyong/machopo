<!DOCTYPE html>
<!-- svg.txt's page for the keyboard: Tab from #start moves the focus to
     the SVG <a>, which shows the UA's focus ring around its rect, inside
     #around; Enter follows its link. #out says what has the focus. -->
<title>svg focus</title>
<style>body { margin: 0 } svg { display: block }</style>
<div id="start" tabindex="0">start</div>
<svg id="around" width="120" height="120">
  <a id="link" href="nav-two.html"><rect x="10" y="10" width="100" height="100" fill="lime"/></a>
</svg>
<p id="out">nothing</p>
<script>
  document.addEventListener("focusin", () => {
    document.getElementById("out").textContent = document.activeElement.id;
  });
</script>
