<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="script" content="wasm" />
        <title>TodoMVC: a wasm guest</title>
        <link rel="stylesheet" href="../../sites/todomvc/base.css" />
        <link rel="stylesheet" href="../../sites/todomvc/index.css" />
        <!-- Not the JS app's: a headless frame is taken as the page loads, and a
             label's color would be in the middle of this transition if the page
             was styled once before the style sheets came. -->
        <style>
            .todo-list li label { transition: none; }
        </style>
    </head>
    <body>
        <!-- The markup and the style sheets of the JS app (../../sites/todomvc/index.html), its scripts replaced by the guest's component, which builds the todos -->
        <section class="todoapp">
            <header class="header">
                <h1>todos</h1>
                <input class="new-todo" placeholder="What needs to be done?" autofocus />
            </header>
            <main class="main">
                <div class="toggle-all-container">
                    <input class="toggle-all" type="checkbox" />
                    <label class="toggle-all-label" for="toggle-all">Mark all as complete</label>
                </div>
                <ul class="todo-list show-priority" data-seed></ul>
            </main>
            <footer class="footer">
                <span class="todo-count"></span>
                <ul class="filters">
                    <li>
                        <a href="#/" class="selected">All</a>
                    </li>
                    <li>
                        <a href="#/active">Active</a>
                    </li>
                    <li>
                        <a href="#/completed">Completed</a>
                    </li>
                </ul>
                <button class="clear-completed">Clear completed</button>
            </footer>
        </section>
        <footer class="info">
            <p>Click on input field to write your todo.</p>
            <p>At least two characters are needed to be a valid entry.</p>
            <p>Press 'enter' to add the todo.</p>
            <p>Double-click to edit a todo</p>
        </footer>
        <script type="application/wasm" src="../../../crates/dom_wasm/tests/guests/todomvc.wasm"></script>
    </body>
</html>
