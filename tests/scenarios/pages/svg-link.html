<!DOCTYPE html>
<!-- svg.txt's page: a click on a shape inside an SVG <a> follows its link;
     one on the <svg> where no shape is (inside a stroke-only circle)
     doesn't; one on SVG text finds the <tspan> it is in. -->
<title>svg</title>
<style>body { margin: 0 } svg { display: block }</style>
<p id="clicked">none</p>
<svg id="ring" width="100" height="100" onclick="document.getElementById('clicked').textContent = event.target.id">
  <circle id="circle" cx="50" cy="50" r="40" fill="none" stroke="blue" stroke-width="10"/>
</svg>
<svg id="words" width="100" height="100" onclick="document.getElementById('clicked').textContent = event.target.id">
  <text x="0" y="80" style="font: 100px Ahem"><tspan id="word">X</tspan></text>
</svg>
<svg id="link" width="100" height="100">
  <a href="nav-two.html"><rect width="100" height="100" fill="lime"/></a>
</svg>
